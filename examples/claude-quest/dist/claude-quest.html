<script>
// ---- src/scenes/01-title.js
// Shot 01 'title' — T 0–2.0 s (dur 2.0), 60 fps, 120 bpm (beat 30 f, 8th 15 f). Opens the film; hard cut
// out at T 2.0 into shot 02, which starts on this same level screen (same sky, clouds, hill, bush and
// Claw'd at x 24), so pressing START simply drops the title layer and pops the HUD on.
//
// An attract screen in the console grammar: the title plaque over the live level, no HUD. Layers,
// back to front:
//   1. level plate: sky, clouds (60, 18) and (180, 30), hill at x 24, bush at x 130, ground strip
//   2. Claw'd idle at x 24, feet y 103 (shot 02's frame-0 pose)
//   3. the title plaque (lib.titlePlaque, scale 3): CLAUDE / QUEST on a raised brick-orange board with
//      a pale bevel top/left, a dark edge bottom/right and four rivets, x 45–194, y 4–57. It falls in
//      under constant gravity and lands on the T 0.5 title-jingle hit with a 2 px bump.
//   4. from the landing: '©2026 CLAWD SOFT' right-aligned under the plaque (y 61), the menu
//      1 PLAYER GAME (y 71) / 2 PLAYER GAME (y 80) with a mini-mushroom cursor blinking beside
//      1 PLAYER on 8ths, and TOP- 000000 (y 89)
//   5. sparkle pops on the plaque's top-left (T 1.0) and top-right (T 1.5) corners, flickering out
//
// Every colour is a lib.pal key; nothing is blended (no alpha): pops flicker, the console way.
(function () {
  'use strict';

  const ID = 'title';

  // plaque geometry (game px): scale-3 lines, pad 4, gap 3 -> 150 x 54, centred on x 120
  const LINES = ['CLAUDE', 'QUEST'];
  const PLAQUE = { scale: 3, pad: 4, gap: 3 };
  const PCX = 120, PY_REST = 4, PH = 54, PW = 150;
  const PX0 = PCX - PW / 2; // 45
  const LAND = 0.5; // T 0.5 title-jingle hit
  const DROP = PY_REST + PH + 1; // starts fully above the frame
  const G = (2 * DROP) / (LAND * LAND); // constant gravity that covers DROP from rest in LAND s
  const BUMP_S = 8 / 60; // 8-frame landing bump
  const BUMP_H = 2;

  // menu (game px); glyphs are 7 tall in 8-px cells
  const COPY_Y = 61, MENU_Y1 = 71, MENU_Y2 = 80, TOP_Y = 89;
  const MENU_TXT1 = '1 PLAYER GAME', MENU_TXT2 = '2 PLAYER GAME', TOP_TXT = 'TOP- 000000', COPY_TXT = '©2026 CLAWD SOFT';

  // the menu cursor: a 5x5 mini sparkle-mushroom (cap, spots, stem)
  const CURSOR = ['.CCC.', 'CSCSC', 'CCCCC', '.MMM.', '.MMM.'];

  function glyph(ctx, L, rows, gx, gy, colours) {
    for (let y = 0; y < rows.length; y++) {
      for (let x = 0; x < rows[y].length; x++) {
        const c = colours[rows[y][x]];
        if (c) L.px(ctx, gx + x, gy + y, 1, 1, c);
      }
    }
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, N = FILM.nes;
      const t = L.clamp(tIn, 0, info.dur);
      const f = N.frameOf(t); // shot-local frame (60 fps)
      const GY = L.GROUND_Y;

      // 1. level plate (shot 02's opening screen, camX 0)
      L.px(ctx, 0, 0, L.VW, L.VH, P.sky);
      L.sprite(ctx, 'cloud', 60, 18);
      L.sprite(ctx, 'cloud', 180, 30);
      L.sprite(ctx, 'hill', 24, GY - 10);
      L.sprite(ctx, 'bush', 130, GY - 7);
      L.groundStrip(ctx, -16, L.VW + 16, 0);

      // 2. Claw'd, standing where shot 02 starts him
      L.sprite(ctx, 'clawdIdle', 24, GY - 12);

      // 3. the plaque falls in (y = y0 + g t^2 / 2), lands on T 0.5 and bumps 2 px
      let py;
      if (t < LAND) py = PY_REST - DROP + 0.5 * G * t * t;
      else if (t < LAND + BUMP_S) py = N.arc(PY_REST, BUMP_H, (t - LAND) / BUMP_S);
      else py = PY_REST;
      py = Math.round(py);
      if (py > -PH) L.titlePlaque(ctx, PCX, py, LINES, PLAQUE);

      // 4. the rest of the attract screen appears with the landing
      if (t >= LAND) {
        L.pxtext(ctx, COPY_TXT, PX0 + PW, COPY_Y, { color: P.brickHi, align: 'right' }); // under the plaque's right edge
        const mx = PCX - Math.floor(L.pxtextWidth(MENU_TXT1, 1) / 2);
        L.pxtext(ctx, MENU_TXT1, mx, MENU_Y1, { color: P.hudWhite });
        L.pxtext(ctx, MENU_TXT2, mx, MENU_Y2, { color: P.hudWhite });
        L.pxtext(ctx, TOP_TXT, PCX, TOP_Y, { color: P.hudWhite, align: 'center' });

        // cursor blinks on 8ths (15 frames on, 15 off), on from the landing frame
        if (N.step(f - N.frameOf(LAND), 15, 2) === 0) {
          glyph(ctx, L, CURSOR, mx - 9, MENU_Y1 + 1, { C: P.clawdOrange, S: P.sparkle, M: P.pearlCream });
        }
      }

      // 5. sparkle pops on the plaque corners: 24 frames, steady for 12, then flickering on 2s
      const pops = [
        { at: 1.0, x: PX0 - 4, y: PY_REST - 4 },
        { at: 1.5, x: PX0 + PW - 4, y: PY_REST - 4 },
      ];
      for (const p of pops) {
        const k = f - N.frameOf(p.at);
        if (k < 0 || k >= 24) continue;
        if (k < 12 || N.step(k, 2, 2) === 0) L.sprite(ctx, 'sparkle', p.x, p.y);
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/02-start-run.js
/*
 * 02-start-run.js — shot 02 'start-run', T 2.0–4.5 (dur 2.5 s; beat 0.5 s = 30 frames at 60 fps).
 * World 1-1's opening screen grammar: the HUD pops on, Claw'd idles, breaks into a run,
 * the camera starts scrolling once he anchors at screen x 64, and a bug walks in from the
 * right edge. Ends mid-run at hero world-x 168 (camX 104) — shot 03 continues this world.
 *
 * Layers, back to front:
 *   1. sky — flat pal.sky fill
 *   2. clouds at world (60, 18) and (180, 30)
 *   3. hill at world-x 24, bush at world-x 130 (feet on the ground line y 103)
 *   4. ground strip across the visible world range (camX−16 .. camX+256)
 *   5. bug — enters at local t 1.5 (T 3.5), walking left at 24 px/s, bug1/bug2 every 8 frames
 *   6. Claw'd — idle to local t 0.5 (T 2.5), then run1/run2 (FILM.nes.runPose), feet y 103
 *   7. HUD — screen-fixed, 3-step pop from t 0 (3 frames a step), TIME = 400 − floor((T − 2.0) · 10)
 *
 * NES motion: the camera and every sprite sit on whole game pixels each 60 Hz frame. camX is
 * snapped once and every world object is drawn at its world-x minus that integer camX, so the
 * scene scrolls 1 or 2 px a frame (72 px/s = 1.2 px/frame) with nothing jittering against it.
 */
(function () {
  'use strict';
  const ID = 'start-run';

  // Geometry and timing (storyboard Conventions, G1, G2; game px).
  const RUN_V = 72; // hero run speed: 1.2 px a frame at 60 fps
  const BUG_V = 24; // bug walk speed, leftward
  const T_RUN = 0.5; // local t the hero breaks into a run (T 2.5)
  const T_BUG = 1.5; // local t the bug enters (T 3.5)
  const HERO_X0 = 24; // hero world-x at t 0 (G2)
  const ANCHOR_X = 64; // hero anchors at screen x 64 once the camera scrolls (T ≈ 3.06)
  const BUG_X0 = 264; // bug world-x at T_BUG: 240 + 24 · (shot time remaining at T 3.5)
  const GROUND_Y = 103; // ground top face (lib.GROUND_Y)

  // HUD pop: three steps of scale about the bar's centre, each held 3 frames, then hold at 1.
  const HUD_POP = [0.72, 1.08, 1];
  const HUD_POP_HOLD = 3;

  // Scratch strip the HUD is drawn into during its pop, so the scale blit keeps hard
  // nearest-neighbour edges (no smoothing, ever). Redrawn every pop frame — t-dependent.
  let hudStrip = null;
  function hudScratch(PX) {
    if (!hudStrip) {
      hudStrip = document.createElement('canvas');
      hudStrip.width = 240 * PX; // full game width
      hudStrip.height = 16 * PX; // HUD band: game rows 0–15
    }
    return hudStrip;
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib;
      const P = L.pal;
      const N = FILM.nes;
      const t = L.clamp(tIn, 0, info.dur);

      // --- continuity ---------------------------------------------------------
      // Hero world-x: stands at 24 until T_RUN, then runs right at 72 px/s → 168 at t 2.5.
      const heroWX = HERO_X0 + RUN_V * Math.max(0, t - T_RUN);
      // Camera: static until he reaches the anchor, then camX = heroWorldX − 64.
      const camX = Math.max(0, Math.round(heroWX) - ANCHOR_X); // snapped: a whole game pixel
      const heroSX = Math.round(heroWX) - camX;
      const running = t >= T_RUN;
      const heroSprite = running ? N.runPose(info.frame, RUN_V) : 'clawdIdle';

      // --- 1. sky --------------------------------------------------------------
      L.px(ctx, 0, 0, L.VW, L.VH, P.sky);

      // --- 2. clouds (world-locked) --------------------------------------------
      L.sprite(ctx, 'cloud', 60 - camX, 18);
      L.sprite(ctx, 'cloud', 180 - camX, 30);

      // --- 3. hill + bush, feet on the ground line ------------------------------
      L.sprite(ctx, 'hill', 24 - camX, GROUND_Y - 10);
      L.sprite(ctx, 'bush', 130 - camX, GROUND_Y - 7);

      // --- 4. ground across the visible world range -----------------------------
      L.groundStrip(ctx, camX - 16, camX + 256, camX);

      // --- 5. the bug walks in from the right edge at T 3.5 ----------------------
      if (t >= T_BUG) {
        const bugWX = BUG_X0 - BUG_V * (t - T_BUG); // 240 at shot end
        const bugSprite = N.step(info.frame, 8, 2) ? 'bug2' : 'bug1';
        L.sprite(ctx, bugSprite, bugWX - camX, GROUND_Y - 9);
      }

      // --- 6. Claw'd --------------------------------------------------------------
      L.sprite(ctx, heroSprite, heroSX, GROUND_Y - 12);

      // --- 7. HUD (screen-fixed; pops on over frames 0–2, G1: 000000 ×00 TIME 400) ---
      const time = 400 - Math.floor((info.T - 2.0) * 10);
      const f = Math.floor(N.frameOf(t) / HUD_POP_HOLD); // pop step
      if (f < HUD_POP.length) {
        const s = HUD_POP[f];
        const c = hudScratch(L.PX);
        const g = c.getContext('2d');
        g.clearRect(0, 0, c.width, c.height);
        L.hud(g, { score: 0, coins: 0, world: '1-1', time });
        const cx = 120 * L.PX;
        const cy = 8 * L.PX; // pop centre: middle of the HUD band
        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.translate(cx, cy);
        ctx.scale(s, s);
        ctx.drawImage(c, -cx, -cy);
        ctx.restore();
      } else {
        L.hud(ctx, { score: 0, coins: 0, world: '1-1', time });
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/03-stomp.js
// Shot 03 — stomp · T 4.5–6.5 (dur 2.0 s) · mode none · hard cut in/out, mid-run both sides.
//
// Layers, back to front:
//   1 sky fill            4 ground strip          7 "+100" score pop
//   2 clouds (world)      5 bug1/2 → bugFlat      8 HUD
//   3 bush (world)        6 Claw'd (run1/2, jump)
//
// Continuity contracts (storyboard G1/G2/G4 + brief):
//   hero world-x 168 → 312 at 72 px/s; camX = heroWorldX − 64 from frame 0 (hero pinned at
//   screen x 64), snapped to a whole game pixel every 60 Hz frame. Jump at local 0.25 (h 20,
//   0.75 s of air), lands ON the bug at world-x 240 at local 1.0 (T 5.5); bounce h 8, 0.5 s,
//   lands local 1.5 and keeps running. Both arcs are constant-gravity parabolas.
//   HUD: score 000000 → 000100 at the stomp, coins ×00, time = 400 − floor((T − 2)·10).
//   Note: the brief's bug formula and its "meet at world-x 240" disagree by 24 px; the
//   storyboard ("the bug walks into his landing point: they meet at world-x 240 at T 5.5")
//   wins on position+time, so the bug walks bugX = 264 − 24·t and is under the hero at t 1.0.
(function () {
  'use strict';

  const ID = 'stomp';
  const LIB = FILM.lib;
  const clamp = LIB.clamp;
  const N = FILM.nes;

  // Beat constants, shot-local seconds.
  const B_JUMP = 0.25; // T 4.75 takeoff
  const B_STOMP = 1.0; // T 5.5  stomp lands on the bug
  const B_LAND = 1.5; // T 6.0  bounce ends, run resumes
  const JUMP_AIR = 0.75; // s (45 frames)
  const BOUNCE_AIR = 0.5; // s (30 frames)
  const JUMP_H = 20;
  const BOUNCE_H = 8;
  const GROUND = LIB.GROUND_Y; // 103
  const MEET_X = 240; // world-x of the stomp (hero and bug both here at local 1.0)
  const RISE_F = 0.5; // +100 rises 8 px over 0.5 s
  const HOLD_F = 0.25; // then holds an 8th and vanishes (the console has no fades)
  const RUN_V = 72;

  // Art-bible jump parabola: apex h, progress u in [0,1] → feet y.
  const arc = (h, u) => GROUND - 4 * h * u * (1 - u);

  // "+100" in the pixel font, centred on cx (game px).
  function scorePop(ctx, L, color, cx, gy) {
    L.pxtext(ctx, '+100', Math.round(cx), Math.round(gy), { color, align: 'center' });
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = clamp(tIn, 0, info.dur);

      // --- world state (all game px) -----------------------------------------
      const heroX = Math.round(168 + RUN_V * t); // hero world-x (left edge), whole px; 168 → 312
      const camX = heroX - 64; // hero pinned at screen x 64; 104 → 248
      const bugX = 264 - 24 * t; // walks left at 24 px/s; equals MEET_X at t = B_STOMP
      const stomped = t >= B_STOMP;
      const score = stomped ? 100 : 0;
      const time = 400 - Math.floor((info.T - 2.0) * 10);

      // Hero feet y + pose. Run drawings step on the global frame index so the cycle
      // continues seamlessly across the cuts with shots 02 and 04.
      let feet = GROUND, pose;
      if (t < B_JUMP) {
        pose = N.runPose(info.frame, RUN_V);
      } else if (t < B_STOMP) {
        feet = arc(JUMP_H, (t - B_JUMP) / JUMP_AIR);
        pose = 'clawdJump';
      } else if (t < B_LAND) {
        feet = arc(BOUNCE_H, (t - B_STOMP) / BOUNCE_AIR);
        pose = 'clawdJump';
      } else {
        pose = N.runPose(info.frame, RUN_V);
      }

      // --- 1 sky ---------------------------------------------------------------
      L.px(ctx, 0, 0, L.VW, L.VH, P.sky);

      // --- 2 clouds (world-anchored, scroll with the camera) --------------------
      L.sprite(ctx, 'cloud', 250 - camX, 22);
      L.sprite(ctx, 'cloud', 340 - camX, 16);

      // --- 3 bush ---------------------------------------------------------------
      L.sprite(ctx, 'bush', 260 - camX, GROUND - 7);

      // --- 4 ground -------------------------------------------------------------
      L.groundStrip(ctx, camX, camX + L.VW, camX);

      // --- 5 the bug: walking left, feet swapping every 8 frames; flattened at the stomp
      if (stomped) {
        L.sprite(ctx, 'bugFlat', MEET_X - camX, GROUND - 4);
      } else {
        const bugPose = N.step(info.frame, 8, 2) ? 'bug2' : 'bug1';
        L.sprite(ctx, bugPose, Math.round(bugX) - camX, GROUND - 9);
      }

      // --- 6 Claw'd ---------------------------------------------------------------
      L.sprite(ctx, pose, heroX - camX, feet - (pose === 'clawdJump' ? 10 : 12));

      // --- 7 "+100" pop: above the stomp, rises 8 px over 0.5 s, holds, then vanishes
      // y0 84: the hero bounces straight up from the bug faster than the pop rises, so
      // the text starts just over his head (head top 93 at t 1.0, 85 at the bounce apex)
      // and stays clear of his sprite for its whole life instead of covering his face.
      if (stomped) {
        const age = t - B_STOMP;
        const rise = Math.floor(clamp(age / RISE_F) * 8);
        if (age < RISE_F + HOLD_F) scorePop(ctx, L, P.hudWhite, MEET_X + 6 - camX, 84 - rise);
      }

      // --- 8 HUD ------------------------------------------------------------------
      L.hud(ctx, { score, coins: 0, world: '1-1', time });
    },
  });
})();

</script>
<script>
// ---- src/scenes/04-qblock.js
// ============================================================================
// Shot 04 — qblock (T 6.5–9.0, dur 2.5 s, mode none, hard cut mid-run)
//
// Claw'd runs on (world-x 312 → 492, screen anchor 64), jumps at T 7.25 and
// head-bumps the floating ? block at T 7.5: the block hops 4 px and turns
// used, a coin spins out of its top, HUD coins ×00→×01, score 000100→000300
// with a floating "+200". He lands at T 8.25 and runs on.
//
// Layers, back to front:
//   1. sky fill
//   2. cloud (world 450, 16)
//   3. bush (world-x 500, on the ground line)
//   4. ground strip
//   5. Claw'd (run cycle / tucked jump; drawn BEHIND the block row so the
//      bump occludes his head)
//   6. block row y 67–83: brick (368) / Q→used (384, hops) / brick (400)
//   7. coin pop (spins through the 4 coin drawings every 3 frames, rises 12 px over 0.5 s, vanishes)
//   8. "+200" pxtext (rises 8 px over 0.5 s, then vanishes)
//   9. HUD (G1: score 000100→000300, ×00→×01, TIME 355 ticking −10/s)
//
// NES motion (60 fps): camX snaps to a whole game pixel every frame; the ? block shimmers on
// its own palette cadence (lib.qFrame: 24 frames lit, then 8/8/8 through the glint); the coin
// spins on lib.coinSpin at 20 drawings/s (3 frames each); nothing is blended.
// ============================================================================
(function () {
  'use strict';
  const ID = 'qblock';

  const N = FILM.nes;

  // Beat grid, shot-local seconds (global T in comments).
  const TAKEOFF = 0.75; // T 7.25 — jump takeoff, on the beat
  const BUMP = 1.0;     // T 7.5  — head-bump: block hop, coin, ×01, +200
  const LAND = 1.75;    // T 8.25 — lands, run resumes
  const JUMP_H = 30;    // apex px (storyboard G4)
  const AIR = 1.0;      // 60 frames airborne

  const SPEED = 72;     // run speed, game px/s (1.2 px a frame at 60 fps)
  const START_WX = 312; // hero world-x at t 0 (storyboard G2)
  const ANCHOR = 64;    // hero screen-x anchor in run shots

  const BLOCK_Y = 67;                    // block row tops (row spans y 67–83)
  const BRICK_A_WX = 368, Q_WX = 384, BRICK_B_WX = 400;

  const HOP_T = 0.25;   // block hop: 4 px up and back over 15 frames
  const POP_T = 0.5;    // coin pop / +200: 30 frames
  const COIN_FPS = 20;  // popped coin: a new spin drawing every 3 frames

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);

      // Continuity: mid-run, camera locked to the hero's screen anchor.
      const heroWx = Math.round(START_WX + SPEED * t); // whole game px
      const camX = heroWx - ANCHOR;

      // Jump parabola (art bible 7.2): u runs 0..1 takeoff→land; outside the
      // jump the clamp pins u to 0/1, which puts the feet back on the ground.
      const u = L.clamp((t - TAKEOFF) / AIR);
      const feetY = 103 - 4 * JUMP_H * u * (1 - u);
      const airborne = t > TAKEOFF && t < LAND;

      const bumped = t >= BUMP - 1e-6; // tileUsed from the bump frame on

      // 1. sky ----------------------------------------------------------------
      L.px(ctx, 0, 0, L.VW, L.VH, P.sky);

      // 2. cloud (world-anchored, drifts left with the scroll) -----------------
      L.sprite(ctx, 'cloud', 450 - camX, 16);

      // 3. bush on the ground line --------------------------------------------
      L.sprite(ctx, 'bush', 500 - camX, 103 - 7);

      // 4. ground strip across the visible range -------------------------------
      L.groundStrip(ctx, camX - 16, camX + L.VW + 16, camX);

      // 5. Claw'd — run cycle on the ground (FILM.nes.runPose), clawdJump airborne
      if (airborne) {
        L.sprite(ctx, 'clawdJump', ANCHOR, feetY - 10); // jump sprite is 16×10
      } else {
        L.sprite(ctx, N.runPose(info.frame, SPEED), ANCHOR, 103 - 12);
      }

      // 6. Block row, drawn OVER the hero so the rise reads as a head-bump. ----
      //    The Q block hops 4 px up and back over 15 frames from the bump.
      let qHop = 0;
      if (bumped && t < BUMP + HOP_T) qHop = -4 * Math.sin((Math.PI * (t - BUMP)) / HOP_T);
      L.sprite(ctx, 'tileBrick', BRICK_A_WX - camX, BLOCK_Y);
      if (bumped) {
        L.sprite(ctx, 'tileUsed', Q_WX - camX, BLOCK_Y + qHop);
      } else {
        // tileQ's '?' counters are transparent pixels; back them with sky so
        // the hero rising behind the block doesn't peek through the glyph.
        L.px(ctx, Q_WX - camX, BLOCK_Y, 16, 16, P.sky);
        L.sprite(ctx, 'tileQ', Q_WX - camX, BLOCK_Y, { frame: L.qFrame(info.T) });
      }
      L.sprite(ctx, 'tileBrick', BRICK_B_WX - camX, BLOCK_Y);

      // 7. Coin pop — out of the block top (y 67−14=53), rises 12 px and falls
      //    back over 30 frames, spinning a drawing every 3 frames.
      const cu = (t - BUMP) / POP_T;
      if (cu >= 0 && cu < 1) {
        const coin = L.coinSpin(t - BUMP, COIN_FPS);
        L.sprite(ctx, coin, Q_WX + 4 - camX, 53 - 4 * 12 * cu * (1 - cu));
      }

      // 8. "+200" — pops above the block (clear of the coin's 12 px arc),
      //    rises 8 px over 30 frames and vanishes (score pops never fade on the console).
      const su = (t - BUMP) / POP_T;
      if (su >= 0 && su < 1) {
        L.pxtext(ctx, '+200', Q_WX + 8 - camX, 40 - Math.floor(8 * su), {
          align: 'center',
          color: P.hudWhite,
        });
      }

      // 9. HUD — storyboard G1: 000100 ×00 at start; +200 and ×01 on the bump.
      L.hud(ctx, {
        score: bumped ? 300 : 100,
        coins: bumped ? 1 : 0,
        time: 400 - Math.floor((info.T - 2.0) * 10),
      });
    },
  });
})();

</script>
<script>
// ---- src/scenes/05-powerup.js
/*
 * 05-powerup.js — shot 05 'powerup' (T 9.0–11.5, dur 2.5 s, 150 frames at 60 fps)
 *
 * The sparkle-mushroom power-up. Claw'd runs in from the left (continuing shots 02–04),
 * jumps and head-bumps the middle ? block; the block hops and turns spent; the sparkle
 * mushroom rises out of its top, scoots right along the block row, drops to the ground
 * and keeps sliding; Claw'd lands, catches it at T 11.0 and powers up — white flash,
 * 8-sparkle radial burst, grow flicker — ending as Super Claw'd (scale 2), +1000.
 *
 * Layers, back to front:
 *   1. sky fill
 *   2. world scenery: cloud (world 560, 18), hill (world 640, base y 103)
 *   3. ground strip
 *   4. the mushroom (before the blocks: the block row masks its lower half during the emerge)
 *   5. block row at y 67–83: brick (544) / ?-block (560, hops and turns used) / brick (576)
 *   6. Claw'd (run / jump / grow-flicker / Super), feet anchored at y 103
 *   7. power-up FX: 8-sparkle radial burst, '+1000' pop (the white flash is the hero himself,
 *      drawn as a white silhouette on alternate 2-frame beats — the console never blends)
 *   8. HUD (G1: score 000300 → 001300 at T 11.0, coins ×01, TIME from 330)
 *
 * Continuity contracts honoured:
 *   hero world-x = 492 + 72·t  (G2: in from shot 04 at 492, out to shot 06 at 672)
 *   camX = world-x − 64        (hero anchors at screen x 64; camera scrolls right only)
 *   feet y = 103, blocks at 544/560/576 y 67–83, hill at 640, cloud at (560, 18)
 *   bump local 1.0 (T 10.0), land local 1.5 (T 10.5), touch local 2.0 (T 11.0)
 *
 * Notes for reviewers (deviations forced by the fixed geometry, all beats intact):
 *   - The jump is clipped to h 10 (same 1.0 s of air): at apex (local 1.0) the tucked sprite's
 *     head (feet 93 − 10 = 83) exactly kisses the block's underside (83). The storyboard's
 *     generic h-30 spec would put the hero's whole body inside the y 67–83 block row.
 *   - The mushroom slides at 120 px/s once loose (not 24): the hero never stops running
 *     (72 px/s, world-x 636 at T 11.0), so a slower mushroom can never reach the T 11.0
 *     touch point. Emerge timing/position and the ≈620 landing are exactly as briefed.
 *   - The grow flicker is 9 steps of 3 frames (3 flickers, ending BIG; 0.45 s at 60 fps).
 *
 * NES motion: camX snaps to a whole game pixel every 60 Hz frame; the ? block shimmers on its
 * own cadence; the burst and the '+1000' never fade (sparkles flicker out, the pop vanishes).
 */
(function () {
  'use strict';
  const ID = 'powerup';
  const N = FILM.nes;
  const RUN_V = 72;

  // beat constants, shot-local seconds
  const B_JUMP = 0.5;  // T 9.5  takeoff
  const B_BUMP = 1.0;  // T 10.0 head-bump; block hops; mushroom starts emerging
  const B_LAND = 1.5;  // T 10.5 hero lands; mushroom fully out and sliding
  const B_TOUCH = 2.0; // T 11.0 power-up

  // world constants
  const FEET = 103;        // ground top face (lib.GROUND_Y)
  const BLOCK_Y = 67;      // block row top (tiles are 16 tall: 67–83)
  const BX = [544, 560, 576];
  const MUSH_X = 561;      // centred on the ? block (560–576; mush is 14 wide)
  const ROW_RIGHT = 592;   // right edge of the block row
  const MUSH_SLIDE = 120;  // px/s once the mushroom is loose (see header notes)

  // grow flicker: 9 steps held 3 frames each, small/big alternating, 3 flickers, ends BIG (held after)
  const FLICKER = [1, 2, 2, 1, 2, 2, 1, 2, 2];
  const FLICKER_HOLD = 3;
  // the flash: white silhouette on frames 0-1 and 4-5 after the touch
  const FLASH_FRAMES = 8;
  const BURST_S = 1 / 3; // sparkle burst life (20 frames)
  const POP_S = 0.5; // '+1000' life (30 frames)

  // A sprite as a solid silhouette of one colour: its own pixels, recoloured through a cached
  // tiny canvas (a pure function of name + colour), blitted with smoothing off.
  const silhouettes = new Map();
  function silhouette(ctx, L, name, colour, gx, gy, scale) {
    const key = name + '|' + colour;
    let c = silhouettes.get(key);
    if (!c) {
      const src = L.spriteCanvas(name);
      c = document.createElement('canvas');
      c.width = src.width;
      c.height = src.height;
      const g = c.getContext('2d');
      g.drawImage(src, 0, 0);
      g.globalCompositeOperation = 'source-in';
      g.fillStyle = colour;
      g.fillRect(0, 0, c.width, c.height);
      silhouettes.set(key, c);
    }
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(c, Math.round(gx) * L.PX, Math.round(gy) * L.PX, c.width * scale * L.PX, c.height * scale * L.PX);
    ctx.restore();
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);
      const T = info.T;

      // hero + camera (hero never stops running right at 72 px/s)
      const heroWx = Math.round(492 + RUN_V * t); // whole game px
      const camX = heroWx - 64;
      const sx = (wx) => wx - camX;

      // ------------------------------------------------ 1. sky
      L.px(ctx, 0, 0, L.VW, L.VH, P.sky);

      // ------------------------------------------------ 2. scenery (world-locked)
      L.sprite(ctx, 'cloud', sx(560), 18);
      L.sprite(ctx, 'hill', sx(640), FEET - 10);

      // ------------------------------------------------ 3. ground
      L.groundStrip(ctx, camX - 16, camX + L.VW, camX);

      // ------------------------------------------------ 4. the sparkle mushroom
      if (t >= B_BUMP && t < B_TOUCH) {
        let mx = MUSH_X, mFeet;
        if (t <= B_LAND) {
          // rises out of the block top over 0.5 s: y-top 67 → 56 (feet 78 → 67)
          mFeet = 78 - 11 * L.seg(t, B_BUMP, B_LAND);
        } else {
          // slides right along the block top…
          mx = MUSH_X + MUSH_SLIDE * (t - B_LAND);
          const fallT0 = B_LAND + (ROW_RIGHT - MUSH_X) / MUSH_SLIDE; // left edge clears the row
          if (t <= fallT0) mFeet = BLOCK_Y;
          else mFeet = Math.min(FEET, BLOCK_Y + (FEET - BLOCK_Y) * L.seg(t, fallT0, fallT0 + 0.18, 'inQuad'));
        }
        L.sprite(ctx, 'mush', sx(mx), mFeet - 11);
      }

      // ------------------------------------------------ 5. block row
      const bumped = t >= B_BUMP;
      // the bumped block hops 4 px and back over 15 frames (0.25 s)
      const hk = (t - B_BUMP) / 0.25;
      const hop = bumped && hk <= 1 ? -4 * Math.sin(Math.PI * hk) : 0;
      L.sprite(ctx, 'tileBrick', sx(BX[0]), BLOCK_Y);
      if (bumped) L.sprite(ctx, 'tileUsed', sx(BX[1]), BLOCK_Y + hop);
      else L.sprite(ctx, 'tileQ', sx(BX[1]), BLOCK_Y, { frame: L.qFrame(info.T) }); // ? block cadence
      L.sprite(ctx, 'tileBrick', sx(BX[2]), BLOCK_Y);

      // ------------------------------------------------ 6. Claw'd
      const jumping = t >= B_JUMP && t < B_LAND;
      const u = L.clamp((t - B_JUMP) / (B_LAND - B_JUMP));
      const feetY = jumping ? FEET - 4 * 10 * u * (1 - u) : FEET; // clipped bump arc (see header)
      let scale = 1;
      const kTouch = t >= B_TOUCH ? N.frameOf(t - B_TOUCH) : -1; // frames since the touch
      if (kTouch >= 0) {
        const k = Math.floor(kTouch / FLICKER_HOLD);
        scale = k >= FLICKER.length ? 2 : FLICKER[k];
      }
      const pose = jumping ? 'clawdJump' : N.runPose(info.frame, RUN_V);
      const hh = (jumping ? 10 : 12) * scale;
      if (kTouch >= 0 && kTouch < FLASH_FRAMES && N.step(kTouch, 2, 2) === 0) {
        silhouette(ctx, L, pose, P.hudWhite, 64, feetY - hh, scale); // the power-up flash
      } else {
        L.sprite(ctx, pose, 64, feetY - hh, { scale });
      }

      // ------------------------------------------------ 7. power-up FX
      if (t >= B_TOUCH) {
        const k = kTouch; // frames since the touch
        // 8-sparkle radial burst at 45° steps, out to r 24 over 20 frames: steady for 10,
        // then flickering out on 2-frame beats; world-locked at the touch point, vertically
        // squashed so no sparkle dips underground
        if (t < B_TOUCH + BURST_S && (k < 10 || N.step(k, 2, 2) === 0)) {
          const s = L.seg(t, B_TOUCH, B_TOUCH + BURST_S, 'outQuad');
          const rx = 6 + 18 * s, ry = 4 + 10 * s;
          for (let i = 0; i < 8; i++) {
            const ang = i * Math.PI / 4;
            L.sprite(ctx, 'sparkle',
              sx(heroWxAt(B_TOUCH) + 10 + Math.cos(ang) * rx) - 4,
              89 + Math.sin(ang) * ry - 4);
          }
        }
        // '+1000' pops where the mushroom was grabbed, rises 8 px over 30 frames, then vanishes
        if (t < B_TOUCH + POP_S) {
          const rise = Math.floor(8 * L.seg(t, B_TOUCH, B_TOUCH + POP_S));
          L.pxtext(ctx, '+1000', sx(heroWxAt(B_TOUCH) + 10), 72 - rise, { color: P.hudWhite, align: 'center' });
        }
      }

      // ------------------------------------------------ 8. HUD
      L.hud(ctx, {
        score: t >= B_TOUCH ? 1300 : 300,
        coins: 1,
        world: '1-1',
        time: 400 - Math.floor((T - 2.0) * 10 + 1e-4),
      });
    },
  });

  // hero world-x at a given local time (for world-locked FX anchored to the touch moment)
  function heroWxAt(tt) { return Math.round(492 + RUN_V * tt); }
})();

</script>
<script>
// ---- src/scenes/06-pit.js
/*
 * 06-pit.js — shot 06 'pit' (T 11.5–13.5, dur 2.0 s, 120 frames at 60 fps)
 *
 * The long jump over the pit. Super Claw'd (the same sprites at scale 2, 32×24 game px,
 * feet at y 103) runs in from shot 05, hits a 2-tile gap in the ground (world-x 752–784:
 * a caveBlack void with brickDeep inner lips), and clears it with one jump — the storyboard's
 * h-30, 1.0 s constant-gravity arc — landing on the far side and running on toward the staircase (shot 07).
 *
 * Layers, back to front:
 *   1. sky fill
 *   2. world scenery: cloud (world 760, y 16), bush (world-x 820, base y 103) — far side
 *   3. the pit: caveBlack void y 103–135 with a 1-px brickDeep inner lip on each edge
 *   4. ground strips: …→752 and 784→… (two strips; the gap is tiles 47–48)
 *   5. Super Claw'd: run cycle on the ground (FILM.nes.runPose), clawdJump while airborne
 *   6. HUD (G1: score 001300, coins ×01, TIME 400 − floor((T − 2.0)·10) = 305 at start)
 *
 * Continuity contracts honoured:
 *   hero world-x = 672 + 72·t   (G2: in from shot 05 at 672, out to shot 07 at 816)
 *   camX = heroWx − 64          (hero pinned at screen x 64; camera scrolls right only,
 *                               snapped to a whole game pixel every 60 Hz frame)
 *   takeoff local 0.75 (T 12.25), G4 arc h 30 / 1.0 s of air (u = elapsed/1.0 s, feet
 *   y = 103 − 4·30·u·(1−u)), horizontal speed 72 px/s throughout; lands local 1.75
 *   (T 13.25) at world-x 798 — 14 px past the pit's right edge — and resumes the run.
 *
 * Notes for reviewers:
 *   - groundStrip's end is ceil-inclusive, so the left strip is passed wxTo = 736:
 *     its last tile (46) spans world [736,752) and the ground stops exactly at 752.
 *   - Takeoff world-x is 726, so 26 of his 32 px are still on the lip when he leaves the
 *     ground — jumping from the very edge, as the fixed (world-x, beat) pair forces.
 *   - The run cycle keys off the global frame index (like shot 03) so the step continues
 *     seamlessly across the cuts with shots 05 and 07.
 */
(function () {
  'use strict';
  const ID = 'pit';
  const LIB = FILM.lib;
  const N = FILM.nes;
  const RUN_V = 72;

  // beat constants, shot-local seconds
  const B_JUMP = 0.75; // T 12.25 takeoff
  const B_LAND = 1.75; // T 13.25 landing past the pit
  const JUMP_AIR = 1.0; // s (60 frames)
  const JUMP_H = 30; // apex px (G4)

  // world constants (game px)
  const FEET = LIB.GROUND_Y; // 103, the ground's top face
  const PIT_L = 752; // gap left edge (world-x)
  const PIT_R = 784; // gap right edge — a 2-tile hole (tiles 47 and 48)
  const SCALE = 2; // Super Claw'd

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);

      // hero + camera (he never stops moving right at 72 px/s)
      const heroWx = Math.round(672 + RUN_V * t); // left edge, whole game px; 672 → 816
      const camX = heroWx - 64; // 608 → 752; hero pinned at screen x 64
      const sx = (wx) => wx - camX;

      // ------------------------------------------------ 1. sky
      L.px(ctx, 0, 0, L.VW, L.VH, P.sky);

      // ------------------------------------------------ 2. scenery (world-locked)
      L.sprite(ctx, 'cloud', sx(760), 16);
      L.sprite(ctx, 'bush', sx(820), FEET - 7);

      // ------------------------------------------------ 3. the pit
      // The void: black from the ground's top face to the frame bottom (the two missing
      // ground-tile rows), with a 1-px brickDeep inner lip on each edge.
      const pitX = sx(PIT_L);
      const pitH = L.VH - FEET; // 32
      L.px(ctx, pitX, FEET, PIT_R - PIT_L, pitH, P.caveBlack);
      L.px(ctx, pitX, FEET, 1, pitH, P.brickDeep); // left inner lip
      L.px(ctx, sx(PIT_R) - 1, FEET, 1, pitH, P.brickDeep); // right inner lip

      // ------------------------------------------------ 4. ground (two strips, gap 752–784)
      L.groundStrip(ctx, camX - 16, PIT_L - 16, camX); // last tile [736,752)
      L.groundStrip(ctx, PIT_R, camX + L.VW + 16, camX); // first tile [784,800)

      // ------------------------------------------------ 5. Super Claw'd
      const airborne = t >= B_JUMP && t < B_LAND;
      let feetY = FEET, pose;
      if (airborne) {
        const u = (t - B_JUMP) / JUMP_AIR; // 0..1 over the 60-frame arc
        feetY = FEET - 4 * JUMP_H * u * (1 - u);
        pose = 'clawdJump';
      } else {
        pose = N.runPose(info.frame, RUN_V);
      }
      const hh = (pose === 'clawdJump' ? 10 : 12) * SCALE;
      L.sprite(ctx, pose, sx(heroWx), feetY - hh, { scale: SCALE });

      // ------------------------------------------------ 6. HUD
      L.hud(ctx, {
        score: 1300,
        coins: 1,
        world: '1-1',
        time: 400 - Math.floor((info.T - 2.0) * 10 + 1e-4),
      });
    },
  });
})();

</script>
<script>
// ---- src/scenes/07-stairs.js
// 07 stairs — T 13.5–16.0 (dur 2.5 s), mode none, hard cut in/out (mid-run).
//
// Super Claw'd hops up a tileBlock staircase on the beat: four hops at local 0.5 / 1.0 / 1.5 /
// 2.0 (T 14.0–15.5), each h 28 over 0.5 s (30 frames), landing on the next column's top just
// before the next beat; he ends standing on the plateau deck. The camera scrolls right at 72 px/s
// with the hero anchored at screen x 64 (camX = hero world-x − 64, a whole game pixel each frame).
//
// Layers, back to front:
//   1. sky fill
//   2. scenery: cloud (world 950, 18 — below the HUD rows 1–15), hill (world-x 1120, base on the ground line)
//   3. ground strip (runs the full width, underneath the staircase)
//   4. staircase: tileBlock columns at world-x 880 / 912 / 944 / 976 plus plateau 1008–1040,
//      every column 2 tiles wide and filled from its top down to the ground's top face
//   5. Super Claw'd (scale 2, 32×24): run frames on surfaces, clawdJump airborne, idle at the end
//   6. HUD (G1: score 001300, ×01, TIME 285 at T 13.5 ticking 10/s)
(function () {
  'use strict';
  const ID = 'stairs';

  // Run continuity (G2): world-x = 816 + 72·t; 1.2 game px a frame at 60 fps.
  const RUN_V = 72; // game px/s
  const X0 = 816; // world-x at local t 0 (T 13.5)
  const GROUND = 103; // lib.GROUND_Y: the ground strip's top face
  const N = FILM.nes;

  // Staircase: 2-tile-wide tileBlock columns (tiles are 16 game px), filled from the column top
  // down to the ground's top face. Tops: 1/2/3/4 tiles high, then the plateau at 4 high.
  const COLS = [
    { x: 880, top: 87 }, // 1 high
    { x: 912, top: 71 }, // 2 high
    { x: 944, top: 55 }, // 3 high
    { x: 976, top: 39 }, // 4 high
    { x: 1008, top: 39 }, // plateau, 4 high (runs to world-x 1040)
  ];

  // Four hops (G4): take off on the beats, h 28, air 0.5 s (30 frames), from each surface to the
  // next column's top. The last hop is h 19: at h 28 its apex (feet 27) puts the 20-px jump sprite's
  // top at y 7, inside the HUD rows 1–15; h 19 peaks with his head at y 16, clear of them.
  const HOP_AIR = 0.5; // 30 frames at 60 fps
  const HOPS = [
    { b: 0.5, y0: 103, y1: 87, h: 28 }, // T 14.0: ground -> step 1
    { b: 1.0, y0: 87, y1: 71, h: 28 }, //  T 14.5: step 1 -> step 2
    { b: 1.5, y0: 71, y1: 55, h: 28 }, //  T 15.0: step 2 -> step 3
    { b: 2.0, y0: 55, y1: 39, h: 19 }, //  T 15.5: step 3 -> step 4 / plateau deck
  ];
  // An h parabola lands back at its own start height at u = 1, so a step UP (a 16 px rise) is
  // cut short where y(u) meets the step top: 4·h·u·(1−u) = 16 → u = (1 + √(1 − 16/h)) / 2 (the
  // descending root: ≈ 0.8273 at h 28, ≈ 0.6987 at h 19). It keeps him airborne until he is
  // actually over the next column (touchdowns at world-x ≈ 882 / 918 / 954 / 985 — inside their
  // columns at 880–912 / 912–944 / 944–976 / 976–1008), before each next beat's takeoff; from
  // u_land on he stands on the step top. The ascending root would hover him 16 px above the lower
  // surface short of the column, so it is never used.
  const uLand = (h) => (1 + Math.sqrt(1 - 16 / h)) / 2;
  const T_STOP = HOPS[3].b + uLand(HOPS[3].h) * HOP_AIR; // ≈ 2.349: final touchdown — he stops and stands

  // Hero pose at local t: { x (world-x of the sprite's left edge), y (feet), airborne, idle }.
  function heroAt(t) {
    const x = Math.round(X0 + RUN_V * Math.min(t, T_STOP)); // whole game px; frozen once he stands on the plateau deck
    let y = GROUND;
    let airborne = false;
    let idle = false;
    for (let i = 0; i < HOPS.length; i++) {
      const hp = HOPS[i];
      if (t < hp.b) break; // standing on the previous surface, waiting for the beat
      const u = (t - hp.b) / HOP_AIR;
      if (u < uLand(hp.h)) {
        y = N.arc(hp.y0, hp.h, u); // the storyboard parabola (constant gravity)
        airborne = true;
        break;
      }
      y = hp.y1; // touched down on the next column's top
      if (i === HOPS.length - 1) idle = true;
    }
    return { x, y, airborne, idle };
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib;
      const P = L.pal;
      const t = L.clamp(tIn, 0, info.dur); // transitions may ask past dur: hold the final pose

      const hero = heroAt(t);
      const camX = hero.x - 64; // hero anchors at screen x 64 (run-shot convention)

      // 1. sky
      L.px(ctx, 0, 0, 240, 135, P.sky);

      // 2. scenery (world-locked, scrolls with the camera)
      L.sprite(ctx, 'cloud', 950 - camX, 18);
      L.sprite(ctx, 'hill', 1120 - camX, GROUND - 10); // hill sprite is 24×10, base on the ground

      // 3. ground strip, full width (the staircase sits on it)
      L.groundStrip(ctx, camX - 16, camX + 240 + 16, camX);

      // 4. staircase + plateau: 2-tile-wide columns, filled from each top down to the ground
      for (const c of COLS) {
        for (let w = 0; w < 2; w++) {
          const gx = c.x + w * 16 - camX;
          if (gx < -16 || gx > 240) continue;
          for (let gy = c.top; gy < GROUND; gy += 16) L.sprite(ctx, 'tileBlock', gx, gy);
        }
      }

      // 5. Super Claw'd (scale 2): feet on the current surface, jump sprite only while airborne
      const SC = 2;
      let name;
      let hgt; // sprite heights at scale 2: clawdJump is 10 rows, the stand/run frames are 12
      if (hero.airborne) {
        name = 'clawdJump';
        hgt = 10 * SC;
      } else if (hero.idle) {
        name = 'clawdIdle';
        hgt = 12 * SC;
      } else {
        name = N.runPose(info.frame, RUN_V); // run cycle on the global frame (FILM.nes)
        hgt = 12 * SC;
      }
      L.sprite(ctx, name, hero.x - camX, hero.y - hgt, { scale: SC });

      // 6. HUD (G1): score 001300, ×01, TIME 285 at T 13.5, ticking 10 per second
      L.hud(ctx, { score: 1300, coins: 1, world: '1-1', time: 400 - Math.floor((info.T - 2.0) * 10) });
    },
  });
})();

</script>
<script>
// ---- src/scenes/08-shell.js
// Shot 08 — shell · T 16.0–18.5 (dur 2.5 s) · mode none · hard cut in/out, mid-run both sides.
//
// Layers, back to front:
//   1 sky fill              4 bugs A/B (walk left → flipped fall)   7 score pops
//   2 cloud + bush (world)  5 shellbug → shell (walk / skid / slide)
//   3 ground strip          6 Super Claw'd (scale 2)                8 HUD
//
// Continuity contracts (storyboard G1/G2/G4 + brief):
//   hero world-x = 976 + 72·t (in from shot 07 at 976, out to shot 09 at 1156);
//   camX = heroX − 64 (hero pinned at screen x 64, a whole game pixel each 60 Hz frame);
//   feet y 103; Super scale 2.
//   Hop local 0.5 (h 22, 0.5 s of air) → STOMP local 1.0 (T 17.0): shellbug → shell, +100.
//   Bounce h 8, 0.5 s → land + KICK local 1.5 (T 17.5): shell slides right at 96 px/s.
//   Shell meets bug A at local 2.0 (T 18.0, +200) and bug B at local 2.25 (T 18.25,
//   +400 — placed half a beat before the cut so the pop reads). Each hit flips the bug
//   upside-down and it falls off the bottom under gravity over 1/3 s (20 frames).
//   HUD: 001300 → 001400 (1.0) → 001600 (2.0) → 002000 (2.25); ×01;
//   time = 400 − floor((info.T − 2.0)·10) → 260 at start, matching shot 09's 235.
//
// Geometry note for reviewers (the brief's literal numbers are impossible; two forced fixes):
//   - Shellbug starts at world-x 1090 (brief said 1072): at local 1.0 it is exactly under
//     the hero's right half, right edges flush (hero 1048–1080, shellbug 1066–1080). The
//     1072 start left-aligns it and parks the shell 68 px behind the kick.
//   - The stomp knocks the shell forward: it skids right at 100 px/s during the bounce,
//     arriving flush with the hero's nose (world 1116) the frame he lands (local 1.5).
//     Why this is forced: the hero (72 px/s) is always AHEAD of a shell launched from the
//     stomp point (96 px/s from 36 px behind), so any shell/bug meeting earlier than
//     t = 3.75 s happens inside the hero's sprite — the mandated 2.0/2.25 hits would show
//     the bugs dying inside his body (checked numerically: 42 px and 36 px deep). With the
//     skid, the kicked shell leaves from his nose and pulls away at 24 px/s: the bugs die
//     26 px and 32 px ahead of him and he never touches them. It reads as one motion:
//     stomp pops the shell out from under him → he lands nose-to-shell → kick.
(function () {
  'use strict';

  const ID = 'shell';
  const LIB = FILM.lib;
  const clamp = LIB.clamp;
  const N = FILM.nes;
  const RUN_V = 72;

  // Beat constants, shot-local seconds.
  const B_HOP = 0.5; // T 16.5  takeoff
  const B_STOMP = 1.0; // T 17.0  shellbug → shell, +100
  const B_KICK = 1.5; // T 17.5  hero lands; shell slides right at 96 px/s
  const B_HIT_A = 2.0; // T 18.0  shell meets bug A, +200
  const B_HIT_B = 2.25; // T 18.25 shell meets bug B, +400

  const HOP_H = 22;
  const BOUNCE_H = 8;
  const AIR = 0.5; // both arcs are 0.5 s (30 frames)
  const FEET = LIB.GROUND_Y; // 103

  // World layout (game px).
  const BUSH_X = 1080;
  const CLOUD_X = 1120, CLOUD_Y = 18;

  // The shell actor (see header note).
  const SB_START = 1090; // shellbug left edge at t 0; walks left at 24 px/s
  const SHELL_STOMP = SB_START - 24 * B_STOMP; // 1066: shell appears here at local 1.0
  const SHELL_KICK = 1116; // shell left edge at the kick = hero's nose at local 1.5
  const SKID_V = (SHELL_KICK - SHELL_STOMP) / (B_KICK - B_STOMP); // 100 px/s during the bounce
  const SHELL_V = 96; // px/s once kicked
  const HIT_A_X = SHELL_KICK + 14 + SHELL_V * (B_HIT_A - B_KICK); // 1178 = bug A left edge at death
  const HIT_B_X = SHELL_KICK + 14 + SHELL_V * (B_HIT_B - B_KICK); // 1202 = bug B left edge at death

  // The two bugs: left edge meets the shell's right edge exactly at the hit time.
  const BUG_V = 24; // px/s walking left
  const BUG_A_START = HIT_A_X + BUG_V * B_HIT_A; // 1226
  const BUG_B_START = HIT_B_X + BUG_V * B_HIT_B; // 1256
  const FALL_F = 1 / 3; // flipped bugs fall off the bottom over 20 frames

  // Score pops: pxtext scale 1 ('+' glyph exists), rises 8 px over 0.5 s, holds an 8th, vanishes.
  const POP_RISE = 0.5;
  const POP_HOLD = 0.25;

  // Art-bible jump parabola: apex h, progress u → feet y.
  const arc = (h, u) => FEET - 4 * h * u * (1 - u);

  function scorePop(ctx, L, P, str, worldCx, camX, y0, age) {
    if (age < 0 || age >= POP_RISE + POP_HOLD) return;
    const rise = Math.floor(clamp(age / POP_RISE) * 8);
    L.pxtext(ctx, str, worldCx - camX, y0 - rise, { color: P.hudWhite, align: 'center' });
  }

  // A bug flipped upside-down in place (its box [gy, gy+9] mirrored about its own centre),
  // pixels kept hard: integer translate, no smoothing, straight blit under a 1,-1 transform.
  function bugFlipped(ctx, L, pose, gx, feetY) {
    const gy = Math.round(feetY) - 9;
    ctx.save();
    ctx.translate(0, (2 * gy + 9) * LIB.PX);
    ctx.scale(1, -1);
    L.sprite(ctx, pose, gx, gy);
    ctx.restore();
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = clamp(tIn, 0, info.dur);
      const T = info.T;

      // --- world state ---------------------------------------------------------
      const heroX = Math.round(976 + RUN_V * t); // hero world-x (left edge), whole px; 976 → 1156
      const camX = heroX - 64; // hero pinned at screen x 64; 912 → 1092
      const sx = (wx) => wx - camX;
      const score = t >= B_HIT_B ? 2000 : t >= B_HIT_A ? 1600 : t >= B_STOMP ? 1400 : 1300;
      const time = 400 - Math.floor((T - 2.0) * 10 + 1e-4);

      // Hero feet y + pose. Run drawings step on the global frame index so the cycle
      // continues seamlessly across the cuts with shots 07 and 09.
      const runPose = N.runPose(info.frame, RUN_V);
      let feet = FEET, pose = runPose;
      if (t >= B_HOP && t < B_STOMP) {
        feet = arc(HOP_H, (t - B_HOP) / AIR);
        pose = 'clawdJump';
      } else if (t >= B_STOMP && t < B_KICK) {
        feet = arc(BOUNCE_H, (t - B_STOMP) / AIR);
        pose = 'clawdJump';
      }

      // --- 1 sky ----------------------------------------------------------------
      L.px(ctx, 0, 0, L.VW, L.VH, P.sky);

      // --- 2 cloud + bush (world-anchored) ---------------------------------------
      L.sprite(ctx, 'cloud', sx(CLOUD_X), CLOUD_Y);
      L.sprite(ctx, 'bush', sx(BUSH_X), FEET - 7);

      // --- 3 ground ---------------------------------------------------------------
      L.groundStrip(ctx, camX, camX + L.VW, camX);

      // --- 4 bugs A and B: walk left at 24 px/s until hit, then flip and fall ------
      const walkPose = N.step(info.frame, 8, 2) ? 'bug2' : 'bug1';
      for (const [startX, hitT] of [[BUG_A_START, B_HIT_A], [BUG_B_START, B_HIT_B]]) {
        if (t < hitT) {
          const bx = sx(startX - BUG_V * t);
          if (bx > -12 && bx < L.VW) L.sprite(ctx, walkPose, bx, FEET - 9);
        } else {
          const u = clamp((t - hitT) / FALL_F);
          if (u < 1) {
            // frozen at the hit point, on the walk frame it died in; gravity ease-in
            const hitX = startX - BUG_V * hitT;
            const deadPose = N.step(N.frameOf(16 + hitT), 8, 2) ? 'bug2' : 'bug1';
            bugFlipped(ctx, L, deadPose, sx(hitX), FEET + 48 * L.ease.inQuad(u));
          }
        }
      }

      // --- 5 shellbug → shell -----------------------------------------------------
      if (t < B_STOMP) {
        const sbPose = N.step(info.frame, 8, 2) ? 'shellbug2' : 'shellbug1';
        L.sprite(ctx, sbPose, sx(SB_START - 24 * t), FEET - 12);
      } else {
        const shellX =
          t < B_KICK ? SHELL_STOMP + SKID_V * (t - B_STOMP) : SHELL_KICK + SHELL_V * (t - B_KICK);
        L.sprite(ctx, 'shell', sx(shellX), FEET - 7);
      }

      // --- 6 Super Claw'd -----------------------------------------------------------
      const hh = (pose === 'clawdJump' ? 10 : 12) * 2;
      L.sprite(ctx, pose, sx(heroX), Math.round(feet) - hh, { scale: 2 });

      // --- 7 score pops: world-anchored at the hit points, rise 8 px, then fade -----
      // y0s keep every pop above Super Claw'd's head (top 79 standing, 71 at the bounce
      // apex) for its whole life: they are world-anchored and drift left across him.
      scorePop(ctx, L, P, '+100', SHELL_STOMP + 7, camX, 66, t - B_STOMP);
      scorePop(ctx, L, P, '+200', HIT_A_X + 6, camX, 80, t - B_HIT_A);
      scorePop(ctx, L, P, '+400', HIT_B_X + 6, camX, 68, t - B_HIT_B); // above +200 (both 31 px wide)

      // --- 8 HUD ----------------------------------------------------------------------
      L.hud(ctx, { score, coins: 1, world: '1-1', time });
    },
  });
})();

</script>
<script>
// ---- src/scenes/09-pipe-down.js
/*
 * 09 pipe-down — T 18.5–21.0 (dur 2.5 s), mode none, hard cut in (mid-run).
 *
 * Super Claw'd (scale 2, 32x24) runs in at world-x 1156 + 72t (screen x 64,
 * camX = world-x - 64), jumps at T 19.25 onto the tall pipe at world-x 1300
 * (4 tiles, rim top y 39), lands on the rim at T 20.25, stands one beat, then
 * sinks straight down into the pipe T 20.5–21.0. Shot ends on the empty pipe.
 *
 * Layers back to front:
 *   1 sky fill     2 cloud (world 1250,20)   3 bush (world-x 1200)
 *   4 groundStrip  5 hero (run/jump/idle)    6 pipe OVER the hero (occludes sink)
 *   7 HUD (G1: 002000, x01, TIME 235 -> 210)
 *
 * The jump: h 66 parabola y(u) = 103 - 264*u*(1-u) (constant gravity); its
 * descending branch crosses the rim top (y 39) at u = U_CUT ~ 0.5870. The arc
 * is stretched so that cut lands exactly on the T 20.25 beat — apex feet y 37
 * (66 px above takeoff), head at y 17, clear of the HUD rows 1–15 — then the
 * feet hold at 39.
 * Horizontally he glides 1210 -> 1300 so the 32-px-wide sprite lands flush on
 * the 2-tile rim. The sink is 26 px over 0.5 s, linear, one whole game px at a time (a
 * step every ~1.15 frames at 60 fps, the console's pipe crawl); the hero is drawn
 * first and the whole pipe re-blitted over him, so the rim occludes him and
 * no legs dangle below the rim tile (sprite is 24 tall, sink is 26 deep).
 *
 * NES motion: camX snaps to a whole game pixel every 60 Hz frame, so the scroll and the hero
 * move together in 1-2 px steps.
 */
(function () {
  'use strict';

  const ID = 'pipe-down';
  const N = FILM.nes;

  // Beats (local t; global T in comments)
  const B_JUMP = 0.75; // T 19.25 — takeoff
  const B_LAND = 1.75; // T 20.25 — lands on the rim
  const B_SINK = 2.0;  // T 20.5  — starts sliding down the pipe
  const SINK_DUR = 0.5;
  const SINK_PX = 26;

  // World geometry (game px)
  const X_START = 1156;  // hero world-x at t 0 (G2)
  const RUN_V = 72;      // run speed, px/s
  const X_TAKE = X_START + RUN_V * B_JUMP; // 1210 — world-x at takeoff
  const PIPE_WX = 1300;  // pipe left edge (G3)
  const X_LAND = PIPE_WX; // lands flush: sprite is 32 wide, pipe is 2 tiles
  const PIPE_TOP = 39;   // rim top y (G3)
  const PIPE_H = 4;      // tiles tall, rim included
  const GROUND = 103;    // ground top face (lib.GROUND_Y)
  const FEET_RUN = GROUND;

  // Jump parabola: y(u) = FEET_RUN - 4*H*u*(1-u), cut where it descends to the
  // rim: 103 - 264u(1-u) = 39  ->  u = (1 + sqrt(1 - 64/66)) / 2
  const JUMP_H = 66;
  const U_CUT = (1 + Math.sqrt(1 - 64 / JUMP_H)) / 2; // ~0.5870

  // Sprite heights at scale 2 (rows x 2)
  const H_RUN = 24;  // clawdRun1/2, clawdIdle: 12 rows
  const H_JUMP = 20; // clawdJump: 10 rows

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);
      const T = info.T;

      // --- hero world-x and camera (hero pinned at screen x 64) ---
      let wx;
      if (t <= B_JUMP) wx = X_START + RUN_V * t;
      else if (t <= B_LAND) wx = L.lerp(X_TAKE, X_LAND, L.seg(t, B_JUMP, B_LAND));
      else wx = X_LAND;
      const camX = Math.round(wx) - 64; // whole game px
      const heroSX = Math.round(wx) - camX; // 64

      // 1 sky
      L.px(ctx, 0, 0, L.VW, L.VH, P.sky);

      // 2 cloud (scrolls with the world)
      L.sprite(ctx, 'cloud', 1250 - camX, 20);

      // 3 bush (background dressing on the ground line)
      L.sprite(ctx, 'bush', 1200 - camX, GROUND - 7);

      // 4 ground
      L.groundStrip(ctx, camX, camX + L.VW, camX);

      // 5 hero
      if (t < B_JUMP) {
        // mid-run from frame 0: run cycle on the global frame, feet on the ground
        L.sprite(ctx, N.runPose(info.frame, RUN_V), heroSX, FEET_RUN - H_RUN, { scale: 2 });
      } else if (t < B_LAND) {
        // the h 66 arc, cut at the rim top and remapped to land on B_LAND
        const u = L.seg(t, B_JUMP, B_LAND) * U_CUT;
        const feet = FEET_RUN - 4 * JUMP_H * u * (1 - u);
        L.sprite(ctx, 'clawdJump', heroSX, feet - H_JUMP, { scale: 2 });
      } else {
        // standing on the rim, then the steady slide down into the pipe
        const sink = Math.floor(SINK_PX * L.seg(t, B_SINK, B_SINK + SINK_DUR)); // linear, whole px
        L.sprite(ctx, 'clawdIdle', heroSX, PIPE_TOP - H_RUN + sink, { scale: 2 });
      }

      // 6 pipe OVER the hero: the rim occludes him as he sinks; by t 2.46 he is
      // fully behind it and the shot ends on the empty pipe
      L.pipe(ctx, PIPE_WX - camX, PIPE_TOP, PIPE_H);

      // 7 HUD (G1: score 002000, coins x01, TIME 235 at T 18.5 ticking -10/s)
      L.hud(ctx, {
        score: 2000,
        coins: 1,
        world: '1-1',
        time: 400 - Math.floor((T - 2.0) * 10),
      });
    },
  });
})();

</script>
<script>
// ---- src/scenes/10-cave.js
// Shot 10 — cave: "Underground" (T 21.0–24.0, dur 3.0 s; transitionIn fade 0.25 handled by core as
// an NES palette fade, frame 0 is fully drawn). A separate cave room: hero world-x starts at 24 (G2).
// 60 fps: camX snaps to a whole game pixel every frame; coins spin on their own 8-frame cadence
// (lib.coinSpin at 7.5 drawings/s).
// Layers, back to front:
//   1. caveBlack fill
//   2. cave-brick ceiling, 2 tiles deep (tileBrickCave, y 0–31), world-locked
//   3. cave ground strip (tileGroundCave, rows y 103 and 119), world-locked
//   4. five coins in a low arc + 8-frame collect sparkles
//   5. one patrolling bug (world-x ~300, walking left at 24 px/s)
//   6. Super Claw'd (scale 2, run cycle on the global frame; hop over the bug at local 2.5)
//   7. HUD (screen-fixed)
(function () {
  'use strict';
  const ID = 'cave';
  const N = FILM.nes;

  // World layout (storyboard G1/G2 + shot 10)
  const RUN = 72; // run speed, game px/s (1.2 px a frame at 60 fps)
  const HERO_X0 = 24; // cave room: hero world-x at t 0
  const GROUND_TOP = 103; // lib.GROUND_Y
  const ANCHOR = 64; // hero screen-x anchor once running

  // Five coins, a shallow arc; collected exactly on beats T 21.5–23.5 (local 0.5–2.5).
  const COINS = [
    { x: 60, y: 71 },
    { x: 96, y: 63 },
    { x: 132, y: 55 },
    { x: 168, y: 63 },
    { x: 204, y: 71 },
  ];
  const B_COIN = [0.5, 1.0, 1.5, 2.0, 2.5]; // local beats: T 21.5, 22.0, 22.5, 23.0, 23.5
  const SPARKLE_S = 8 / 60; // collect pop: sparkle sprite for 8 frames

  // Bug patrol
  const BUG_X0 = 300; // world-x at t 0
  const BUG_V = 24; // walks left, game px/s

  // The hop over the bug: local 2.5 (T 23.5), h 24, 0.5 s of air, lands as the shot ends.
  const B_HOP = 2.5; // T 23.5
  const HOP_H = 24;
  const HOP_A = 0.5; // s (30 frames)

  // HUD state (G1 row 10): start 002000 / ×01; +100 and +1 coin on each of the five beats.
  const SCORE0 = 2000;
  const COINS0 = 1;

  const COIN_FPS = 7.5; // a new spin drawing every 8 frames

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);

      // Hero on the world: runs the whole shot (keeps speed through the hop).
      const heroWX = Math.round(HERO_X0 + RUN * t); // whole game px
      const camX = Math.max(0, heroWX - ANCHOR);
      const heroSX = heroWX - camX;

      // Hop parabola (art bible 7.2): y(u) = y0 - 4*h*u*(1-u), u over A frames.
      const hopping = t >= B_HOP && t < B_HOP + HOP_A;
      let feetY = GROUND_TOP;
      if (hopping) {
        const u = (t - B_HOP) / HOP_A;
        feetY = GROUND_TOP - 4 * HOP_H * u * (1 - u);
      }

      // 1. Underground plate: flat caveBlack.
      L.px(ctx, 0, 0, L.VW, L.VH, P.caveBlack);

      // 2 + 3. Ceiling (2 tiles deep, y 0–31) and cave ground (rows y 103/119) across the
      // visible world range. L.groundStrip always uses tileGround, so lay tileGroundCave by hand.
      const ti0 = Math.floor(camX / 16);
      const ti1 = Math.ceil((camX + L.VW) / 16);
      for (let ti = ti0; ti <= ti1; ti++) {
        const gx = ti * 16 - camX;
        if (gx < -16 || gx > L.VW) continue;
        L.sprite(ctx, 'tileBrickCave', gx, 0);
        L.sprite(ctx, 'tileBrickCave', gx, 16);
        L.sprite(ctx, 'tileGroundCave', gx, GROUND_TOP);
        L.sprite(ctx, 'tileGroundCave', gx, GROUND_TOP + 16);
      }

      // 4. Coins: spin, 8 frames a drawing, keyed to global T; on the collect beat each vanishes
      // with an 8-frame sparkle pop at its spot.
      const coinName = L.coinSpin(info.T, COIN_FPS);
      let collected = 0;
      for (let i = 0; i < COINS.length; i++) {
        const c = COINS[i];
        const beat = B_COIN[i];
        if (t >= beat) collected++;
        const sx = c.x - camX;
        if (sx < -16 || sx > L.VW + 8) continue;
        if (t < beat) {
          L.sprite(ctx, coinName, sx, c.y);
        } else if (t < beat + SPARKLE_S) {
          L.sprite(ctx, 'sparkle', sx, c.y + 3); // 8×8 sparkle centred on the coin's middle
        }
      }

      // 5. The patrolling bug, walking left with a 2-frame step.
      const bugSX = Math.round(BUG_X0 - BUG_V * t) - camX;
      if (bugSX > -16 && bugSX < L.VW + 8) {
        L.sprite(ctx, N.step(info.frame, 8, 2) ? 'bug2' : 'bug1', bugSX, GROUND_TOP - 9);
      }

      // 6. Super Claw'd: run cycle, clawdJump while airborne, scale 2 (32×24 / 32×20).
      if (hopping) {
        L.sprite(ctx, 'clawdJump', heroSX, feetY - 20, { scale: 2 });
      } else {
        L.sprite(ctx, N.runPose(info.frame, RUN), heroSX, GROUND_TOP - 24, { scale: 2 });
      }

      // 7. HUD (G1): score 002000 → 002500, coins ×01 → ×06, TIME 210 ticking −10/s from T 2.0.
      L.hud(ctx, {
        score: SCORE0 + 100 * collected,
        coins: COINS0 + collected,
        time: 400 - Math.floor((info.T - 2.0) * 10 + 1e-6),
      });
    },
  });
})();

</script>
<script>
// ---- src/scenes/11-pipe-up.js
// Shot 11 — pipe-up: Back to daylight (T 24.0–26.0, dur 2.0 s, transitionIn fade 0.25
// handled by core as an NES palette fade; frame 0 is a fully drawn pose). 60 fps: the camera
// and every sprite sit on whole game pixels each frame.
//
// Layers, back to front:
//   1. sky fill — daylight again after the cave
//   2. hills at world-x 1700 / 1780 (base y 103) and a cloud at (1750, 20)
//   3. far landmarks: the flagpole at world-x 1848 (pipeGreen pole y 40–103, sparkle
//      tip, flag at y 44) and the castle at world-x 1912 (base y 103) — they enter
//      frame right as the camera moves
//   4. groundStrip across the visible range
//   5. the 2-tile pipe at world-x 1650 (rim top y 71) and Super Claw'd (scale 2) —
//      their draw order swaps at the hop, see below
//   6. HUD — G1 row 11: score 002500, ×06, TIME 180 ticking down to 160
//
// Pipe-occlusion note: the brief's sandwich (body rows, hero, rim over him) cannot
// fully hide a 24-px-tall Super Claw'd behind a 16-px rim — his legs would sit on top
// of the pipe body at t 0. So during the rise and stand (t < 1.0) he is drawn BEFORE
// the whole pipe: body rows and rim both occlude him, frame 0 fully hidden, and the
// rim still occludes his middle as he slides up. From the hop on (t ≥ 1.0) the pipe
// draws first and he runs in front. At the swap instant he stands exactly on the rim
// with zero pixel overlap, so the order change never shows.
//
// Camera note: the hero anchors at screen x 64 once running (camX = heroX − 64).
// A pure follow ends at camX 1658 with the castle (world-x 1912) at screen 254 —
// off-frame, while the storyboard wants it "entering frame at the end". So a +36 px
// look-ahead eases in over the last beat (t 1.5–2.0; a one-beat camera ease, art
// bible §7.2): final frame has the hero at screen 28, the flagpole at 154 and the
// castle's left 22 px on screen at 218. camX is snapped to a whole game pixel after the ease.
//
// Determinism: everything derives from t (clamped to [0, dur]) and info.T; no seeds
// needed — the shot has no random choices.

(function () {
  'use strict';

  const ID = 'pipe-up';
  const N = FILM.nes;

  // World layout (storyboard G2/G3 + shot 11 composition)
  const PIPE_X = 1650; // 2-tile pipe; hero rises out of it and resumes the surface run here
  const PIPE_TOP = 71; // rim top y
  const HILL1_X = 1700;
  const HILL2_X = 1780;
  const CLOUD_X = 1750;
  const POLE_X = 1848; // flagpole, 2 px wide, y 40–103
  const CASTLE_X = 1912; // 32×30 castle, base y 103
  const GY = 103; // ground top face (lib.GROUND_Y)
  const ANCHOR = 64; // hero screen-x anchor in run shots

  // Beats (shot-local seconds)
  const RISE_END = 0.75; // T 24.75 — standing on the rim
  const HOP_T = 1.0; // T 25.0 — hops off right
  const HOP_A = 0.5; // 30 frames of air
  const LAND_T = HOP_T + HOP_A; // t 1.5 — lands on the ground, runs on
  const HOP_H = 20; // hop bump height (storyboard G4-style parabola)
  const HOP_DX = 36; // 72 px/s × 0.5 s
  const RUN_V = 72; // run speed, px/s
  const CAM_LEAD = 36; // end-of-shot camera look-ahead (see header)

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);

      // --- hero state ---------------------------------------------------------
      let heroX, feetY, spr;
      if (t < HOP_T) {
        // Rise + stand: a steady upward slide, feet 95 (fully inside the pipe, top
        // level with the rim) → 71 (standing on the rim); holds the rim until the hop.
        const u = L.clamp(t / RISE_END);
        heroX = PIPE_X;
        feetY = 95 - 24 * u;
        spr = 'clawdIdle';
      } else if (t < LAND_T) {
        // Hop off right: 30-frame parabola from the rim (y 71) down to the ground
        // (y 103), moving right at run speed.
        const u = (t - HOP_T) / HOP_A;
        heroX = PIPE_X + HOP_DX * u;
        feetY = L.lerp(PIPE_TOP, GY, u) - 4 * HOP_H * u * (1 - u);
        spr = 'clawdJump';
      } else {
        // Run right at 72 px/s.
        heroX = PIPE_X + HOP_DX + RUN_V * (t - LAND_T);
        feetY = GY;
        spr = N.runPose(info.frame, RUN_V);
      }
      const sprH = spr === 'clawdJump' ? 20 : 24; // scale-2 sprite heights (10/12 rows)
      const heroGY = feetY - sprH;

      // --- camera ---------------------------------------------------------------
      // Follows once the hero passes the anchor (he starts on it: camX 1586); the
      // look-ahead eases in over the last beat so the castle enters frame right.
      const lead = CAM_LEAD * L.seg(t, LAND_T, info.dur, 'inOutQuad');
      heroX = Math.round(heroX); // whole game px
      const camX = Math.round(heroX - ANCHOR + lead); // whole game px

      // 1. sky ------------------------------------------------------------------
      L.px(ctx, 0, 0, L.VW, L.VH, P.sky);

      // 2. hills + cloud ---------------------------------------------------------
      L.sprite(ctx, 'hill', HILL1_X - camX, GY - 10);
      L.sprite(ctx, 'hill', HILL2_X - camX, GY - 10);
      L.sprite(ctx, 'cloud', CLOUD_X - camX, 20);

      // 3. far landmarks: flagpole + castle ---------------------------------------
      L.px(ctx, POLE_X - camX, 40, 2, GY - 40, P.pipeGreen);
      L.sprite(ctx, 'sparkle', POLE_X - 3 - camX, 40 - 8); // ball on the pole top
      L.sprite(ctx, 'flag', POLE_X + 2 - camX, 44); // pennant flying right
      L.sprite(ctx, 'castle', CASTLE_X - camX, GY - 30);

      // 4. ground ------------------------------------------------------------------
      L.groundStrip(ctx, camX - 16, camX + L.VW + 16, camX);

      // 5. pipe + hero (order swap at the hop — see header) -------------------------
      const hero = () => L.sprite(ctx, spr, heroX - camX, heroGY, { scale: 2 });
      if (t < HOP_T) {
        hero(); // behind the whole pipe: fully hidden at t 0, rim occludes on the way up
        L.pipe(ctx, PIPE_X - camX, PIPE_TOP, 2);
      } else {
        L.pipe(ctx, PIPE_X - camX, PIPE_TOP, 2);
        hero(); // clear of the pipe, runs in front of the world
      }

      // 6. HUD -----------------------------------------------------------------------
      L.hud(ctx, { score: 2500, coins: 6, time: 400 - Math.floor((info.T - 2.0) * 10) });
    },
  });
})();
