<script>
// ---- src/scenes/12-flagpole.js
// Shot 12 — flagpole: The leap onto the flagpole (T 26.0–28.0, dur 2.0 s, mode none,
// hard cut in from shot 11; frame 0 is a fully drawn mid-run pose, the last frame
// holds him hanging on the pole).
//
// Layers, back to front:
//   1. sky fill — overworld plate
//   2. cloud at world (1880, 16)
//   3. the flagpole at world-x 1848: 2-px pipeGreen pole y 40–103 (L.px), sparkle
//      ball on top at y 38, triangular `flag` flying right at y 44 — and the castle
//      at world-x 1912 (32×30, base y 103)
//   4. groundStrip across the visible range
//   5. Super Claw'd (scale 2) — runs, leaps, grabs; always in front of the pole
//   6. HUD — G1 row 12: score 002500, ×06, TIME 160 ticking down to 140
//
// Camera: shot 11 ended at camX 1694 (a +36 px look-ahead over the anchor). Here the
// lead dissolves LINEARLY over the first beat (36 px over 0.5 s = 72 px/s, exactly
// the run speed), so camX holds 1694 while the hero crosses screen 28 → 64 — the
// "ease to the anchor" happens in the framing, with zero leftward camera motion.
// From t 0.5 the camera anchor-follows (camX = runX − 64) — and is capped at 1704,
// the fixed camera of shots 13–14 (pole at screen x 144, storyboard G3). The cap
// bites at t ≈ 0.64, so the leap and the grab play against a parked, SMB-end-level
// frame, and the shot ends exactly on the continuity contract. camX is therefore
// monotonic (right-only, art bible §10.6); a literal follow to the grab (camX 1784)
// would have forced an 80-px leftward whip into the cut, which that rule bans.
//
// The grab: takeoff at world-x 1794 on the T 27.0 beat; the pole is 54 px ahead and
// he travels 72 px/s, so he reaches it 0.75 s later (T 27.75, an 8th) exactly at the
// apex of the h 55, A 36 f parabola (u = 0.5 → feet y = 103 − 55 = 48, storyboard
// G4). That frame he becomes clawdPole at world-x 1846 — the pole (1848–1850) sits
// 2 px inside his left silhouette, the feet side against it — and the flag twitches
// 1 px for 8 frames. Then everything holds: frozen grip, parked camera.
//
// NES motion (60 fps): camX and the hero sit on whole game pixels each frame; the leap is a
// constant-gravity parabola; the run cycle steps on the global frame index.
//
// Determinism: everything derives from t (clamped to [0, dur]) and info.T; no seeds
// needed — the shot has no random choices.

(function () {
  'use strict';

  const ID = 'flagpole';
  const N = FILM.nes;

  // World layout (storyboard G2/G3 + shot 12 composition)
  const RUN_X0 = 1722; // hero world-x at t 0 (G2)
  const RUN_V = 72; // run speed, px/s (1.2 px a frame at 60 fps)
  const ANCHOR = 64; // hero screen-x anchor in run shots
  const CAM_START = 1694; // shot 11's final camX (+36 px look-ahead)
  const CAM_LEAD = CAM_START - (RUN_X0 - ANCHOR); // 36 — dissolves over beat 1
  const CAM_END = 1704; // fixed camera of shots 13–14 (pole at screen 144, G3)
  const POLE_X = 1848; // flagpole, 2 px wide, y 40–103
  const BALL_Y = 32; // sparkle ball on the pole top (sprite bottom flush at y 40 — matches shots 11 and 13)
  const FLAG_Y = 44; // triangular flag, flying right
  const CASTLE_X = 1912; // 32×30 castle, base y 103
  const CLOUD_X = 1880;
  const CLOUD_Y = 16;
  const GY = 103; // ground top face (lib.GROUND_Y)

  // Beats (shot-local seconds)
  const B_JUMP = 1.0; // T 27.0 — THE BIG JUMP takes off at world-x 1794
  const B_GRAB = 1.75; // T 27.75 — pole grab at the apex (an 8th note)
  const AIR = 1.5; // 1.5 s of air (G4), 90 frames
  const JUMP_H = 55; // apex height (G4)
  const TAKEOFF_X = RUN_X0 + RUN_V * B_JUMP; // 1794
  const GRAB_X = 1846; // frozen grip: sprite left edge, feet side against the pole
  const GRAB_FEET = GY - JUMP_H; // 48 — apex height
  const JIG_S = 8 / 60; // flag twitch: 1 px for 8 frames from the grab

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);

      // --- hero state ---------------------------------------------------------
      let heroX, feetY, spr, sprH;
      if (t < B_JUMP) {
        // Run right at 72 px/s, run cycle on the global frame.
        heroX = RUN_X0 + RUN_V * t;
        feetY = GY;
        spr = N.runPose(info.frame, RUN_V);
        sprH = 24; // 12 rows at scale 2
      } else if (t < B_GRAB) {
        // The soaring parabola: h 55, 1.5 s of air, apex (u = 0.5) exactly at the pole.
        const u = (t - B_JUMP) / AIR;
        heroX = TAKEOFF_X + RUN_V * (t - B_JUMP);
        feetY = GY - 4 * JUMP_H * u * (1 - u);
        spr = 'clawdJump';
        sprH = 20; // 10 rows at scale 2
      } else {
        // Frozen on the pole, feet y 48, feet side against it.
        heroX = GRAB_X;
        feetY = GRAB_FEET;
        spr = 'clawdPole';
        sprH = 22; // 11 rows at scale 2
      }

      // --- camera ---------------------------------------------------------------
      // Beat 1: the +36 lead dissolves linearly at run speed — camX parks at 1694
      // while the hero settles onto the anchor. Then anchor-follow, capped at 1704
      // (monotonic, right-only; see header). Nominal run-x drives the camera even
      // after the hero freezes, so the cap logic never sees the grab pose.
      const runX = RUN_X0 + RUN_V * t;
      const lead = CAM_LEAD * (1 - L.clamp(t / 0.5));
      const camX = Math.round(Math.min(runX - ANCHOR + lead, CAM_END)); // whole game px
      heroX = Math.round(heroX);

      // 1. sky ------------------------------------------------------------------
      L.px(ctx, 0, 0, L.VW, L.VH, P.sky);

      // 2. cloud -----------------------------------------------------------------
      L.sprite(ctx, 'cloud', CLOUD_X - camX, CLOUD_Y);

      // 3. flagpole + castle -------------------------------------------------------
      const jig = t >= B_GRAB && t < B_GRAB + JIG_S ? 1 : 0;
      L.px(ctx, POLE_X - camX, 40, 2, GY - 40, P.pipeGreen);
      L.sprite(ctx, 'sparkle', POLE_X - 3 - camX, BALL_Y); // ball mounted on the pole top
      L.sprite(ctx, 'flag', POLE_X + 2 - camX, FLAG_Y + jig); // pennant flying right; twitches on the grab
      L.sprite(ctx, 'castle', CASTLE_X - camX, GY - 30);

      // 4. ground ------------------------------------------------------------------
      L.groundStrip(ctx, camX - 16, camX + L.VW + 16, camX);

      // 5. hero ----------------------------------------------------------------------
      L.sprite(ctx, spr, heroX - camX, feetY - sprH, { scale: 2 });

      // 6. HUD -----------------------------------------------------------------------
      L.hud(ctx, { score: 2500, coins: 6, time: 400 - Math.floor((info.T - 2.0) * 10) });
    },
  });
})();

</script>
<script>
// ---- src/scenes/13-slide.js
/*
 * 13-slide.js — shot 13 'slide' (T 28.0–30.0, dur 2.0 s, 120 frames at 60 fps)
 *
 * The flag slide. Claw'd (Super, scale 2) hangs on the flagpole, slides down as the flag
 * comes down with him, the '+5000' score pop fires and the HUD jumps 002500 → 007500;
 * he hops off to the right and runs toward the castle while two firework bursts celebrate
 * in the sky. Camera FIXED at camX 1704 (storyboard G3): pole at screen 144, castle door
 * at screen ~226.
 *
 * Layers, back to front:
 *   1. sky fill
 *   2. cloud (world 1880, 18 → screen 176; nudged right from the brief's world 1800 —
 *      see deviations)
 *   3. castle (world 1912 → screen 208, base y 103)
 *   4. flagpole: 2-px pipeGreen pole y 40–103 at world 1848 (screen 144), sparkle ball
 *      on top, triangular flag sliding y 44 → 88
 *   5. ground strip across the visible range
 *   6. Claw'd — clawdPole slide → clawdIdle stand → clawdJump hop → run1/run2 (scale 2;
 *      drawn after the pole so he hugs it / passes in front of it)
 *   7. FX: '+5000' pxtext pop (T 28.75), firework bursts (T 29.0 orange / T 29.5 cream)
 *   8. HUD — G1 row 13: score 002500 → 007500 at T 28.75, ×06, TIME 140 → 120
 *
 * Beat grid (shot-local):
 *   0.00–0.75  slide down the pole, hero top y 48 → 81 (feet 70 → 103), flag 44 → 88,
 *              both steady linear slides
 *   0.75       '+5000' pops at the pole top (rises 8 px over 0.5 s, then vanishes);
 *              HUD score jumps to 007500; he stands at the pole base
 *   1.00       hops off right (clawdJump, h 12, 0.5 s of air, drifts +8 px); firework 1
 *   1.50       lands, runs right at 72 px/s (run cycle on the global frame); firework 2
 *   2.00       holds the final pose: mid-run at world-x 1860 (screen 156)
 *
 * Deviations forced by the fixed geometry (beats and look unchanged):
 *   - The slide ends at hero-top y 81, not the brief's 79: clawdPole is 11 rows (22 game
 *     px at scale 2), so top 81 is what puts his feet exactly on the ground top (103),
 *     which is the brief's hard constraint ('feet reach 103').
 *   - He hangs LEFT of the pole (left edge world 1816, SMB's Mario-left / flag-right
 *     layout): with his body right of the pole, the right-flying flag (screen 146–154)
 *     would slide through his torso for most of the descent. This also keeps the flag
 *     visible for the whole slide and reads exactly like SMB's flagpole dismount.
 *   - He ends at world-x ≈ 1860, not the brief's '≈ 1790': the pole is at world 1848 and
 *     he hops RIGHT toward the castle, covering ~44 px (8 px hop drift + 36 px run). 1790
 *     is LEFT of the pole he just slid down — geometrically impossible for this shot;
 *     treated as a typo. NOTE for the shot-14 agent: storyboard shot 14's 'world-x 1790 →
 *     1938' carries the same slip — shot 13 hands off at 1860, mid-run pose.
 *   - The cloud sits at world 1880 (screen 176), not (1800, 18): firework 2 bursts
 *     beside it, and the cream sparkle sprite on the white cloud would be invisible
 *     there. The firework beats are fixed; the cloud is scenery, so the cloud moved.
 *   - The fireworks burst at screen (60, 40) and (100, 38), not ~(100, 22): radius 18 from
 *     y 22 puts the top sparkles inside the HUD rows (1–15) and over the score and ×06 counter.
 *     These centres keep every spark at y ≥ 16, clear of the HUD; the '~' position stood.
 *
 * Determinism: everything derives from t (clamped to [0, dur]) and info.T; the shot has
 * no random choices, so no seeds.
 *
 * NES motion (60 fps): the slide and the run move in whole game pixels each frame; bursts and
 * the pop never blend (sparkles flicker out, the pop vanishes).
 */
(function () {
  'use strict';

  const ID = 'slide';
  const N = FILM.nes;

  // beats (shot-local seconds)
  const B_POP = 0.75; // T 28.75 — slide ends, '+5000' pops, HUD score jumps
  const B_HOP = 1.0;  // T 29.0  — hops off right; firework 1
  const B_LAND = 1.5; // T 29.5  — lands and runs; firework 2
  const HOP_A = 0.5;  // 30 frames of air
  const HOP_H = 12;   // hop apex height (game px)
  const HOP_DX = 8;   // rightward drift during the hop
  const RUN_V = 72;   // run speed, px/s

  // world layout (storyboard G3 + shot 13 composition); camera fixed
  const CAM = 1704;
  const GY = 103;             // ground top face (lib.GROUND_Y)
  const POLE_X = 1848;        // flagpole, 2 px wide, y 40–103
  const POLE_TOP = 40;
  const CASTLE_X = 1912;      // 32×30 castle, base y 103
  const CLOUD_X = 1880;       // nudged right (see header)
  const CLOUD_Y = 18;
  const HERO_X = 1816;        // hero left edge on the pole: body left, flush to the pole
  const RUN_X0 = HERO_X + HOP_DX; // where the hop lands and the run starts

  // slide endpoints: hero top y 48 → 81 (feet 70 → 103); flag top y 44 → 88
  const SLIDE_Y0 = 48, SLIDE_Y1 = 81;
  const FLAG_Y0 = 44, FLAG_Y1 = 88;

  // sprite heights at scale 2 (clawdPole 11 rows, clawdJump 10, idle/run 12)
  const H_POLE = 22, H_JUMP = 20, H_RUN = 24;

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);
      const T = info.T;
      const sx = (wx) => wx - CAM;

      // --- hero state ---------------------------------------------------------
      let hx = HERO_X, heroTop;
      let spr;
      if (t < B_POP) {
        // the slide: steady linear descent, feet 70 → 103
        const u = t / B_POP;
        spr = 'clawdPole';
        heroTop = SLIDE_Y0 + (SLIDE_Y1 - SLIDE_Y0) * u;
      } else if (t < B_HOP) {
        // stands at the pole base for a beat-half before the hop
        spr = 'clawdIdle';
        heroTop = GY - H_RUN;
      } else if (t < B_LAND) {
        // hops off to the right: 30-frame parabola, h 12, drifts +8 px
        const u = (t - B_HOP) / HOP_A;
        spr = 'clawdJump';
        hx = HERO_X + HOP_DX * u;
        heroTop = GY - 4 * HOP_H * u * (1 - u) - H_JUMP;
      } else {
        // lands and runs right toward the castle at 72 px/s
        spr = N.runPose(info.frame, RUN_V);
        hx = RUN_X0 + RUN_V * (t - B_LAND);
        heroTop = GY - H_RUN;
      }

      // ------------------------------------------------ 1. sky
      L.px(ctx, 0, 0, L.VW, L.VH, P.sky);

      // ------------------------------------------------ 2. cloud
      L.sprite(ctx, 'cloud', sx(CLOUD_X), CLOUD_Y);

      // ------------------------------------------------ 3. castle
      L.sprite(ctx, 'castle', sx(CASTLE_X), GY - 30);

      // ------------------------------------------------ 4. flagpole + sliding flag
      L.px(ctx, sx(POLE_X), POLE_TOP, 2, GY - POLE_TOP, P.pipeGreen);
      L.sprite(ctx, 'sparkle', sx(POLE_X) - 3, POLE_TOP - 8); // ball on the pole top
      const flagY = t < B_POP ? FLAG_Y0 + (FLAG_Y1 - FLAG_Y0) * (t / B_POP) : FLAG_Y1;
      L.sprite(ctx, 'flag', sx(POLE_X) + 2, flagY); // pennant flying right

      // ------------------------------------------------ 5. ground
      L.groundStrip(ctx, CAM - 16, CAM + L.VW + 16, CAM);

      // ------------------------------------------------ 6. Claw'd (in front of the pole)
      L.sprite(ctx, spr, sx(hx), heroTop, { scale: 2 });

      // ------------------------------------------------ 7. FX
      // '+5000' pops at the pole top on T 28.75: rises 8 px over 30 frames, then vanishes
      if (t >= B_POP && t < B_POP + 0.5) {
        const rise = Math.floor(8 * L.seg(t, B_POP, B_POP + 0.5));
        L.pxtext(ctx, '+5000', sx(POLE_X) + 1, 26 - rise, { align: 'center', color: P.hudWhite });
      }
      // fireworks: 8-sparkle radial bursts at 45° steps, out to r 18 over 25 frames: steady
      // for the first 12, then flickering out on 2-frame beats (no fades on the console);
      // burst 1 is fireOrange (small hard px squares — the sparkle sprite is fixed cream),
      // burst 2 draws the sparkle sprite itself
      const BURST_S = 25 / 60;
      const burst = (bx, by, bt, orange) => {
        const k = N.frameOf(t - bt); // frames since the pop
        if (t < bt || t >= bt + BURST_S) return;
        if (k >= 12 && N.step(k, 2, 2) === 1) return;
        const r = 18 * L.seg(t, bt, bt + BURST_S, 'outQuad');
        if (k < 8) L.px(ctx, bx - 1, by - 1, 3, 3, orange ? P.fireYellow : P.sparkle); // core flash
        for (let i = 0; i < 8; i++) {
          const ang = (i * Math.PI) / 4;
          const fx = bx + Math.cos(ang) * r, fy = by + Math.sin(ang) * r;
          if (orange) L.px(ctx, fx - 1, fy - 1, 2, 2, P.fireOrange);
          else L.sprite(ctx, 'sparkle', fx - 4, fy - 4);
        }
      };
      burst(60, 40, B_HOP, true);   // T 29.0 — orange burst (top spark y 21)
      burst(100, 38, B_LAND, false); // T 29.5 — cream sparkle burst (top sparkle y 16)

      // ------------------------------------------------ 8. HUD (G1 row 13)
      L.hud(ctx, {
        score: t >= B_POP ? 7500 : 2500,
        coins: 6,
        world: '1-1',
        time: 400 - Math.floor((T - 2.0) * 10 + 1e-4),
      });
    },
  });
})();

</script>
<script>
// ---- src/scenes/14-castle-in.js
/*
 * 14 castle-in — T 30.0–32.0 (dur 2.0 s), mode none, hard cut in (mid-run).
 *
 * Super Claw'd runs the last stretch to the castle and disappears through the
 * door. Camera fixed at camX 1704 (G3): flagpole at screen 144, castle at
 * screen 208, door at screen ~221–227.
 *
 * World layout (game px; screen x = world-x − 1704):
 *   cloud     world (1780, 20) → screen 76
 *   flagpole  world-x 1848, pole y 40–103, sparkle ball on top; the flag is
 *             gone (taken down during shot 13's slide — bare pole, SMB-style)
 *   castle    world-x 1912, 32×30, base y 103 → screen (208, 73)
 *   door      sprite cols 13–18 + castle x → world 1925–1931, centre 1928
 *   hero      world-x 1860 + 72·t (left edge — G2/storyboard world-x semantics),
 *             feet y 103, scale 2 (32×24), run cycle keyed to the global frame (FILM.nes),
 *             whole game px each 60 Hz frame
 *
 * THE ENTRY — classic SMB draw-order swap. While the hero's centre is left of
 * the door's left jamb (centre < 1925) he draws AFTER the castle, running in
 * front of the wall, the black door visible between his legs in the last
 * in-front frames. Once his centre crosses the jamb — t = (1925 − 16 −
 * 1860)/72 = 49/72 ≈ 0.681 (T 30.681) — the order swaps: hero first, castle
 * over him, and since the keep's 32 px of wall and door void now cover him he
 * is simply not drawn any more: the doorway swallows him whole, SMB1-style.
 * (Drawing him behind the castle would leak his top rows through the
 * crenellation gaps for a frame — the verified-clean read is the instant
 * vanish.) He is inside well before T 31.75 (storyboard) and the frame holds
 * on the empty castle; the keep's pennant twitches once (1 px up, to the cut: 6 frames)
 * from local t 1.9 (T 31.9).
 *
 * Layers back to front:
 *   1 sky fill
 *   2 cloud (world 1780, 20)
 *   3 flagpole (bare) + sparkle ball
 *   4 ground strip (camX … camX + 240)
 *   5 hero + castle — draw order swapped at the door jamb (see above)
 *   6 pennant twitch overlay (castle pennant redrawn 1 px up from t 1.9)
 *   7 HUD (G1: score 007500, ×06, TIME 400 − floor((T − 2)·10) = 120 → 100)
 *
 * Determinism: everything derives from clamped t and info.T; no random choices.
 */
(function () {
  'use strict';

  const ID = 'castle-in';

  // World constants (game px)
  const CAM_X = 1704; // fixed camera (G3)
  const FEET = 103; // ground top face (lib.GROUND_Y)
  const HERO_W = 32; // Super Claw'd bounding box at scale 2
  const HERO_H = 24; // run sprite: 12 rows × 2
  const RUN_V = 72; // run speed, px/s
  const X_START = 1860; // hero left edge at t 0 (shot 13 hands off at world-x 1860)
  const CLOUD_X = 1780, CLOUD_Y = 20;
  const POLE_X = 1848; // flagpole (G3)
  const CASTLE_X = 1912; // castle left edge (G3)
  const CASTLE_TOP = FEET - 30; // 73 — castle sprite is 30 tall
  const DOOR_L = CASTLE_X + 13; // 1925 — door's left jamb (sprite cols 13–18)
  const TWITCH_T = 1.9; // T 31.9 — pennant jiggle starts
  const N = FILM.nes;

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);

      // hero state: always mid-run, moving right at 72 px/s
      const heroWx = Math.round(X_START + RUN_V * t); // left edge, whole game px
      const heroCx = heroWx + HERO_W / 2;
      const inFront = heroCx < DOOR_L; // before the jamb: over the castle; after: behind it

      // ------------------------------------------------ 1. sky
      L.px(ctx, 0, 0, L.VW, L.VH, P.sky);

      // ------------------------------------------------ 2. cloud (world-locked)
      L.sprite(ctx, 'cloud', CLOUD_X - CAM_X, CLOUD_Y);

      // ------------------------------------------------ 3. flagpole (flag taken in shot 13)
      L.px(ctx, POLE_X - CAM_X, 40, 2, FEET - 40, P.pipeGreen);
      L.sprite(ctx, 'sparkle', POLE_X - 3 - CAM_X, 40 - 8); // ball on the pole top

      // ------------------------------------------------ 4. ground
      L.groundStrip(ctx, CAM_X, CAM_X + L.VW, CAM_X);

      // ------------------------------------------------ 5. hero + castle (order swap)
      // Once his centre is past the jamb he is inside: the castle covers his whole
      // span, so he is not drawn at all — nothing leaks through wall or crenels.
      const drawHero = () => {
        // run cycle keyed to the global frame like shot 06
        L.sprite(ctx, N.runPose(info.frame, RUN_V), heroWx - CAM_X, FEET - HERO_H, { scale: 2 });
      };
      L.sprite(ctx, 'castle', CASTLE_X - CAM_X, CASTLE_TOP);
      if (inFront) drawHero(); // before the jamb: hero runs in front of the castle

      // ------------------------------------------------ 6. pennant twitch (T 31.9 to the cut, 6 frames)
      // The pennant is baked into the castle sprite at local x 16–22, y 0–2 against
      // open sky; erase it and redraw one game px up.
      if (t >= TWITCH_T) {
        const px = CASTLE_X - CAM_X + 16, py = CASTLE_TOP;
        L.px(ctx, px, py, 7, 3, P.sky); // clear the baked pennant (sky behind it)
        L.px(ctx, px, py - 1, 7, 1, P.bushGreen); // row 0, shifted up 1 px
        L.px(ctx, px, py, 5, 1, P.bushGreen); // row 1
        L.px(ctx, px, py + 1, 3, 1, P.bushGreen); // row 2
      }

      // ------------------------------------------------ 7. HUD (G1 row 14)
      L.hud(ctx, {
        score: 7500,
        coins: 6,
        world: '1-1',
        time: 400 - Math.floor((info.T - 2.0) * 10 + 1e-4),
      });
    },
  });
})();

</script>
<script>
// ---- src/scenes/15-throne.js
// Shot 15 — throne (T 32.0–35.0, dur 3.0 s, 60 fps). transitionIn fade 0.25 handled by core as an
// NES palette fade. Positions are whole game pixels each frame; nothing blends (pops flicker out).
// Screen-fixed castle interior (no camera): Claw'd walks in from the left, sees Princess
// Pearl waiting on her pedestal, she hops with joy and waves, hearts rise between them.
//
// Layers, back to front:
//   1. caveBlack hall fill
//   2. floor — tileGroundCastle rows at y 103 and y 119, full width (16 px pitch)
//   3. wall pillars — tileBlockCastle, 2 tiles wide, at x 32 and x 200, y 39 → floor
//   4. torch flames on each pillar's inner face (2-shape flicker, 8 frames a shape, L.px)
//   5. pedestal — 3 ascending tileBlockCastle steps (tops y 99 / 95 / 91)
//   6. Princess Pearl — princess → princessWave, two 20-frame joy hops (h 8)
//   7. Claw'd (Super, scale 2) — walks in (run cycle on the global frame), stops at centre x 130, idle
//   8. "!" pxtext scale 2 pop above his head (local 1.0: 10-frame pop, hold, flickers out by 2.0)
//   9. three hearts rising between them (local 2.0 / 2.25 / 2.5, 14 px over 1 s, flickering out)
//  10. HUD — score 007500, ×06, TIME held at 100 (the game has ended — no tick-down)

(() => {
  'use strict';
  const ID = 'throne';
  const N = FILM.nes;

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);

      // --- beat times (shot-local seconds; global = local + 32.0) ---
      const T_SEE = 1.0;    // T 33.0 — the "!" pops above his head
      const T_STOP = 1.5;   // T 33.5 — he reaches x 130 and stops; her first hop
      const T_HOP2 = 2.0;   // T 34.0 — her second hop, princessWave from here, hearts start
      const HOP_A = 1 / 3; // 20-frame parabola

      // --- hero state (needed by both his sprite and the "!") ---
      const HCX0 = -16;  // centre starts off-screen left: frame 0 hall is empty of hero
      const HCX1 = 130;  // centre stops here, idle, facing her
      const walking = t < T_STOP;
      const hcx = Math.round(walking ? L.lerp(HCX0, HCX1, t / T_STOP) : HCX1); // whole game px
      const hName = walking ? N.runPose(info.frame, (HCX1 - HCX0) / T_STOP) : 'clawdIdle';

      // 1. hall (the game screen is 240×135 game px)
      L.px(ctx, 0, 0, 240, 135, P.caveBlack);

      // 2. floor
      for (let x = 0; x < 240; x += 16) {
        L.sprite(ctx, 'tileGroundCastle', x, 103);
        L.sprite(ctx, 'tileGroundCastle', x, 119);
      }

      // 3. pillars (y 39 down to the floor: 4 rows of 2 tiles)
      for (const px0 of [32, 200]) {
        for (let ty = 39; ty < 103; ty += 16) {
          L.sprite(ctx, 'tileBlockCastle', px0, ty);
          L.sprite(ctx, 'tileBlockCastle', px0 + 16, ty);
        }
      }

      // 4. torches — 4×6 fireOrange blob + 2×3 fireYellow core, two flicker shapes, 8 frames each
      const flame = (fx, fy, f) => {
        const rows = f
          ? ['..O.', '.OO.', '.OOO', 'OOOO', 'OOO.', '.OO.']
          : ['.OO.', '.OO.', 'OOOO', 'OOOO', 'OOOO', '.OO.'];
        for (let y = 0; y < 6; y++)
          for (let x = 0; x < 4; x++)
            if (rows[y][x] === 'O') L.px(ctx, fx + x, fy + y, 1, 1, P.fireOrange);
        L.px(ctx, fx + 1, fy + (f ? 3 : 2), 2, 3, P.fireYellow); // core
        L.px(ctx, fx + 1, fy + 6, 2, 2, P.castleDeep);           // wall sconce
      };
      const tf = N.step(info.frame, 8, 2);
      flame(64, 68, tf);      // left pillar's inner face
      flame(196, 68, tf ^ 1); // right pillar's inner face, opposite phase

      // 5. pedestal — steps ascending toward her, tops y 99 / 95 / 91, each 2×1 tiles
      for (const step of [[138, 99], [154, 95], [170, 91]]) {
        L.sprite(ctx, 'tileBlockCastle', step[0], step[1]);
        L.sprite(ctx, 'tileBlockCastle', step[0] + 16, step[1]);
      }

      // 6. Princess Pearl — feet planted on the top step (feet y 91); hops at T 33.5 / 34.0
      const hop = (t0) => {
        const u = (t - t0) / HOP_A;
        return u >= 0 && u <= 1 ? 4 * 8 * u * (1 - u) : 0;
      };
      const pdy = Math.max(hop(T_STOP), hop(T_HOP2));
      L.sprite(ctx, t >= T_HOP2 ? 'princessWave' : 'princess', 163, 77 - pdy);

      // 7. Claw'd — Super (scale 2, 32×24), feet y 103, faces right (toward her)
      L.sprite(ctx, hName, hcx - 16, 79, { scale: 2 });

      // 8. "!" — 10-frame pop from local 1.0 (small, overshoot, settle), holds, then flickers
      //    out on 2-frame beats over the last 8th before 2.0
      if (t >= T_SEE && t < 2.0) {
        const d = N.frameOf(t - T_SEE); // frames since the pop started
        const shown = t < 1.75 || N.step(d, 2, 2) === 0;
        if (shown && d < 5) {
          L.pxtext(ctx, '!', hcx, 71, { scale: 1, align: 'center', color: P.hudWhite });
        } else if (shown) {
          L.pxtext(ctx, '!', hcx, d < 10 ? 65 : 66, { scale: 2, align: 'center', color: P.hudWhite });
        }
      }

      // 9. hearts — spawn x ≈ 148/156/152 at y 88, rise 14 px over 1 s, ±2 px sine wobble,
      //    flickering out (2 frames on, 2 off) over their last 0.4 s
      const HX = [148, 156, 152], HT = [2.0, 2.25, 2.5];
      for (let i = 0; i < 3; i++) {
        const u = (t - HT[i]) / 1.0;
        if (u < 0 || u >= 1) continue;
        if (u >= 0.6 && N.step(N.frameOf(t - HT[i]), 2, 2) === 1) continue;
        const hx = HX[i] + Math.sin(u * Math.PI * 2 + i * 2.1) * 2;
        L.sprite(ctx, 'heart', hx, 88 - 14 * u);
      }

      // 10. HUD — TIME held at 100 (inside the castle the countdown has stopped)
      L.hud(ctx, { score: 7500, coins: 6, world: '1-1', time: 100 });
    },
  });
})();

</script>
<script>
// ---- src/scenes/16-thanks.js
// Shot 16 — thanks (T 35.0–38.0, dur 3.0 s, 180 frames at 60 fps) · mode none · hard cut in/out.
// The rescue celebration in the throne room (same castle-interior room as shot 15,
// screen-fixed). "THANK YOU CLAW'D!" types on, the +10000 rescue bonus pops and the
// score rolls to 017500, sparkle bursts frame the pair while Claw'd (Super) and
// Princess Pearl trade joy hops on alternating 8ths.
//
// Layers, back to front:
//    1. caveBlack fill
//    2. wall pillars: tileBlockCastle stacks at x 32 and x 200, y 55–103 (kept below the text lines)
//    3. floor: tileGroundCastle rows y 103 and y 119, full width
//    4. torch flames on the pillar tops — 2-shape flicker, 8 frames a shape, alternating phase
//       (fireOrange 4×6 blob + fireYellow 2×3 core)
//    5. Claw'd (Super, scale 2, centre x 96) and Princess Pearl (centre x 128), feet y 103,
//       apex-locked joy hops h 6, 20-frame parabolas, Pearl offset 0.25 s (they take turns)
//    6. sparkle bursts: 6-sparkle radials at T 36.5 (70,60), T 37.0 (170,55), T 37.5 (120,48),
//       flying out 14 px over 20 frames, flickering out over the last 10 (no fades on the console)
//    7. "+10000" pxtext pop above the pair at T 36.0 — rises 8 px over 30 frames, holds, vanishes
//    8. text: "THANK YOU CLAW'D!" scale 1 centred x 120, y 27 (types on local 0–0.5 s);
//       "THE PRINCESS IS SAVED!" scale 1 centred x 120, y 39 (types on local 0.5–1.0 s) —
//       the 8x8 console font, one line each, like the game's own castle message
//    9. HUD (G1: score 007500 → 017500 at T 36.0, ×06, TIME HELD at 70)
//
// Notes for reviewers:
//   - Hop windows are ±10 frames around the apex, apexes locked to the beat grid (Claw'd on
//     beats 0/0.5/1.0/…, Pearl on the 8ths 0.25/0.75/…), so frame 0 opens with Claw'd at
//     the top of his hop and Pearl lifts off 5 frames later — the bounce is already running.
//   - Pillar tops sit at y 55 so the flames (y 49–54) sit below the second text line (y 39–45):
//     at 175 px it is wider than the gap between the pillars.
//   - The font now has a '+' glyph (lib FONT), so the pop is one pxtext call, not the
//     hand-drawn plus used in shots 03/05 (which predate the glyph).
(function () {
  'use strict';

  const ID = 'thanks';
  const N = FILM.nes;
  const BEAT_F = 30; // frames per beat at 60 fps

  // Beat constants, shot-local seconds.
  const B_POP = 1.0; // T 36.0  "+10000" pop; HUD score rolls 007500 → 017500
  const BURSTS = [1.5, 2.0, 2.5]; // T 36.5 / 37.0 / 37.5 sparkle bursts
  const BURST_AT = [
    [70, 60],
    [170, 55],
    [120, 48],
  ];

  const FEET = 103; // floor top face (lib.GROUND_Y)
  const HOP_H = 6; // joy-hop apex height (game px)
  const HOP_AIR = 1 / 3; // 20-frame parabola
  const BURST_S = 1 / 3; // 20 frames
  const HOP_HALF = HOP_AIR / 2;

  const L1 = "THANK YOU CLAW'D!"; // 17 glyphs: scale-1 width 135, centred at x 120
  const L2 = 'THE PRINCESS IS SAVED!'; // 22 glyphs: scale-1 width 175, centred at x 120
  const PILLAR_TOP = 55;

  // Apex-locked hop: airborne inside ±10 frames of an apex; apexes every beat (0.5 s)
  // starting at `phase`. Returns feet y (game px). Deterministic from t alone.
  function hopFeet(t, phase) {
    const k = Math.round((t - phase) / 0.5);
    const dt = t - (phase + k * 0.5);
    if (Math.abs(dt) > HOP_HALF) return FEET;
    const u = (dt + HOP_HALF) / HOP_AIR;
    return FEET - 4 * HOP_H * u * (1 - u);
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib,
        P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);
      const f = N.frameOf(t); // shot-local frame

      // ------------------------------------------------ 1. caveBlack hall
      L.px(ctx, 0, 0, L.VW, L.VH, P.caveBlack);

      // ------------------------------------------------ 2. wall pillars (x 32, x 200)
      for (const px of [32, 200]) {
        for (let y = PILLAR_TOP; y < FEET; y += 16) L.sprite(ctx, 'tileBlockCastle', px, y);
      }

      // ------------------------------------------------ 3. floor (rows y 103 / 119)
      for (let x = 0; x < L.VW; x += 16) {
        L.sprite(ctx, 'tileGroundCastle', x, FEET);
        L.sprite(ctx, 'tileGroundCastle', x, FEET + 16);
      }

      // ------------------------------------------------ 4. torch flames (2 shapes, 8 frames each)
      // Alternating phase between the two torches; the 2-px tip leans on the off frame.
      for (let i = 0; i < 2; i++) {
        const cx = [40, 208][i]; // pillar centres (32+8, 200+8)
        const base = PILLAR_TOP; // flame base sits on the pillar top
        const ph = N.step(info.frame + 8 * i, 8, 2);
        L.px(ctx, cx - 2, base - 5, 4, 5, P.fireOrange); // 4-wide body, y 50–54
        L.px(ctx, cx - 1 + ph, base - 6, 2, 1, P.fireOrange); // leaning tip, y 49
        L.px(ctx, cx - 1, base - 3, 2, 3, P.fireYellow); // 2×3 core, y 52–54
      }

      // ------------------------------------------------ 5. the pair
      // Claw'd: Super (scale 2, 32×24 / jump 32×20), centre x 96 → left edge 80.
      const cf = hopFeet(t, 0);
      const cAir = cf < FEET - 0.01;
      const cPose = cAir ? 'clawdJump' : 'clawdIdle';
      L.sprite(ctx, cPose, 96 - 16, cf - (cAir ? 20 : 24), { scale: 2 });

      // Princess Pearl: 14×14, centre x 128 → left edge 121; offset 0.25 s so they take turns.
      const pf = hopFeet(t, 0.25);
      L.sprite(ctx, pf < FEET - 0.01 ? 'princessWave' : 'princess', 128 - 7, pf - 14);

      // ------------------------------------------------ 6. sparkle bursts
      for (let i = 0; i < 3; i++) {
        if (t < BURSTS[i] || t >= BURSTS[i] + BURST_S) continue;
        const k = N.frameOf(t - BURSTS[i]); // frames since the burst
        if (k >= 10 && N.step(k, 2, 2) === 1) continue; // flicker out
        const bx = BURST_AT[i][0],
          by = BURST_AT[i][1];
        const r = 14 * L.seg(t, BURSTS[i], BURSTS[i] + BURST_S, 'outQuad');
        for (let j = 0; j < 6; j++) {
          const ang = (j * Math.PI) / 3 + Math.PI / 6; // 6-way radial, 30° offset
          L.sprite(ctx, 'sparkle', bx + Math.cos(ang) * r - 4, by + Math.sin(ang) * r - 4);
        }
      }

      // ------------------------------------------------ 7. "+10000" pop (T 36.0)
      // Centred x 112 (midpoint of the pair), starts above his hop-apex head (top 73),
      // rises 8 px over 30 frames, holds 15, then vanishes.
      if (t >= B_POP) {
        const k = N.frameOf(t - B_POP);
        if (k < 45) {
          const rise = Math.floor(8 * L.clamp(k / 30));
          L.pxtext(ctx, '+10000', 112 - Math.floor(L.pxtextWidth('+10000', 1) / 2), 66 - rise, {
            color: P.hudWhite,
          });
        }
      }

      // ------------------------------------------------ 8. text (fixed-slot type-on)
      // The full string's centred slot is computed first; only the first n glyphs draw,
      // so letters never recentre. First glyph of L1 is on at frame 0; each line
      // completes exactly on its beat (f 30 for L1, f 60 for L2).
      const typeOn = (str, n, cx, gy, scale) => {
        if (n <= 0) return;
        const gx = cx - Math.floor(L.pxtextWidth(str, scale) / 2);
        L.pxtext(ctx, str.slice(0, n), gx, gy, { scale, color: P.hudWhite });
      };
      const n1 = Math.min(L1.length, 1 + Math.floor((f * (L1.length - 1)) / BEAT_F));
      typeOn(L1, n1, 120, 27, 1);
      const n2 = f < BEAT_F ? 0 : Math.min(L2.length, 1 + Math.floor(((f - BEAT_F) * (L2.length - 1)) / BEAT_F));
      typeOn(L2, n2, 120, 39, 1);

      // ------------------------------------------------ 9. HUD (G1: ×06, TIME held at 70)
      L.hud(ctx, { score: t >= B_POP ? 17500 : 7500, coins: 6, world: '1-1', time: 70 });
    },
  });
})();

</script>
<script>
// ---- src/scenes/17-end-card.js
// Shot 17 — end-card (T 38.0–40.0, dur 2.0 s, 120 frames at 60 fps)
// The title card (shot 01) revisited so the film loops: the same attract screen over the level —
// plaque, level plate, no HUD — with the princess beside Claw'd and the run's score on the TOP line.
// Layers, back to front:
//   1. level plate: sky, clouds (60, 18) and (180, 30), hill at x 24, bush at x 130, ground strip
//   2. the title plaque (lib.titlePlaque, scale 3, x 45–194, y 4–57), already landed: the cut on T 38.0
//      is the title-jingle reprise
//   3. "GAME COMPLETE" types on local 0.5–1.0 at y 61 (where the © line sits on the title)
//   4. "PRESS START TO PLAY AGAIN" (y 71) blinks on 8ths from local 1.0; "TOP- 017500" (y 81)
//   5. Claw'd (clawdIdle, x 168) and Princess Pearl (x 196), feet on the ground (y 103), a 1 px bob
//      every 8th (15 frames), anti-phase; she waves every other half second
//   6. one heart in the gap between them — rises 6 px per 1 s loop, flickers out at the top
// Nothing blends: every pixel is a palette colour on whole game pixels.
(function () {
  'use strict';
  const ID = 'end-card';

  const LINES = ['CLAUDE', 'QUEST'];
  const PLAQUE = { scale: 3, pad: 4, gap: 3 }; // same plaque as shot 01
  const SUB = 'GAME COMPLETE'; // 13 glyphs, 103 px
  const AGAIN = 'PRESS START TO PLAY AGAIN'; // 25 glyphs, 199 px
  const TOP = 'TOP- 017500'; // the score the run ended on (shot 16)
  const CLAWD_X = 168, PEARL_X = 196;

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib,
        P = L.pal,
        N = FILM.nes;
      const t = L.clamp(tIn, 0, info.dur);
      const f = N.frameOf(t); // shot-local frame (60 fps)
      const GY = L.GROUND_Y;

      // 1. level plate (the title's)
      L.px(ctx, 0, 0, L.VW, L.VH, P.sky);
      L.sprite(ctx, 'cloud', 60, 18);
      L.sprite(ctx, 'cloud', 180, 30);
      L.sprite(ctx, 'hill', 24, GY - 10);
      L.sprite(ctx, 'bush', 130, GY - 7);
      L.groundStrip(ctx, -16, L.VW + 16, 0);

      // 2. the plaque
      L.titlePlaque(ctx, 120, 4, LINES, PLAQUE);

      // 3. GAME COMPLETE: fixed-slot type-on (letters never recentre), T 0.5–1.0,
      //    first glyph on the beat frame
      const nSub = L.clamp(Math.floor(((f - 30 + 1) * SUB.length) / 30), 0, SUB.length);
      if (nSub > 0) {
        const gx = 120 - Math.floor(L.pxtextWidth(SUB, 1) / 2);
        L.pxtext(ctx, SUB.slice(0, nSub), gx, 61, { color: P.brickHi });
      }

      // 4. PRESS START TO PLAY AGAIN: on/off every 8th (15 frames) from t 1.0; the TOP line holds
      if (t >= 1.0 && N.step(f - 60, 15, 2) === 0) {
        L.pxtext(ctx, AGAIN, 120, 71, { align: 'center', color: P.hudWhite });
      }
      L.pxtext(ctx, TOP, 120, 81, { align: 'center', color: P.hudWhite });

      // 5. the couple: 1 px bob every 8th, anti-phase so they take turns — a little dance
      const bobC = N.step(f, 15, 2) === 1 ? -1 : 0;
      L.sprite(ctx, 'clawdIdle', CLAWD_X, GY - 12 + bobC);
      const pName = Math.floor(t * 2 + 1e-6) % 2 === 1 ? 'princessWave' : 'princess';
      L.sprite(ctx, pName, PEARL_X, GY - 14 - 1 - bobC);

      // 6. the heart: 1 s loop in the gap between them (x 186–193); rises 6 px from y 84 and
      //    flickers out (2 frames on, 2 off) over the top of its climb
      const u = t - Math.floor(t);
      const shown = u < 0.55 || (u < 0.85 && N.step(f, 2, 2) === 0);
      if (shown) L.sprite(ctx, 'heart', 186 + Math.round(Math.sin(u * Math.PI * 2)), 84 - 6 * u);
    },
  });
})();

</script>
<script>
// ---- src/music.js
// music.js : the score and sound design of Claude Quest, played on an emulated NES 2A03 APU.
// Owner: music. Contract: docs/CONTRACT.md, section Audio.
//
// FILM.audio.render(ctx, { start = 0, dest = ctx.destination }) plays the whole piece, music and
// effects, from global time `start` into any BaseAudioContext.
//
// How it works, in the order the sound is made:
//   1 compose()  writes an original score and the effect cues as per-frame register states for the
//                four APU channels (pulse 1, pulse 2, triangle, noise), one state per 1/60 s driver
//                frame, the way a 1985 sound driver updates the chip once per video frame. An effect
//                takes over its channel for its length; the music voice on that channel is silent
//                meanwhile and resumes on the frame the effect ends.
//   2 synth()    emulates the chip from those states: 11-bit pulse timers with the four duty
//                sequences and the hardware sweep unit, the 32-step triangle with its linear counter,
//                the 15-bit noise LFSR in long and short mode with the NTSC period table, the
//                non-linear NES mixer, and the console's output filters (high-pass 90 Hz and 440 Hz,
//                low-pass 14 kHz). Channels are integrated exactly over each sub-sample at 4x the
//                output rate and decimated by a windowed-sinc filter, which band-limits the square
//                edges without softening them.
//   3 render()   plays the finished mono buffer (copied to both channels) through one
//                AudioBufferSourceNode. The buffer is always computed from time 0, so any `start`
//                hears exactly the same samples at the same global times.
//
// No reverb, delay, compressor or panning: what leaves here is the chip, times one flat gain set by
// measurement (tools/audio) so the master sits near -14 LUFS with true peak under -1 dBFS.
// Deterministic: the only randomness is FILM.lib.rng, seeded per effect.
(function () {
  'use strict';
  const FILM = window.FILM;
  const lib = FILM.lib;
  const TAU = Math.PI * 2;

  // ---------------------------------------------------------------- hardware constants
  const CPU = 1789773; // NTSC 2A03 clock, Hz
  const FPS = 60; // driver frames per second
  const SUB = 4; // integration sub-samples per output sample
  const GAIN = 2.78; // flat master gain, set by measurement
  const DUTY = [
    [0, 1, 0, 0, 0, 0, 0, 0], // 12.5 %
    [0, 1, 1, 0, 0, 0, 0, 0], // 25 %
    [0, 1, 1, 1, 1, 0, 0, 0], // 50 %
    [1, 0, 0, 1, 1, 1, 1, 1], // 75 %
  ];
  const TRI = [];
  for (let i = 15; i >= 0; i--) TRI.push(i);
  for (let i = 0; i <= 15; i++) TRI.push(i);
  const NOISE = [4, 8, 16, 32, 64, 96, 128, 160, 202, 254, 380, 508, 762, 1016, 2034, 4068];

  // ---------------------------------------------------------------- pitch
  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function midi(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(n);
    if (!m) throw new Error('music.js: bad note ' + n);
    return 12 * (Number(m[3]) + 1) + SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  }
  const mhz = (m) => 440 * Math.pow(2, (midi(m) - 69) / 12);
  const clampT = (t) => Math.max(0, Math.min(2047, t));
  const ptimer = (hz) => clampT(Math.round(CPU / (16 * hz) - 1)); // pulse: f = CPU / (16 (t + 1))
  const ttimer = (hz) => clampT(Math.round(CPU / (32 * hz) - 1)); // triangle: f = CPU / (32 (t + 1))

  // ---------------------------------------------------------------- instruments (music voices)
  // A pulse instrument turns (frame k of a note, note length in frames, midi) into a register state.
  // vols: the first frames' volumes; after them the volume steps down by 1 every `every` frames to
  // `floor`. The last frame of a note of 3+ frames is silent, so repeated notes articulate.
  function pulseInst(duty, vols, floor, every, o) {
    const opt = o || {};
    return {
      ch: 'p',
      frame(k, len, m) {
        const gate = opt.gate ? opt.gate(len) : len >= 3 ? len - 1 : len;
        const t = ptimer(mhz(m));
        if (k >= gate) return { v: 0, d: duty, t };
        let v = k < vols.length ? vols[k] : Math.max(floor, vols[vols.length - 1] - Math.floor((k - vols.length + 1) / every));
        v = Math.max(0, Math.min(15, v));
        let dt = 0;
        if (opt.vib && k >= opt.vib[0]) dt = Math.round(opt.vib[1] * Math.sin((TAU * (k - opt.vib[0])) / opt.vib[2]));
        return { v, d: duty, t: t + dt };
      },
    };
  }
  function triInst(gateOf, vib) {
    return {
      ch: 't',
      frame(k, len, m) {
        const g = Math.max(1, Math.min(len, gateOf(len)));
        if (k >= g) return null;
        let dt = 0;
        if (vib && k >= vib[0]) dt = Math.round(vib[1] * Math.sin((TAU * (k - vib[0])) / vib[2]));
        return { t: ttimer(mhz(m)) + dt, gate: g, k };
      },
    };
  }
  // Noise drums: [period index, volume, short mode] per frame.
  function drum(rows) {
    return {
      ch: 'n',
      frame(k) {
        const r = rows[k];
        return r ? { i: r[0], v: r[1], m: r[2] || 0 } : null;
      },
    };
  }
  const INST = {
    lead: pulseInst(2, [12, 11, 10, 9], 6, 6),
    leadHi: pulseInst(1, [10, 10, 9, 8], 5, 6),
    dbl: pulseInst(2, [9, 8, 8, 7], 5, 6),
    harm: pulseInst(1, [8, 7, 7, 6], 4, 8),
    stab: pulseInst(2, [9, 7, 5, 3, 2, 1], 0, 2),
    cave: pulseInst(2, [10, 8, 6, 4, 2, 1], 0, 2),
    brass: pulseInst(2, [13, 13, 12, 12, 11], 9, 8, { vib: [14, 1, 6] }),
    brass2: pulseInst(1, [9, 9, 8, 8, 7], 6, 8),
    oom: pulseInst(2, [11, 9, 7, 5, 4, 3, 2, 1], 0, 3),
    pah: pulseInst(0, [7, 6, 5, 4, 3, 2, 1], 0, 3),
    bass: triInst((len) => Math.max(3, Math.round(len * 0.7))),
    hold: triInst((len) => len - 1),
    triLead: triInst((len) => len - 2, [16, 1, 6]),
  };
  const DRUMS = {
    K: drum([[10, 13], [11, 9], [12, 5], [12, 2]]),
    S: drum([[6, 12], [6, 9], [7, 7], [7, 5], [8, 3], [8, 2], [8, 1]]),
    H: drum([[1, 7], [1, 3], [1, 1]]),
    h: drum([[1, 4], [1, 1]]),
    C: drum(Array.from({ length: 22 }, (_, k) => [3, Math.max(0, Math.round(11 - k / 2))])),
    D: drum([[2, 6, 1], [2, 3, 1], [2, 1, 1]]),
  };

  // ---------------------------------------------------------------- effects (per-frame programs)
  const SIL = () => ({ v: 0, d: 2 });
  const lerp = (a, b, f) => a + (b - a) * f;
  // A pulse tone: hz for n frames. o.d duty, o.v [from, to] volume, o.bend pitch ratio per frame,
  // o.vib [depth ratio, period frames], o.wob alternating +/- ratio each frame.
  function pt(hz, n, o) {
    const out = [];
    let f = hz;
    const v = o.v || [12, 12];
    for (let k = 0; k < n; k++) {
      let ff = f;
      if (o.vib) ff *= 1 + o.vib[0] * Math.sin((TAU * k) / o.vib[1]);
      if (o.wob) ff *= k & 1 ? 1 - o.wob : 1 + o.wob;
      out.push({ v: Math.round(lerp(v[0], v[1], n > 1 ? k / (n - 1) : 0)), d: o.d == null ? 2 : o.d, t: ptimer(ff), trig: k === 0 && o.trig !== false });
      f *= o.bend || 1;
    }
    return out;
  }
  // A pulse tone driven by the hardware sweep unit: the driver writes the timer once, the sweep
  // divider (period p half-frames) shifts it by t >> s every clock, down (neg) or up in period.
  function psw(hz, n, o) {
    const out = [];
    const v = o.v || [12, 12];
    const sw = { p: o.p || 0, n: !!o.neg, s: o.s };
    for (let k = 0; k < n; k++) {
      const st = { v: Math.round(lerp(v[0], v[1], n > 1 ? k / (n - 1) : 0)), d: o.d == null ? 2 : o.d, sw };
      if (k === 0) Object.assign(st, { t: ptimer(hz), trig: true });
      out.push(st);
    }
    return out;
  }
  const gap = (n) => Array.from({ length: n }, SIL);
  const cat = (...a) => [].concat(...a);
  // Two notes alternating every frame: the driver's arpeggio trick for a shimmering chord.
  function trill(a, b, n, o) {
    const out = [];
    const v = o.v || [12, 0];
    for (let k = 0; k < n; k++) out.push({ v: Math.round(lerp(v[0], v[1], k / Math.max(1, n - 1))), d: o.d == null ? 1 : o.d, t: ptimer(mhz(k & 1 ? b : a)), trig: k === 0 });
    return out;
  }
  const nz = (rows) => rows.map((r) => ({ i: r[0], v: r[1], m: r[2] || 0 }));
  function tthud(hz, n, ratio) {
    const out = [];
    for (let k = 0; k < n; k++) out.push({ t: ttimer(hz * Math.pow(ratio, k)), gate: n, k, trig: k === 0 });
    return out;
  }
  // The coin: a short grace note, then the fifth above it rings and decays.
  const coin = (note, ring) => cat(pt(mhz(note), 3, { d: 1, v: [12, 12] }), pt(mhz(midi(note) + 7), ring || 22, { d: 1, v: [13, 0] }));
  // A bubble glug: a short upward chirp, then a breath of silence.
  const glug = (hz) => cat(pt(hz, 5, { d: 2, v: [12, 7], bend: 1.07 }), gap(3));
  const squish = () => nz([[5, 15], [6, 13], [7, 10], [8, 7], [9, 4], [10, 2]]);

  // ---------------------------------------------------------------- the score
  // Returns per-frame register states for the four channels. Times are global seconds; one
  // sixteenth is 1/4 beat of FILM.TIMELINE.bpm (0.125 s at 120 bpm). Every note lands on the frame
  // nearest its time, so an off-frame sixteenth alternates 8- and 7-frame lengths like a real driver.
  function compose(F) {
    const bpm = (FILM.TIMELINE && FILM.TIMELINE.bpm) || 120;
    const S16 = 15 / bpm;
    const fr = (t) => Math.round(t * FPS);
    const notes = [];
    const sfx = [];

    function parse(str) {
      return str
        .trim()
        .split(/\s+/)
        .map((tok) => {
          const [a, b] = tok.split(':');
          return { m: a === 'r' ? null : midi(a), n: b ? Number(b) : 1 };
        });
    }
    // One voice's line from t0; `expect` (sixteenths) guards against miscounted bars.
    function line(ch, t0, str, inst, expect, tr) {
      let p = 0;
      for (const tok of parse(str)) {
        if (tok.m !== null) notes.push({ ch, f0: fr(t0 + p * S16), f1: fr(t0 + (p + tok.n) * S16), m: tok.m + (tr || 0), inst });
        p += tok.n;
      }
      if (expect != null && p !== expect) throw new Error(`music.js: line at ${t0}s is ${p} sixteenths, expected ${expect}`);
      return p;
    }
    // Drums: one character per sixteenth; a hit rings until the next hit or its table ends.
    function drums(t0, pat) {
      for (let p = 0; p < pat.length; p++) {
        const c = pat[p];
        if (c === '.') continue;
        let q = p + 1;
        while (q < pat.length && pat[q] === '.') q++;
        notes.push({ ch: 'n', f0: fr(t0 + p * S16), f1: fr(t0 + q * S16), m: 0, inst: DRUMS[c] });
      }
    }
    const fx = (ch, t, frames) => sfx.push({ ch, f0: fr(t), frames });

    // Chords: pitch classes, and the triangle bass root (kept in the G2..F#3 pocket).
    const CH = {
      C: [[0, 4, 7], 48],
      F: [[5, 9, 0], 53],
      Dm: [[2, 5, 9], 50],
      G: [[7, 11, 2], 43],
      G7: [[7, 11, 2, 5], 43],
      Em: [[4, 7, 11], 52],
      A7: [[9, 1, 4, 7], 45],
    };
    // Bouncing bass for one half bar: root, root pickup, fifth, then a chromatic step into the next
    // root (or the octave when the chord holds).
    function bassHalf(t0, ch, next) {
      const r = CH[ch][1];
      const nx = CH[next][1];
      const x = nx !== r ? nx - 1 : r + 12;
      notes.push({ ch: 't', f0: fr(t0), f1: fr(t0 + 3 * S16), m: r, inst: INST.bass });
      notes.push({ ch: 't', f0: fr(t0 + 3 * S16), f1: fr(t0 + 4 * S16), m: r, inst: INST.bass });
      notes.push({ ch: 't', f0: fr(t0 + 4 * S16), f1: fr(t0 + 6 * S16), m: r + 7, inst: INST.bass });
      notes.push({ ch: 't', f0: fr(t0 + 6 * S16), f1: fr(t0 + 8 * S16), m: x, inst: INST.bass });
    }
    // Offbeat calypso stabs on pulse 2: the chord's third on 2 and 10, its fifth on 6 and 14, placed
    // between E4 and D5.
    function stabs(t0, halves, from, to) {
      for (let p = from || 0; p < (to || 16); p++) {
        if (p % 4 !== 2) continue;
        const pcs = CH[halves[p < 8 ? 0 : halves.length - 1]][0];
        const pc = p % 8 === 2 ? pcs[1] : pcs[2];
        let m = 64;
        while (((m % 12) + 12) % 12 !== pc) m++;
        notes.push({ ch: 'p2', f0: fr(t0 + p * S16), f1: fr(t0 + (p + 1) * S16), m, inst: INST.stab });
      }
    }
    // Harmony a chord tone below the lead: the nearest chord tone at least a minor third down.
    function thirds(t0, str, halves) {
      let p = 0;
      for (const tok of parse(str)) {
        if (tok.m !== null) {
          const pcs = CH[halves[p < 8 ? 0 : halves.length - 1]][0];
          let h = tok.m - 3;
          while (!pcs.includes(((h % 12) + 12) % 12)) h--;
          notes.push({ ch: 'p2', f0: fr(t0 + p * S16), f1: fr(t0 + (p + tok.n) * S16), m: h, inst: INST.harm });
        }
        p += tok.n;
      }
    }
    const RUNDRUM = 'K.H.S.HhK.HKS.Hh';

    // ---- 0.5 title jingle: a climbing C major arpeggio onto a held C6, pickup into the run
    line('p1', 0.5, 'C5 E5 G5 C6:7 G5 B5', INST.lead, 12);
    line('p2', 0.5, 'G4 C5 E5 G5:7 r:2', INST.harm, 12);
    line('t', 0.5, 'C3:10 G2:2', INST.hold, 12);
    drums(0.5, 'C.........SS');

    // ---- 2.0 to 20.5 the run theme (overworld): intro vamp, phrase A (4 bars), phrase B (4 bars)
    const RUN = [
      ['C6 r G5 r r:2 E5 r r:4 D5 E5 F5 F#5', ['C']], // intro, 2 s
      ['G5:2 E5 G5 r A5 G5:2 r E5 C5:2 D5 E5 r D5', ['C']], // A1, 4 s
      ['A5:2 F5 A5 r C6 A5:2 r F5 D5:2 E5 F5 r G5', ['F']], // A2, 6 s
      ['A5 G5 F5 D5 r:2 F5 E5 D5:2 B4 D5 r G5:3', ['Dm', 'G']], // A3, 8 s
      ['E5:2 D5 C5:3 r G4 C5 D5 E5 r G5 r:3', ['C']], // A4, 10 s
      ['C6:2 A5 C6 r D6 C6 A5 r F5 G5:2 A5:3 r', ['F']], // B1, 12 s
      ['B5:2 G5 E5 r B5 A5:2 r C#6 A5 E5 G5:2 A5 G5', ['Em', 'A7']], // B2, 14 s
      ['D5 F5 A5 D6:2 C6 A5 r B5:2 G5 F5 D5:2 B4 r', ['Dm', 'G7']], // B3, 16 s
      ['C5 E5 G5 C6:3 r G5 A5 B5 C6 r C6 r:3', ['C']], // B4, 18 s
    ];
    for (let b = 0; b < RUN.length; b++) {
      const t0 = 2 + b * 16 * S16;
      const [mel, halves] = RUN[b];
      line('p1', t0, mel, INST.lead, 16);
      if (b >= 5) thirds(t0, mel, halves);
      else stabs(t0, halves);
      const nextBar = RUN[b + 1] ? RUN[b + 1][1][0] : 'C';
      const h2 = halves[halves.length - 1];
      bassHalf(t0, halves[0], h2);
      bassHalf(t0 + 8 * S16, h2, nextBar);
      drums(t0, b === 0 ? 'K.H.S.HhK.H.SSSS' : RUNDRUM);
    }
    // 20.0 tail, then the pipe cuts the theme at 20.5
    line('p1', 20, 'C6 r G5 r', INST.lead, 4);
    line('t', 20, 'C3:2 G2:2', INST.bass, 4);
    drums(20, 'K.H.');

    // ---- 21.0 to 24.0 underground: low staccato riff with chromatic turns, dripping noise
    line('p1', 21, 'A3 r r E4 r D#4 E4 r A3 r r G4 r F#4 F4 r A3 r C4 r B3 r A#3 r', INST.cave, 24);
    line('t', 21, 'A2:2 r:3 E3:2 r A2:2 r:3 E3:2 r A2:2 r:2 F3:2 E3:2', INST.bass, 24);
    drums(21, 'K..D...DK..D...DK..D.D.D');

    // ---- 24.5 pickup and drum fill, 25.0 the theme resumes an octave up, doubled below
    line('p1', 24.5, 'D6 E6 F6 F#6', INST.leadHi, 4);
    line('t', 24.5, 'G2:2 B2:2', INST.bass, 4);
    drums(24.5, 'SSSS');
    const A1 = RUN[1][0];
    const A2 = 'A5:2 F5 A5 r C6';
    line('p1', 25, A1, INST.leadHi, 16, 12);
    line('p1', 27, A2, INST.leadHi, 6, 12);
    line('p2', 25, A1, INST.dbl, 16);
    line('p2', 27, A2, INST.dbl, 6);
    bassHalf(25, 'C', 'C');
    bassHalf(26, 'C', 'F');
    line('t', 27, 'F3:3 F3 C4:2', INST.bass, 6);
    drums(25, 'K.HKS.HhK.H.S.HhK.H.S.');

    // ---- 28.75 course clear: a rising major-ninth flourish in parallel thirds
    line('p1', 28.75, 'G4 C5 E5 G5 B5 D6 D6 E6:3', INST.brass, 10);
    line('p2', 28.75, 'r:2 C5 E5 G5 B5 G5 C6:3', INST.brass2, 10);
    line('t', 28.75, 'C3:3 G2:2 C3:5', INST.hold, 10);

    // ---- 30.0 castle: the brass figure C5 F5 A5 C6, then darkens through Db to C before the door
    line('p1', 30, 'C5 F5 A5 C6:4 r Ab5 G5 F5 E5:2 r:3', INST.brass, 16);
    line('p2', 30, 'A4 C5 F5 A5:4 r F5 Eb5 Db5 C5:2 r:3', INST.brass2, 16);
    line('t', 30, 'F2:8 Db3:3 C3:3 r:2', INST.hold, 16);
    drums(30, 'K...S...S.SSK...');

    // ---- 32.0 throne-room waltz in 3/4: triangle lead, pulse oom and pah
    line('t', 32, 'A4:4 C5:2 F5:4 E5:2 D5:4 C5:2 A4:2 G4:2 A4:2', INST.triLead, 24);
    line('p1', 32, 'F3:4 r:8 Bb3:4 r:4 C4:4', INST.oom, 24);
    line('p2', 32, 'r:4 A4:4 C5:4 r:4 D5:4 E5:4', INST.pah, 24);

    // ---- 35.0 victory: the title jingle's rhythm up a fourth, then a bouncing line home to V of C
    line('p1', 35, 'F5 A5 C6 F6:3 r E6 D6 C6 D6:2 Bb5 F5 A5:2 C6 F5 r D5 F5 G5 B5 D6', INST.lead, 24);
    line('p2', 35, 'r:2 A4 r:3 C5 r:3 D5 r:3 C5 r:3 F4 r:3 B4 r', INST.stab, 24);
    line('t', 35, 'F3:3 F3 C3:2 A2:2 Bb2:2 D3:2 F3:2 A2:2 D3:2 A2:2 G2:2 B2:2', INST.bass, 24);
    drums(35, 'C.H.S.HhK.HKS.HhK.HKS.SS');

    // ---- 38.0 end card: the title jingle again, a last C chord, silence by the loop seam
    line('p1', 38, 'C5 E5 G5 C6:5 G5 E5 C6:2 r:4', INST.lead, 16);
    line('p2', 38, 'G4 C5 E5 G5:5 E5 C5 G5:2 r:4', INST.harm, 16);
    line('t', 38, 'C3:8 G2:2 C3:4 r:2', INST.hold, 16);
    drums(38, 'C.........K.....');

    // ---------------------------------------------------------------- effects on the cues
    const R = (seed) => lib.rng(lib.hash('claude-quest-sfx', seed));
    // 1.0, 1.5 sparkle pings: a two-note shimmer high above the jingle
    fx('p2', 1.0, trill('B6', 'E7', 14, { v: [12, 0], d: 1 }));
    fx('p2', 1.5, trill('C#7', 'F#7', 14, { v: [12, 0], d: 1 }));
    // 3.5 bug waddle: two low plodding notes
    fx('p2', 3.5, cat(pt(mhz('D4'), 5, { d: 2, v: [11, 3] }), gap(3), pt(mhz('A3'), 5, { d: 2, v: [11, 3] })));
    // 5.5 stomp: noise squish, a hardware-sweep drop (300 Hz down to about 80), then the +100 blip
    const stomp = (t, blip) => {
      fx('n', t, squish());
      fx('p2', t, cat(psw(300, 6, { d: 2, v: [13, 5], s: 3, p: 0, neg: false }), gap(2), blip ? pt(mhz('E6'), 5, { d: 0, v: [10, 2] }) : []));
    };
    stomp(5.5, true);
    // 7.5 block bump: noise thud and a triangle knock, the coin rising out of it
    fx('n', 7.5, nz([[12, 15], [12, 10], [13, 6], [13, 2]]));
    fx('t', 7.5, tthud(120, 5, 0.88));
    fx('p2', 7.5 + 3 / FPS, coin('C6'));
    // jumps: an upward hardware sweep (period shrinking by t >> s each half-frame)
    const jump = (t, hz, n, s) => fx('p2', t, psw(hz, n, { d: 1, v: [12, 2], s, p: 0, neg: true }));
    jump(9.5, 294, 11, 4);
    // 10.0 mushroom emerge: a wobbling slide 200 to 900 Hz over 18 frames
    fx('p2', 10.0, cat(pt(200, 18, { d: 2, v: [10, 8], bend: Math.pow(900 / 200, 1 / 17), wob: 0.06 }), pt(900, 3, { d: 2, v: [6, 1], trig: false })));
    // 11.0 power-up: a straight major arpeggio three frames a note, then a C7/E7 shimmer
    fx('p2', 11.0, cat(...['C5', 'E5', 'G5', 'C6', 'E6', 'G6', 'C7'].map((n) => pt(mhz(n), 3, { d: 1, v: [12, 11] })), trill('C7', 'E7', 14, { v: [11, 0], d: 1 })));
    jump(12.25, 220, 18, 5); // long jump
    // 13.25 land thud
    fx('n', 13.25, nz([[11, 14], [12, 9], [13, 4], [13, 1]]));
    // 14.0 to 15.5 stair hops: short bright boips climbing 300, 380, 460, 540 Hz
    [300, 380, 460, 540].forEach((hz, i) => fx('p2', 14 + i * 0.5, pt(hz, 6, { d: 2, v: [11, 3], bend: 1.12 })));
    stomp(17.0, false);
    // 17.5 shell kick tok
    fx('p2', 17.5, cat(pt(800, 1, { d: 0, v: [13, 13] }), pt(600, 3, { d: 0, v: [9, 3], trig: false })));
    fx('n', 17.5, nz([[2, 11, 1], [2, 5, 1]]));
    // 18.0, 18.5 combo hits G5, B5 with a driver echo
    const combo = (t, n) => fx('p2', t, cat(pt(mhz(n), 4, { d: 2, v: [13, 9] }), gap(2), pt(mhz(n), 4, { d: 2, v: [5, 2] })));
    combo(18.0, 'G5');
    combo(18.5, 'B5');
    jump(19.25, 294, 11, 4);
    // 20.5 pipe down: three glugs 400, 300, 200 Hz
    fx('p2', 20.5, cat(glug(400), glug(300), glug(200)));
    // 21.5 to 23.5 five coins, each a step higher; the last with a hop on pulse 1
    ['C6', 'D6', 'E6', 'F6', 'G6'].forEach((n, i) => fx('p2', 21.5 + i * 0.5, coin(n, 20)));
    fx('p1', 23.5, psw(392, 7, { d: 1, v: [9, 2], s: 3, p: 0, neg: true }));
    // 24.0 pipe rise: glugs climbing 200, 300, 400 Hz
    fx('p2', 24.0, cat(glug(200), glug(300), glug(400)));
    jump(27.0, 220, 20, 5); // big jump
    // 27.75 pole grab zang: C5 and E5 stabbed together, a crash under them
    fx('p1', 27.75, pt(mhz('C5'), 15, { d: 2, v: [15, 0] }));
    fx('p2', 27.75, pt(mhz('E5'), 15, { d: 2, v: [13, 0] }));
    fx('n', 27.75, nz([[3, 12], [3, 9], [4, 6], [4, 4], [4, 2], [4, 1]]));
    // 28.0 slide whistle down 900 to 300 Hz over 0.7 s
    fx('p2', 28.0, pt(900, 42, { d: 2, v: [11, 7], bend: Math.pow(300 / 900, 1 / 41), vib: [0.03, 4] }));
    // 28.75 +5000 tally: a quick pentatonic climb two frames a note
    fx('p2', 28.75, cat(...['G5', 'A5', 'C6', 'D6', 'E6', 'G6', 'A6', 'C7'].map((n) => pt(mhz(n), 2, { d: 0, v: [10, 10] }))));
    // 29.0, 29.5 fireworks: a sharp pop and a rumbling tail
    const firework = (t) => fx('n', t, nz([[2, 15], [3, 13]].concat(Array.from({ length: 16 }, (_, k) => [9 + (k >> 2), Math.max(0, 12 - k)]))));
    firework(29.0);
    firework(29.5);
    // 31.75 door clunk: a low noise hit and a triangle drop
    fx('n', 31.75, nz([[11, 15], [12, 12], [13, 8], [14, 5], [14, 3], [14, 1]]));
    fx('t', 31.75, tthud(90, 6, 0.9));
    // 33.0 "!" pling
    fx('p2', 33.0, cat(pt(mhz('F6'), 1, { d: 1, v: [12, 12] }), pt(mhz('F7'), 11, { d: 1, v: [12, 0], trig: false })));
    // 34.0 three heart pops, rising
    fx('p2', 34.0, cat(...['C6', 'E6', 'G6'].map((n) => cat(pt(mhz(n), 4, { d: 0, v: [11, 6], bend: 1.13 }), gap(4)))));
    // 36.0 +10000 bonus cascade: F-major triads pouring upward, then a held top note
    fx('p2', 36.0, cat(...[['F6', 'A6', 'C7'], ['F6', 'A6', 'C7'], ['A6', 'C7', 'F7']].map((tri, j) => cat(...tri.map((n) => pt(mhz(n), 2, { d: 0, v: [11 - j, 11 - j] })))), pt(mhz('F7'), 10, { d: 0, v: [9, 0] })));
    // 37.0, 37.5 sparkle bursts: seeded random high pentatonic notes, one per frame
    const burst = (t) => {
      const r = R(t);
      const set = ['C7', 'D7', 'E7', 'G7', 'A7', 'C8'];
      fx('p2', t, Array.from({ length: 12 }, (_, k) => ({ v: Math.round(12 - k), d: 0, t: ptimer(mhz(r.pick(set))), trig: k === 0 })));
      fx('n', t, nz([[0, 6, 1], [0, 4, 1], [0, 2, 1], [0, 1, 1]]));
    };
    burst(37.0);
    burst(37.5);
    // 39.5 final coin, ringing out before the loop seam
    fx('p2', 39.5, coin('C6', 26));

    // ---------------------------------------------------------------- paint frames
    const CHS = { p1: [], p2: [], t: [], n: [] };
    for (const k of Object.keys(CHS)) CHS[k] = new Array(F).fill(null);
    notes.sort((a, b) => a.f0 - b.f0);
    for (const nt of notes) {
      const arr = CHS[nt.ch];
      const len = nt.f1 - nt.f0;
      for (let k = 0; k < len; k++) {
        const f = nt.f0 + k;
        if (f < 0 || f >= F) continue;
        const st = nt.inst.frame(k, len, nt.m);
        if (!st) {
          arr[f] = nt.ch === 't' ? null : { v: 0, d: 2, mus: true };
          continue;
        }
        st.mus = true;
        if (k === 0) st.trig = true;
        arr[f] = st;
      }
    }
    sfx.sort((a, b) => a.f0 - b.f0);
    for (const s of sfx) {
      const arr = CHS[s.ch];
      for (let k = 0; k < s.frames.length; k++) {
        const f = s.f0 + k;
        if (f >= 0 && f < F) arr[f] = Object.assign({}, s.frames[k]);
      }
    }
    // The music voice resumes on the frame an effect ends: a fresh trigger (and, for the triangle,
    // the rest of its gate).
    for (const s of sfx) {
      const arr = CHS[s.ch];
      const f = s.f0 + s.frames.length;
      const st = f < F ? arr[f] : null;
      if (st && st.mus && !st.trig) arr[f] = Object.assign({}, st, s.ch === 't' ? { trig: true, gate: st.gate - st.k } : { trig: true });
    }
    return CHS;
  }

  // ---------------------------------------------------------------- the APU
  function synth(sr) {
    const DUR = (FILM.TIMELINE && FILM.TIMELINE.duration) || FILM.DURATION || 40;
    const F = Math.ceil(DUR * FPS);
    const S = compose(F);
    const RS = sr * SUB; // integration rate
    const cps = CPU / RS; // CPU cycles per sub-sample
    const nOut = Math.round(DUR * sr);
    const HALF = 23;
    const NS = nOut * SUB + HALF + 1;
    const sub = new Float32Array(NS);

    const mkPulse = (i) => ({ i, v: 0, d: 2, t: 0, per: 2, cnt: 2, pos: 0, swEn: false, swP: 0, swN: true, swS: 0, div: 0, reload: false, mute: true });
    const P = [mkPulse(0), mkPulse(1)];
    const T = { t: 0, per: 1, cnt: 1, pos: 0, lin: 0 };
    const N = { v: 0, per: 4, cnt: 4, lfsr: 1, mode: 0 };

    const target = (c) => (c.swN ? c.t - (c.t >> c.swS) - (c.i === 0 ? 1 : 0) : c.t + (c.t >> c.swS));
    const remute = (c) => {
      c.mute = c.t < 8 || (!c.swN && target(c) > 0x7ff);
    };
    function applyPulse(c, s) {
      if (!s) {
        c.v = 0;
        c.swEn = false;
        c.swN = true;
        c.swS = 0;
        return;
      }
      c.v = s.v;
      c.d = s.d;
      if (s.sw) {
        if (s.trig) {
          c.swEn = true;
          c.swP = s.sw.p;
          c.swN = s.sw.n;
          c.swS = s.sw.s;
          c.reload = true;
        }
      } else {
        // the driver's default sweep write: disabled, negate set, so low notes are never muted
        c.swEn = false;
        c.swN = true;
        c.swS = 0;
      }
      if (s.t !== undefined) {
        c.t = s.t;
        c.per = 2 * (c.t + 1);
      }
      if (s.trig) {
        c.pos = 0;
        c.cnt = c.per;
      }
      remute(c);
    }
    function applyFrame(f) {
      applyPulse(P[0], f < F ? S.p1[f] : null);
      applyPulse(P[1], f < F ? S.p2[f] : null);
      const t = f < F ? S.t[f] : null;
      if (t) {
        if (t.t !== undefined) {
          T.t = t.t;
          T.per = T.t + 1;
        }
        if (t.trig) T.lin = t.gate * 4;
      }
      const n = f < F ? S.n[f] : null;
      if (n && n.v > 0) {
        N.v = n.v;
        N.per = NOISE[n.i];
        N.mode = n.m;
      } else N.v = 0;
    }
    function quarter(q) {
      if (T.lin > 0) T.lin--;
      if (q & 1) {
        // half frame: the sweep units
        for (const c of P) {
          if (c.div === 0 && c.swEn && c.swS > 0 && !c.mute) {
            c.t = Math.max(0, target(c));
            c.per = 2 * (c.t + 1);
            remute(c);
          }
          if (c.div === 0 || c.reload) {
            c.div = c.swP;
            c.reload = false;
          } else c.div--;
        }
      }
    }
    function pulseAvg(c) {
      if (c.v === 0 || c.mute) return 0;
      const seq = DUTY[c.d];
      let rem = cps;
      let acc = 0;
      let out = seq[c.pos];
      while (c.cnt <= rem) {
        acc += out * c.cnt;
        rem -= c.cnt;
        c.pos = (c.pos + 1) & 7;
        out = seq[c.pos];
        c.cnt = c.per;
      }
      acc += out * rem;
      c.cnt -= rem;
      return (c.v * acc) / cps;
    }
    function triAvg() {
      if (T.lin === 0 || T.t < 2) return TRI[T.pos]; // halted: the sequencer holds its step
      let rem = cps;
      let acc = 0;
      let out = TRI[T.pos];
      while (T.cnt <= rem) {
        acc += out * T.cnt;
        rem -= T.cnt;
        T.pos = (T.pos + 1) & 31;
        out = TRI[T.pos];
        T.cnt = T.per;
      }
      acc += out * rem;
      T.cnt -= rem;
      return acc / cps;
    }
    function noiseAvg() {
      let rem = cps;
      let acc = 0;
      let out = N.lfsr & 1 ? 0 : 1;
      const tap = N.mode ? 6 : 1;
      while (N.cnt <= rem) {
        acc += out * N.cnt;
        rem -= N.cnt;
        const fb = (N.lfsr ^ (N.lfsr >> tap)) & 1;
        N.lfsr = (N.lfsr >> 1) | (fb << 14);
        out = N.lfsr & 1 ? 0 : 1;
        N.cnt = N.per;
      }
      acc += out * rem;
      N.cnt -= rem;
      return (N.v * acc) / cps;
    }

    // console output filters, first order, at the integration rate
    const dt = 1 / RS;
    const hpA = (fc) => {
      const rc = 1 / (TAU * fc);
      return rc / (rc + dt);
    };
    const a1 = hpA(90);
    const a2 = hpA(440);
    const lrc = 1 / (TAU * 14000);
    const b3 = dt / (lrc + dt);
    let x1 = 0;
    let y1 = 0;
    let x2 = 0;
    let y2 = 0;
    let y3 = 0;
    let primed = false;

    let q = 0;
    let nextQ = 0;
    for (let s = 0; s < NS; s++) {
      while (s >= nextQ) {
        if ((q & 3) === 0) applyFrame(q >> 2);
        quarter(q);
        q++;
        nextQ = Math.round((q * RS) / (FPS * 4));
      }
      const ps = pulseAvg(P[0]) + pulseAvg(P[1]);
      const po = ps > 0 ? 95.88 / (8128 / ps + 100) : 0;
      const tn = triAvg() / 8227 + noiseAvg() / 12241;
      const to = tn > 0 ? 159.79 / (1 / tn + 100) : 0;
      const x = po + to;
      if (!primed) {
        x1 = x; // the console has been on: no step into the first sample
        primed = true;
      }
      y1 = a1 * (y1 + x - x1);
      x1 = x;
      y2 = a2 * (y2 + y1 - x2);
      x2 = y1;
      y3 += b3 * (y2 - y3);
      sub[s] = y3;
    }

    // decimate: windowed-sinc (Blackman) low-pass, zero phase, so timing is untouched
    const fc = Math.min(20000, 0.45 * sr) / RS;
    const h = new Float64Array(2 * HALF + 1);
    let hs = 0;
    for (let k = -HALF; k <= HALF; k++) {
      const x = k === 0 ? 2 * fc : Math.sin(TAU * fc * k) / (Math.PI * k);
      const w = 0.42 + 0.5 * Math.cos((Math.PI * k) / (HALF + 1)) + 0.08 * Math.cos((TAU * k) / (HALF + 1));
      h[k + HALF] = x * w;
      hs += x * w;
    }
    for (let k = 0; k < h.length; k++) h[k] *= GAIN / hs;
    const out = new Float32Array(nOut);
    for (let i = 0; i < nOut; i++) {
      const c = i * SUB;
      let acc = 0;
      const k0 = Math.max(-HALF, -c);
      for (let k = k0; k <= HALF; k++) acc += h[k + HALF] * sub[c + k];
      out[i] = acc;
    }
    return out;
  }

  const cache = {};
  FILM.audio = {
    render(ctx, opts) {
      const o = opts || {};
      const start = Math.max(0, Number(o.start) || 0);
      const dest = o.dest || ctx.destination;
      const base = ctx.currentTime;
      const sr = ctx.sampleRate;
      const data = cache[sr] || (cache[sr] = synth(sr));
      if (start >= data.length / sr) return;
      const buf = ctx.createBuffer(2, data.length, sr);
      buf.getChannelData(0).set(data);
      buf.getChannelData(1).set(data);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(dest);
      // A live context keeps running while the chip is emulated: start late by that much, on time.
      const late = Math.max(0, ctx.currentTime - base);
      src.start(base + late, start + late);
    },
  };
})();

</script>
<script>
// ---- src/player.js
/*
 * player.js : the interactive page around the film.
 *
 *   click or space   play / pause (with audio)
 *   left / right     step one frame back / forward
 *   ?t=seconds       open paused on that global time
 *   ?shot=id         loop one shot
 *   ?render=1        no UI, canvas at native size, nothing drawn until asked (used by tools)
 *
 * The clock while playing is the AudioContext clock when there is music, otherwise the
 * requestAnimationFrame timestamp. Nothing here draws: it only calls FILM.renderFrame(T).
 */
(function () {
  'use strict';

  const FILM = window.FILM;
  if (!FILM || typeof FILM.renderFrame !== 'function') return;

  const params = new URLSearchParams(window.location.search);
  const renderMode = params.get('render') === '1';

  if (renderMode) {
    // tools mount their own canvas; keep the page inert
    document.documentElement.style.background = '#000';
    return;
  }

  function start() {
    if (FILM.prepare) FILM.prepare(); // applies the timeline's fps and frame size before anything reads them
    const FPS = FILM.FPS;
    const duration = FILM.DURATION;
    const shotId = params.get('shot');
    const loopShot = shotId ? FILM.shotById(shotId) : null;
    const rangeStart = loopShot ? loopShot.start : 0;
    const rangeEnd = loopShot ? loopShot.end : duration;
    const tParam = params.get('t');

    const style = document.createElement('style');
    style.textContent = [
      'html,body{margin:0;height:100%;background:#000;overflow:hidden}',
      'body{display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-user-select:none;user-select:none}',
      `#film{display:block;height:min(100vh,calc(100vw*${FILM.H}/${FILM.W}));width:auto;` +
        `aspect-ratio:${FILM.W}/${FILM.H};background:#000}`,
      '#hud{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;font:12px/1.4 ui-monospace,Menlo,monospace;color:#bbb;',
      'display:flex;justify-content:space-between;pointer-events:none;transition:opacity .4s;text-shadow:0 1px 2px #000}',
      '#bar{position:fixed;left:0;bottom:0;height:2px;background:#e8e0cf;width:0;pointer-events:none}',
      'body.playing #hud{opacity:0}',
      'body.playing:hover #hud{opacity:.85}',
    ].join('');
    document.head.appendChild(style);

    const canvas = document.createElement('canvas');
    canvas.id = 'film';
    document.body.appendChild(canvas);
    FILM.mount(canvas);

    const hud = document.createElement('div');
    hud.id = 'hud';
    const left = document.createElement('span');
    const right = document.createElement('span');
    right.textContent = 'click or space: play/pause   ← →: step';
    hud.appendChild(left);
    hud.appendChild(right);
    document.body.appendChild(hud);
    const bar = document.createElement('div');
    bar.id = 'bar';
    document.body.appendChild(bar);

    let T = tParam != null && isFinite(Number(tParam)) ? Number(tParam) : rangeStart;
    let playing = false;
    let audio = null; // { ctx, anchor, startT }
    let rafStamp0 = null;
    let rafT0 = 0;
    let lastDrawn = -1;

    const quant = (t) => Math.floor(t * FPS + 1e-6) / FPS;

    // Clip frames (instrument mode) decode on demand: a frame draws once its clips are ready, and
    // while playing the next second is prefetched so playback does not wait on the decoder.
    const hasClips = FILM.prepareFrame && FILM.CLIPS && Object.keys(FILM.CLIPS).length > 0;
    let prefetchedTo = -1;
    function prefetch(q) {
      if (!hasClips) return;
      const to = Math.min(rangeEnd - 1 / FPS, q + 1);
      for (let f = Math.max(Math.round(q * FPS), prefetchedTo + 1); f <= Math.round(to * FPS); f++) FILM.prepareFrame(f / FPS);
      prefetchedTo = Math.round(to * FPS);
    }
    function paint(q) {
      FILM.errors = [];
      const shot = FILM.renderFrame(q);
      if (FILM.errors.length && window.console) console.warn('FILM errors at', q, FILM.errors);
      left.textContent = `${q.toFixed(2)}s  f${Math.round(q * FPS)}  ${shot ? shot.id : ''}`;
      bar.style.width = `${(100 * (q - rangeStart)) / Math.max(1e-6, rangeEnd - rangeStart)}%`;
    }
    function draw(force) {
      const q = quant(Math.min(Math.max(T, rangeStart), rangeEnd - 1 / FPS));
      if (!force && q === lastDrawn) return;
      lastDrawn = q;
      if (!hasClips) return paint(q);
      if (q * FPS < prefetchedTo - FPS * 2) prefetchedTo = -1; // looped or seeked back
      prefetch(q);
      FILM.prepareFrame(q).then(() => {
        if (lastDrawn === q) paint(q);
      });
    }

    function stopAudio() {
      if (audio) {
        const c = audio.ctx;
        audio = null;
        c.close();
      }
    }

    function startAudio(fromT) {
      stopAudio();
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC || !FILM.audio || typeof FILM.audio.render !== 'function') return;
      const ctx = new AC({ latencyHint: 'playback', sampleRate: 48000 });
      const master = ctx.createGain();
      master.connect(ctx.destination);
      const anchor = ctx.currentTime;
      try {
        FILM.audio.render(ctx, { start: fromT, dest: master });
      } catch (e) {
        if (window.console) console.error('FILM.audio.render failed', e);
      }
      audio = { ctx, anchor, startT: fromT };
    }

    function play() {
      if (T >= rangeEnd - 1 / FPS) T = rangeStart;
      playing = true;
      document.body.classList.add('playing');
      startAudio(T);
      rafStamp0 = null;
      rafT0 = T;
    }

    function pause() {
      playing = false;
      document.body.classList.remove('playing');
      stopAudio();
      T = quant(T);
      draw(true);
    }

    function tick(stamp) {
      if (playing) {
        if (audio) {
          const lat = (audio.ctx.baseLatency || 0) + (audio.ctx.outputLatency || 0);
          T = audio.startT + Math.max(0, audio.ctx.currentTime - audio.anchor - lat);
        } else {
          if (rafStamp0 == null) rafStamp0 = stamp;
          T = rafT0 + (stamp - rafStamp0) / 1000;
        }
        if (T >= rangeEnd) {
          T = rangeStart;
          if (audio) startAudio(T);
          rafStamp0 = stamp;
          rafT0 = T;
        }
        draw(false);
      }
      window.requestAnimationFrame(tick);
    }

    function step(n) {
      if (playing) pause();
      const f = Math.round(quant(T) * FPS) + n;
      const f0 = Math.round(rangeStart * FPS);
      const f1 = Math.round(rangeEnd * FPS) - 1;
      T = Math.min(f1, Math.max(f0, f)) / FPS;
      draw(true);
    }

    canvas.addEventListener('click', () => (playing ? pause() : play()));
    document.body.addEventListener('click', (e) => {
      if (e.target === document.body) playing ? pause() : play();
    });
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        playing ? pause() : play();
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        step(1);
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        step(-1);
      }
    });

    draw(true);
    window.requestAnimationFrame(tick);
  }

  // Photos decode asynchronously and the hand-lettering face resolves asynchronously; drawing before
  // either is ready shows a half-built frame (and hashes differently from the same frame drawn later).
  const boot = () =>
    Promise.all([
      FILM.loadPhotos ? FILM.loadPhotos() : Promise.resolve(),
      document.fonts ? document.fonts.ready : Promise.resolve(),
    ]).then(start);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
