<script>
// ---- src/game/30-draw.js
// game/30-draw.js : paints one snapshot (game/10-engine.js) into the console's 320x180 frame buffer.
// Every pixel is repainted each frame, only in lib.NES colours, through lib.sprite / lib.pxtext.
// Owner: game.
//
// Layers, back to front: backdrop (a flash may replace it for a frame); then, clipped below the HUD band
// (y >= 32) so nothing from the world ever enters it: scenery (clouds, hills, bushes, the castle flag, the
// castle); sprites that sit behind the tiles (a power-up rising out of its block, Claw'd inside a pipe,
// the boss sinking into the lava); tiles; bumped blocks; sprites; score pops; the castle's door and right
// wall redrawn over Claw'd as he walks in. Then the HUD and the title / lives / ending text.
//
// The game (docs/game-spec.md 9.3) adds a `view` argument, { now, reducedFlash }, which the film never
// passes: `now` paints the level grid as it stands (a live console draws the snapshot it just took),
// `reducedFlash` drops backdrop flashes, slows the star cycle and holds FLICKER sprites steady. The live
// screens (pause, continue, clear card, credits) and the live lives screen are drawn only from live
// snapshots, so every film frame is painted exactly as before.
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});
  const CQ = FILM.__cq;
  const rowTop = CQ.rowTop;

  let L = null; // FILM.lib, resolved on first draw (lib.js loads before the game, but stay lazy)
  let N = null;
  let PALS = null;
  function libs() {
    if (L) return;
    L = FILM.lib;
    N = L.NES;
    // palette slots used by the snapshot (docs/game-spec.md 2.6): 1-4 the Claude spark cycle (the fourth
    // is Claw'd's own), 5 and 6 the underground bugs (the overworld bug's black legs would vanish on
    // black), 7 Claw'd Code, 8 the 1UP floppy, 9 the Big Bug's hit flash, 10 and 11 the new enemies on
    // black, 12 brick fragments underground
    const SP = L.SPAL || {};
    const star = SP.clawdStar || [];
    PALS = [null, star[0], star[1], star[2], star[3], SP.bugU, SP.shellbugU, SP.clawdCode, SP.life, SP.bossHit, SP.mothU, SP.spikeU, SP.fragmentU];
  }

  // Per-frame draw state, set at the top of drawSnap: the visual frame (animation clocks) and the
  // reduced-flashing option. The film leaves both at their defaults.
  const FLICKER = 256;
  let VF = 0;
  let REDUCED = false;
  let STAR_STEP = 0; // reduced flashing: the star cycle's slot, one step every 8 frames
  // the palette slot a sprite shows this frame: FLICKER alternates its slot with the sprite's own every
  // 4 frames (held steady with reduced flashing), and reduced flashing slows the star cycle
  function palOf(fl, pal) {
    if (!pal) return 0;
    if (fl & FLICKER && !REDUCED && (VF >> 2) & 1) return 0;
    if (REDUCED && pal >= 1 && pal <= 4) return STAR_STEP;
    return pal;
  }

  const MANI = () => FILM.SPRITE_MANIFEST || {};
  const A = CQ.ANCHOR;
  // one reusable options object: lib.sprite reads it synchronously
  const O = { flip: false, flipV: false, pal: undefined };
  function spr(ctx, name, x, y, flags, pal) {
    if (flags & (A.FEET | A.RIGHT | A.LEFT)) {
      const m = MANI()[name];
      const w = m ? m.w : 16, h = m ? m.h : 16;
      y -= h;
      if (flags & A.FEET) x -= w >> 1;
      else if (flags & A.RIGHT) x -= w;
    }
    O.flip = !!(flags & 1);
    O.flipV = !!(flags & 2);
    O.pal = pal ? PALS[pal] || undefined : undefined;
    L.sprite(ctx, name, x, y, O);
  }

  // ------------------------------------------------------------------------------------------
  // Scenery: the level's own hand-placed list (def.scenery), checked against the map once (cached per level
  // definition, so a game level and a film level never share an entry): a hill or bush is dropped if any
  // column under it lacks ground or holds a pipe, block or the pole
  // ------------------------------------------------------------------------------------------
  const sceneryCache = new Map();
  const POLE_CODES = ['|'.charCodeAt(0), '!'.charCodeAt(0)];
  function scenery(lv) {
    if (sceneryCache.has(lv.def)) return sceneryCache.get(lv.def);
    const out = [];
    const orig = lv.orig;
    const w = lv.w;
    const at = (tx, ty) => (tx < 0 || tx >= w || ty < 0 || ty > 11 ? 46 : orig[ty * w + tx]);
    const M = MANI();
    for (const [name, col, cy] of lv.def.scenery || []) {
      const m = M[name] || { w: 32, h: 16 };
      const x = Math.round(col * 16);
      if (name.startsWith('cloud')) {
        out.push([name, x, cy, 0]);
        continue;
      }
      let ok = true;
      for (let c = Math.floor(x / 16); c <= Math.floor((x + m.w - 1) / 16) && ok; c++) {
        if (CQ.SOLID[at(c, 10)] !== 1) ok = false;
        for (let r = 7; r <= 9 && ok; r++) if (CQ.SOLID[at(c, r)] === 1 || POLE_CODES.indexOf(at(c, r)) >= 0) ok = false;
      }
      if (ok) out.push([name, x, 148 - m.h, name.startsWith('hill') ? 1 : 2]);
    }
    // clouds, then hills, then bushes in front
    out.sort((p, q) => p[3] - q[3]);
    sceneryCache.set(lv.def, out);
    return out;
  }

  // ------------------------------------------------------------------------------------------
  // Tiles
  // ------------------------------------------------------------------------------------------
  const TILE = {};
  function tileTable(kind) {
    if (TILE[kind]) return TILE[kind];
    const t = new Array(128).fill(null);
    const set = (ch, name) => (t[ch.charCodeAt(0)] = name);
    const names = CQ.TILE_NAMES[kind] || CQ.TILE_NAMES.over;
    for (const ch in names) set(ch, names[ch]);
    set('[', 't_pipeTL'); set(']', 't_pipeTR'); set('{', 't_pipeL'); set('}', 't_pipeR');
    set('h', 't_pipeHT'); set('H', 't_pipeHB'); set('-', 't_pipeHBodyT'); set('_', 't_pipeHBodyB');
    set('j', 't_pipeJoinT'); set('J', 't_pipeJoinB');
    set('!', 't_poleTop'); set('|', 't_pole'); set('%', 't_chain'); set('l', 't_lava');
    set('?', '?'); set('M', '?'); set('o', 'o'); set('L', 'L');
    // the game's blocks: N (a 1UP inside) shimmers like any ? block; a spring (S) is drawn by its system
    // as a sprite and a hidden 1UP block (+) shows nothing until it is bumped
    set('N', '?');
    t['S'.charCodeAt(0)] = null;
    t['+'.charCodeAt(0)] = null;
    TILE[kind] = t;
    return t;
  }

  // the tile code of cell i as it was when the snapshot was taken (chg = length of the change log then)
  function histOf(lv) {
    if (lv.histLen === lv.changes.length) return lv.hist;
    const h = new Map();
    const c = lv.changes;
    for (let k = 0; k < c.length; k += 2) {
      let a = h.get(c[k]);
      if (!a) h.set(c[k], (a = []));
      a.push(k, c[k + 1]);
    }
    lv.hist = h;
    lv.histLen = c.length;
    return h;
  }
  function codeAt(lv, hist, i, chg) {
    const a = hist.get(i);
    if (!a) return lv.orig[i];
    let code = lv.orig[i];
    for (let k = 0; k < a.length; k += 2) {
      if (a[k] < chg) code = a[k + 1];
      else break;
    }
    return code;
  }

  // the ? block shimmer on the console's 48-frame cadence (lib.shimmer)
  const qName = (f) => 't_q' + (1 + L.shimmer(f));

  // now: read the grid as it stands (a live console draws the snapshot it just took) instead of replaying
  // the change log up to the snapshot's length
  function drawTiles(ctx, s, f, now) {
    const lv = s.lv;
    const tab = tileTable(lv.def.kind);
    const grid = now ? lv.grid : null;
    const hist = now ? null : histOf(lv);
    const cam = s.cam;
    const tx0 = Math.max(0, Math.floor(cam / 16)), tx1 = Math.min(lv.w - 1, Math.floor((cam + 319) / 16));
    const hide = s.hide;
    const q = qName(f);
    const lava = (s.lt >> 4) & 1 ? 't_lavaTop2' : 't_lavaTop1';
    const coin = 'coin' + (1 + ((f >> 3) & 3));
    for (let ty = 0; ty < 12; ty++) {
      const y = rowTop(ty);
      for (let tx = tx0; tx <= tx1; tx++) {
        const i = ty * lv.w + tx;
        const code = grid ? grid[i] : codeAt(lv, hist, i, s.chg);
        const name = tab[code];
        if (!name) continue;
        if (hide && hide.indexOf(i) >= 0) continue;
        const x = tx * 16 - cam;
        if (name === '?') L.sprite(ctx, q, x, y);
        else if (name === 'o') L.sprite(ctx, coin, x + 4, y + 1);
        else if (name === 'L') L.sprite(ctx, lava, x, y);
        else L.sprite(ctx, name, x, y);
      }
    }
  }

  // ------------------------------------------------------------------------------------------
  // HUD and text
  // ------------------------------------------------------------------------------------------
  // Text layers (the HUD, the title, the lives screen, the ending) are painted once per distinct
  // content into their own transparent canvas and blitted: pixel text is thousands of 1-px fills.
  // Each layer is a pure function of its key, so the cache never changes what a frame shows.
  const layers = new Map();
  function layer(ctx, id, key, h, paint) {
    let e = layers.get(id);
    if (!e) {
      const c = FILM.makeCanvas(320, h);
      e = { c, g: c.getContext('2d'), key: null };
      e.g.imageSmoothingEnabled = false;
      layers.set(id, e);
    }
    if (e.key !== key) {
      e.g.clearRect(0, 0, 320, h);
      paint(e.g);
      e.key = key;
    }
    ctx.drawImage(e.c, 0, 0);
  }
  CQ.layer = layer;
  function hud(ctx, s, f) {
    const shim = L.shimmer(f);
    const time = s.time >= 0 ? s.time : null;
    layer(ctx, 'hud', s.score + '|' + s.coins + '|' + s.world + '|' + time + '|' + shim, L.HUD_H || 32, (g) =>
      L.hud(g, { score: s.score, coins: s.coins, world: s.world, time, frame: f })
    );
  }

  // The title: the Claude-Code-style welcome box, the menu with its ▶ cursor, the high score. When the
  // game page's shell runs the menu (s.shell), only the box is drawn here; the shell paints the menu.
  function titleText(ctx, s) {
    if (s.shell) {
      layer(ctx, 'title', 'shell', 180, (g) => L.titleBox(g, 160, 38, { text: 'CLAUDE QUEST', lines: ['©1986 CLAWD SOFT'] }));
      return;
    }
    // after START the cursor flickers while the console gets ready
    const blink = s.title.started && (s.title.mt >> 2) & 1 ? 1 : 0;
    layer(ctx, 'title', s.top + '|' + blink, 180, (g) => {
      const white = N[0x30];
      L.titleBox(g, 160, 38, { text: 'CLAUDE QUEST', lines: ['©1986 CLAWD SOFT'] });
      if (!blink) L.pxtext(g, '▶', 110, 94, { color: N[0x26] });
      L.pxtext(g, 'NEW QUEST', 124, 94, { color: white });
      L.pxtext(g, 'CONTINUE', 124, 106, { color: white });
      L.pxtext(g, 'HI-SCORE ' + String(s.top).padStart(6, '0'), 160, 122, { color: white, align: 'center' });
    });
  }

  function livesText(ctx, s) {
    if (s.live) {
      // the game: the world, the level's name under it, then Claw'd and his lives
      const name = s.name || '';
      layer(ctx, 'lives', s.world + '|' + s.lives + '|' + name, 180, (g) => {
        const white = N[0x30];
        L.pxtext(g, 'WORLD ' + s.world, 160, 60, { color: white, align: 'center' });
        if (name) L.pxtext(g, name, 160, 72, { color: white, align: 'center' });
        L.sprite(g, 'clawdS_idle', 132, 88);
        L.pxtext(g, '×', 158, 93, { color: white });
        L.pxtext(g, String(s.lives), 176, 93, { color: white });
      });
      return;
    }
    layer(ctx, 'lives', s.world + '|' + s.lives, 180, (g) => {
      const white = N[0x30];
      L.pxtext(g, 'WORLD ' + s.world, 160, 68, { color: white, align: 'center' });
      L.sprite(g, 'clawdS_idle', 132, 86);
      L.pxtext(g, '×', 158, 91, { color: white });
      L.pxtext(g, String(s.lives), 176, 91, { color: white });
    });
  }

  // The ending: Pearl's line centred in her teal, then the completion summary as a left-aligned block
  // (✻ in salmon, ✓ in green), typed on a character a frame; PUSH START TO SHIP IT blinks under it.
  // Everything sits between the HUD band and the heads of Claw'd and Pearl (y 124).
  // The film's five lines keep their layout; the game's seven (docs/game-spec.md 9.4) sit closer.
  const END_Y = [42, 62, 74, 86, 98];
  const END_PUSH_Y = 114;
  const END_Y7 = [40, 56, 66, 76, 86, 96, 106];
  const END_PUSH_Y7 = 116;
  function endingText(ctx, s) {
    const e = s.end;
    const seven = e.lines.length >= 7;
    const Y = seven ? END_Y7 : END_Y;
    const pushY = seven ? END_PUSH_Y7 : END_PUSH_Y;
    layer(ctx, 'ending', e.lines.join('/') + '|' + e.chars.join(',') + '|' + e.push, 180, (g) => {
      const white = N[0x30];
      const lines = e.lines;
      if (e.chars[0] > 0) {
        const x = 160 - Math.floor(L.pxtextWidth(lines[0]) / 2);
        L.pxtext(g, lines[0].slice(0, e.chars[0]), x, Y[0], { color: N[0x3c] });
      }
      let bw = 0;
      for (let i = 1; i < lines.length; i++) bw = Math.max(bw, L.pxtextWidth(lines[i]));
      const bx = 160 - Math.floor(bw / 2);
      for (let i = 1; i < lines.length && i < Y.length; i++) {
        const n = e.chars[i];
        if (n <= 0) continue;
        const mark = lines[i][0];
        L.pxtext(g, mark, bx, Y[i], { color: mark === '✻' ? N[0x26] : N[0x2a] });
        if (n > 1) L.pxtext(g, lines[i].slice(1, n), bx + 8, Y[i], { color: white });
      }
      if (e.push === 1) L.pxtext(g, 'PUSH START TO SHIP IT', 160, pushY, { color: N[0x28], align: 'center' });
    });
  }

  // ------------------------------------------------------------------------------------------
  // The live screens (the game only): pause, continue, the clear card, the credits
  // ------------------------------------------------------------------------------------------
  const pad6 = (n) => String(Math.max(0, Math.floor(n || 0))).padStart(6, '0');
  // a line whose first glyph is a coloured mark (✓ or ✻), centred on x 160
  function markLine(g, mark, markColor, rest, y, color) {
    const w = L.pxtextWidth(mark + ' ' + rest);
    const x = 160 - Math.floor(w / 2);
    L.pxtext(g, mark, x, y, { color: markColor });
    L.pxtext(g, rest, x + 16, y, { color });
  }
  // three token medals in a row (collected salmon, missing grey), centred on x 160
  function tokenRow(g, bits, y) {
    for (let i = 0; i < 3; i++) L.pxtext(g, '✻', 160 - 20 + 16 * i, y, { color: (bits >> i) & 1 ? N[0x26] : N[0x00] });
  }
  function black(ctx) {
    ctx.fillStyle = N[0x0f];
    ctx.fillRect(0, 0, 320, 180);
  }

  // mode 4 without the shell's panel: PAUSED over the frozen frame
  function pausedText(ctx) {
    layer(ctx, 'paused', 'p', 180, (g) => L.pxtext(g, 'PAUSED', 160, 86, { color: N[0x30], align: 'center', shadow: N[0x0f] }));
  }

  // mode 5: GAME OVER, then CONTINUE or END with the ▶ on the chosen row
  function continueScreen(ctx, s) {
    const sel = s.cont && s.cont.sel ? 1 : 0;
    black(ctx);
    layer(ctx, 'continue', String(sel), 180, (g) => {
      const white = N[0x30];
      L.pxtext(g, 'GAME OVER', 160, 70, { color: white, align: 'center' });
      L.pxtext(g, 'CONTINUE', 136, 94, { color: white });
      L.pxtext(g, 'END', 136, 106, { color: white });
      L.pxtext(g, '▶', 120, sel ? 106 : 94, { color: N[0x26] });
    });
  }

  // mode 6: the clear card
  function clearCard(ctx, s) {
    const c = s.clear || {};
    black(ctx);
    const key = [c.id, c.name, c.tokens, c.time, c.score].join('|');
    layer(ctx, 'clear', key, 180, (g) => {
      const white = N[0x30];
      markLine(g, '✓', N[0x2a], (c.id || '') + ' CLEAR', 56, white);
      if (c.name) L.pxtext(g, c.name, 160, 70, { color: white, align: 'center' });
      tokenRow(g, c.tokens | 0, 88);
      L.pxtext(g, 'SCORE ' + pad6(c.score), 160, 108, { color: white, align: 'center' });
      L.pxtext(g, 'TIME ' + String(Math.max(0, c.time | 0)).padStart(3, '0'), 160, 120, { color: white, align: 'center' });
    });
  }

  // mode 7: the cast parades across a castle floor, left to right in single file, each with its name over
  // its head (alternate rows, so no two names meet), to the credits song; fireworks burst on its beat
  // (the engine's CREDITS_FIREWORKS, which also sound them) and sparks twinkle overhead. Then the final
  // card. Every position is a function of the credits clock c.t alone.
  // [name, drawings, frames a drawing, palette slot (enemies wear their dark-backdrop palettes on black),
  //  flipped to face right, how it moves: 'walk', 'hop' (Pearl bobs and waves) or 'fly' (the moth bobs)]
  const CAST = [
    ["CLAW'D", ['clawdB_run1', 'clawdB_run2', 'clawdB_run3'], 6, 0, false, 'walk'],
    ['PRINCESS PEARL', ['pearl', 'pearl_wave'], 16, 0, false, 'hop'],
    ['BUG', ['bug_walk1', 'bug_walk2'], 8, 5, true, 'walk'],
    ['SHELL BUG', ['shellbug_walk1', 'shellbug_walk2'], 8, 6, true, 'walk'],
    ['MOTH', ['moth1', 'moth2'], 6, 10, true, 'fly'],
    ['SPIKE BEETLE', ['spike_walk1', 'spike_walk2'], 8, 11, true, 'walk'],
    ['BIG BUG', ['boss_walk1', 'boss_walk2'], 12, 0, true, 'walk'],
  ];
  // the leader's left edge starts at x -16 and every member walks 1 px a frame, CAST_GAP px behind the
  // one in front, so the Big Bug steps off the right edge on the parade's last frame (672 = 16 + 6 * 56 + 320)
  const CAST_X0 = -16, CAST_GAP = 56, FLOOR_Y = 148, NAME_Y = [100, 88];
  const FW_AT = [[72, 54], [248, 52], [104, 58], [216, 58]]; // the four bursts. centres (clear of the header and names)
  const FW_R1 = [[-10, 0], [10, 0], [0, -10], [0, 10]], FW_R2 = [[-13, -13], [13, -13], [-13, 13], [13, 13]], FW_R3 = [[-22, 0], [22, 0], [0, -22], [0, 22]];
  const SPARKS = [[20, 50], [58, 76], [104, 44], [142, 70], [178, 46], [222, 78], [266, 48], [298, 72]];
  // a name, painted once into its own small canvas and blitted wherever its owner walks
  const names = new Map();
  function nameplate(ctx, text, cx, y) {
    let c = names.get(text);
    if (!c) {
      const w = L.pxtextWidth(text);
      c = FILM.makeCanvas(w, 8);
      const g = c.getContext('2d');
      g.imageSmoothingEnabled = false;
      L.pxtext(g, text, 0, 0, { color: N[0x30] });
      names.set(text, c);
    }
    ctx.drawImage(c, cx - (c.width >> 1), y);
  }
  function firework(ctx, x, y, k) {
    const put = (n, dx, dy) => L.sprite(ctx, 'firework' + n, x - 8 + dx, y - 8 + dy);
    if (k < 6) put(1, 0, 0);
    else if (k < 14) {
      put(2, 0, 0);
      for (const [dx, dy] of FW_R1) put(1, dx, dy);
    } else if (k < 22) {
      put(3, 0, 0);
      for (const [dx, dy] of FW_R1) put(2, dx, dy);
      for (const [dx, dy] of FW_R2) put(1, dx, dy);
    } else {
      for (const [dx, dy] of FW_R2) put(3, dx, dy);
      for (const [dx, dy] of FW_R3) put(k & 2 ? 2 : 1, dx, dy);
    }
  }
  function parade(ctx, t) {
    for (let x = 0; x < 320; x += 16) {
      L.sprite(ctx, 't_groundC', x, FLOOR_Y);
      L.sprite(ctx, 't_groundC', x, FLOOR_Y + 16);
    }
    layer(ctx, 'credits', 'cast', 180, (g) => {
      // '✻ THE CAST ✻' centred, the marks in salmon (8 px a glyph)
      const x0 = 160 - (L.pxtextWidth('✻ THE CAST ✻') >> 1);
      L.pxtext(g, '✻', x0, 28, { color: N[0x26] });
      L.pxtext(g, 'THE CAST', x0 + 16, 28, { color: N[0x30] });
      L.pxtext(g, '✻', x0 + 88, 28, { color: N[0x26] });
    });
    SPARKS.forEach(([x, y], i) => {
      if ((t + i * 13) % 40 < 10) L.sprite(ctx, 'cursor', x, y);
    });
    const FW = CQ.TIMING.CREDITS_FIREWORKS;
    FW.forEach((f0, i) => {
      if (t >= f0 && t < f0 + 30) firework(ctx, FW_AT[i % FW_AT.length][0], FW_AT[i % FW_AT.length][1], t - f0);
    });
    const SIN = CQ.SIN64 || [0];
    CAST.forEach(([label, frames, every, pal, flip, how], i) => {
      const x = CAST_X0 - i * CAST_GAP + t;
      const name = frames[Math.floor(t / every) % frames.length];
      const m = MANI()[name] || { w: 16, h: 16 };
      if (x <= -m.w || x >= 320) return;
      let feet = FLOOR_Y;
      if (how === 'hop') feet -= (t >> 3) & 1;
      else if (how === 'fly') feet = FLOOR_Y - 14 + (SIN[(t * 2) & 63] >> 2);
      spr(ctx, name, x, feet - m.h, flip ? 1 : 0, pal);
      nameplate(ctx, label, x + (m.w >> 1), NAME_Y[i & 1]);
    });
  }
  function credits(ctx, s) {
    const c = s.credits || { t: 0 };
    const t = c.t | 0;
    const ROLL = CQ.TIMING.CREDITS_ROLL, CARD_PUSH = ROLL + CQ.TIMING.CREDITS_WAIT;
    black(ctx);
    if (t < ROLL) {
      parade(ctx, t);
      return;
    }
    const push = t >= CARD_PUSH && (t - CARD_PUSH) % 48 < 32 ? 1 : 0;
    const tokens = Math.max(0, Math.min(99, c.tokens | 0));
    const key = ['card', c.score, c.top, tokens, c.perfect ? 1 : 0, push].join('|');
    layer(ctx, 'credits', key, 180, (g) => {
      const white = N[0x30];
      markLine(g, '✻', N[0x26], 'CLAUDE QUEST', 56, white);
      L.pxtext(g, 'SESSION COMPLETE', 160, 72, { color: N[0x36], align: 'center' });
      L.pxtext(g, 'SCORE ' + pad6(c.score), 160, 92, { color: white, align: 'center' });
      L.pxtext(g, 'HI-SCORE ' + pad6(c.top), 160, 104, { color: white, align: 'center' });
      L.pxtext(g, 'TOKENS ' + String(tokens).padStart(2, '0') + '/12', 160, 116, { color: white, align: 'center' });
      if (c.perfect || tokens >= 12) L.pxtext(g, '✻ PERFECT ✻', 160, 128, { color: N[0x28], align: 'center' });
      if (push) L.pxtext(g, 'PUSH START', 160, 150, { color: white, align: 'center' });
    });
  }

  // ------------------------------------------------------------------------------------------
  // The frame
  // ------------------------------------------------------------------------------------------
  const CASTLE_Y = 68; // the castle stands on the ground (80 tall, bottom at y 148)
  const CASTLE_TIP = [68, 16]; // the right turret's tip, where the castle flag's staff stands
  const BACKDROP = { over: 0x22, sky: 0x21 }; // under and castle are black
  // film: true for the film's frames (FILM.game.draw), false for a live console (FILM.game.create).
  // view (live only): { now, reducedFlash } (see the header)
  function drawSnap(ctx, s, f, film, view) {
    libs();
    const now = !!(view && view.now);
    REDUCED = !!(view && view.reducedFlash);
    VF = f | 0;
    STAR_STEP = 1 + (Math.floor((s.f | 0) / 8) % 4 + 4) % 4;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    const TL = FILM.TIMELINE;
    const off = film && TL && TL.crt && TL.crt.powerOff;
    // the film's set is dark after its power-off; a live console never is
    if (s.m === 3 || (off && f >= off[1])) {
      ctx.fillStyle = N[0x0f];
      ctx.fillRect(0, 0, 320, 180);
      if (s.m === 3) L.pxtext(ctx, 'GAME OVER', 160, 86, { color: N[0x30], align: 'center' });
      ctx.restore();
      return;
    }
    if (s.m === 1) {
      ctx.fillStyle = N[0x0f];
      ctx.fillRect(0, 0, 320, 180);
      hud(ctx, s, f);
      livesText(ctx, s);
      ctx.restore();
      return;
    }
    if (s.m === 5 || s.m === 6 || s.m === 7) {
      if (s.m === 5) continueScreen(ctx, s);
      else if (s.m === 6) clearCard(ctx, s);
      else credits(ctx, s);
      ctx.restore();
      return;
    }
    const lv = s.lv;
    const kind = lv.def.kind;
    const cam = s.cam;
    const back = BACKDROP[kind] !== undefined ? BACKDROP[kind] : 0x0f;
    ctx.fillStyle = s.flash && !REDUCED ? N[s.flash] : N[back];
    ctx.fillRect(0, 0, 320, 180);
    // the world, clipped below the HUD band
    const HB = L.HUD_H || 32;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, HB, 320, 180 - HB);
    ctx.clip();
    for (const [name, x, y] of scenery(lv)) {
      const sx = x - cam;
      const m = MANI()[name];
      if (sx > 320 || sx + (m ? m.w : 80) < 0) continue;
      L.sprite(ctx, name, sx, y);
    }
    const cx = lv.def.castle ? lv.def.castle * 16 - cam : null;
    const castleOn = cx !== null && cx < 320 && cx > -96;
    if (castleOn) {
      if (s.cflag > 0) {
        // the flag climbs out of the turret's tip
        const tipY = CASTLE_Y + CASTLE_TIP[1];
        ctx.save();
        ctx.beginPath();
        ctx.rect(cx + CASTLE_TIP[0], HB, 16, tipY - HB);
        ctx.clip();
        L.sprite(ctx, 'castleFlag', cx + CASTLE_TIP[0], tipY - s.cflag);
        ctx.restore();
      }
      L.sprite(ctx, 'castle', cx, CASTLE_Y);
    }
    const spr16 = s.spr;
    const NAMES = CQ.NAMES;
    // sprites behind the tiles
    for (let k = 0; k < spr16.length; k += 5) {
      const fl = spr16[k + 3];
      if (fl & 4 && spr16[k] < 1000) spr(ctx, NAMES[spr16[k]], spr16[k + 1] - cam, spr16[k + 2], fl, palOf(fl, spr16[k + 4]));
    }
    drawTiles(ctx, s, f, now);
    // bumped blocks, then the sprites and score pops (a pop's x is its centre)
    for (let k = 0; k < spr16.length; k += 5) {
      const fl = spr16[k + 3];
      if (fl & 16) L.sprite(ctx, NAMES[spr16[k]], spr16[k + 1] - cam, spr16[k + 2]);
    }
    for (let k = 0; k < spr16.length; k += 5) {
      const n = spr16[k];
      const fl = spr16[k + 3];
      if (n >= 1000) L.scoreText(ctx, CQ.POPS[n - 1000], spr16[k + 1] - cam, spr16[k + 2], { align: 'center' });
      else if (!(fl & 20)) spr(ctx, NAMES[n], spr16[k + 1] - cam, spr16[k + 2], fl, palOf(fl, spr16[k + 4]));
    }
    // walking into the castle: its door and the wall right of it cover him
    if (castleOn && s.door >= 0) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(s.door - cam, CASTLE_Y, cx + 80 - (s.door - cam), 80);
      ctx.clip();
      L.sprite(ctx, 'castle', cx, CASTLE_Y);
      ctx.restore();
    }
    ctx.restore();
    hud(ctx, s, f);
    if (s.m === 0 && s.title) titleText(ctx, s);
    if (s.end) endingText(ctx, s);
    if (s.m === 4 && !s.shell) pausedText(ctx);
    ctx.restore();
  }
  CQ.drawSnap = drawSnap;

  // Warm-up: build every sprite drawing the film will blit (each name, mirror, flip and palette it
  // appears in, every tile and scenery piece) on an off-screen canvas once, before the first frame,
  // so no frame pays for building one mid-film. Only lib's own caches change; no pixel does.
  function warm(states) {
    libs();
    const c = FILM.makeCanvas(64, 64);
    const g = c.getContext('2d');
    const seen = new Set();
    const NAMES = CQ.NAMES;
    for (const st of states) {
      const sp = st.spr;
      if (!sp) continue;
      for (let k = 0; k < sp.length; k += 5) {
        const n = sp[k];
        if (n >= 1000) continue;
        const key = n * 4096 + (sp[k + 3] & 3) * 256 + sp[k + 4];
        if (seen.has(key)) continue;
        seen.add(key);
        spr(g, NAMES[n], 0, 0, sp[k + 3] & 3, sp[k + 4]);
      }
    }
    const M = MANI();
    for (const name in M) L.sprite(g, name, 0, 0);
    return seen.size;
  }
  CQ.warm = warm;

  // The game page's warm-up (docs/game-spec.md 9.3, 11.1): warmStep(n) builds the next n manifest names
  // with every palette slot and mirror they can be drawn in, and returns true once all are built. The
  // title calls it once an animation frame, so no frame of play pays for building a drawing.
  const WARM_SETS = [
    [/^clawd/, [0, 1, 2, 3, 4, 7], [0, 1]],
    [/^(bug_|shellbug_|shell$|moth\d|spike_)/, [0, 5, 6, 10, 11], [0, 1, 2, 3]],
    [/^mushroom$/, [0, 8], [0, 1]],
    [/^boss_/, [0, 9], [0, 1, 2, 3]],
    [/^fragment/, [0, 12], [0, 1]],
    [/^(pearl|ember|caret|poof)/, [0], [0, 1, 2]],
  ];
  let warmNames = null;
  let warmAt = 0;
  function warmStep(n) {
    libs();
    if (!warmNames) warmNames = Object.keys(MANI());
    const end = Math.min(warmNames.length, warmAt + Math.max(1, n | 0));
    for (; warmAt < end; warmAt++) {
      const name = warmNames[warmAt];
      let pals = [0], flips = [0];
      for (const [re, p, fl] of WARM_SETS) if (re.test(name)) { pals = p; flips = fl; break; }
      for (const p of pals) for (const fl of flips) L.spriteCanvas(name, 0, p ? PALS[p] : undefined, !!(fl & 1), !!(fl & 2));
    }
    return warmAt >= warmNames.length;
  }
  CQ.warmStep = warmStep;
})();

</script>
<script>
// ---- src/game/40-api.js
// game/40-api.js : FILM.game, the public face of the engine (docs/v2-architecture.md 4.1). Owner: game.
//
//   FILM.game.BUTTONS            { A: 1, B: 2, SELECT: 4, START: 8, UP: 16, DOWN: 32, LEFT: 64, RIGHT: 128 }
//   FILM.game.create(opts)       a live console (the game): { step(buttons) -> events[], state(), snapshot(),
//                                draw(nativeCtx, view), frame, mode, pausable } (docs/game-spec.md 2.5)
//   FILM.game.demo()             the attract demo: { step() -> events[], snapshot(), draw(ctx, view), done, frame }
//   FILM.game.sim()              the film, run once from frame 0 on the recorded tape and cached:
//                                { length, states[], events[], tape (Uint8Array of buttons per frame) }
//   FILM.game.draw(ctx, f)       paint film frame f (clamped to 0..length-1) into the 320x180 native buffer
//   FILM.game.events()           sim().events, sorted by f
//   FILM.game.tape()             sim().tape
//   FILM.game.record()           re-run the tape program: { length, fp, rle } for game/21-recorded.js
//
// The film and live play share one step function (game/10-engine.js). A film state keeps the buttons
// held on that frame (states[f].btn) for an input-display overlay.
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});
  const CQ = FILM.__cq;

  let SIM = null;
  function filmLength() {
    const TL = FILM.TIMELINE;
    if (TL && TL.duration > 0) return Math.round(TL.duration * (TL.fps || 60));
    return CQ.DEFAULT_LENGTH || 3840;
  }

  // One pass of the console over `length` frames; input(W, f) gives each frame's buttons.
  function run(length, input) {
    const W = CQ.newWorld({});
    const states = new Array(length);
    const events = [];
    const tape = new Uint8Array(length);
    for (let f = 0; f < length; f++) {
      const b = input(W, f);
      tape[f] = b;
      const ev = CQ.step(W, b);
      for (let i = 0; i < ev.length; i++) events.push(ev[i]);
      states[f] = CQ.snapshot(W);
    }
    return { length, states, events, tape, built: W.built, score: W.score };
  }

  // The fingerprint of a run: every event's frame and type, and the final score (FNV-1a).
  function fingerprint(S) {
    let h = 0x811c9dc5 | 0;
    const mix = (str) => {
      for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 0x01000193);
    };
    for (const e of S.events) mix(e.f + e.type + ';');
    mix('score' + S.score);
    return (h >>> 0).toString(16).padStart(8, '0');
  }

  // run-length tape: "bb:n" pairs (buttons in hex, count in base 36), comma separated
  function encode(tape) {
    const out = [];
    for (let i = 0; i < tape.length; ) {
      let j = i;
      while (j < tape.length && tape[j] === tape[i]) j++;
      out.push(tape[i].toString(16).padStart(2, '0') + ':' + (j - i).toString(36));
      i = j;
    }
    return out.join(',');
  }
  function decode(rle, length) {
    const tape = new Uint8Array(length);
    let f = 0;
    for (const run of rle.split(',')) {
      const [b, n] = run.split(':');
      const v = parseInt(b, 16);
      for (let k = parseInt(n, 36); k > 0 && f < length; k--) tape[f++] = v;
    }
    return f === length ? tape : null;
  }

  // The film plays the recorded tape (game/21-recorded.js). If the engine has moved on since the
  // recording (the fingerprint differs), the tape program is played live instead: same film, slower.
  function sim() {
    if (SIM) return SIM;
    const length = filmLength();
    const rec = CQ.RECORDED;
    if (rec && rec.length === length) {
      const tape = decode(rec.rle, length);
      if (tape) {
        const S = run(length, (W, f) => tape[f]);
        if (fingerprint(S) === rec.fp) {
          S.source = 'recorded';
          SIM = S;
          return SIM;
        }
      }
    }
    const bot = CQ.makeBot(CQ.program());
    SIM = run(length, (W) => bot(W));
    SIM.source = 'program';
    return SIM;
  }

  // A fresh recording from the tape program (for regenerating game/21-recorded.js).
  function record() {
    const S = run(filmLength(), ((bot) => (W) => bot(W))(CQ.makeBot(CQ.program())));
    return { length: S.length, fp: fingerprint(S), rle: encode(S.tape) };
  }

  let warmed = false;
  function draw(ctx, f) {
    const S = sim();
    if (!warmed) {
      warmed = true;
      CQ.warm(S.states);
    }
    f = Math.max(0, Math.min(S.length - 1, Math.floor(Number(f) || 0)));
    CQ.drawSnap(ctx, S.states[f], f, true); // film frames go dark after the power-off
  }

  // A live console (docs/game-spec.md 2.5). opts: start (level id, default '1-1'), feel ('modern' |
  // 'nes', default 'modern'), top (the saved hi-score), shellMenu (the shell draws the title menu and the
  // pause panel); for proofs only form ('small' | 'big' | 'code') and lives. It is always live.
  function create(opts) {
    const o = {};
    if (opts) for (const k of ['start', 'feel', 'top', 'shellMenu', 'form', 'lives']) if (opts[k] !== undefined) o[k] = opts[k];
    o.live = true;
    const W = CQ.newWorld(o);
    return {
      step(buttons) {
        return CQ.step(W, buttons | 0);
      },
      state() {
        return W;
      },
      snapshot() {
        return CQ.snapshot(W);
      },
      // view: { reducedFlash } (the shell's options); a live console draws the grid it just stepped
      draw(ctx, view) {
        const s = CQ.snapshot(W);
        CQ.drawSnap(ctx, s, s.f, false, Object.assign({ now: true }, view)); // never dark on the film's clock
      },
      get frame() {
        return W.f;
      },
      get mode() {
        return W.mode;
      },
      get pausable() {
        return CQ.pausable(W);
      },
    };
  }

  // The attract demo (U5): a film-rules world fed the recorded tape, stepped headless to the first frame
  // in play (film frame 310), then one tape frame per step(). frame is the film frame last stepped; done
  // turns true DEMO_AFTER_FLAG frames after the tape's first flagpole event (1821, so frame 2001) or
  // DEMO_CAP frames after play began, whichever comes first. It emits no audio of its own: the shell
  // sends no demo events to the sound driver.
  const DEMO_AFTER_FLAG = 180, DEMO_CAP = 2400;
  function demo() {
    const rec = CQ.RECORDED;
    const length = rec ? rec.length : 0;
    const tape = (rec && decode(rec.rle, length)) || new Uint8Array(0);
    const W = CQ.newWorld({});
    const input = (f) => (f < tape.length ? tape[f] : 0);
    while (W.mode !== 'play' && W.f < 1200) CQ.step(W, input(W.f));
    const playF = W.f - 1;
    let flagF = -1;
    let done = false;
    const api = {
      step() {
        if (done) return [];
        const ev = CQ.step(W, input(W.f));
        for (const e of ev) if (e.type === 'flagpole' && flagF < 0) flagF = e.f;
        const f = W.f - 1;
        if ((flagF >= 0 && f >= flagF + DEMO_AFTER_FLAG) || f >= playF + DEMO_CAP) done = true;
        return ev;
      },
      snapshot() {
        return CQ.snapshot(W);
      },
      draw(ctx, view) {
        const s = CQ.snapshot(W);
        CQ.drawSnap(ctx, s, s.f, false, Object.assign({ now: true }, view));
      },
      get done() {
        return done;
      },
      get frame() {
        return W.f - 1;
      },
    };
    return api;
  }

  FILM.game = Object.freeze({
    BUTTONS: CQ.BUTTONS,
    create,
    demo,
    sim,
    draw,
    events: () => sim().events,
    tape: () => sim().tape,
    record,
  });
})();

</script>
<script>
// ---- src/game/45-clock.js
// game/45-clock.js : the game page's fixed-step clock (docs/game-spec.md 11.2). Owner: P6.
//
//   CQ.clock.make()              -> { acc, last }  a fresh clock (nothing seen yet)
//   CQ.clock.advance(c, stamp)   -> steps          how many 60 Hz console steps this animation frame runs
//   CQ.clock.reset(c)                              forget the last stamp (the next advance returns 1)
//
// The logic is play.js's accumulator, moved here unchanged so it can be proven without a browser
// (tools/proof/clock.cjs): the first call returns 1 (the first animation frame shows the first console
// frame); a gap longer than MAX_GAP_MS (a hidden tab, a debugger stop) counts as exactly one step, so
// the game never races to catch up; an animation frame runs at most MAX_CATCHUP steps and a backlog
// beyond that is dropped. TOL_MS absorbs animation-frame jitter, so a 60 Hz display never skips or
// doubles a step, and the remainder carries over, so 120, 144 or 240 Hz displays average exactly 60.
// Timing comes only from the stamp passed in (the requestAnimationFrame stamp); nothing here reads a clock.
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});
  const CQ = (FILM.__cq = FILM.__cq || {});

  const STEP_MS = 1000 / 60; // one console frame
  const TOL_MS = 2; // animation-frame jitter absorbed without a skipped or doubled step
  const MAX_CATCHUP = 5; // most steps one animation frame may run
  const MAX_GAP_MS = 250; // a longer gap is not caught up at all

  function advance(c, stamp) {
    if (c.last == null) {
      c.last = stamp;
      c.acc = STEP_MS; // the first animation frame shows the first console frame
    } else {
      const dt = stamp - c.last;
      c.last = stamp;
      c.acc += dt > MAX_GAP_MS ? STEP_MS : dt;
    }
    let n = 0;
    while (c.acc >= STEP_MS - TOL_MS && n < MAX_CATCHUP) {
      c.acc -= STEP_MS;
      n++;
    }
    if (c.acc >= STEP_MS) c.acc = 0; // too far behind: drop the backlog rather than run fast later
    return n;
  }

  CQ.clock = Object.freeze({
    STEP_MS,
    TOL_MS,
    MAX_CATCHUP,
    MAX_GAP_MS,
    make: () => ({ acc: 0, last: null }),
    advance,
    reset(c) {
      c.acc = 0;
      c.last = null;
    },
  });
})();

</script>
<script>
// ---- src/game/50-menu.js
// game/50-menu.js : the game page's menus (docs/game-spec.md 11.4 and 11.5). Owner: P6.
//
// Pure state machines and their painters. No DOM, no storage, no clocks: the shell (src/shell.js) owns
// every side effect and feeds the menus one 60 Hz step at a time.
//
//   CQ.menu.init(screen, env)               -> state            screen: 'title' | 'pause' (or any screen)
//   CQ.menu.step(state, pressed, env)       -> { state, action, sound }
//   CQ.menu.key(state, code, env)           -> { state, action, sound }   a raw key while binding (CONTROLS)
//   CQ.menu.draw(g, state, snap, save, x)   paints into the 320x180 native buffer, NES colours only
//   CQ.menu.drawDemo(g, t)                  the attract demo's blinking DEMO
//   CQ.menu.items(state, env)               the screen's rows (for the shell's announcements and tests)
//   CQ.menu.rebind(keys, action, slot, code) -> keys | null     swap-on-rebind; null when the code is refused
//   CQ.menu.keyLabel(code), CQ.menu.bindable(code), CQ.menu.DEFAULT_KEYS, CQ.menu.ACTIONS, CQ.menu.IDLE
//
// pressed: the button edges of this step (FILM.game.BUTTONS bits). env: { save, fromPause, saveOff }.
// UP and DOWN move (SELECT cycles down), LEFT and RIGHT change a value (or pick a key slot), A or START
// confirms, B backs out. Every move sounds 'cursor', every confirm 'select', every back 'back' (the shell
// sends the sound straight to the audio queue). Disabled rows are skipped. Menus have no time limits;
// only the title counts idle steps (1080 without a button edge gives { type: 'demo' }) and a key binding
// gives up after 300 steps.
//
// Actions: { type: 'new' }, { type: 'continue', level }, { type: 'resume' }, { type: 'quit' },
// { type: 'set', key, value } (key is a save.settings field), { type: 'bind', action, slot }, { type: 'erase' },
// { type: 'demo' }.
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});
  const CQ = (FILM.__cq = FILM.__cq || {});

  const B = { A: 1, B: 2, SELECT: 4, START: 8, UP: 16, DOWN: 32, LEFT: 64, RIGHT: 128 };
  const IDLE = 1080; // ATTRACT_IDLE: 18 s on the title without a button edge starts the demo
  const REMAP_TIMEOUT = 300; // a binding waits this many steps for a key
  const NOTE_FRAMES = 90; // a refusal note under the CONTROLS list

  const ACTIONS = Object.freeze(['UP', 'DOWN', 'LEFT', 'RIGHT', 'A', 'B', 'START', 'SELECT']);
  const DEFAULT_KEYS = Object.freeze({
    UP: Object.freeze(['ArrowUp', 'KeyW']),
    DOWN: Object.freeze(['ArrowDown', 'KeyS']),
    LEFT: Object.freeze(['ArrowLeft', 'KeyA']),
    RIGHT: Object.freeze(['ArrowRight', 'KeyD']),
    A: Object.freeze(['KeyZ', 'KeyK']),
    B: Object.freeze(['KeyX', 'KeyJ']),
    START: Object.freeze(['Enter', 'NumpadEnter']),
    SELECT: Object.freeze(['ShiftLeft', 'ShiftRight']),
  });
  // the page's own keys, never bindable: P and Escape pause, F fullscreen, C the TV, M mute, I input display
  const FIXED = new Set(['KeyP', 'Escape', 'KeyF', 'KeyC', 'KeyM', 'KeyI']);
  // modifier-only keys belong to the browser's shortcuts (Shift is a console button: SELECT's default)
  const MODIFIER = new Set(['MetaLeft', 'MetaRight', 'OSLeft', 'OSRight', 'ControlLeft', 'ControlRight', 'AltLeft', 'AltRight',
    'AltGraph', 'CapsLock', 'Fn', 'FnLock', 'ContextMenu', 'NumLock', 'ScrollLock']);

  function bindable(code) {
    return typeof code === 'string' && code.length > 0 && code !== 'Unidentified' && !FIXED.has(code) && !MODIFIER.has(code);
  }

  const LABELS = { ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', Space: 'SPACE', Enter: 'ENTER',
    NumpadEnter: 'NENTER', ShiftLeft: 'LSHIFT', ShiftRight: 'RSHIFT' };
  // a key's label on the CONTROLS screen: A-Z and 0-9 only (every glyph is in lib.FONT), at most 6
  function keyLabel(code) {
    if (!code) return '-';
    if (LABELS[code]) return LABELS[code];
    let m = /^Key([A-Z])$/.exec(code);
    if (m) return m[1];
    m = /^Digit([0-9])$/.exec(code);
    if (m) return m[1];
    m = /^Numpad([0-9])$/.exec(code);
    if (m) return 'NUM' + m[1];
    const s = String(code).replace(/^(Key|Digit)/, '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
    return s || '?';
  }

  const copyKeys = (keys) => {
    const out = {};
    for (const a of ACTIONS) out[a] = [keys[a][0], keys[a][1]];
    return out;
  };
  // Bind `code` to keys[action][slot]. A code already bound anywhere else takes the replaced code in its
  // place (a swap), so no key is ever bound twice. Refused (null): a fixed key or a modifier-only key.
  function rebind(keys, action, slot, code) {
    if (!bindable(code) || ACTIONS.indexOf(action) < 0 || (slot !== 0 && slot !== 1)) return null;
    const out = copyKeys(keys);
    const old = out[action][slot];
    if (old === code) return out;
    for (const a of ACTIONS) for (let s = 0; s < 2; s++) if (out[a][s] === code) out[a][s] = old;
    out[action][slot] = code;
    return out;
  }

  // ------------------------------------------------------------------------------------------
  // Screens and rows
  // ------------------------------------------------------------------------------------------
  const settings = (env) => (env && env.save && env.save.settings) || {};
  const reachOf = (env) => (env && env.save && typeof env.save.reach === 'string' ? env.save.reach : '1-1');

  const FEEL = { modern: 'MODERN', nes: 'NES ACCURATE' };
  const ROWS = {
    feel: { label: 'FEEL', key: 'feel', values: ['modern', 'nes'], show: (v) => FEEL[v] || 'MODERN', say: (v) => (v === 'nes' ? 'NES accurate' : 'modern') },
    crt: { label: 'DISPLAY', key: 'crt', values: ['on', 'off'], show: (v) => (v === 'off' ? 'CLEAN' : 'CRT'), say: (v) => (v === 'off' ? 'clean' : 'CRT') },
    vol: { label: 'VOLUME', key: 'vol', range: [0, 10], show: (v) => '< ' + v + ' >', say: (v) => String(v) },
    input: { label: 'INPUT DISPLAY', key: 'input', values: [false, true], show: (v) => (v ? 'ON' : 'OFF'), say: (v) => (v ? 'on' : 'off') },
    flash: { label: 'FLASHING', key: 'flash', values: ['full', 'reduced'], show: (v) => (v === 'reduced' ? 'REDUCED' : 'FULL'), say: (v) => (v === 'reduced' ? 'reduced' : 'full') },
    controls: { label: 'CONTROLS', go: 'controls' },
    erase: { label: 'ERASE SAVE', go: 'erase' },
    back: { label: 'BACK', back: true },
  };
  const OPTIONS_TITLE = ['feel', 'crt', 'vol', 'input', 'flash', 'controls', 'erase', 'back'];
  const OPTIONS_PAUSE = ['crt', 'vol', 'input', 'flash', 'controls', 'back'];
  const CONTROL_ROWS = ACTIONS.concat(['reset', 'back']);
  const ACTION_LABEL = { UP: 'UP', DOWN: 'DOWN', LEFT: 'LEFT', RIGHT: 'RIGHT', A: 'A (JUMP)', B: 'B (RUN/THROW)', START: 'START', SELECT: 'SELECT' };

  // the rows of a screen: { id, label, disabled, value?, say }
  function items(state, env) {
    const st = settings(env);
    switch (state.screen) {
      case 'title': {
        const reach = reachOf(env);
        const off = reach === '1-1';
        return [
          { id: 'new', label: 'NEW QUEST', say: 'New quest' },
          { id: 'continue', label: off ? 'CONTINUE' : 'CONTINUE ' + reach, disabled: off, say: 'Continue, world ' + reach },
          { id: 'options', label: 'OPTIONS', say: 'Options' },
        ];
      }
      case 'options':
        return (state.from === 'pause' ? OPTIONS_PAUSE : OPTIONS_TITLE).map((id) => {
          const r = ROWS[id];
          const it = { id, label: r.label, say: r.label.charAt(0) + r.label.slice(1).toLowerCase() };
          if (r.key) {
            it.value = st[r.key];
            it.say += ', ' + r.say(st[r.key]);
          }
          return it;
        });
      case 'controls':
        return CONTROL_ROWS.map((id) => {
          if (id === 'reset') return { id, label: 'RESET DEFAULTS', say: 'Reset defaults' };
          if (id === 'back') return { id, label: 'BACK', say: 'Back' };
          const keys = (st.keys && st.keys[id]) || DEFAULT_KEYS[id];
          return { id, label: ACTION_LABEL[id], keys, say: ACTION_LABEL[id].replace(/[()]/g, '').toLowerCase() + ', ' + keyLabel(keys[0]) + ' or ' + keyLabel(keys[1]) };
        });
      case 'erase':
        return [{ id: 'no', label: 'NO', say: 'No' }, { id: 'yes', label: 'YES', say: 'Yes, erase' }];
      case 'pause':
        return [{ id: 'resume', label: 'RESUME', say: 'Resume' }, { id: 'options', label: 'OPTIONS', say: 'Options' }, { id: 'quit', label: 'QUIT', say: 'Quit' }];
      case 'quit':
        return [{ id: 'no', label: 'NO', say: 'No' }, { id: 'yes', label: 'YES', say: 'Yes, quit' }];
    }
    return [];
  }

  function firstEnabled(list, from) {
    for (let i = 0; i < list.length; i++) {
      const k = (from + i) % list.length;
      if (!list[k].disabled) return k;
    }
    return 0;
  }
  // a new state on `screen` with the cursor on row `sel` (moved on past a disabled row)
  function on(screen, sel, extra, env) {
    const s = Object.assign({ screen, sel: 0, idle: 0, from: 'title', slot: 0, bind: null, note: null }, extra || {});
    s.screen = screen;
    const list = items(s, env);
    s.sel = firstEnabled(list, Math.max(0, Math.min(list.length - 1, sel | 0)));
    return s;
  }

  function init(screen, env) {
    if (screen === 'options' || screen === 'controls') return on(screen, 0, { from: env && env.fromPause ? 'pause' : 'title' }, env);
    return on(screen || 'title', 0, { from: screen === 'pause' || screen === 'quit' || (env && env.fromPause) ? 'pause' : 'title' }, env);
  }

  // move the cursor by d rows, skipping disabled rows, wrapping
  function move(list, sel, d) {
    const n = list.length;
    for (let i = 1; i <= n; i++) {
      const k = (((sel + d * i) % n) + n) % n;
      if (!list[k].disabled) return k;
    }
    return sel;
  }

  // a settings row's next value (dir -1 or +1), or undefined when it cannot move
  function nextValue(row, cur, dir) {
    if (row.range) {
      const v = Math.max(row.range[0], Math.min(row.range[1], (Number(cur) | 0) + dir));
      return v === cur ? undefined : v;
    }
    const i = Math.max(0, row.values.indexOf(cur));
    return row.values[(i + (dir > 0 ? 1 : row.values.length - 1)) % row.values.length];
  }

  const R = (state, action, sound) => ({ state, action: action || null, sound: sound || null });

  function step(state, pressed, env) {
    pressed = pressed | 0;
    let s = Object.assign({}, state);
    if (s.note) s.note = s.note.t > 1 ? { text: s.note.text, t: s.note.t - 1 } : null;
    const list = items(s, env);

    // CONTROLS while binding: only time passes here (the key arrives through key()); a pad's B cancels
    if (s.bind) {
      if (pressed & B.B) return R(Object.assign(s, { bind: null }), null, 'back');
      const t = s.bind.t + 1;
      if (t >= REMAP_TIMEOUT) return R(Object.assign(s, { bind: null, note: { text: 'NO KEY PRESSED', t: NOTE_FRAMES } }), null, 'back');
      s.bind = { action: s.bind.action, slot: s.bind.slot, t };
      return R(s);
    }

    if (s.screen === 'title') {
      if (pressed) s.idle = 0;
      else if (++s.idle >= IDLE) {
        s.idle = 0;
        return R(s, { type: 'demo' });
      }
    }

    // the pause screen: START resumes whatever the cursor is on
    if (s.screen === 'pause' && pressed & B.START) return R(s, { type: 'resume' }, 'select');

    if (pressed & (B.UP | B.DOWN | B.SELECT)) {
      const d = pressed & B.UP && !(pressed & (B.DOWN | B.SELECT)) ? -1 : 1;
      const k = move(list, s.sel, d);
      if (k === s.sel) return R(s);
      s.sel = k;
      if (s.screen === 'controls') s.slot = Math.min(s.slot, 1);
      return R(s, null, 'cursor');
    }

    const row = list[s.sel] || {};
    if (pressed & (B.LEFT | B.RIGHT)) {
      const dir = pressed & B.LEFT ? -1 : 1;
      if (s.screen === 'options' && ROWS[row.id] && ROWS[row.id].key) {
        const r = ROWS[row.id];
        const v = nextValue(r, settings(env)[r.key], dir);
        if (v === undefined) return R(s);
        return R(s, { type: 'set', key: r.key, value: v }, 'cursor');
      }
      if (s.screen === 'controls' && ACTIONS.indexOf(row.id) >= 0) {
        const slot = dir < 0 ? 0 : 1;
        if (slot === s.slot) return R(s);
        s.slot = slot;
        return R(s, null, 'cursor');
      }
      if (s.screen === 'erase' || s.screen === 'quit') {
        s.sel = s.sel ? 0 : 1;
        return R(s, null, 'cursor');
      }
      return R(s);
    }

    if (pressed & B.B) return back(s, env);

    if (pressed & (B.A | B.START)) {
      if (row.disabled) return R(s);
      switch (s.screen) {
        case 'title':
          if (row.id === 'new') return R(s, { type: 'new' }, 'select');
          if (row.id === 'continue') return R(s, { type: 'continue', level: reachOf(env) }, 'select');
          if (row.id === 'options') return R(on('options', 0, { from: 'title' }, env), null, 'select');
          break;
        case 'options': {
          const r = ROWS[row.id];
          if (r.key) {
            const cur = settings(env)[r.key];
            // A on a value steps it forward; VOLUME wraps to 0 after 10
            const v = r.range ? ((Number(cur) | 0) >= r.range[1] ? r.range[0] : (Number(cur) | 0) + 1) : nextValue(r, cur, 1);
            return R(s, { type: 'set', key: r.key, value: v }, 'select');
          }
          if (r.go === 'controls') return R(on('controls', 0, { from: s.from }, env), null, 'select');
          if (r.go === 'erase') return R(on('erase', 0, { from: s.from }, env), null, 'select');
          if (r.back) return back(s, env);
          break;
        }
        case 'controls':
          if (row.id === 'reset') return R(s, { type: 'set', key: 'keys', value: copyKeys(DEFAULT_KEYS) }, 'select');
          if (row.id === 'back') return back(s, env);
          s.bind = { action: row.id, slot: s.slot, t: 0 };
          s.note = null;
          return R(s, { type: 'bind', action: row.id, slot: s.slot }, 'select');
        case 'erase':
          if (row.id === 'yes') return R(on('options', OPTIONS_TITLE.indexOf('erase'), { from: s.from }, env), { type: 'erase' }, 'select');
          return back(s, env);
        case 'pause':
          if (row.id === 'resume') return R(s, { type: 'resume' }, 'select');
          if (row.id === 'options') return R(on('options', 0, { from: 'pause' }, env), null, 'select');
          if (row.id === 'quit') return R(on('quit', 0, { from: 'pause' }, env), null, 'select');
          break;
        case 'quit':
          if (row.id === 'yes') return R(s, { type: 'quit' }, 'select');
          return back(s, env);
      }
    }
    return R(s);
  }

  // B (or BACK): up one screen; the pause screen's B resumes
  function back(s, env) {
    switch (s.screen) {
      case 'options':
        return s.from === 'pause'
          ? R(on('pause', 1, { from: 'pause' }, env), null, 'back')
          : R(on('title', 2, { from: 'title' }, env), null, 'back');
      case 'controls':
        return R(on('options', (s.from === 'pause' ? OPTIONS_PAUSE : OPTIONS_TITLE).indexOf('controls'), { from: s.from }, env), null, 'back');
      case 'erase':
        return R(on('options', OPTIONS_TITLE.indexOf('erase'), { from: s.from }, env), null, 'back');
      case 'quit':
        return R(on('pause', 2, { from: 'pause' }, env), null, 'back');
      case 'pause':
        return R(s, { type: 'resume' }, 'back');
    }
    return R(s);
  }

  // A raw key while binding: Escape cancels, a fixed or modifier key is refused (the binding waits on),
  // anything else is bound with swap-on-rebind and saved through { type: 'set', key: 'keys' }.
  function key(state, code, env) {
    const s = Object.assign({}, state);
    if (!s.bind) return R(s);
    if (code === 'Escape') return R(Object.assign(s, { bind: null }), null, 'back');
    const cur = (settings(env).keys) || DEFAULT_KEYS;
    const keys = rebind(cur, s.bind.action, s.bind.slot, code);
    if (!keys) {
      const text = FIXED.has(code) ? keyLabel(code) + ' IS RESERVED' : 'USE ANOTHER KEY';
      return R(Object.assign(s, { note: { text, t: NOTE_FRAMES } }), null, 'back');
    }
    return R(Object.assign(s, { bind: null, note: null }), { type: 'set', key: 'keys', value: keys }, 'select');
  }

  // ------------------------------------------------------------------------------------------
  // Painters (native buffer, NES colours only, cached per content through CQ.layer)
  // ------------------------------------------------------------------------------------------
  let L = null;
  let N = null;
  function libs() {
    if (!L) {
      L = FILM.lib;
      N = L.NES;
    }
  }
  const pad6 = (n) => String(Math.max(0, Math.floor(Number(n) || 0))).padStart(6, '0');
  // the font has no brackets on older libs: 'A (JUMP)' reads 'A - JUMP' there
  const txt = (s) => (L.FONT['('] && L.FONT[')'] ? s : s.replace(/ \(([^)]*)\)/, ' - $1'));

  function panel(g, x0, y0, x1, y1) {
    g.fillStyle = N[0x26];
    g.fillRect(x0, y0, x1 - x0, y1 - y0);
    g.fillStyle = N[0x0f];
    g.fillRect(x0 + 2, y0 + 2, x1 - x0 - 4, y1 - y0 - 4);
  }
  function tokenRow(g, bits, y) {
    for (let i = 0; i < 3; i++) L.pxtext(g, '✻', 160 - 20 + 16 * i, y, { color: (bits >> i) & 1 ? N[0x26] : N[0x00] });
  }

  function drawTitle(g, state, snap, save) {
    const env = { save };
    const list = items(state, env);
    const hi = Math.max(Number(save && save.hi) || 0, Number(snap && snap.top) || 0);
    const key = 'title|' + state.sel + '|' + list[1].label + '|' + (list[1].disabled ? 1 : 0) + '|' + hi;
    CQ.layer(g, 'm-title', key, 180, (c) => {
      const Y = [94, 106, 118];
      for (let i = 0; i < list.length; i++) {
        L.pxtext(c, list[i].label, 124, Y[i], { color: list[i].disabled ? N[0x00] : N[0x30], shadow: N[0x0f] });
      }
      L.pxtext(c, '▶', 110, Y[state.sel] || 94, { color: N[0x26], shadow: N[0x0f] });
      // the hi-score sits on 1-1's light green bush: a full $0F outline, not only the drop shadow
      const hs = 'HI-SCORE ' + pad6(hi);
      for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) L.pxtext(c, hs, 160 + dx, 136 + dy, { color: N[0x0f], align: 'center' });
      L.pxtext(c, hs, 160, 136, { color: N[0x30], align: 'center', shadow: N[0x0f] });
    });
  }

  function drawOptions(g, state, save, x) {
    const env = { save };
    const list = items(state, env);
    const off = !!(x && x.saveOff);
    const key = 'options|' + state.from + '|' + state.sel + '|' + list.map((r) => String(r.value)).join(',') + '|' + off;
    CQ.layer(g, 'm-options', key, 180, (c) => {
      c.fillStyle = N[0x0f];
      c.fillRect(0, 0, 320, 180);
      L.pxtext(c, 'OPTIONS', 160, 24, { color: N[0x26], align: 'center' });
      list.forEach((r, i) => {
        const y = 44 + 12 * i;
        L.pxtext(c, r.label, 40, y, { color: N[0x30] });
        const row = ROWS[r.id];
        if (row && row.key) L.pxtext(c, row.show(r.value), 192, y, { color: i === state.sel ? N[0x26] : N[0x30] });
      });
      L.pxtext(c, '▶', 28, 44 + 12 * state.sel, { color: N[0x26] });
      if (off) L.pxtext(c, 'SAVE OFF', 296, 24, { color: N[0x16], align: 'right' });
      L.pxtext(c, 'A SELECT  B BACK', 160, 164, { color: N[0x10], align: 'center' });
    });
  }

  function drawControls(g, state, save) {
    const env = { save };
    const list = items(state, env);
    const bind = state.bind;
    // the waiting slot blinks (32 on, 16 off) on the binding's own step count
    const blink = bind ? (bind.t % 48 < 32 ? 1 : 0) : 0;
    const note = state.note ? state.note.text : '';
    const key = 'controls|' + state.sel + '|' + state.slot + '|' + (bind ? bind.action + bind.slot + blink : '-') + '|' + note + '|' +
      list.map((r) => (r.keys ? r.keys.join('+') : r.id)).join(',');
    CQ.layer(g, 'm-controls', key, 180, (c) => {
      c.fillStyle = N[0x0f];
      c.fillRect(0, 0, 320, 180);
      L.pxtext(c, 'CONTROLS', 160, 20, { color: N[0x26], align: 'center' });
      L.pxtext(c, 'KEY 1', 160, 32, { color: N[0x10] });
      L.pxtext(c, 'KEY 2', 232, 32, { color: N[0x10] });
      list.forEach((r, i) => {
        const y = 44 + 11 * i;
        L.pxtext(c, txt(r.label), 40, y, { color: N[0x30] });
        if (r.keys) {
          for (let k = 0; k < 2; k++) {
            const x0 = 160 + 72 * k;
            const here = i === state.sel && k === state.slot;
            if (bind && here) {
              if (blink) L.pxtext(c, '?', x0, y, { color: N[0x26] });
            } else L.pxtext(c, keyLabel(r.keys[k]), x0, y, { color: here ? N[0x26] : N[0x30] });
            if (here) {
              c.fillStyle = N[0x26];
              c.fillRect(x0, y + 8, 47, 1);
            }
          }
        }
      });
      L.pxtext(c, '▶', 28, 44 + 11 * state.sel, { color: N[0x26] });
      let help = '< > KEY  A SET  B BACK';
      let color = N[0x10];
      if (bind) {
        help = 'PRESS A KEY  ESC CANCELS';
        color = N[0x30];
      } else if (note) {
        help = note;
        color = N[0x16];
      }
      L.pxtext(c, help, 160, 164, { color, align: 'center' });
    });
  }

  function drawConfirm(g, id, question, state) {
    CQ.layer(g, id, question + '|' + state.sel, 180, (c) => {
      panel(c, 80, 52, 240, 148);
      L.pxtext(c, question, 160, 76, { color: N[0x30], align: 'center' });
      L.pxtext(c, 'NO', 152, 104, { color: N[0x30] });
      L.pxtext(c, 'YES', 152, 116, { color: N[0x30] });
      L.pxtext(c, '▶', 138, state.sel ? 116 : 104, { color: N[0x26] });
    });
  }

  function drawPause(g, state, snap) {
    const name = (snap && snap.name) || '';
    const bits = (snap && snap.tokens) | 0;
    const world = (snap && snap.world) || '';
    CQ.layer(g, 'm-pause', 'pause|' + state.sel + '|' + name + '|' + bits + '|' + world, 180, (c) => {
      panel(c, 80, 52, 240, 148);
      L.pxtext(c, 'PAUSED', 160, 60, { color: N[0x30], align: 'center' });
      L.pxtext(c, (world ? world + ' ' : '') + name, 160, 74, { color: N[0x10], align: 'center' });
      tokenRow(c, bits, 88);
      const Y = [104, 116, 128];
      ['RESUME', 'OPTIONS', 'QUIT'].forEach((t, i) => L.pxtext(c, t, 120, Y[i], { color: N[0x30] }));
      L.pxtext(c, '▶', 106, Y[state.sel] || 104, { color: N[0x26] });
    });
  }

  // x: { saveOff } (the shell's storage state)
  function draw(g, state, snap, save, x) {
    libs();
    if (!state) return;
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.imageSmoothingEnabled = false;
    g.globalAlpha = 1;
    switch (state.screen) {
      case 'title':
        drawTitle(g, state, snap, save);
        break;
      case 'options':
        drawOptions(g, state, save, x);
        break;
      case 'controls':
        drawControls(g, state, save);
        break;
      case 'erase':
        // the confirm stands alone on the options screen's black, so the options cursor and the
        // labels the panel would clip never show beside it
        CQ.layer(g, 'm-options', 'erase', 180, (c) => {
          c.fillStyle = N[0x0f];
          c.fillRect(0, 0, 320, 180);
          L.pxtext(c, 'OPTIONS', 160, 24, { color: N[0x26], align: 'center' });
        });
        drawConfirm(g, 'm-erase', 'ERASE SAVE?', state);
        break;
      case 'pause':
        drawPause(g, state, snap);
        break;
      case 'quit':
        drawConfirm(g, 'm-quit', 'QUIT?', state);
        break;
    }
    g.restore();
  }

  // the attract demo's caption: DEMO centred at y 40, 32 frames on and 32 off, white on a black shadow
  function drawDemo(g, t) {
    libs();
    if ((t | 0) % 64 >= 32) return;
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    CQ.layer(g, 'm-demo', 'demo', 56, (c) => L.pxtext(c, 'DEMO', 160, 40, { color: N[0x30], align: 'center', shadow: N[0x0f] }));
    g.restore();
  }

  CQ.menu = Object.freeze({
    IDLE,
    REMAP_TIMEOUT,
    ACTIONS,
    DEFAULT_KEYS,
    FIXED: Object.freeze(Array.from(FIXED)),
    init,
    step,
    key,
    items,
    draw,
    drawDemo,
    rebind,
    bindable,
    keyLabel,
  });
})();

/*

 * 1920x1080 output, 60 fps (the console's refresh). The game draws a native 320x180 frame
 * (FILM.native()), src/crt.js presents it. Owner: game (keep `duration` equal to the simulation's
 * length in frames / 60 — tools/check.cjs verifies it). Beat and song frames: docs/story.md.
 *
 * crt: TV power windows in GLOBAL FRAMES. powerOn [f0, f1]: the set is off at f0 and the picture has
 * settled by f1. powerOff [f0, f1]: the picture collapses from f0 and is a dark screen by f1. After
 * powerOff ends the screen stays dark to the last frame (150 frames, for the closing caption on the
 * dark glass), so the loop restarts on a dark set. The ending song starts at frame 3101 (the first
 * ending text); the power-off starts 256 frames later.
 */
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});
  const FRAMES = 3627;
  FILM.TIMELINE = {
    title: 'claude-quest',

    duration: FRAMES / 60,
    fps: 60,
    width: 1920,
    height: 1080,
    crt: { powerOn: [0, 120], powerOff: [3357, 3477] },
    shots: [
      { id: 'game', file: '01-game.js', start: 0, end: FRAMES / 60, mode: 'none', title: 'Claude Quest',
        brief: 'The TV powers on, the cartridge plays: title, lives screen, World 1-1, the castle, the rescue; the TV powers off.' },
    ],

})();

<script>
// ---- src/music.js
// music.js : the sound of CLAUDE QUEST (1986), a sound driver and an emulated NES 2A03 APU.
// Owner: audio. Contract: docs/v2-architecture.md sections 4.2 and 4.4; design notes: docs/sound.md.
//
// FILM.audio.render(ctx, { start = 0, dest = ctx.destination }) plays the whole film, music, effects and
// the TV foley, from global time `start` into any BaseAudioContext.
// FILM.audio.live(audioCtx, { dest }) runs the same driver and chip in real time for the playable mode.
//
// The sound is made the way a 1986 cartridge made it:
//   1 the driver   runs once per 60 Hz frame. It reads the frame's game events (FILM.game.events(): a
//                  `song` event starts a song, every other event starts a sound effect), advances the
//                  song sequencer one tick, lets an effect take over its channel for its length (the
//                  song's voice there keeps time silently and resumes on the frame the effect ends), and
//                  writes the result as APU register writes ($4000-$4017), keeping a shadow of the pulse
//                  high bytes so $4003/$4007 are only rewritten on a new note (no phase-reset clicks).
//   2 the APU      emulates the chip from those writes: two pulses (duty sequencer, envelope, sweep unit
//                  with its muting quirk, length counter), the triangle (linear counter, 32 steps), the
//                  noise LFSR (long and short mode, NTSC periods), and the DMC (1-bit delta playback of
//                  sample bytes from $C000 at the 16 NTSC rates). The drum samples are synthesised and
//                  delta-encoded below, the way a composer's tool would have packed them into the ROM.
//                  The channels are integrated exactly at 4x the output rate, mixed by the console's
//                  non-linear DAC formulas, filtered like the console output (high-pass 90 Hz and 440 Hz,
//                  low-pass 14 kHz) and decimated by a zero-phase windowed sinc.
//   3 the TV       src/foley.js (FILM.foley) turns the TV's speaker on and off with the picture and adds
//                  the set's own sounds (switch, degauss, static, flyback whine). The only non-NES sound.
//
// The game (docs/game-spec.md section 10) adds, live only: the songs death, gameover, sky, boss and hurry;
// fast(id), the hurry-up variant of a level song at speed minus 1 (overworldFast, undergroundFast,
// skyFast, castleFast, bossFast); its effects (pause, unpause, hurt, checkpoint, token, throw, zap, poof,
// bosshit, bossdefeat, spit, ember, spring, crumble and the menu's cursor, select, continue, back); and
// the driver pause: a `pause` event holds the song's frame and silences it while effects play on, and
// `unpause` resumes the same frame. The film emits none of these, so its soundtrack is byte-identical.
//
// No reverb, delay, compressor or panning: the buffer is the chip times one flat gain (measured to
// -14 LUFS, true peak under -1 dBTP), mono in both channels. Deterministic: the only randomness is
// FILM.lib.rng with fixed seeds. The buffer is always computed from frame 0, so any `start` hears the
// same samples at the same global times.
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const FILM = root.FILM;
  const lib = FILM.lib;
  const TAU = Math.PI * 2;

  // ---------------------------------------------------------------- hardware constants
  const CPU = 1789773; // NTSC 2A03 clock, Hz
  const FPS = 60; // driver frames per second (the film's frame rate)
  const SUB = 4; // integration sub-samples per output sample
  const HALF = 23; // decimation filter half length, in sub-samples
  const GAIN = 2.87; // flat master gain, set by measurement (tools/audio/loudness.cjs): -14 LUFS
  const DUTY = [
    [0, 1, 0, 0, 0, 0, 0, 0], // 12.5 %
    [0, 1, 1, 0, 0, 0, 0, 0], // 25 %
    [0, 1, 1, 1, 1, 0, 0, 0], // 50 %
    [1, 0, 0, 1, 1, 1, 1, 1], // 25 % negated
  ];
  const TRI = [];
  for (let i = 15; i >= 0; i--) TRI.push(i);
  for (let i = 0; i <= 15; i++) TRI.push(i);
  const NOISE = [4, 8, 16, 32, 64, 96, 128, 160, 202, 254, 380, 508, 762, 1016, 2034, 4068];
  const DMC_RATE = [428, 380, 340, 320, 286, 254, 226, 214, 190, 160, 142, 128, 106, 84, 72, 54];
  const LENGTH = [10, 254, 20, 2, 40, 4, 80, 6, 160, 8, 60, 10, 14, 12, 26, 14, 12, 16, 24, 18, 48, 20, 96, 22, 192, 24, 72, 26, 16, 28, 32, 30];
  const DMC_LEVEL0 = 40; // $4011 as the game's reset code left it, long before the TV came on

  // ---------------------------------------------------------------- pitch
  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function midi(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(n);
    if (!m) throw new Error('music.js: bad note ' + n);
    return 12 * (Number(m[3]) + 1) + SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  }
  const mhz = (m) => 440 * Math.pow(2, (midi(m) - 69) / 12);
  const clampT = (t) => Math.max(0, Math.min(2047, t));
  const ptimer = (hz) => clampT(Math.round(CPU / (16 * hz) - 1)); // pulse: f = CPU / (16 (t + 1))
  const ttimer = (hz) => clampT(Math.round(CPU / (32 * hz) - 1)); // triangle: f = CPU / (32 (t + 1))

  // ---------------------------------------------------------------- DMC samples (the ROM at $C000)
  // Each drum is synthesised at its playback rate and delta-encoded greedily (a 1 bit steps the 7-bit DAC
  // up by 2, a 0 steps it down by 2). Every sample holds as many 1s as 0s, so it returns the DAC to the
  // level it started from and the drums never drift the channel's DC level.
  const DMC_MEM = new Uint8Array(0x4000);
  const DMC = {}; // name -> { a: $4012 value, l: $4013 value, bytes }
  const dmcHz = (rate) => CPU / DMC_RATE[rate];
  function dmcEncode(wave) {
    const L0 = DMC_LEVEL0;
    const need = wave.length + 64; // the wave, then at least 64 bits to settle home
    const nBytes = Math.ceil((need / 8 - 1) / 16) * 16 + 1; // lengths are 16 n + 1 bytes
    const bits = nBytes * 8;
    const out = new Uint8Array(nBytes);
    let level = L0;
    for (let i = 0; i < bits; i++) {
      let bit;
      if (i < wave.length) {
        const target = L0 + wave[i];
        bit = level < target ? 1 : level > target ? 0 : i & 1;
      } else {
        const off = level - L0; // settle: walk home, then hover up-down so the last bit lands on L0
        bit = off < 0 ? 1 : off > 0 ? 0 : 1;
      }
      if (!bit && level < 2) bit = 1; // never ask for a step the DAC would clamp: the 1s and 0s stay paired
      else if (bit && level > 125) bit = 0;
      if (bit) {
        if (level <= 125) level += 2;
        out[i >> 3] |= 1 << (i & 7); // bits play LSB first
      } else if (level >= 2) level -= 2;
    }
    if (level !== L0) throw new Error('music.js: DMC sample does not return to its level');
    return out;
  }
  function dmcSynth(rate, seconds, fn) {
    const sr = dmcHz(rate);
    const n = Math.round(seconds * sr);
    const w = new Float64Array(n);
    let ph = 0;
    for (let i = 0; i < n; i++) {
      const t = i / sr;
      const r = fn(t, ph);
      w[i] = r.x;
      ph += (TAU * (r.hz || 0)) / sr;
    }
    return w;
  }
  (function buildDmc() {
    const noise = lib.rng('claude-quest-dmc');
    const kick = dmcSynth(15, 0.11, (t, ph) => {
      const env = t < 0.0008 ? t / 0.0008 : Math.exp(-(t - 0.0008) / 0.042);
      const click = t < 0.002 ? (noise() * 2 - 1) * 12 * (1 - t / 0.002) : 0;
      return { x: 28 * env * Math.sin(ph) + click, hz: 46 + 170 * Math.exp(-t / 0.016) };
    });
    const snare = dmcSynth(15, 0.13, (t, ph) => {
      const tone = 9 * Math.exp(-t / 0.028) * (Math.sin(ph) + 0.6 * Math.sin(ph * 1.78));
      const hiss = 17 * Math.exp(-t / 0.045) * (noise() * 2 - 1);
      return { x: tone + hiss, hz: 188 };
    });
    // Timpani: a membrane's inharmonic partials under a felt mallet. Tuned so rate 15 plays the root and
    // rate 14 (0.75x) the fifth below it: a tonic-dominant pair from one sample, as real carts did.
    const timp = (root) =>
      dmcSynth(15, 0.36, (t, ph) => {
        const env = t < 0.004 ? t / 0.004 : 1;
        const x = Math.sin(ph) * Math.exp(-t / 0.3) + 0.45 * Math.sin(ph * 1.5 + 0.3) * Math.exp(-t / 0.16) + 0.22 * Math.sin(ph * 1.98 + 1.1) * Math.exp(-t / 0.09);
        const mallet = t < 0.005 ? (noise() * 2 - 1) * 8 * (1 - t / 0.005) : 0;
        return { x: 24 * env * x + mallet, hz: root };
      });
    let addr = 0;
    for (const [name, wave] of [['kick', kick], ['snare', snare], ['timpD', timp(mhz('D3'))], ['timpC', timp(mhz('C3'))]]) {
      const bytes = dmcEncode(wave);
      DMC_MEM.set(bytes, addr);
      DMC[name] = { a: addr >> 6, l: (bytes.length - 1) >> 4, bytes: bytes.length };
      addr = Math.ceil((addr + bytes.length) / 64) * 64;
    }
    DMC.romBytes = addr;
  })();

  // ---------------------------------------------------------------- the APU
  // A register-level 2A03 sound unit. write(addr, value) as the CPU would; quarter(q) is the frame
  // counter's quarter-frame clock (4-step mode); fill(ring, s0, n) integrates n sub-samples.
  function makeApu(sr) {
    const RS = sr * SUB;
    const cps = CPU / RS; // CPU cycles per sub-sample
    const pulse = (i) => ({ i, duty: 0, halt: false, cv: true, vol: 0, envStart: false, envDiv: 0, decay: 0, swEn: false, swP: 0, swN: false, swS: 0, swDiv: 0, swReload: false, t: 0, per: 2, cnt: 2, pos: 0, len: 0, on: false, mute: true });
    const P = [pulse(0), pulse(1)];
    const T = { ctrl: false, linR: 0, lin: 0, linFlag: false, t: 0, cnt: 1, pos: 0, len: 0, on: false };
    const N = { halt: false, cv: true, vol: 0, envStart: false, envDiv: 0, decay: 0, mode: 0, per: 4, cnt: 4, lfsr: 1, len: 0, on: false };
    const D = { loop: false, rate: DMC_RATE[0], cnt: DMC_RATE[0], level: DMC_LEVEL0, addr: 0xc000, length: 1, cur: 0xc000, left: 0, buf: -1, shift: 0, bits: 8, silent: true, on: false };

    const target = (c) => {
      const ch = c.t >> c.swS;
      return c.swN ? c.t - ch - (c.i === 0 ? 1 : 0) : c.t + ch;
    };
    const remute = (c) => {
      c.mute = c.t < 8 || (!c.swN && target(c) > 0x7ff);
      c.per = 2 * (c.t + 1);
    };
    function dmcFetch() {
      if (D.buf < 0 && D.left > 0) {
        D.buf = DMC_MEM[D.cur - 0xc000];
        D.cur = D.cur === 0xffff ? 0x8000 : D.cur + 1;
        D.left--;
        if (D.left === 0 && D.loop) {
          D.cur = D.addr;
          D.left = D.length;
        }
      }
    }
    function write(a, v) {
      if (a < 0x4008) {
        const c = P[(a - 0x4000) >> 2];
        switch (a & 3) {
          case 0:
            c.duty = v >> 6;
            c.halt = !!(v & 0x20);
            c.cv = !!(v & 0x10);
            c.vol = v & 15;
            break;
          case 1:
            c.swEn = !!(v & 0x80);
            c.swP = (v >> 4) & 7;
            c.swN = !!(v & 8);
            c.swS = v & 7;
            c.swReload = true;
            remute(c);
            break;
          case 2:
            c.t = (c.t & 0x700) | v;
            remute(c);
            break;
          default:
            c.t = (c.t & 0xff) | ((v & 7) << 8);
            if (c.on) c.len = LENGTH[v >> 3];
            c.pos = 0; // $4003 restarts the duty sequencer: the phase reset drivers avoid mid-note
            c.envStart = true;
            remute(c);
        }
        return;
      }
      switch (a) {
        case 0x4008:
          T.ctrl = !!(v & 0x80);
          T.linR = v & 0x7f;
          break;
        case 0x400a:
          T.t = (T.t & 0x700) | v;
          break;
        case 0x400b:
          T.t = (T.t & 0xff) | ((v & 7) << 8);
          if (T.on) T.len = LENGTH[v >> 3];
          T.linFlag = true;
          break;
        case 0x400c:
          N.halt = !!(v & 0x20);
          N.cv = !!(v & 0x10);
          N.vol = v & 15;
          break;
        case 0x400e:
          N.mode = v >> 7;
          N.per = NOISE[v & 15];
          break;
        case 0x400f:
          if (N.on) N.len = LENGTH[v >> 3];
          N.envStart = true;
          break;
        case 0x4010:
          D.loop = !!(v & 0x40);
          D.rate = DMC_RATE[v & 15];
          break;
        case 0x4011:
          D.level = v & 0x7f;
          break;
        case 0x4012:
          D.addr = 0xc000 + v * 64;
          break;
        case 0x4013:
          D.length = v * 16 + 1;
          break;
        case 0x4015:
          P[0].on = !!(v & 1);
          P[1].on = !!(v & 2);
          T.on = !!(v & 4);
          N.on = !!(v & 8);
          if (!P[0].on) P[0].len = 0;
          if (!P[1].on) P[1].len = 0;
          if (!T.on) T.len = 0;
          if (!N.on) N.len = 0;
          if (v & 0x10) {
            if (D.left === 0) {
              D.cur = D.addr;
              D.left = D.length;
            }
            dmcFetch();
          } else D.left = 0;
          break;
        default:
      }
    }
    function env(c) {
      if (c.envStart) {
        c.envStart = false;
        c.decay = 15;
        c.envDiv = c.vol;
      } else if (c.envDiv === 0) {
        c.envDiv = c.vol;
        if (c.decay > 0) c.decay--;
        else if (c.halt) c.decay = 15;
      } else c.envDiv--;
    }
    function quarter(q) {
      env(P[0]);
      env(P[1]);
      env(N);
      if (T.linFlag) T.lin = T.linR;
      else if (T.lin > 0) T.lin--;
      if (!T.ctrl) T.linFlag = false;
      if (q & 1) {
        for (const c of P) {
          if (c.len > 0 && !c.halt) c.len--;
          if (c.swDiv === 0 && c.swEn && c.swS > 0 && !c.mute) {
            c.t = Math.max(0, target(c));
