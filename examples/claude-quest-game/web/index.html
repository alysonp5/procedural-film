  // Snapshot: the compact per-frame record the draw pass paints
  // ------------------------------------------------------------------------------------------
  // spr is a flat Int16Array of [name, x, y, flags, pal] in world px. flags: 1 flip, 2 flip vertical,
  // 4 behind the tiles, 8 hidden-by-castle layer (drawn before the castle). name >= 1000 is a score
  // pop (CQ.POPS[name - 1000]). pal: 0 normal, 1.. the star cycle.
  const NAMES = [];
  const NI = new Map();
  function ni(name) {
    let i = NI.get(name);
    if (i === undefined) {
      i = NAMES.length;
      NAMES.push(name);
      NI.set(name, i);
    }
    return i;
  }
  CQ.NAMES = NAMES;
  CQ.ni = ni;

  // C (the multi-coin brick) draws as its kind's brick; the sky kind is the game's (docs/game-spec.md 9.2)
  const TILE_NAMES = {
    over: { '#': 't_ground', B: 't_brick', U: 't_used', X: 't_stair', C: 't_brick' },
    under: { '#': 't_groundU', G: 't_groundU', B: 't_brickU', W: 't_brickU', U: 't_used', X: 't_stair', C: 't_brickU' },
    castle: { '#': 't_groundC', f: 't_groundC', w: 't_brickC', U: 't_used', X: 't_groundC', '=': 't_bridge', B: 't_brickC', C: 't_brickC' },
    sky: { '#': 't_cloudTop', B: 't_brick', C: 't_brick', U: 't_used', X: 't_stair', T: 't_rackTop', R: 't_rack' },
  };
  CQ.TILE_NAMES = TILE_NAMES;
  const MODE_CODE = { title: 0, title2: 0, lives: 1, play: 2, gameover: 3, pause: 4, continue: 5, clear: 6, credits: 7 };
  CQ.MODE_CODE = MODE_CODE;

  // Sprite entries anchor at the feet so any drawing size stands right: flag 32 means x is the body
  // centre and y the feet; 64 means x is where the drawing's right edge meets (the flagpole), 128 its
  // left edge. The draw pass reads each drawing's size from FILM.SPRITE_MANIFEST.
  const ANCHOR_FEET = 32, ANCHOR_RIGHT = 64, ANCHOR_LEFT = 128;
  CQ.ANCHOR = { FEET: ANCHOR_FEET, RIGHT: ANCHOR_RIGHT, LEFT: ANCHOR_LEFT };
  // palette slots: 1-4 the Claude spark cycle (lib.SPAL.clawdStar), 5 and 6 the underground bugs
  CQ.PAL_BUG_U = 5;
  CQ.PAL_SHELLBUG_U = 6;
  // every palette slot and flag a snapshot sprite can carry (docs/game-spec.md 2.4 and 2.6)
  const PAL = Object.freeze({ STAR1: 1, BUG_U: 5, SHELLBUG_U: 6, CODE: 7, LIFE: 8, BOSS_HIT: 9, MOTH_U: 10, SPIKE_U: 11, FRAG_U: 12 });
  const FLAG = Object.freeze({ FLIP: 1, FLIPV: 2, BEHIND: 4, BUMP: 16, FEET: 32, RIGHT: 64, LEFT: 128, FLICKER: 256 });
  CQ.PAL = PAL;
  CQ.FLAG = FLAG;

  function playerSprite(W, out) {
    const p = W.p;
    if (p.hide) return;
    if (p.inv > 0 && (p.inv >> 1) & 1) return;
    const vf = W.vf;
    let name;
    if (p.growT >= 0) {
      const c = GROW_SEQ[Math.min(GROW_SEQ.length - 1, Math.floor(p.growT / 5))];
      name = c === 'S' ? 'clawdS_idle' : c === 'M' ? 'clawdM_grow' : 'clawdB_idle';
    } else if (p.st === 'dead') {
      name = 'clawdS_dead';
    } else if (W.live && p.throwT > 0 && p.big && p.st === 'play') {
      name = 'clawdB_throw'; // a caret thrown: one nub thrust forward
    } else {
      let pose = p.pose === 'victory' && !p.big ? 'idle' : p.pose;
      // idle life: standing still, Claw'd blinks for 8 frames every 3 seconds
      if (pose === 'idle' && vf % 180 < 8) pose = 'blink';
      name = (p.big ? 'clawdB_' : 'clawdS_') + pose;
    }
    let flags = p.face < 0 ? 1 : 0;
    if (p.behind) flags |= 4;
    let pal = 0;
    if (p.star > 0) {
      const rate = p.star < STAR_SLOW ? 4 : 2;
      pal = 1 + (Math.floor(vf / rate) % 4);
    } else if (W.live && W.freeze > 0 && W.freezeK === 'code') {
      pal = PAL.CODE; // the terminal's hold: flickering into the code palette
      flags |= FLAG.FLICKER;
    } else if (W.live && p.code && p.big) pal = PAL.CODE;
    let x = Math.floor(p.x) + 8;
    if (p.pose === 'pole1' || p.pose === 'pole2') {
      // on the pole the grip hand is at the drawing's edge: stand the drawing against the pole's pixels
      const pole = W.lv.pole;
      if (p.face > 0) {
        x = pole.tx * 16 + 7;
        flags |= ANCHOR_RIGHT;
      } else {
        x = pole.tx * 16 + 9;
        flags |= ANCHOR_LEFT;
      }
    } else flags |= ANCHOR_FEET;
    out.push(ni(name), x, Math.floor(p.y), flags, pal);
  }

  // a firework burst centred on (x, y): one star, then a ring, then a wide double ring (48 px across)
  const FW_RING1 = [[-10, 0], [10, 0], [0, -10], [0, 10]];
  const FW_RING2 = [[-13, -13], [13, -13], [-13, 13], [13, 13]];
  const FW_RING3 = [[-22, 0], [22, 0], [0, -22], [0, 22]];
  function fireworkSprites(q, out) {
    const x = q.x - 8, y = q.y - 8;
    const put = (n, dx, dy) => out.push(ni('firework' + n), x + dx, y + dy, 0, 0);
    if (q.t < 6) put(1, 0, 0);
    else if (q.t < 14) {
      put(2, 0, 0);
      for (const [dx, dy] of FW_RING1) put(1, dx, dy);
    } else if (q.t < 22) {
      put(3, 0, 0);
      for (const [dx, dy] of FW_RING1) put(2, dx, dy);
      for (const [dx, dy] of FW_RING2) put(1, dx, dy);
    } else {
      for (const [dx, dy] of FW_RING2) put(3, dx, dy);
      for (const [dx, dy] of FW_RING3) put(q.t & 2 ? 2 : 1, dx, dy);
    }
  }

  // docs/game-spec.md 8. s.f is the visual clock (W.vf - 1; the film's W.vf === W.f), and every animation
  // below reads it, so a paused frame stands still. Modes 1, 3, 5, 6 and 7 carry an empty spr; mode 4
  // (pause) carries the frozen play record.
  function snapshot(W) {
    const live = !!W.live;
    const areaDef = W.mode === 'lives' ? defOf(W, W.pending) : W.lv ? W.lv.def : null;
    const main = areaDef ? mainOf(areaDef) : '';
    const inPlay = W.mode === 'play' || W.mode === 'pause';
    const s = {
      m: MODE_CODE[W.mode], f: W.vf - 1, btn: W.btn, score: W.score, coins: W.coins, lives: W.lives, top: W.top,
      world: W.world, time: inPlay ? W.time : -1,
      lv: W.lv, chg: W.lv ? W.lv.changes.length : 0, cam: W.cam, lt: W.lv ? W.lv.t : 0,
      spr: null, hide: null, cflag: W.castleFlag, flagY: W.lv ? W.lv.flagY : 0, end: endingState(W),
      title: W.mode === 'title' || W.mode === 'title2' ? { started: W.mode === 'title2', mt: W.mt } : null,
      flash: W.flashN > 0 ? W.flashC : 0, door: -1,
      live, shell: live && !!W.shellMenu, pausable: pausable(W),
      lid: areaDef ? String(areaDef.id) : '', main: String(main), name: areaDef && areaDef.name ? String(areaDef.name) : '',
      tokens: live ? W.tokens[main] | 0 : 0, tokenTotal: live ? tokenCount(W) : 0,
      clear: live && W.mode === 'clear' && W.clear ? Object.assign({}, W.clear) : null,
      cont: live && W.mode === 'continue' && W.cont ? { sel: W.cont.sel } : null,
      credits: live && W.mode === 'credits' && W.credits ? Object.assign({}, W.credits) : null,
    };
    if (!inPlay && W.mode !== 'title' && W.mode !== 'title2') {
      s.spr = new Int16Array(0);
      return s;
    }
    const lv = W.lv;
    const p = W.p;
    const out = [];
    const f = W.vf;
    if (lv.def.castle && p.st === 'walkCastle') s.door = castleDoor(lv);
    // behind-the-tiles sprites first: sprouting items, the player in a pipe, the boss in the lava
    for (const it of W.items) {
      const name = it.k === 'mushroom' || it.k === 'life' ? 'mushroom' : it.k === 'terminal' ? 'terminal' : 'spark' + (1 + ((f >> 2) & 3));
      out.push(ni(name), Math.floor(it.x), Math.floor(it.y) - 16, it.st === 'sprout' ? 4 : 0, it.k === 'life' ? PAL.LIFE : 0);
    }
    // the level's decorations (torches flicker, each on its own beat)
    if (lv.def.decor) {
      lv.def.decor.forEach((d, i) => {
        const name = d.n === 'torch' ? 'torch' + (1 + (((f + i * 5) >> 3) & 1)) : d.n;
        out.push(ni(name), d.x, d.y, 0, 0);
      });
    }
    // the checkpoint post (live), in the main level only: its flag flies once passed
    if (live && lv.def.mid && mainOf(lv.def) === lv.def.id) {
      const m = lv.def.mid;
      const on = !!(W.mid && W.mid.id === lv.def.id);
      out.push(ni(on ? 'ckpt_on' : 'ckpt_off'), m.tx * 16, rowTop(m.row) - 32, 0, 0);
    }
    // lava bubbles rise and pop on every third lava column, each on its own clock. Live: an ember's column
    // boils only as its tell (src/game/13-platforms.js), so a bubble there always means a leap is coming
    for (const c of lv.lavaCols) {
      if (c % 3 !== 1) continue;
      if (live && lv.emberCols && lv.emberCols.indexOf(c) >= 0) continue;
      const k = (lv.t + c * 37) % 80;
      if (k < 24) out.push(ni(k < 14 ? 'bubble1' : 'bubble2'), c * 16 + 4, rowTop(10) - 4 - (k >> 2), 0, 0);
    }
    if (lv.pole) out.push(ni('flag'), lv.pole.tx * 16 + 7 - 16, Math.floor(lv.flagY), 0, 0);
    if (lv.axe) {
      // the ENTER key; once pressed it stays down, dark
      if (!lv.axe.gone) out.push(ni('axe' + (1 + (Math.floor(f / 10) % 3))), lv.axe.tx * 16, rowTop(lv.axe.ty), 0, 0);
      else out.push(ni('axe1'), lv.axe.tx * 16, rowTop(lv.axe.ty) + 2, 0, 0);
    }
    if (lv.pearl) {
      const pl = lv.pearl;
      const wave = pl.wave && Math.floor(f / 16) % 2 === 1;
      out.push(ni(wave ? 'pearl_wave' : 'pearl'), pl.x, pl.y - 24 - Math.round(pl.hy || 0), 0, 0);
    }
    for (const e of lv.ents) {
      if (e.st === 'wait' || e.st === 'gone') continue;
      if (e.x < W.cam - 32 || e.x > W.cam + 336) continue;
      const K = kindOf(W, e);
      if (K) {
        // a live kind draws itself: [name, drawHeight, flags, pal]
        const r = K.sprite(W, lv, e, f);
        if (!r) continue;
        out.push(ni(r[0]), Math.floor(e.x), Math.floor(e.y) - r[1], (r[2] | 0) | (e.st === 'dead' ? FLAG.FLIPV : 0), r[3] | 0);
        continue;
      }
      let name, h, flags = 0;
      if (e.st === 'flat') {
        name = 'bug_flat';
        h = 8;
      } else if (e.kind === 'bug') {
        // the enemy drawings face left (at the player); mirrored when walking right
        name = e.st === 'dead' ? 'bug_walk1' : (e.t >> 3) & 1 ? 'bug_walk2' : 'bug_walk1';
        h = 16;
        if (e.vx > 0) flags |= 1;
      } else if (e.kind === 'shellbug') {
        name = e.st === 'dead' ? 'shellbug_walk1' : (e.t >> 3) & 1 ? 'shellbug_walk2' : 'shellbug_walk1';
        h = 16;
        if (e.vx > 0) flags |= 1;
      } else {
        name = 'shell';
        h = 16;
      }
      if (e.st === 'dead') flags |= 2;
      const under = lv.def.kind === 'under';
      const epal = !under ? 0 : e.kind === 'bug' ? CQ.PAL_BUG_U : CQ.PAL_SHELLBUG_U;
      out.push(ni(name), Math.floor(e.x), Math.floor(e.y) - h, flags, epal);
    }
    const b = lv.boss;
    if (b && !b.gone && (b.active || b.x < W.cam + 336)) {
      // it looks down as the bridge goes under it, and roars as it drops into the lava (behind its surface)
      const collapsing = W.seq && W.seq.k === 'axe';
      const name = collapsing || (b.fall && b.vy < 1.5 && !b.lava) ? 'boss_look' : b.roar > 0 || b.air || b.fall ? 'boss_roar' : (b.t >> 4) & 1 ? 'boss_walk2' : 'boss_walk1';
      let flags = (b.face > 0 ? 1 : 0) | (b.fall ? 4 : 0);
      let pal = 0;
      if (b.flip) flags |= FLAG.FLIPV; // beaten: it falls upside down
      if (b.hitT > 0) {
        pal = PAL.BOSS_HIT; // a caret hit: it flickers white
        flags |= FLAG.FLICKER;
      }
      out.push(ni(name), Math.floor(b.x), Math.floor(b.y) - 32, flags, pal);
    }
    for (const sy of systemsOf(W)) if (sy.sprites) sy.sprites(W, lv, out, f);
    playerSprite(W, out);
    for (const fb of lv.firebars) {
      const k = 1 + ((f >> 2) & 3);
      for (const [bx, by] of firebarBalls(fb, lv.t)) out.push(ni('fireball' + k), bx, by, 0, 0);
    }
    const fragPal = live && lv.def.kind === 'under' ? PAL.FRAG_U : 0;
    for (const q of W.parts) {
      if (q.k === 'coin') out.push(ni('coinpop' + (1 + ((q.t >> 1) & 3))), Math.floor(q.x), Math.floor(q.y), 0, 0);
      else if (q.k === 'frag') out.push(ni((q.t >> 2) & 1 ? 'fragment2' : 'fragment1'), Math.floor(q.x), Math.floor(q.y), q.flip ? 1 : 0, fragPal);
      else if (q.k === 'fw') fireworkSprites(q, out);
      else if (q.k === 'splash') { if (q.t >= 0) out.push(ni('splash' + (1 + Math.min(2, q.t >> 3))), q.x - 8, q.y, 0, 0); }
      else if (q.k === 'heart') out.push(ni((q.t >> 3) & 1 ? 'heart2' : 'heart1'), q.x, Math.floor(q.y), 0, 0);
    }
    // score pops (x is the centre); not during the grow pause, when the world holds still
    if (W.freeze === 0) for (const sp of W.pops) out.push(1000 + sp.v, sp.x, Math.floor(sp.y), 0, 0);
    if (W.poleScore) out.push(1000 + W.poleScore.v, W.poleScore.x, Math.floor(W.poleScore.y), 0, 0);
    // bumped blocks ride above their cell for a few frames
    if (W.bumps.length) {
      s.hide = [];
      const names = TILE_NAMES[lv.def.kind] || TILE_NAMES.over;
      for (const bp of W.bumps) {
        s.hide.push(bp.ty * lv.w + bp.tx);
        const ch = String.fromCharCode(bp.code);
        out.push(ni(names[ch] || 't_used'), bp.tx * 16, rowTop(bp.ty) + BUMP_DY[bp.t], 16, 0);
      }
    }
    s.spr = Int16Array.from(out);
    return s;
  }
  CQ.snapshot = snapshot;

  // ------------------------------------------------------------------------------------------
  // The seam: the kit the 1x modules may use (docs/game-spec.md 2.4). Nothing else is theirs.
  // ------------------------------------------------------------------------------------------
  CQ.K = Object.freeze({
    Q, PH, BUTTONS, rowTop, rowOf, cell, solidAt, headAt, setCell,
    bodyL, bodyR, bodyH, drawH: DRAW_H,
    emit, setSong, addScore, pop, popOf,
    comboPoints, hurt,
    nudgeX,
  });
})();

</script>
<script>
// ---- src/game/12-foes.js
// game/12-foes.js : the new enemies (moth, hover moth, spike beetle) and the Big Bug upgrade (hit points,
// the hit flicker, enrage, the roar spit, the defeat). Owner: P2. docs/game-spec.md 6.1 and 6.2.
//
// Everything here is reached through the engine seam (docs/game-spec.md 2.4): enemy kinds in CQ.KINDS,
// the boss upgrade as a system in CQ.systems. The engine calls both only for live worlds (W.live), so
// the film never sees any of it. Every number is an exact dyadic constant; no trig at run time.
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});
  const CQ = (FILM.__cq = FILM.__cq || {});
  const register = (sys) => {
    const i = CQ.systems.findIndex((q) => q.name === sys.name);
    if (i >= 0) CQ.systems[i] = sys;
    else CQ.systems.push(sys);
  };
  const K = CQ.K;
  const { Q, PH, rowTop, rowOf, cell, solidAt, bodyL, bodyR, bodyH } = K;
  const PAL = CQ.PAL, FLAG = CQ.FLAG;

  // Math.round(16 * sin(2 pi i / 64)), stored as a literal (never computed at run time)
  const SIN64 = [0, 2, 3, 5, 6, 8, 9, 10, 11, 12, 13, 14, 15, 15, 16, 16, 16, 16, 16, 15, 15, 14, 13, 12, 11, 10, 9, 8, 6, 5, 3, 2,
    0, -2, -3, -5, -6, -8, -9, -10, -11, -12, -13, -14, -15, -15, -16, -16, -16, -16, -16, -15, -15, -14, -13, -12, -11, -10, -9, -8, -6, -5, -3, -2];
  CQ.SIN64 = SIN64;

  const MOTH_VX = -Q(0xc00); // -0.75 px a frame
  const SPIKE_VX = PH.enemyWalk; // 0.5
  const dark = (lv) => lv.def.kind === 'under' || lv.def.kind === 'castle';

  // a stomped moth: the dead fall straight down (vy 0), a bug counted, the stomp combo scored
  function mothStomp(W, lv, e, p) {
    e.st = 'dead';
    e.vy = 0;
    e.vx = 0;
    e.t = 0;
    W.stats.bugs++;
    K.comboPoints(W, p.combo, e.x + 8, e.y - 24);
  }

  // moth: flies left at 0.75 px a frame through the tiles, bobbing 16 px round its spawn line
  CQ.KINDS.moth = {
    top: 12,
    flier: true,
    spiky: false,
    move(W, lv, e) {
      e.vx = MOTH_VX;
      e.x += e.vx;
      e.y = e.y0 + SIN64[e.t & 63];
    },
    onStomp: mothStomp,
    sprite(W, lv, e) {
      const name = e.st === 'dead' ? 'moth1' : (e.t >> 2) & 1 ? 'moth2' : 'moth1';
      return [name, 16, 0, dark(lv) ? PAL.MOTH_U : 0];
    },
  };

  // hover moth: fixed x, bobbing 32 px on the level clock (so a bot can time it), facing the player
  CQ.KINDS.hover = {
    top: 12,
    flier: true,
    spiky: false,
    move(W, lv, e) {
      e.vx = 0;
      e.y = e.y0 + 2 * SIN64[(lv.t >> 1) & 63];
    },
    onStomp: mothStomp,
    sprite(W, lv, e) {
      const name = e.st === 'dead' ? 'moth1' : (lv.t >> 2) & 1 ? 'moth2' : 'moth1';
      // the drawing faces left; mirrored while the player is to its right
      const right = W.p && W.p.x + 8 > e.x + 8;
      return [name, 16, right && e.st !== 'dead' ? FLAG.FLIP : 0, dark(lv) ? PAL.MOTH_U : 0];
    },
  };

  // spike beetle: an edge walker at 0.5 that turns at walls and at ledges (never walks off one); its
  // spikes hurt from every side, stomps included (the engine's spiky rule)
  CQ.KINDS.spike = {
    top: 12,
    flier: false,
    spiky: true,
    move(W, lv, e) {
      if (e.vx === 0) e.vx = -SPIKE_VX;
      if (!e.ground) {
        // spawned in the air (or its floor knocked away): fall like a walker
        e.vy = Math.min(PH.maxFall, e.vy + PH.enemyGrav);
        const y0 = e.y;
        e.y += e.vy;
        if (solidAt(lv, e.x + 4, e.y) || solidAt(lv, e.x + 11, e.y)) {
          const top = rowTop(rowOf(e.y));
          if (top >= y0 - 1) {
            e.y = top;
            e.vy = 0;
            e.ground = true;
          }
        }
        return;
      }
      e.x += e.vx;
      const yy = e.y - 8;
      if (e.vx > 0 && solidAt(lv, e.x + 14, yy)) {
        e.x = Math.floor((e.x + 14) / 16) * 16 - 15;
        e.vx = -e.vx;
        return;
      }
      if (e.vx < 0 && solidAt(lv, e.x + 1, yy)) {
        e.x = Math.floor((e.x + 1) / 16) * 16 + 15;
        e.vx = -e.vx;
        return;
      }
      // the leading foot over air: step back and turn round
      const lead = e.vx > 0 ? e.x + 14 : e.x + 2;
      if (!solidAt(lv, lead, e.y)) {
        e.x -= e.vx;
        e.vx = -e.vx;
        // nothing under either foot any more (the floor went): fall
        if (!solidAt(lv, e.x + 2, e.y) && !solidAt(lv, e.x + 14, e.y)) {
          e.ground = false;
          e.vy = 0;
        }
      }
    },
    // never reached (spiky contact hurts before any stomp), kept so a stomp could never leave it standing
    onStomp(W, lv, e, p) {
      K.hurt(W, false, 'spike');
    },
    sprite(W, lv, e) {
      const name = e.st === 'dead' ? 'spike_walk1' : (e.t >> 3) & 1 ? 'spike_walk2' : 'spike_walk1';
      return [name, 16, e.vx > 0 ? FLAG.FLIP : 0, dark(lv) ? PAL.SPIKE_U : 0];
    },
  };

  // ------------------------------------------------------------------------------------------
  // X2 the Big Bug upgrade
  // ------------------------------------------------------------------------------------------
  const HIT_FRAMES = 16;
  const ENRAGE_HP = 2, ENRAGE_VX = Q(0xc00), ENRAGE_HOP = 90;
  const SPIT_MAX = 2, SPIT_VY = -2, SPIT_G = Q(0x200);
  // The spit is aimed: its speed (0.5 to 2.5 px a frame, in 1/16 px) puts its first landing on the bridge's
  // top face where Claw'd stands, or, when that would take more than the top speed, its bounce's landing.
  // So standing still anywhere in reach gets him hit; a hop over it or a step aside does not.
  const SPIT_VMIN = Q(0x800), SPIT_VMAX = Q(0x2800);
  // Lingering: after LINGER frames of Claw'd off the bridge (on the step before it, say), the Big Bug walks
  // up to the bridge's near end and paces its first HOLD_W px there, until he sets foot on the bridge.
  const LINGER = 90, HOLD_W = 32;
  const LAVA_T = 'L'.charCodeAt(0), LAVA = 'l'.charCodeAt(0);

  const fighting = (b) => !!b && b.active && !b.dead && !b.fall && !b.gone;

  // frames of a spit's flight from y0 down to the bridge's top face (floor, in s.y), and of one bounce there
  function flight(y0, floor) {
    let y = y0, vy = SPIT_VY, n = 0;
    while (n < 240) {
      vy = Math.min(PH.maxFall, vy + SPIT_G);
      y += vy;
      n++;
      if (vy > 0 && y >= floor) break;
    }
    return n;
  }
  function spitVx(W, lv, x0, y0, face) {
    const floor = rowTop(8) - 8;
    const n1 = flight(y0, floor), n2 = flight(floor, floor);
    const d = Math.abs(W.p.x + 8 - (x0 + 4));
    let v = d / n1;
    if (v > SPIT_VMAX) v = d / (n1 + n2);
    v = Math.max(SPIT_VMIN, Math.min(SPIT_VMAX, v));
    return (face * Math.round(v * 16)) / 16;
  }

  // a caret on the boss (called by src/game/14-caret.js). Returns false while the hit flicker runs (the
  // caret poofs without damage), true when the hit counted.
  function hitBoss(W, lv) {
    const b = lv.boss;
    if (!fighting(b) || b.hitT > 0) return false;
    b.hp--;
    b.hitT = HIT_FRAMES;
    K.emit(W, 'bosshit', { hp: b.hp });
    if (b.hp <= ENRAGE_HP && !b.enraged) {
      b.enraged = true;
      b.vx = (b.vx < 0 ? -1 : 1) * ENRAGE_VX;
      b.hopEvery = ENRAGE_HOP;
    }
    if (b.hp <= 0) {
      b.hp = 0;
      K.emit(W, 'bossdefeat');
      K.addScore(W, 5000);
      K.pop(W, K.popOf('5000'), b.x + 16, b.y - 40);
      W.stats.bugs++;
      b.dead = true;
      b.fall = true;
      b.air = false;
      b.vy = -3;
      b.flip = true;
      b.roar = 0;
      K.setSong(W, 'none');
    }
    return true;
  }
  // the boss's body box (the engine's contact box), for the carets
  function bossBox(b) {
    return { l: b.x + 4, r: b.x + 28, t: b.y - 28, b: b.y };
  }
  CQ.foes = Object.freeze({ hitBoss, bossBox, fighting, SIN64 });

  function stepSpit(W, lv) {
    const list = lv.spit;
    const p = W.p;
    for (const s of list) {
      if (s.gone) continue;
      s.t++;
      s.vy = Math.min(PH.maxFall, s.vy + SPIT_G);
      s.x += s.vx;
      // a wall ahead ends it
      if (solidAt(lv, s.x + (s.vx > 0 ? 7 : 0), s.y + 4)) {
        s.gone = true;
        continue;
      }
      const y0 = s.y;
      s.y += s.vy;
      if (s.vy > 0 && (solidAt(lv, s.x + 2, s.y + 8) || solidAt(lv, s.x + 5, s.y + 8))) {
        const top = rowTop(rowOf(s.y + 8));
        if (top >= y0 + 8 - 1) {
          // a solid top: the first contact bounces, the second ends it
          if (++s.hits >= 2) {
            s.gone = true;
            continue;
          }
          s.y = top - 8;
          s.vy = SPIT_VY;
        }
      }
      const c = cell(lv, Math.floor((s.x + 4) / 16), rowOf(s.y + 6));
      if (c === LAVA_T || c === LAVA || s.y > 200 || s.x < W.cam - 16 || s.x > W.cam + 336) {
        s.gone = true;
        continue;
      }
      if (p.st === 'play' && p.star === 0 && p.inv === 0) {
        if (bodyR(p) > s.x + 1 && bodyL(p) + 1 < s.x + 7 && p.y > s.y + 1 && p.y - bodyH(p) + 3 < s.y + 7) {
          s.gone = true;
          K.hurt(W, false, 'fire');
        }
      }
    }
    if (list.some((s) => s.gone)) lv.spit = list.filter((s) => !s.gone);
  }

  // registered once, by name (a second load of this file replaces it rather than doubling every hook)
  register({
    name: 'foes',
    build(lv, def) {
      if (lv.boss) {
        lv.spit = [];
        lv.boss.xFar = lv.boss.x1; // the far end of its stretch (x1 shrinks while he lingers)
        lv.boss.linger = 0;
        lv.boss.nearX = def.bridge ? def.bridge[0] * 16 : lv.boss.x0; // the bridge's near end
      }
    },
    step(W, lv) {
      const b = lv.boss;
      if (!b) return;
      if (b.hitT > 0) b.hitT--;
      const p = W.p;
      if (fighting(b) && p.st === 'play') {
        // off the bridge (his middle short of its near end): it comes to meet him; on it: its whole stretch
        b.linger = p.x + 8 < b.nearX ? b.linger + 1 : 0;
        b.x1 = b.linger >= LINGER ? Math.max(b.x0 + HOLD_W, Math.min(b.x1, b.x)) : b.xFar;
      }
      // a roar that started this frame (stepBoss set 30 and counted it down once): one spit, aimed
      if (fighting(b) && b.roar === 29 && b.spat !== b.t) {
        b.spat = b.t;
        if (lv.spit.length < SPIT_MAX) {
          const face = b.face > 0 ? 1 : -1;
          const x = b.x + (face > 0 ? 24 : 0), y = b.y - 20;
          lv.spit.push({ x, y, vx: spitVx(W, lv, x, y, face), vy: SPIT_VY, t: 0, hits: 0, gone: false });
          K.emit(W, 'spit');
        }
      }
      if (lv.spit.length) stepSpit(W, lv);
      // beaten: the level's (boss) song stays silent, even when a star or the hurry jingle ends
      if (b.dead && W.bgm && (W.song === W.bgm || W.song === W.bgm + 'Fast')) K.setSong(W, 'none');
    },
    sprites(W, lv, out, vf) {
      if (!lv.spit) return;
      const k = 1 + ((vf >> 2) & 3);
      for (const s of lv.spit) out.push(CQ.ni('fireball' + k), Math.floor(s.x), Math.floor(s.y), 0, 0);
    },
    cloneLevel(src, dst) {
      if (src.spit) dst.spit = src.spit.map((s) => Object.assign({}, s));
    },
  });
})();

<script>
// ---- src/game/13-platforms.js
// game/13-platforms.js : lifts (horizontal, vertical, falling), springs and lava embers. Owner: P2.
// docs/game-spec.md 6.3 (X3), 6.4 (X4) and 6.5 (X5).
//
// One system behind the engine seam (docs/game-spec.md 2.4), called only for live worlds. Lift and
// ember positions are pure functions of the level clock lv.t (a falling lift is the one exception: it
// falls from its first contact), so a paused, cloned or replayed world always agrees.
// p.ride is an index into lv.lifts (or -1), never an object, so the engine's flat copy of the player stays
// correct in cloneWorld.
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});
  const CQ = (FILM.__cq = FILM.__cq || {});
  const register = (sys) => {
    const i = CQ.systems.findIndex((q) => q.name === sys.name);
    if (i >= 0) CQ.systems[i] = sys;
    else CQ.systems.push(sys);
  };
  const K = CQ.K;
  const { Q, PH, BUTTONS, rowTop, rowOf, cell, solidAt, bodyL, bodyR, bodyH } = K;
  const FLAG = CQ.FLAG;

  const FALL_DELAY = 20; // a falling lift shakes this many frames after its first contact
  const FALL_ACC = Q(0x100), FALL_MAX = 2;
  const GONE_Y = 200;

  const flat = (o) => Object.assign({}, o);
  const mod = (a, m) => ((a % m) + m) % m;
  // the back-and-forth offset of a lift at level clock t: 0 .. D .. 0 over 2D steps
  function swing(t, speed, phase, D) {
    if (!(D > 0)) return 0;
    const o = mod(Math.floor(t * speed) + (phase | 0), 2 * D);
    return o < D ? o : 2 * D - o;
  }

  // ------------------------------------------------------------------------------------------
  // X3 lifts
  // ------------------------------------------------------------------------------------------
  function makeLift(d) {
    const w = Math.max(1, d.w | 0 || 3);
    const L = { k: d.k, tx: d.tx, w, x: d.tx * 16, y: 0, dx: 0, dy: 0 };
    if (d.k === 'h') Object.assign(L, { y0: d.y, x1: d.x1, speed: d.speed != null ? d.speed : 1, phase: d.phase | 0 });
    else if (d.k === 'v') Object.assign(L, { y0: d.y0, y1: d.y1, speed: d.speed != null ? d.speed : 0.5, phase: d.phase | 0 });
    else Object.assign(L, { k: 'fall', y0: d.y, st: 'still', t: 0, vy: 0 });
    place(L, 0);
    L.dx = 0;
    L.dy = 0;
    return L;
  }
  // put a lift where it is at level clock t (h and v); a falling lift runs its own state
  function place(L, t) {
    if (L.k === 'h') {
      L.x = L.tx * 16 + swing(t, L.speed, L.phase, L.x1 - L.tx * 16);
      L.y = L.y0;
    } else if (L.k === 'v') {
      L.x = L.tx * 16;
      L.y = L.y1 - swing(t, L.speed, L.phase, L.y1 - L.y0);
    } else if (t === 0) {
      L.x = L.tx * 16;
      L.y = L.y0;
    }
  }
  function advanceFall(W, L) {
    if (L.st === 'shake') {
      if (++L.t > FALL_DELAY) L.st = 'fall';
    }
    if (L.st === 'fall') {
      L.vy = Math.min(FALL_MAX, L.vy + FALL_ACC);
      L.y += L.vy;
      if (L.y > GONE_Y) L.st = 'gone';
    }
  }
  const alive = (L) => L.k !== 'fall' || L.st !== 'gone';
  // his feet over the lift's top face (the same foot probes the engine uses on tiles)
  const over = (p, L) => bodyR(p) - 1 >= L.x && bodyL(p) + 1 <= L.x + L.w * 16 - 1;
  const onTile = (lv, p) => solidAt(lv, bodyL(p) + 1, p.y) || solidAt(lv, bodyR(p) - 1, p.y);

  // a rider now stands on lift i: a falling lift starts to crumble on its first contact
  function board(W, lv, p, i) {
    const L = lv.lifts[i];
    p.ride = i;
    if (L.k === 'fall' && L.st === 'still') {
      L.st = 'shake';
      L.t = 0;
      K.emit(W, 'crumble');
    }
  }

  function preLifts(W, lv, p) {
    const lifts = lv.lifts;
    for (const L of lifts) {
      const x = L.x, y = L.y;
      if (L.k === 'fall') advanceFall(W, L);
      else place(L, lv.t);
      L.dx = L.x - x;
      L.dy = L.y - y;
    }
    if (p.ride >= 0) {
      const L = lifts[p.ride];
      // the ride ends with a jump, a scripted state, a gone lift, or when a tile took his feet
      if (!L || !alive(L) || p.st !== 'play' || !p.ground || onTile(lv, p)) p.ride = -1;
      else {
        if (L.dx) K.nudgeX(W, lv, p, L.dx);
        p.y = L.y;
      }
      return;
    }
    // a lift rising through the feet of a player standing beside it picks him up
    if (p.st === 'play' && p.ground) {
      for (let i = 0; i < lifts.length; i++) {
        const L = lifts[i];
        if (!alive(L) || L.dy >= 0) continue;
        if (L.y - L.dy >= p.y && L.y < p.y && over(p, L)) {
          p.y = L.y;
          board(W, lv, p, i);
          return;
        }
      }
    }
  }

  // moveY, grounded with no tile under the feet: the lift he rides (or one level with his feet) holds him
  function supportLift(W, lv, p) {
    const lifts = lv.lifts;
    if (p.ride >= 0) {
      const L = lifts[p.ride];
      if (L && alive(L) && over(p, L) && Math.abs(p.y - L.y) <= 1) {
        p.y = L.y;
        return true;
      }
      p.ride = -1; // walked off the span: the engine starts the fall (and coyote time)
      return false;
    }
    for (let i = 0; i < lifts.length; i++) {
      const L = lifts[i];
      if (alive(L) && over(p, L) && Math.abs(p.y - L.y) <= 1) {
        p.y = L.y;
        board(W, lv, p, i);
        return true;
      }
    }
    return false;
  }

  // moveY, falling, no tile landing: the top face is one-way. y0 is where his feet were last frame.
  function landLift(W, lv, p, y0) {
    if (p.vy < 0) return false;
    let best = -1;
    for (let i = 0; i < lv.lifts.length; i++) {
      const L = lv.lifts[i];
      if (!alive(L)) continue;
      const top = L.y;
      if (y0 <= top - L.dy && p.y >= top && over(p, L) && (best < 0 || top < lv.lifts[best].y)) best = i;
    }
    if (best < 0) return false;
    p.y = lv.lifts[best].y;
    board(W, lv, p, best);
    return true;
  }

  function liftName(lv) {
    const k = lv.def.kind;
    return k === 'under' ? 'liftU' : k === 'castle' ? 'liftC' : 'lift';
  }

  // ------------------------------------------------------------------------------------------
  // X4 springs (the S tile)
  // ------------------------------------------------------------------------------------------
  const SPRING = 'S'.charCodeAt(0);
  const SPRING_HELD = { vy: -5, gHold: Q(0x240), gFall: Q(0x900) }; // rise 86.4 px in 35 frames
  const SPRING_FREE = { vy: -4, gFall: Q(0x700) }; // rise 16.3 px
  const SPRING_ANIM = 3; // spring2 for 3 frames, spring3 for 3, then spring1

  function springAt(lv, p) {
    const ty = rowOf(p.y);
    for (const x of [bodyL(p) + 1, bodyR(p) - 1]) {
      const tx = Math.floor(x / 16);
      if (cell(lv, tx, ty) === SPRING) return { tx, ty };
    }
    return null;
  }
  function launch(W, lv, p, btn, at) {
    const held = (btn & BUTTONS.A) !== 0;
    const run = (btn & BUTTONS.B) !== 0 || Math.abs(p.vx) > PH.maxWalk;
    if (held) {
      p.vy = SPRING_HELD.vy;
      p.gHold = SPRING_HELD.gHold;
      p.gFall = SPRING_HELD.gFall;
      p.jumping = true;
    } else {
      p.vy = SPRING_FREE.vy;
      p.gHold = SPRING_HELD.gHold;
      p.gFall = SPRING_FREE.gFall;
      p.jumping = false;
    }
    p.ground = false;
    p.jumped = true; // the jump pose, and no coyote jump in mid-air
    p.skid = false;
    p.airMax = run ? PH.maxRun : PH.maxWalk;
    p.coyote = 0;
    p.buf = 0;
    p.ride = -1;
    const s = lv.springs.find((q) => q.tx === at.tx && q.ty === at.ty);
    if (s) s.t0 = lv.t;
    K.emit(W, 'spring', { held });
  }

  // ------------------------------------------------------------------------------------------
  // X5 embers
  // ------------------------------------------------------------------------------------------
  const EMBER_REST = 164; // feet line at rest, behind the lava surface
  const EMBER_VY = -5, EMBER_G = Q(0x300); // rise 64.2 px, back in about 54 frames
  const EMBER_BEHIND = 152; // drawn behind the tiles while its feet are below this line
  // The tell: for EMBER_TELL frames before every leap the lava at its column glows white-hot and boils
  // (two bubbles), and for the last EMBER_PEEK frames the ember's head shows above the surface. Drawn
  // only; the ember cannot hurt until it leaps. A pure function of lv.t, like the leap itself.
  const EMBER_TELL = 36, EMBER_PEEK = 12;
  // frames until the next leap (period when it leaps this frame)
  const emberDue = (lv, e) => e.period - mod(lv.t + e.phase, e.period);

  function stepEmbers(W, lv) {
    const p = W.p;
    for (const e of lv.embers) {
      if (e.period > 0 && mod(lv.t + e.phase, e.period) === 0) {
        e.up = true;
        e.y = EMBER_REST;
        e.vy = e.v0;
        if (e.x > W.cam - 16 && e.x < W.cam + 320) K.emit(W, 'ember');
      } else if (e.up) {
        e.vy += EMBER_G;
        e.y += e.vy;
        if (e.vy > 0 && e.y >= EMBER_REST) {
          e.y = EMBER_REST;
          e.vy = 0;
          e.up = false;
        }
      }
      if (!e.up || p.st !== 'play' || p.star !== 0 || p.inv !== 0) continue;
      // hitbox x+3..x+13, y-13..y-3 (y is the feet)
      if (bodyR(p) + 1 > e.x + 3 && bodyL(p) < e.x + 13 && p.y > e.y - 13 && p.y - bodyH(p) < e.y - 3) K.hurt(W, false, 'fire');
    }
  }

  // ------------------------------------------------------------------------------------------
  // the system
  // ------------------------------------------------------------------------------------------
  // registered once, by name (a second load of this file replaces it rather than doubling every hook)
  register({
    name: 'platforms',
    spawn: {
      // the spring stays in the grid as a solid tile; the system draws it and fires it
      S(lv, tx, ty) {
        (lv.springs || (lv.springs = [])).push({ tx, ty, t0: -100 });
        return 'S';
      },
    },
    build(lv, def) {
      lv.lifts = (def.lifts || []).map(makeLift);
      if (!lv.springs) lv.springs = [];
      // d.vy (optional): this ember's leap speed, for a lower leap than the standard -5
      lv.embers = (def.embers || []).map((d) => ({ tx: d.tx, x: d.tx * 16, period: d.period | 0, phase: d.phase | 0, v0: d.vy != null ? d.vy : EMBER_VY, y: EMBER_REST, vy: 0, up: false }));
      // the columns whose lava only boils as an ember's tell (the engine's ambient bubbles skip them)
      lv.emberCols = lv.embers.map((e) => e.tx);
    },
    enter(W, lv) {
      if (W.p) W.p.ride = -1;
    },
    pre(W, lv, p) {
      if (lv.lifts.length) preLifts(W, lv, p);
    },
    support(W, lv, p) {
      return lv.lifts.length > 0 && supportLift(W, lv, p);
    },
    land(W, lv, p, y0) {
      return lv.lifts.length > 0 && landLift(W, lv, p, y0);
    },
    grounded(W, lv, p, btn) {
      if (!lv.springs.length || p.ride >= 0 || p.st !== 'play') return;
      const at = springAt(lv, p);
      if (at) launch(W, lv, p, btn, at);
    },
    step(W, lv) {
      if (lv.embers.length) stepEmbers(W, lv);
    },
    sprites(W, lv, out, vf) {
      const lo = W.cam - 48, hi = W.cam + 336;
      if (lv.lifts.length) {
        const n = CQ.ni(liftName(lv));
        for (const L of lv.lifts) {
          if (!alive(L)) continue;
          // a falling lift shakes 1 px either way while it crumbles (drawn only: his feet stay put)
          const sx = L.k === 'fall' && L.st === 'shake' && L.t > 0 ? (L.t & 1 ? 1 : -1) : 0;
          const x = Math.floor(L.x) + sx, y = Math.floor(L.y);
          for (let i = 0; i < L.w; i++) if (x + i * 16 > lo && x + i * 16 < hi) out.push(n, x + i * 16, y, 0, 0);
        }
      }
      for (const s of lv.springs) {
        const x = s.tx * 16;
        if (x < lo || x > hi) continue;
        const age = lv.t - s.t0;
        const name = age >= 0 && age < SPRING_ANIM ? 'spring2' : age >= SPRING_ANIM && age < 2 * SPRING_ANIM ? 'spring3' : 'spring1';
        out.push(CQ.ni(name), x, rowTop(s.ty), 0, 0);
      }
      for (const e of lv.embers) {
        if (e.x < lo || e.x > hi) continue;
        if (!e.up) {
          const due = e.period > 0 ? emberDue(lv, e) : e.period + 1;
          if (due > EMBER_TELL) continue;
          // the tell: the surface at its column glows white-hot (the lava tile's own wave drawing), two
          // bubbles boil on it, and for the last frames the ember's head rises into view behind the surface
          const k = EMBER_TELL - due; // 0 .. EMBER_TELL - 1
          const surf = rowTop(10);
          out.push(CQ.ni((lv.t >> 4) & 1 ? 't_lavaGlow2' : 't_lavaGlow1'), e.x, surf, 0, 0);
          if (due <= EMBER_PEEK) {
            const peek = Math.min(8, ((EMBER_PEEK - due) >> 1) + 3); // 3 .. 8 px of it above its rest line
            out.push(CQ.ni('ember' + (1 + ((vf >> 2) & 1))), e.x, EMBER_REST - peek - 16, FLAG.BEHIND, 0);
            continue;
          }
          for (const [dx, off] of [[2, 0], [7, 5]]) {
            const b = (k + off) % 10;
            out.push(CQ.ni(b < 6 ? 'bubble1' : 'bubble2'), e.x + dx, surf - 4 - (b >> 1), 0, 0);
          }
          continue;
        }
        let flags = e.vy > 0 ? FLAG.FLIPV : 0;
        if (e.y > EMBER_BEHIND) flags |= FLAG.BEHIND;
        out.push(CQ.ni('ember' + (1 + ((vf >> 2) & 1))), e.x, Math.floor(e.y) - 16, flags, 0);
      }
    },
    cloneLevel(src, dst) {
      dst.lifts = src.lifts.map(flat);
      dst.springs = src.springs.map(flat);
      dst.embers = src.embers.map(flat);
    },
  });
  CQ.platforms = Object.freeze({ swing, EMBER_REST, EMBER_TELL, FALL_DELAY, emberDue });
})();

<script>
// ---- src/game/14-caret.js
// game/14-caret.js : Claw'd Code's carets, the bouncing `>` he throws with B. Owner: P2.
// docs/game-spec.md 6.7 (X7); boss hits go through src/game/12-foes.js (X2).
//
// One system behind the engine seam (docs/game-spec.md 2.4), called only for live worlds. The carets
// live on W.carets (reset on every area entry) as plain records; cloneWorld deep-copies them.
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});
  const CQ = (FILM.__cq = FILM.__cq || {});
  const register = (sys) => {
    const i = CQ.systems.findIndex((q) => q.name === sys.name);
    if (i >= 0) CQ.systems[i] = sys;
    else CQ.systems.push(sys);
  };
  const K = CQ.K;
  const { Q, BUTTONS, rowTop, rowOf, solidAt, emit } = K;
  const FLAG = CQ.FLAG;

  const MAX_CARETS = 2;
  const THROW_POSE = (CQ.TIMING && CQ.TIMING.THROW_POSE) || 8;
  const VX = Q(0x3800); // 3.5 px a frame
  const VY0 = 1, GRAV = Q(0x400), VY_MAX = 4;
  const BOUNCE = -Q(0x2c00); // -2.75: a 13.75 px hop
  const LIFE = 150;
  const POOF_STEP = 4, POOF_FRAMES = 3 * POOF_STEP; // poof1..3, 4 frames each
  const SPIN_STEP = 3; // caret1..4, a quarter turn every 3 frames
  const ZAP_SCORE = 200;

  // the top of an enemy's hitbox (the engine's rule): a live kind's own, the bug 14, the shell-bug 10, its shell 9
  function enemyTop(e) {
    const kind = CQ.KINDS[e.kind];
    return e.y - (kind ? kind.top : e.kind === 'shellbug' ? 10 : e.kind === 'shell' ? 9 : 14);
  }
  const hits = (c, l, r, t, b) => c.x + 3 > l && c.x - 3 < r && c.y + 3 > t && c.y - 3 < b;

  function fly(c) {
    return c.st === 'fly';
  }
  function poof(W, c, loud) {
    c.st = 'poof';
    c.t = 0;
    if (loud) emit(W, 'poof');
  }

  function throwCaret(W, p) {
    const face = p.face < 0 ? -1 : 1;
    W.carets.push({ st: 'fly', x: p.x + 8 + face * 10, y: p.y - 16, vx: VX * face, vy: VY0, t: 0 });
    p.throwT = THROW_POSE;
    emit(W, 'throw');
  }

  // a caret knocks an enemy out: the dead fall, a bug counted (a shell was counted when stomped), 200
  function zap(W, e, dir) {
    if (e.kind !== 'shell') W.stats.bugs++;
    e.st = 'dead';
    e.vy = -3;
    e.vx = 0.75 * dir;
    e.t = 0;
    K.addScore(W, ZAP_SCORE);
    K.pop(W, K.popOf(String(ZAP_SCORE)), e.x + 8, e.y - 24);
    emit(W, 'zap', { kind: e.kind });
  }

  function stepCaret(W, lv, c) {
    c.t++;
    if (c.st === 'poof') {
      if (c.t >= POOF_FRAMES) c.gone = true;
      return;
    }
    if (c.t > LIFE) {
      c.gone = true;
      return;
    }
    const dir = c.vx < 0 ? -1 : 1;
    c.x += c.vx;
    // a wall ahead of the centre
    if (solidAt(lv, c.x + dir * 3, c.y)) {
      c.x = dir > 0 ? Math.floor((c.x + 3) / 16) * 16 - 4 : Math.floor((c.x - 3) / 16) * 16 + 20;
      poof(W, c, true);
      return;
    }
    c.vy = Math.min(VY_MAX, c.vy + GRAV);
    const y0 = c.y;
    c.y += c.vy;
    if (c.vy > 0 && solidAt(lv, c.x, c.y + 4)) {
      const top = rowTop(rowOf(c.y + 4));
      if (top >= y0 + 4 - 1) {
        c.y = top - 4;
        c.vy = BOUNCE;
      }
    } else if (c.vy < 0 && solidAt(lv, c.x, c.y - 4)) {
      poof(W, c, true);
      return;
    }
    if (c.x < W.cam - 16 || c.x > W.cam + 336 || c.y > 200) {
      c.gone = true;
      return;
    }
    // an enemy: any live kind walking or in its shell
    for (const e of lv.ents) {
      if (e.st !== 'walk' && e.st !== 'shell') continue;
      if (!hits(c, e.x + 2, e.x + 14, enemyTop(e), e.y)) continue;
      zap(W, e, dir);
      c.gone = true;
      return;
    }
    // the boss: a hit, or a poof off it while it still flickers from the last one
    const b = lv.boss;
    if (b && CQ.foes && CQ.foes.fighting(b)) {
      const box = CQ.foes.bossBox(b);
      if (hits(c, box.l, box.r, box.t, box.b)) {
        if (CQ.foes.hitBoss(W, lv)) c.gone = true;
        else poof(W, c, true);
      }
    }
  }

  // registered once, by name (a second load of this file replaces it rather than doubling every hook)
  register({
    name: 'caret',
    enter(W, lv) {
      W.carets = [];
      // the pose is counted down only in play: a pipe or a door taken mid-throw must not carry it over
      if (W.p) W.p.throwT = 0;
    },
    input(W, lv, p, btn, pressed) {
      if (p.throwT > 0) p.throwT--;
      if (!(pressed & BUTTONS.B) || !p.code || !p.big || p.st !== 'play') return;
      if (!W.carets) W.carets = [];
      if (W.carets.filter(fly).length >= MAX_CARETS) return;
      throwCaret(W, p);
    },
    step(W, lv) {
      const list = W.carets;
      if (!list || !list.length) return;
      for (const c of list) if (!c.gone) stepCaret(W, lv, c);
      if (list.some((c) => c.gone)) W.carets = list.filter((c) => !c.gone);
    },
    sprites(W, lv, out) {
      const list = W.carets;
      if (!list) return;
      for (const c of list) {
        const x = Math.floor(c.x) - 4, y = Math.floor(c.y) - 4;
        if (c.st === 'poof') out.push(CQ.ni('poof' + (1 + Math.min(2, Math.floor(c.t / POOF_STEP)))), x, y, 0, 0);
        else out.push(CQ.ni('caret' + (1 + (Math.floor(c.t / SPIN_STEP) & 3))), x, y, c.vx < 0 ? FLAG.FLIP : 0, 0);
      }
    },
    cloneWorld(src, dst) {
      if (src.carets) dst.carets = src.carets.map((c) => Object.assign({}, c));
    },
  });
})();

</script>
<script>
// ---- src/game/15-tokens.js
// game/15-tokens.js : the collectible tokens (the spinning ✻ medals, three per main level). Owner: P2.
// docs/game-spec.md 6.8 (X8) and 4.10.
//
// One system behind the engine seam (docs/game-spec.md 2.4), called only for live worlds. A token comes
// from a `t` in the map (numbered by column, left to right, from def.tokenBase) or from def.tokens
// ([tx, ty, bit] overlays for maps that must stay byte-identical). W.tokens[main] is the run's bitmask
// per main level: it survives deaths and continues, so a rebuilt level never shows a collected token.
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});
  const CQ = (FILM.__cq = FILM.__cq || {});
  const register = (sys) => {
    const i = CQ.systems.findIndex((q) => q.name === sys.name);
    if (i >= 0) CQ.systems[i] = sys;
    else CQ.systems.push(sys);
  };
  const K = CQ.K;
  const { rowTop, bodyL, bodyR, bodyH } = K;

  const TOKEN_SCORE = 1000;
  const mainOf = (def) => def.main || def.id;

  function collect(W, lv, tk) {
    const main = mainOf(lv.def);
    W.tokens[main] = (W.tokens[main] | 0) | (1 << tk.bit);
    tk.got = true;
    K.addScore(W, TOKEN_SCORE);
    K.pop(W, K.popOf(String(TOKEN_SCORE)), tk.x + 8, tk.y - 8);
    K.emit(W, 'token', { id: main, n: tk.bit });
  }

  // registered once, by name (a second load of this file replaces it rather than doubling every hook)
  register({
    name: 'tokens',
    spawn: {
      t(lv, tx, ty) {
        (lv.tokenSpots || (lv.tokenSpots = [])).push([tx, ty]);
        return '.';
      },
    },
    build(lv, def, W) {
      const spots = lv.tokenSpots || [];
      delete lv.tokenSpots;
      // numbered by column, left to right (the spawn pass runs row by row)
      spots.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      const base = def.tokenBase | 0;
      const list = spots.map(([tx, ty], i) => [tx, ty, base + i]);
      for (const o of def.tokens || []) list.push([o[0], o[1], o[2] | 0]);
      const have = (W && W.tokens && W.tokens[mainOf(def)]) | 0;
      lv.tokens = list
        .filter(([, , bit]) => !(have & (1 << bit)))
        .map(([tx, ty, bit]) => ({ tx, ty, bit, x: tx * 16, y: rowTop(ty), got: false }));
    },
    step(W, lv) {
      const list = lv.tokens;
      const p = W.p;
      if (!list.length || p.st !== 'play') return;
      const l = bodyL(p), r = bodyR(p), top = p.y - bodyH(p);
      for (const tk of list) {
        // his body over the medal's box x+2..x+14, y+2..y+14
        if (r >= tk.x + 2 && l < tk.x + 14 && p.y > tk.y + 2 && top < tk.y + 14) collect(W, lv, tk);
      }
      if (list.some((tk) => tk.got)) lv.tokens = list.filter((tk) => !tk.got);
    },
    sprites(W, lv, out, vf) {
      if (!lv.tokens.length) return;
      const n = CQ.ni('token' + (1 + ((vf >> 3) & 3)));
      for (const tk of lv.tokens) {
        if (tk.x < W.cam - 32 || tk.x > W.cam + 336) continue;
        out.push(n, tk.x, tk.y, 0, 0);
      }
    },
    cloneLevel(src, dst) {
      dst.tokens = src.tokens.map((tk) => Object.assign({}, tk));
    },
  });
})();

<script>
// ---- src/game/20-tape.js
// game/20-tape.js : the recorded controller tape, authored as a player's intentions. Owner: game.
//
// The tape is not typed frame by frame. It is a short program of moves ("run to x = 330",
// "jump holding A for 14 frames", "wait on the pipe until the bugs come") that a bot plays against
// the live engine, reading the same state a player sees. Each move holds some buttons until its
// condition is met; the buttons of every frame are recorded (FILM.game.tape()). The engine and the
// program are both deterministic, so the tape is a pure function of this file and game/10-engine.js.
// The film replays the recording of this program (game/21-recorded.js); after changing the program
// or the engine, regenerate it from FILM.game.record() (the replay falls back to this program if not).
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});
  const CQ = (FILM.__cq = FILM.__cq || {});
  const { A, B, START, DOWN, LEFT, RIGHT } = CQ.BUTTONS;

  // A move: { until(W, t) -> done?, btn(W, t) -> buttons } with t = frames since the move began.
  function makeBot(program) {
    let pc = 0;
    let t = 0;
    return function bot(W) {
      while (pc < program.length) {
        const m = program[pc];
        if (m.until(W, t)) {
          pc++;
          t = 0;
          continue;
        }
        const b = m.btn(W, t);
        t++;
        return b;
      }
      return 0;
    };
  }
  CQ.makeBot = makeBot;

  const mv = (until, btn) => ({ until, btn: typeof btn === 'function' ? btn : () => btn });

  // The planner's eye: copy the world and play a button sequence forward on the copy, collecting
  // events. The real world is untouched (the copy shares nothing with it).
  // goal(copy, events, k) returns true (reached), false (this try failed) or null (keep playing).
  // Style rules every plan obeys: Claw'd's drawing stays below the HUD band (its top at y >= 32), and
  // an airborne Claw'd never scrapes a wall (a jump that loses its speed against a pipe side looks clumsy).
  const HEAD_MIN = 32;
  function lookahead(W, seq, horizon, goal, o) {
    const c = CQ.cloneWorld(W);
    for (let k = 0; k < horizon; k++) {
      const b = k < seq.length ? seq[k] : seq[seq.length - 1];
      const vx0 = c.p.vx;
      const air0 = !c.p.ground;
      const ev = CQ.step(c, b);
      const p = c.p;
      if (p.st === 'play' && !(o && o.free)) {
        if (CQ.drawTop(p) < HEAD_MIN) return false;
        if ((air0 || !p.ground) && vx0 !== 0 && p.vx === 0) return false;
      }
      const r = goal(c, ev, k);
      if (r === true) return true;
      if (r === false) return false;
    }
    return false;
  }
  CQ.lookahead = lookahead;
  const R = RIGHT, RB = RIGHT | B, L = LEFT, LB = LEFT | B;
  const M = {
    /** hold b for n frames */
    hold: (b, n) => mv((W, t) => t >= n, b),
    /** nothing until global frame f */
    at: (f) => mv((W) => W.f >= f, 0),
    /** nothing until the console is in mode m */
    mode: (m) => mv((W) => W.mode === m, 0),
    /** hold b until the player's x reaches x (moving right) */
    to: (x, b = RB) => mv((W) => W.p.x >= x, b),
    /** hold b until the player's x falls to x (moving left) */
    back: (x, b = L) => mv((W) => W.p.x <= x, b),
    /** hold b until pred(W) */
    until: (pred, b = 0) => mv((W, t) => pred(W, t), b),
    /** a fresh A press held n frames together with b (releases A for a frame first if it was down) */
    jump(b, n) {
      let start = -1;
      return mv(
        (W, t) => start >= 0 && t - start >= n,
        (W, t) => {
          if (start < 0) {
            if (W.prev & A) return b;
            start = t;
          }
          return b | A;
        }
      );
    },
    /** hold b until the player stands on something */
    land: (b = RB) => mv((W, t) => t > 0 && W.p.ground, b),
    /** hold b until the nearest live enemy ahead is within dx px of the player's front */
    near: (dx, b = RB) => mv((W) => gapAhead(W) <= dx, b),
    /** walk (or run, with B) to stand still at x: brake early enough to stop there, like a player lining up a jump */
    goto: (x, run = false) =>
      mv(
        (W, t) => (Math.abs(W.p.x - x) < 2 && W.p.vx === 0 && W.p.ground) || t > 240,
        (W) => {
          const p = W.p;
          const PH = CQ.PH;
          const dx = x - p.x;
          const v = p.vx;
          const dir = Math.sign(dx);
          if (Math.abs(dx) < 2) return 0;
          if (v * dir > 0) {
            const coast = (v * v) / (2 * PH.relDec);
            const skid = (v * v) / (2 * PH.skidDec);
            if (coast >= Math.abs(dx) - 1) {
              // friction alone would overshoot: skid when a skid stops just in time, coast until then
              if (skid >= Math.abs(dx) - 3 && Math.abs(v) > PH.skidTurn) return dir > 0 ? LEFT : RIGHT;
              return 0;
            }
          }
          return (dir > 0 ? RIGHT : LEFT) | (run ? B : 0);
        }
      ),
    /**
     * the planner's jump: hold b, and on the first frame where "press A now, hold it n frames, then
     * keep b" reaches goal(world, events) within the horizon, press A for real
     */
    // o.after: buttons once A is released (default b); o.mids: frames of b between releasing A and
    // switching to o.after (tried in order; default [0]); o.wait: buttons while no plan works yet
    planJump(b, ns, goal, o = {}) {
      ns = Array.isArray(ns) ? ns : [ns];
      const horizon = o.horizon || 90;
      const bAfter = o.after != null ? o.after : b;
      const bWait = o.wait != null ? o.wait : b;
      const mids = o.mids || [0];
      let start = -1;
      let plan = null;
      // the plan's buttons run to the end, then its last buttons are held until Claw'd lands (or
      // leaves play: the flagpole, the axe), exactly as the lookahead played them
      return mv(
        (W, t) => start >= 0 && t - start >= plan.length - 1 && (W.p.ground || W.p.st !== 'play'),
        (W, t) => {
          if (start >= 0) return plan[Math.min(t - start, plan.length - 1)];
          if (W.prev & A) return bWait;
          for (const tryN of ns) {
            for (const mid of mids) {
              const seq = [];
              for (let k = 0; k < tryN; k++) seq.push(b | A);
              for (let k = 0; k < mid; k++) seq.push(b);
              seq.push(bAfter);
              if (lookahead(W, seq, horizon, goal, o)) {
                // o.late: a showman's timing, jump only when waiting one more frame would fail
                if (o.late && lookahead(W, [bWait].concat(seq), horizon + 1, goal, o)) return bWait;
                start = t;
                plan = seq;
                return seq[0];
              }
            }
          }
          return bWait;
        }
      );
    },
    /**
     * a run-up and a jump: while waiting (o.wait), try "hold b until x >= xJump, then b|A for n frames,
     * then b" for each n; commit to the first that reaches goal, and play it through to the landing
     */
    planRunJump(b, xJump, ns, goal, o = {}) {
      const horizon = o.horizon || 120;
      const bWait = o.wait != null ? o.wait : 0;
      let start = -1;
      let plan = null;
      const runUp = (W) => {
        const c = CQ.cloneWorld(W);
        const pre = [];
        while (c.p.x < xJump && pre.length < 120) {
          pre.push(b);
          CQ.step(c, b);
          if (c.p.st !== 'play') return null;
        }
        return pre.length < 120 ? pre : null;
      };
      return mv(
        (W, t) => start >= 0 && t - start >= plan.length - 1 && (W.p.ground || W.p.st !== 'play'),
        (W, t) => {
          if (start >= 0) return plan[Math.min(t - start, plan.length - 1)];
          const pre = runUp(W);
          if (pre) {
            for (const n of ns) {
              const seq = pre.slice();
              for (let k = 0; k < n; k++) seq.push(b | A);
              seq.push(b);
              // the goal counts frames from the jump (negative during the run-up)
              const g = (c, ev, k) => goal(c, ev, k - pre.length);
              if (lookahead(W, seq, horizon + pre.length, g, o)) {
                start = t;
                plan = seq;
                return seq[0];
              }
            }
          }
          return bWait;
        }
      );
    },
    /** wait (holding bWait) until holding b from now reaches goal within the horizon, then hold b until it does */
    planGo(b, goal, o = {}) {
      const horizon = o.horizon || 120;
      const bWait = o.wait != null ? o.wait : 0;
      let go = false;
      return mv(
        (W, t) => go && goal(W, [], 99) === true,
        (W) => {
          if (!go && lookahead(W, [b], horizon, goal, o)) go = true;
          return go ? b : bWait;
        }
      );
    },
    /** skip move m when pred(W) already holds as it begins (the goal was reached some other way) */
    skipIf(pred, m) {
      let skip = null;
      return mv(
        (W, t) => {
          if (t === 0 && skip === null) skip = !!pred(W);
          return skip || m.until(W, t);
        },
        (W, t) => m.btn(W, t)
      );
    },
    /** skid or coast to a standstill */
    brake: () => mv((W, t) => W.p.vx === 0 && W.p.ground, (W) => (W.p.vx > 0 ? LEFT : W.p.vx < 0 ? RIGHT : 0)),
    /** hold b until the player's state is st */
    state: (st, b = 0) => mv((W) => W.p.st === st, b),
  };
  CQ.moves = M;

  function gapAhead(W) {
    let best = Infinity;
    for (const e of W.lv.ents) {
      if (e.st !== 'walk' && e.st !== 'shell') continue;
      const g = e.x - (W.p.x + 16);
      if (g > -8 && g < best) best = g;
    }
    return best;
  }
  CQ.gapAhead = gapAhead;

  // goals for the planner: an event (optionally tested) before the player is back on the ground
  const onEvent = (type, test) => (c, ev, k) => {
    for (const e of ev) if (e.type === type && (!test || test(e, c))) return true;
    if (c.p.st !== 'play') return false;
    return k > 2 && c.p.ground ? false : null;
  };
  const stomps = (n) => onEvent('stomp', (e) => e.combo >= n);
  // lands on its feet where test(copy) holds
  const lands = (test) => (c, ev, k) => (c.p.st !== 'play' ? false : k > 2 && c.p.ground ? !!test(c) : null);
  const songIs = (id) => onEvent('song', (e) => e.id === id);
  // g1, then g2 (state lives on the copy, so every lookahead starts fresh)
  const then = (g1, g2) => (c, ev, k) => {
    if (!c.__then) {
      const r = g1(c, ev, k);
      if (r === true) {
        c.__then = true;
        return null;
      }
      return r;
    }
    return g2(c, ev, k);
  };
  const landsPast = (x) => lands((c) => c.p.x > x);
  // lands where test(copy) holds having collected at least n coins on the way
  const collects = (n, test) => (c, ev, k) => {
    for (const e of ev) if (e.type === 'coin') c.__coins = (c.__coins || 0) + 1;
    if (c.p.st !== 'play') return false;
    return k > 2 && c.p.ground ? (c.__coins || 0) >= n && (!test || !!test(c)) : null;
  };
  const item = (W, k) => W.items.find((it) => it.k === k);
  // unhurt and still big (a plan that costs a hit is no plan)
  const whole = (c) => c.p.inv === 0 && c.p.big;
  // g, and on the way a fireball of firebar i came within maxD px of Claw'd's body without touching it
  // (the gap is measured with the engine's own hit test: a gap of 0 or less would be a hit)
  const closeCall = (i, maxD, g) => (c, ev, k) => {
    const p = c.p;
    const fb = c.lv.firebars[i];
    if (p.st === 'play' && fb) {
      const L = p.x + 8 - (p.big ? 10 : 5), R = p.x + 7 + (p.big ? 10 : 5), T = p.y - (p.big ? 22 : 16) + 3;
      for (const [bx, by] of CQ.firebarBalls(fb, c.lv.t)) {
        const d = Math.max(bx + 1 - R, L + 1 - (bx + 7), by + 1 - p.y, T - (by + 7));
        if (c.__near === undefined || d < c.__near) c.__near = d;
      }
    }
    const r = g(c, ev, k);
    return r === true ? c.__near !== undefined && c.__near > 0 && c.__near <= maxD : r;
  };

  // the planner's goals, for the game's level proofs (tools/proof/programs, docs/game-spec.md 2.5)
  CQ.goals = { onEvent, stomps, lands, landsPast, collects, then, closeCall, songIs };

  // The film's play. x values are the player's left edge in world px (tile * 16).
  // The star pickup lands where the overworld's hook cadences: STAR_AT frames after the song's first frame.
  const STAR_AT = 720;
  CQ.program = function program() {
    let intro = -1; // the frame the overworld song started (read off the world as play begins)
    return [
      // title: the cartridge boots into the attract screen; START on the menu
      M.at(200),
      M.hold(START, 3),
      M.mode('play'),
      mv((W) => ((intro = W.f - 1), true), 0),
      // World 1-1: the first bug, stomped on the open first screen
      M.planJump(RB, [2, 3, 4, 6, 8], stomps(1)),
      M.land(RB),
      // the coin arc over the pit, all five in one leap
      M.planJump(RB, [4, 6, 8, 10, 12, 14, 16, 18, 20], collects(5, (c) => c.p.x > 470), { horizon: 90 }),
      M.land(RB),
      // the floppy gateway: over the low pipe, under the floppy block (col 45)
      M.planJump(RB, [6, 8, 10, 12, 14, 16], lands((c) => c.p.x > 660 && c.p.x < 700)),
      M.land(R),
      M.goto(716),
      M.planJump(0, [6, 8, 10, 12], onEvent('sprout')),
      M.land(0),
      // it rises onto the lintel and slides off its end: be there, under the open sky, when it drops
      M.until((W) => W.freeze > 0, (W) => (W.p.x < 786 ? R : W.p.vx > 0 ? LEFT : 0)),
      M.until((W) => W.freeze === 0, 0),
      // big: up onto the gateway's far pipe and off the other side
      M.planJump(RB, [6, 8, 10, 12, 14, 16, 20, 24], lands((c) => c.p.y === 116 || c.p.x > 852), { horizon: 90 }),
      M.land(RB),
      // the brick canopy: bricks smashed on the run, each tossing up the coin on it
      M.planJump(RB, [2, 3, 4, 6], onEvent('brick'), { horizon: 30 }),
      M.land(RB),
      M.planJump(RB, [2, 3, 4, 6], onEvent('brick'), { horizon: 30 }),
      M.land(RB),
      M.planJump(RB, [2, 3, 4, 6], onEvent('brick'), { horizon: 30 }),
      M.land(RB),
      // past the canopy's end, a leap at nothing: the hidden block (col 76) and the Claude spark; he
      // brakes in the air, turns, and catches the spark at the top of a full leap as it arcs over him
      M.planJump(RB, [2, 3, 4, 6, 8], onEvent('sprout'), { horizon: 30, after: L }),
      M.land(RB),
      M.brake(),
      M.until((W) => item(W, 'spark') && item(W, 'spark').st === 'move', L),
      M.planJump(R, [16, 17, 18, 19, 20, 21, 22, 23, 24, 26, 28, 30], then(onEvent('song', (e) => e.id === 'star' && e.f === intro + STAR_AT), lands(() => true)), { horizon: 120, wait: R }),
      M.land(RB),
      // the star run: through the bug packs, smashing the brick shelf overhead, over the pit
      M.to(1500, RB),
      M.planJump(RB, [2, 3, 4], onEvent('brick'), { horizon: 30 }),
      M.land(RB),
      M.planJump(RB, [2, 3, 4], onEvent('brick'), { horizon: 30 }),
      M.land(RB),
      M.planJump(RB, [4, 6, 8, 10, 12, 14, 16], landsPast(1766), { horizon: 60 }),
      M.land(RB),
      // the quiet stretch: a ? block on the run, the last bug stomped on the way down and the bounce
      // into the second ? block; onto the pipe, and down it
      M.planJump(RB, [2, 3, 4, 6], then(onEvent('coin'), stomps(1)), { horizon: 40 }),
      M.land(RB),
      M.planJump(R, [4, 6, 8, 10, 12, 14, 16], lands((c) => c.p.y === 116 && c.p.x > 2140 && c.p.x < 2164), { horizon: 80 }),
      M.land(0),
      M.until((W) => W.p.st !== 'play', DOWN),
      // the coin room: down out of the ceiling, over the hump through the arc of coins, out by the side pipe
      M.until((W) => W.li === 1 && W.p.y > 84, 0),
      M.land(RB),
      M.planJump(RB, [16, 18, 20, 22, 23, 24, 25, 26], collects(8, (c) => c.p.y === 148 && c.p.x > 192), { horizon: 90 }),
      M.land(RB),
      M.until((W) => W.p.st !== 'play', R),
      M.until((W) => W.li === 0 && W.p.st === 'play', 0),
      // the shell-bug: stomped off the pipe, and the shell booted into the three bugs behind it
      M.planJump(RB, [2, 4, 6, 8, 10, 12], then(stomps(1), onEvent('kick')), { horizon: 120, after: R }),
      M.until((W) => W.p.ground, R),
      // up the two floating platforms, and a hop to the very top of the flagpole
      M.planJump(RB, [4, 6, 8, 10, 12, 14, 16], lands((c) => c.p.y === 116 && c.p.x > 2730), { horizon: 80 }),
      M.land(RB),
      M.planJump(RB, [4, 6, 8, 10, 12, 14, 16], lands((c) => c.p.y === 84 && c.p.x > 2800), { horizon: 80 }),
      M.land(RB),
      M.planJump(RB, [1, 2, 3, 4, 5, 6, 8], onEvent('flagpole', (e) => e.height === 5000), { horizon: 60 }),
      // WORLD 1-4
      M.mode('lives'),
      M.mode('play'),
      M.to(90, RB),
      M.land(RB),
      // the first lava pit
      M.planJump(RB, [6, 8, 10, 12, 14], (c, ev, k) => (whole(c) ? landsPast(340)(c, ev, k) : false)),
      M.land(RB),
      // the first firebar: run under it through a gap
      M.planGo(RB, (c) => (c.p.st !== 'play' || !whole(c) ? false : c.p.x > 500 ? true : null), { horizon: 90, wait: 0 }),
      // the second pit, a quick hop from its lip on the run, landing short of the second firebar's reach
      M.planJump(RB, [1, 2, 3, 4], (c, ev, k) => (whole(c) ? lands((q) => q.p.x > 596 && q.p.x < 636)(c, ev, k) : false), { horizon: 60, wait: RB }),
      M.land(0),
      M.brake(),
      // the second firebar, turning the other way and faster: up onto the step past it, with a fireball
      // brushing by close enough to feel
      M.planRunJump(RB, 724, [4, 6, 8, 10, 12, 14, 16], closeCall(1, 5, (c, ev, k) => (whole(c) ? lands((q) => q.p.y === 116 && q.p.x > 770)(c, ev, k) : false)), { horizon: 120, wait: 0 }),
      M.land(RB),
      // the Big Bug: over it in one bound, along the bridge, and press the ENTER key
      M.planJump(RB, [6, 8, 10, 12, 14, 16, 18, 20, 24], (c, ev, k) => {
        if (c.p.st === 'axe') return true;
        if (c.p.st !== 'play' || !whole(c)) return false;
        return null;
      }, { horizon: 150, wait: R }),
      M.state('axe', RB),
      M.until(() => false, 0),
    ];
  };
})();

</script>
