    '00:g,80:1t,40:a,00:1v,83:6,82:1w,83:2,82:j,83:2,82:i,83:2,82:1j,83:6,40:h,82:1,40:k,80:2,81:k,' +
    '80:m,82:2m,83:2,82:i,83:2,82:16,83:g,82:34,83:2,82:z,81:8,80:d,00:1,20:1,00:1d,82:1j,83:o,82:p,' +
    '80:3,00:1k,82:8,83:c,80:1b,82:1y,83:g,82:h,83:a,82:i,83:2,82:f,00:al,82:37,83:a,82:2p,83:4,82:k,' +

<script>
// ---- src/game/30-draw.js
// game/30-draw.js : paints one snapshot (game/10-engine.js) into the console's 320x180 frame buffer.
// Every pixel is repainted each frame, only in lib.NES colours, through lib.sprite / lib.pxtext.
// Owner: game.
//
// Layers, back to front: backdrop (a flash may replace it for a frame); then, clipped below the HUD band
// (y >= 32) so nothing from the world ever enters it: scenery (clouds, hills, bushes, the castle flag, the
// castle); sprites that sit behind the tiles (a power-up rising out of its block, Claw'd inside a pipe,
// the boss sinking into the lava); tiles; bumped blocks; sprites; score pops; the castle's door and right
// wall redrawn over Claw'd as he walks in. Then the HUD and the title / lives / ending text.
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});
  const CQ = FILM.__cq;
  const rowTop = CQ.rowTop;

  let L = null; // FILM.lib, resolved on first draw (lib.js loads before the game, but stay lazy)
  let N = null;
  let PALS = null;
  function libs() {
    if (L) return;
    L = FILM.lib;
    N = L.NES;
    // palette slots used by the snapshot: 1-4 the Claude spark cycle (the fourth is Claw'd's own),
    // 5 and 6 the underground bugs (the overworld bug's black legs would vanish on black)
    const SP = L.SPAL || {};
    const star = SP.clawdStar || [];
    PALS = [null, star[0], star[1], star[2], star[3], SP.bugU, SP.shellbugU];
  }

  const MANI = () => FILM.SPRITE_MANIFEST || {};
  const A = CQ.ANCHOR;
  // one reusable options object: lib.sprite reads it synchronously
  const O = { flip: false, flipV: false, pal: undefined };
  function spr(ctx, name, x, y, flags, pal) {
    if (flags & (A.FEET | A.RIGHT | A.LEFT)) {
      const m = MANI()[name];
      const w = m ? m.w : 16, h = m ? m.h : 16;
      y -= h;
      if (flags & A.FEET) x -= w >> 1;
      else if (flags & A.RIGHT) x -= w;
    }
    O.flip = !!(flags & 1);
    O.flipV = !!(flags & 2);
    O.pal = pal ? PALS[pal] || undefined : undefined;
    L.sprite(ctx, name, x, y, O);
  }

  // ------------------------------------------------------------------------------------------
  // Scenery (overworld): the level's own hand-placed list (def.scenery), checked against the map once:
  // a hill or bush is dropped if any column under it lacks ground or holds a pipe, block or the pole
  // ------------------------------------------------------------------------------------------
  const sceneryCache = new Map();
  const POLE_CODES = ['|'.charCodeAt(0), '!'.charCodeAt(0)];
  function scenery(lv) {
    if (sceneryCache.has(lv.idx)) return sceneryCache.get(lv.idx);
    const out = [];
    const orig = lv.orig;
    const w = lv.w;
    const at = (tx, ty) => (tx < 0 || tx >= w || ty < 0 || ty > 11 ? 46 : orig[ty * w + tx]);
    const M = MANI();
    for (const [name, col, cy] of lv.def.scenery || []) {
      const m = M[name] || { w: 32, h: 16 };
      const x = Math.round(col * 16);
      if (name.startsWith('cloud')) {
        out.push([name, x, cy, 0]);
        continue;
      }
      let ok = true;
      for (let c = Math.floor(x / 16); c <= Math.floor((x + m.w - 1) / 16) && ok; c++) {
        if (CQ.SOLID[at(c, 10)] !== 1) ok = false;
        for (let r = 7; r <= 9 && ok; r++) if (CQ.SOLID[at(c, r)] === 1 || POLE_CODES.indexOf(at(c, r)) >= 0) ok = false;
      }
      if (ok) out.push([name, x, 148 - m.h, name.startsWith('hill') ? 1 : 2]);
    }
    // clouds, then hills, then bushes in front
    out.sort((p, q) => p[3] - q[3]);
    sceneryCache.set(lv.idx, out);
    return out;
  }

  // ------------------------------------------------------------------------------------------
  // Tiles
  // ------------------------------------------------------------------------------------------
  const TILE = {};
  function tileTable(kind) {
    if (TILE[kind]) return TILE[kind];
    const t = new Array(128).fill(null);
    const set = (ch, name) => (t[ch.charCodeAt(0)] = name);
    const names = CQ.TILE_NAMES[kind];
    for (const ch in names) set(ch, names[ch]);
    set('[', 't_pipeTL'); set(']', 't_pipeTR'); set('{', 't_pipeL'); set('}', 't_pipeR');
    set('h', 't_pipeHT'); set('H', 't_pipeHB'); set('-', 't_pipeHBodyT'); set('_', 't_pipeHBodyB');
    set('j', 't_pipeJoinT'); set('J', 't_pipeJoinB');
    set('!', 't_poleTop'); set('|', 't_pole'); set('%', 't_chain'); set('l', 't_lava');
    set('?', '?'); set('M', '?'); set('o', 'o'); set('L', 'L');
    TILE[kind] = t;
    return t;
  }

  // the tile code of cell i as it was when the snapshot was taken (chg = length of the change log then)
  function histOf(lv) {
    if (lv.histLen === lv.changes.length) return lv.hist;
    const h = new Map();
    const c = lv.changes;
    for (let k = 0; k < c.length; k += 2) {
      let a = h.get(c[k]);
      if (!a) h.set(c[k], (a = []));
      a.push(k, c[k + 1]);
    }
    lv.hist = h;
    lv.histLen = c.length;
    return h;
  }
  function codeAt(lv, hist, i, chg) {
    const a = hist.get(i);
    if (!a) return lv.orig[i];
    let code = lv.orig[i];
    for (let k = 0; k < a.length; k += 2) {
      if (a[k] < chg) code = a[k + 1];
      else break;
    }
    return code;
  }

  // the ? block shimmer on the console's 48-frame cadence (lib.shimmer)
  const qName = (f) => 't_q' + (1 + L.shimmer(f));

  function drawTiles(ctx, s, f) {
    const lv = s.lv;
    const tab = tileTable(lv.def.kind);
    const hist = histOf(lv);
    const cam = s.cam;
    const tx0 = Math.max(0, Math.floor(cam / 16)), tx1 = Math.min(lv.w - 1, Math.floor((cam + 319) / 16));
    const hide = s.hide;
    const q = qName(f);
    const lava = (s.lt >> 4) & 1 ? 't_lavaTop2' : 't_lavaTop1';
    const coin = 'coin' + (1 + ((f >> 3) & 3));
    for (let ty = 0; ty < 12; ty++) {
      const y = rowTop(ty);
      for (let tx = tx0; tx <= tx1; tx++) {
        const i = ty * lv.w + tx;
        const code = codeAt(lv, hist, i, s.chg);
        const name = tab[code];
        if (!name) continue;
        if (hide && hide.indexOf(i) >= 0) continue;
        const x = tx * 16 - cam;
        if (name === '?') L.sprite(ctx, q, x, y);
        else if (name === 'o') L.sprite(ctx, coin, x + 4, y + 1);
        else if (name === 'L') L.sprite(ctx, lava, x, y);
        else L.sprite(ctx, name, x, y);
      }
    }
  }

  // ------------------------------------------------------------------------------------------
  // HUD and text
  // ------------------------------------------------------------------------------------------
  // Text layers (the HUD, the title, the lives screen, the ending) are painted once per distinct
  // content into their own transparent canvas and blitted: pixel text is thousands of 1-px fills.
  // Each layer is a pure function of its key, so the cache never changes what a frame shows.
  const layers = new Map();
  function layer(ctx, id, key, h, paint) {
    let e = layers.get(id);
    if (!e) {
      const c = FILM.makeCanvas(320, h);
      e = { c, g: c.getContext('2d'), key: null };
      e.g.imageSmoothingEnabled = false;
      layers.set(id, e);
    }
    if (e.key !== key) {
      e.g.clearRect(0, 0, 320, h);
      paint(e.g);
      e.key = key;
    }
    ctx.drawImage(e.c, 0, 0);
  }
  function hud(ctx, s, f) {
    const shim = L.shimmer(f);
    const time = s.time >= 0 ? s.time : null;
    layer(ctx, 'hud', s.score + '|' + s.coins + '|' + s.world + '|' + time + '|' + shim, L.HUD_H || 32, (g) =>
      L.hud(g, { score: s.score, coins: s.coins, world: s.world, time, frame: f })
    );
  }

  // The title: the Claude-Code-style welcome box, the menu with its ▶ cursor, the high score.
  function titleText(ctx, s) {
    // after START the cursor flickers while the console gets ready
    const blink = s.title.started && (s.title.mt >> 2) & 1 ? 1 : 0;
    layer(ctx, 'title', s.top + '|' + blink, 180, (g) => {
      const white = N[0x30];
      L.titleBox(g, 160, 38, { text: 'CLAUDE QUEST', lines: ['©1986 CLAWD SOFT'] });
      if (!blink) L.pxtext(g, '▶', 110, 94, { color: N[0x26] });
      L.pxtext(g, 'NEW QUEST', 124, 94, { color: white });
      L.pxtext(g, 'CONTINUE', 124, 106, { color: white });
      L.pxtext(g, 'HI-SCORE ' + String(s.top).padStart(6, '0'), 160, 122, { color: white, align: 'center' });
    });
  }

  function livesText(ctx, s) {
    layer(ctx, 'lives', s.world + '|' + s.lives, 180, (g) => {
      const white = N[0x30];
      L.pxtext(g, 'WORLD ' + s.world, 160, 68, { color: white, align: 'center' });
      L.sprite(g, 'clawdS_idle', 132, 86);
      L.pxtext(g, '×', 158, 91, { color: white });
      L.pxtext(g, String(s.lives), 176, 91, { color: white });
    });
  }

  // The ending: Pearl's line centred in her teal, then the completion summary as a left-aligned block
  // (✻ in salmon, ✓ in green), typed on a character a frame; PUSH START TO SHIP IT blinks under it.
  // Everything sits between the HUD band and the heads of Claw'd and Pearl (y 124).
  const END_Y = [42, 62, 74, 86, 98];
  const END_PUSH_Y = 114;
  function endingText(ctx, s) {
    const e = s.end;
    layer(ctx, 'ending', e.lines.join('/') + '|' + e.chars.join(',') + '|' + e.push, 180, (g) => {
      const white = N[0x30];
      const lines = e.lines;
      if (e.chars[0] > 0) {
        const x = 160 - Math.floor(L.pxtextWidth(lines[0]) / 2);
        L.pxtext(g, lines[0].slice(0, e.chars[0]), x, END_Y[0], { color: N[0x3c] });
      }
      let bw = 0;
      for (let i = 1; i < lines.length; i++) bw = Math.max(bw, L.pxtextWidth(lines[i]));
      const bx = 160 - Math.floor(bw / 2);
      for (let i = 1; i < lines.length; i++) {
        const n = e.chars[i];
        if (n <= 0) continue;
        const mark = lines[i][0];
        L.pxtext(g, mark, bx, END_Y[i], { color: mark === '✻' ? N[0x26] : N[0x2a] });
        if (n > 1) L.pxtext(g, lines[i].slice(1, n), bx + 8, END_Y[i], { color: white });
      }
      if (e.push === 1) L.pxtext(g, 'PUSH START TO SHIP IT', 160, END_PUSH_Y, { color: N[0x28], align: 'center' });
    });
  }

  // ------------------------------------------------------------------------------------------
  // The frame
  // ------------------------------------------------------------------------------------------
  const CASTLE_Y = 68; // the castle stands on the ground (80 tall, bottom at y 148)
  const CASTLE_TIP = [68, 16]; // the right turret's tip, where the castle flag's staff stands
  // film: true for the film's frames (FILM.game.draw), false for a live console (FILM.game.create)
  function drawSnap(ctx, s, f, film) {
    libs();
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    const TL = FILM.TIMELINE;
    const off = film && TL && TL.crt && TL.crt.powerOff;
    // the film's set is dark after its power-off; a live console never is
    if (s.m === 3 || (off && f >= off[1])) {
      ctx.fillStyle = N[0x0f];
      ctx.fillRect(0, 0, 320, 180);
      if (s.m === 3) L.pxtext(ctx, 'GAME OVER', 160, 86, { color: N[0x30], align: 'center' });
      ctx.restore();
      return;
    }
    if (s.m === 1) {
      ctx.fillStyle = N[0x0f];
      ctx.fillRect(0, 0, 320, 180);
      hud(ctx, s, f);
      livesText(ctx, s);
      ctx.restore();
      return;
    }
    const lv = s.lv;
    const kind = lv.def.kind;
    const cam = s.cam;
    ctx.fillStyle = s.flash ? N[s.flash] : kind === 'over' ? N[0x22] : N[0x0f];
    ctx.fillRect(0, 0, 320, 180);
    // the world, clipped below the HUD band
    const HB = L.HUD_H || 32;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, HB, 320, 180 - HB);
    ctx.clip();
    for (const [name, x, y] of scenery(lv)) {
      const sx = x - cam;
      const m = MANI()[name];
      if (sx > 320 || sx + (m ? m.w : 80) < 0) continue;
      L.sprite(ctx, name, sx, y);
    }
    const cx = lv.def.castle ? lv.def.castle * 16 - cam : null;
    const castleOn = cx !== null && cx < 320 && cx > -96;
    if (castleOn) {
      if (s.cflag > 0) {
        // the flag climbs out of the turret's tip
        const tipY = CASTLE_Y + CASTLE_TIP[1];
        ctx.save();
        ctx.beginPath();
        ctx.rect(cx + CASTLE_TIP[0], HB, 16, tipY - HB);
        ctx.clip();
        L.sprite(ctx, 'castleFlag', cx + CASTLE_TIP[0], tipY - s.cflag);
        ctx.restore();
      }
      L.sprite(ctx, 'castle', cx, CASTLE_Y);
    }
    const spr16 = s.spr;
    const NAMES = CQ.NAMES;
    // sprites behind the tiles
    for (let k = 0; k < spr16.length; k += 5) {
      const fl = spr16[k + 3];
      if (fl & 4 && spr16[k] < 1000) spr(ctx, NAMES[spr16[k]], spr16[k + 1] - cam, spr16[k + 2], fl, spr16[k + 4]);
    }
    drawTiles(ctx, s, f);
    // bumped blocks, then the sprites and score pops (a pop's x is its centre)
    for (let k = 0; k < spr16.length; k += 5) {
      const fl = spr16[k + 3];
      if (fl & 16) L.sprite(ctx, NAMES[spr16[k]], spr16[k + 1] - cam, spr16[k + 2]);
    }
    for (let k = 0; k < spr16.length; k += 5) {
      const n = spr16[k];
      const fl = spr16[k + 3];
      if (n >= 1000) L.scoreText(ctx, CQ.POPS[n - 1000], spr16[k + 1] - cam, spr16[k + 2], { align: 'center' });
      else if (!(fl & 20)) spr(ctx, NAMES[n], spr16[k + 1] - cam, spr16[k + 2], fl, spr16[k + 4]);
    }
    // walking into the castle: its door and the wall right of it cover him
    if (castleOn && s.door >= 0) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(s.door - cam, CASTLE_Y, cx + 80 - (s.door - cam), 80);
      ctx.clip();
      L.sprite(ctx, 'castle', cx, CASTLE_Y);
      ctx.restore();
    }
    ctx.restore();
    hud(ctx, s, f);
    if (s.m === 0 && s.title) titleText(ctx, s);
    if (s.end) endingText(ctx, s);
    ctx.restore();
  }
  CQ.drawSnap = drawSnap;

  // Warm-up: build every sprite drawing the film will blit (each name, mirror, flip and palette it
  // appears in, every tile and scenery piece) on an off-screen canvas once, before the first frame,
  // so no frame pays for building one mid-film. Only lib's own caches change; no pixel does.
  function warm(states) {
    libs();
    const c = FILM.makeCanvas(64, 64);
    const g = c.getContext('2d');
    const seen = new Set();
    const NAMES = CQ.NAMES;
    for (const st of states) {
      const sp = st.spr;
      if (!sp) continue;
      for (let k = 0; k < sp.length; k += 5) {
        const n = sp[k];
        if (n >= 1000) continue;
        const key = n * 4096 + (sp[k + 3] & 3) * 256 + sp[k + 4];
        if (seen.has(key)) continue;
        seen.add(key);
        spr(g, NAMES[n], 0, 0, sp[k + 3] & 3, sp[k + 4]);
      }
    }
    const M = MANI();
    for (const name in M) L.sprite(g, name, 0, 0);
    return seen.size;
  }
  CQ.warm = warm;
})();

</script>
<script>
// ---- src/game/40-api.js
// game/40-api.js : FILM.game, the public face of the engine (docs/v2-architecture.md 4.1). Owner: game.
//
//   FILM.game.BUTTONS            { A: 1, B: 2, SELECT: 4, START: 8, UP: 16, DOWN: 32, LEFT: 64, RIGHT: 128 }
//   FILM.game.create(opts)       a live console: { step(buttons) -> events[], state(), draw(nativeCtx), frame }
//   FILM.game.sim()              the film, run once from frame 0 on the recorded tape and cached:
//                                { length, states[], events[], tape (Uint8Array of buttons per frame) }
//   FILM.game.draw(ctx, f)       paint film frame f (clamped to 0..length-1) into the 320x180 native buffer
//   FILM.game.events()           sim().events, sorted by f
//   FILM.game.tape()             sim().tape
//   FILM.game.record()           re-run the tape program: { length, fp, rle } for game/21-recorded.js
//
// The film and live play share one step function (game/10-engine.js). A film state keeps the buttons
// held on that frame (states[f].btn) for an input-display overlay.
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});
  const CQ = FILM.__cq;

  let SIM = null;
  function filmLength() {
    const TL = FILM.TIMELINE;
    if (TL && TL.duration > 0) return Math.round(TL.duration * (TL.fps || 60));
    return CQ.DEFAULT_LENGTH || 3840;
  }

  // One pass of the console over `length` frames; input(W, f) gives each frame's buttons.
  function run(length, input) {
    const W = CQ.newWorld({});
    const states = new Array(length);
    const events = [];
    const tape = new Uint8Array(length);
    for (let f = 0; f < length; f++) {
      const b = input(W, f);
      tape[f] = b;
      const ev = CQ.step(W, b);
      for (let i = 0; i < ev.length; i++) events.push(ev[i]);
      states[f] = CQ.snapshot(W);
    }
    return { length, states, events, tape, built: W.built, score: W.score };
  }

  // The fingerprint of a run: every event's frame and type, and the final score (FNV-1a).
  function fingerprint(S) {
    let h = 0x811c9dc5 | 0;
    const mix = (str) => {
      for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 0x01000193);
    };
    for (const e of S.events) mix(e.f + e.type + ';');
    mix('score' + S.score);
    return (h >>> 0).toString(16).padStart(8, '0');
  }

  // run-length tape: "bb:n" pairs (buttons in hex, count in base 36), comma separated
  function encode(tape) {
    const out = [];
    for (let i = 0; i < tape.length; ) {
      let j = i;
      while (j < tape.length && tape[j] === tape[i]) j++;
      out.push(tape[i].toString(16).padStart(2, '0') + ':' + (j - i).toString(36));
      i = j;
    }
    return out.join(',');
  }
  function decode(rle, length) {
    const tape = new Uint8Array(length);
    let f = 0;
    for (const run of rle.split(',')) {
      const [b, n] = run.split(':');
      const v = parseInt(b, 16);
      for (let k = parseInt(n, 36); k > 0 && f < length; k--) tape[f++] = v;
    }
    return f === length ? tape : null;
  }

  // The film plays the recorded tape (game/21-recorded.js). If the engine has moved on since the
  // recording (the fingerprint differs), the tape program is played live instead: same film, slower.
  function sim() {
    if (SIM) return SIM;
    const length = filmLength();
    const rec = CQ.RECORDED;
    if (rec && rec.length === length) {
      const tape = decode(rec.rle, length);
      if (tape) {
        const S = run(length, (W, f) => tape[f]);
        if (fingerprint(S) === rec.fp) {
          S.source = 'recorded';
          SIM = S;
          return SIM;
        }
      }
    }
    const bot = CQ.makeBot(CQ.program());
    SIM = run(length, (W) => bot(W));
    SIM.source = 'program';
    return SIM;
  }

  // A fresh recording from the tape program (for regenerating game/21-recorded.js).
  function record() {
    const S = run(filmLength(), ((bot) => (W) => bot(W))(CQ.makeBot(CQ.program())));
    return { length: S.length, fp: fingerprint(S), rle: encode(S.tape) };
  }

  let warmed = false;
  function draw(ctx, f) {
    const S = sim();
    if (!warmed) {
      warmed = true;
      CQ.warm(S.states);
    }
    f = Math.max(0, Math.min(S.length - 1, Math.floor(Number(f) || 0)));
    CQ.drawSnap(ctx, S.states[f], f, true); // film frames go dark after the power-off
  }

  function create(opts) {
    const W = CQ.newWorld(Object.assign({}, opts, { live: true }));
    return {
      step(buttons) {
        return CQ.step(W, buttons | 0);
      },
      state() {
        return W;
      },
      snapshot() {
        return CQ.snapshot(W);
      },
      draw(ctx) {
        const s = CQ.snapshot(W);
        CQ.drawSnap(ctx, s, s.f, false); // a live console never goes dark on the film's clock
      },
      get frame() {
        return W.f;
      },
    };
  }

  FILM.game = Object.freeze({
    BUTTONS: CQ.BUTTONS,
    create,
    sim,
    draw,
    events: () => sim().events,
    tape: () => sim().tape,
    record,
  });
})();

</script>
<script>
// ---- src/foley.js
// foley.js : the TV set itself, the one sound in the film that is not the console. Owner: audio.
// Contract: docs/v2-architecture.md section 4.4; design notes: docs/sound.md.
//
// FILM.foley.apply(buf, sr) works on the film's mono soundtrack buffer (sample 0 = global time 0):
//   1 the speaker  the console's sound reaches the room through the TV, so it is multiplied by the set's
//                  speaker gain: silent while the set is off, warming up after the power switch, dying
//                  away over the caption after it is switched off.
//   2 the set      adds the TV's own sounds at the power windows in FILM.TIMELINE.crt (global frames), each
//                  on the picture's own key frame (FILM.crt.marks()):
//                  power-on   the switch click, the tube's thunk, the degauss "bwoom" riding a 60 Hz hum,
//                             a burst of static that fades as the picture settles, and the flyback's faint
//                             15.734 kHz whine fading in (it stays, very quietly, while the set is on)
//                  power-off  the switch click, the collapse "zhip", a static tick, the whine running down
//                  The set's switching sounds reach us with a small room's early reflections (the
//                  console's sound and the whine do not).
// Every sample is a pure function of its index and the timeline; noise comes from FILM.lib.rng with
// fixed seeds, so the buffer is deterministic and any seek hears the same samples.
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const FILM = root.FILM;
  const lib = FILM.lib;
  const TAU = Math.PI * 2;
  const FPS = 60;
  const LINE_HZ = 15734.26; // NTSC horizontal rate: the flyback transformer sings at it

  const smooth = (a, b, t) => {
    const x = Math.max(0, Math.min(1, (t - a) / (b - a)));
    return x * x * (3 - 2 * x);
  };
  // The picture's key frames (FILM.crt.marks(): the switch click, the line opening, the degauss, the lock;
  // the collapse's squeeze, dot and afterglow), so every sound lands on what the tube shows. Without the
  // display loaded they are derived from FILM.TIMELINE.crt in crt.js's own proportions.
  function windows() {
    const c = (FILM.TIMELINE && FILM.TIMELINE.crt) || {};
    const on = Array.isArray(c.powerOn) ? c.powerOn : null;
    const off = Array.isArray(c.powerOff) ? c.powerOff : null;
    const m = FILM.crt && typeof FILM.crt.marks === 'function' ? FILM.crt.marks() : {};
    const w = { on: null, off: null };
    if (on) {
      const k = (on[1] - on[0]) / 150;
      const at = (x) => on[0] + Math.round(x * k);
      const mo = m.powerOn || {};
      w.on = { start: on[0], click: mo.click != null ? mo.click : at(20), line: mo.line != null ? mo.line : at(22), open: mo.open != null ? mo.open : at(27), deg: at(44), locked: mo.locked != null ? mo.locked : at(100), settled: on[1] };
    }
    if (off) {
      const k = (off[1] - off[0]) / 120;
      const at = (x) => off[0] + Math.round(x * k);
      const mf = m.powerOff || {};
      w.off = { start: off[0], squeeze: mf.line != null ? mf.line : at(7), dot: mf.dot != null ? mf.dot : at(15), afterglow: mf.afterglow != null ? mf.afterglow : at(19), end: off[1] };
    }
    return w;
  }

  // The speaker gain at global time t: 0 until the switch clicks, up between 0.1 and 0.5 s after it as the
  // audio stage warms (the console is already playing), then 1 until the set is switched off. Then the
  // sound dies with the supply: an exponential decay (time constant 0.35 s) that is inaudible by the
  // time the caption leaves the dark glass, closed to exact silence between 1.6 and 2.0 s.
  const OFF_TAU = 0.35;
  const OFF_END = 2.0;
  function speaker(t, w) {
    let g = 1;
    if (w.on) {
      const t0 = w.on.click / FPS;
      g = smooth(t0 + 0.1, t0 + 0.5, t);
    }
    if (w.off) {
      const u = t - w.off.start / FPS;
      if (u >= 0) g *= Math.exp(-u / OFF_TAU) * (1 - smooth(OFF_END - 0.4, OFF_END, u));
    }
    return g;
  }

  // Add fn(t, i) to buf over [t0, t1) seconds.
  function add(buf, sr, t0, t1, fn) {
    const i0 = Math.max(0, Math.round(t0 * sr));
    const i1 = Math.min(buf.length, Math.round(t1 * sr));
    for (let i = i0; i < i1; i++) buf[i] += fn(i / sr - t0, i);
  }
  // A one-pole filter pair, for coloured noise.
  function bandNoise(seed, lo, hi, sr) {
    const r = lib.rng(seed);
    const aH = Math.exp((-TAU * lo) / sr);
    const aL = 1 - Math.exp((-TAU * hi) / sr);
    let hp = 0;
    let px = 0;
    let lp = 0;
    return () => {
      const x = r() * 2 - 1;
      hp = aH * (hp + x - px);
      px = x;
      lp += aL * (hp - lp);
      return lp;
    };
  }

  // The power switch: a latch's bright double tick and the small thump of the speaker cone.
  function click(buf, sr, t, seed, bright, level) {
    const g = level == null ? 1 : level;
    const n = bandNoise(seed, 1800, 9000, sr);
    add(buf, sr, t, t + 0.05, (u) => {
      const tick = Math.exp(-u / 0.0022) * (0.11 * Math.sin(TAU * 2350 * bright * u) + 0.07 * Math.sin(TAU * 4130 * bright * u + 1) + 0.9 * n());
      const cone = 0.06 * Math.exp(-u / 0.012) * Math.sin(TAU * 58 * u);
      return g * (tick + cone);
    });
    const n2 = bandNoise(seed + ':latch', 2500, 11000, sr);
    add(buf, sr, t + 0.038, t + 0.06, (u) => g * Math.exp(-u / 0.0015) * (0.05 * Math.sin(TAU * 3100 * bright * u) + 0.45 * n2()));
  }

  function powerOn(buf, sr, w) {
    const t0 = w.on.click / FPS; // the switch, on the frame the picture's power sequence starts
    const settle = Math.max(t0 + 1, w.on.settled / FPS);
    const degPeak = Math.max(0.12, (w.on.deg - w.on.click) / FPS); // the swell peaks with the picture's degauss wobble
    click(buf, sr, t0, 'foley-on-click', 1, 0.7);
    // the tube's thunk: the high voltage coming up, felt more than heard
    add(buf, sr, t0 + 0.05, t0 + 0.45, (u) => Math.exp(-u / 0.075) * (0.16 * Math.sin(TAU * (62 - 14 * Math.min(1, u / 0.2)) * u) + 0.05 * Math.sin(TAU * 131 * u + 0.4)) * smooth(0, 0.004, u));
    // the degauss: the coil's field, a buzzing 60 Hz swell that throbs and dies as its thermistor heats
    const hum = (u) => {
      const s = Math.sin(TAU * 60 * u) + 0.55 * Math.sin(TAU * 120 * u + 0.7) + 0.35 * Math.sin(TAU * 180 * u + 1.9) + 0.22 * Math.sin(TAU * 240 * u + 0.2) + 0.12 * Math.sin(TAU * 360 * u + 2.4);
      return Math.tanh(1.4 * s);
    };
    add(buf, sr, t0 + 0.09, t0 + 0.09 + degPeak + 1.6, (u) => {
      const env = smooth(0, degPeak, u) * Math.exp(-Math.max(0, u - degPeak) / 0.42) * (1 + 0.22 * Math.sin(TAU * 6.5 * u));
      const bwoom = Math.sin(TAU * (96 - 30 * Math.min(1, u / 0.6)) * u);
      return env * (0.1 * hum(u) + 0.09 * bwoom);
    });
    // static: the tuner's hiss while the picture rolls and settles, with crackles in the first second
    const hiss = bandNoise('foley-on-hiss', 900, 7500, sr);
    const tLine = w.on.open / FPS; // the snow comes as the picture opens
    const tLock = w.on.locked / FPS;
    add(buf, sr, tLine, settle + 0.2, (u, i) => {
      const t = i / sr;
      const fade = 1 - smooth(tLine + 0.4, Math.max(tLine + 0.8, tLock), t);
      return 0.13 * smooth(0, 0.08, u) * fade * fade * hiss();
    });
    const cr = lib.rng('foley-on-crackle');
    for (let k = 0; k < 26; k++) {
      const tc = tLine + 0.03 + cr() * Math.max(0.4, tLock - tLine - 0.2);
      const a = 0.04 + 0.1 * cr();
      const f = 2200 + 3000 * cr();
      add(buf, sr, tc, tc + 0.004, (u) => a * Math.exp(-u / 0.0006) * Math.sin(TAU * f * u));
    }
  }

  function powerOff(buf, sr, w) {
    const t1 = w.off.start / FPS;
    click(buf, sr, t1, 'foley-off-click', 0.92, 0.7);
    // the collapse: the deflection dies and the high voltage bleeds off, a zip falling from the squeeze
    // to the dot
    const zn = bandNoise('foley-off-zhip', 600, 6000, sr);
    const tz = w.off.squeeze / FPS - 0.02;
    const fall = Math.max(0.03, (w.off.dot - w.off.squeeze) / FPS / 3);
    let ph = 0;
    add(buf, sr, tz, tz + 0.26, (u) => {
      const hz = 180 + 2300 * Math.exp(-u / fall);
      ph += (TAU * hz) / sr;
      const tone = Math.sin(ph) + 0.33 * Math.sin(3 * ph) + 0.2 * Math.sin(5 * ph);
      return smooth(0, 0.006, u) * Math.exp(-u / 0.07) * (0.08 * tone + 0.05 * zn());
    });
    // the static tick of the discharge on the glass, a moment later
    const tr = lib.rng('foley-off-tick');
    const tt = w.off.afterglow / FPS + 0.1;
    for (let k = 0; k < 3; k++) {
      const tc = tt + k * 0.011 + tr() * 0.004;
      const a = 0.12 - k * 0.035;
      add(buf, sr, tc, tc + 0.005, (u) => a * Math.exp(-u / 0.0007) * Math.sin(TAU * (2600 + 900 * k) * u));
    }
  }

  // The flyback whine, very faint: fades in with the set, runs down in pitch and level at power-off.
  function whine(buf, sr, w) {
    if (sr < 36000) return; // cannot be represented below this rate
    const tOn = w.on ? w.on.click / FPS + 0.25 : 0;
    const tOff = w.off ? w.off.start / FPS : buf.length / sr;
    const A = 0.0032;
    const i0 = Math.max(0, Math.round(tOn * sr));
    const i1 = Math.min(buf.length, Math.round((tOff + 1.2) * sr));
    const iRamp = Math.round((tOn + 2.2) * sr);
    const iOff = Math.round(tOff * sr);
    // a rotating phasor (renormalised every 1024 samples) instead of a sine per sample
    let c = 1;
    let s = 0;
    let om = (TAU * LINE_HZ) / sr;
    let cw = Math.cos(om);
    let sw = Math.sin(om);
    for (let i = i0; i < i1; i++) {
      let a = A;
      if (i < iRamp) a *= smooth(tOn, tOn + 2.2, i / sr);
      if (i >= iOff) {
        const u = (i - iOff) / sr;
        a *= Math.exp(-u / 0.3);
        om = (TAU * LINE_HZ * (1 - 0.05 * (1 - Math.exp(-u / 0.25)))) / sr;
        cw = Math.cos(om);
        sw = Math.sin(om);
      }
      const c2 = c * cw - s * sw;
      s = s * cw + c * sw;
      c = c2;
      if ((i & 1023) === 0) {
        const m = 1 / Math.sqrt(c * c + s * s);
        c *= m;
        s *= m;
      }
      buf[i] += a * s;
    }
  }

  // The room the set stands in: the set's own sounds reach the microphone with a handful of early
  // reflections (walls, the floor, a sofa), each dulled by a one-pole low-pass. Seven taps, 7 to 55 ms,
  // no tail: a small living room, heard, not a reverb. Only the set's switching sounds pass through it (not the whine); the console's
  // sound is the chip as it was recorded.
  const ROOM = [[0.0071, 0.2], [0.0113, 0.15], [0.0172, 0.11], [0.0239, 0.08], [0.0317, 0.06], [0.0419, 0.04], [0.0553, 0.025]];
  function room(src, buf, sr, t0, t1) {
    const taps = ROOM.map(([d, g]) => [Math.round(d * sr), g]);
    const a = 1 - Math.exp((-TAU * 4500) / sr);
    let lp = 0;
    const i1 = Math.min(src.length, Math.round(t1 * sr));
    for (let i = Math.max(0, Math.round(t0 * sr)); i < i1; i++) {
      let r = 0;
      for (let k = 0; k < taps.length; k++) {
        const j = i - taps[k][0];
        if (j >= 0) r += taps[k][1] * src[j];
      }
      lp += a * (r - lp);
      buf[i] += src[i] + lp;
    }
  }

  FILM.foley = {
    speaker: (t) => speaker(t, windows()),
    apply(buf, sr) {
      const w = windows();
      for (let i = 0; i < buf.length; i++) {
        const t = i / sr;
        // only the ramps need the curve; elsewhere the gain is exactly 0 or 1
        if (w.on && t < w.on.click / FPS + 0.6) buf[i] *= speaker(t, w);
        else if (w.off && t >= w.off.start / FPS) buf[i] *= speaker(t, w);
      }
      // the set's switching sounds, heard in the room (only the power windows carry them); the whine is a
      // pure 15.7 kHz tone that reflections would only comb, so it goes straight in
      const set = new Float32Array(buf.length);
      if (w.on) {
        powerOn(set, sr, w);
        room(set, buf, sr, w.on.start / FPS, Math.max(w.on.settled / FPS, w.on.click / FPS + 2.2) + 0.5);
      }
      if (w.off) {
        powerOff(set, sr, w);
        room(set, buf, sr, w.off.start / FPS, w.off.start / FPS + 1.5);
      }
      whine(buf, sr, w);
      return buf;
    },
  };
})();

<script>
// ---- src/scenes/01-game.js
// Shot 01 — game (the whole film). Owner: game.
// The glue between the three systems: the game draws global frame f into the native 320x180 buffer,
// then the display presents it. Until src/game lands this draws a test card; until src/crt.js lands
// it presents with the clean nearest-neighbour upscale.
(function () {
  'use strict';

  function testCard(ctx, f) {
    const L = FILM.lib;
    const N = L.NES;
    const W = FILM.NATIVE_W, H = FILM.NATIVE_H;
    ctx.fillStyle = N[0x22];
    ctx.fillRect(0, 0, W, H);
    const bars = [0x30, 0x28, 0x2c, 0x2a, 0x24, 0x16, 0x12, 0x0f];
    for (let i = 0; i < bars.length; i++) {
      ctx.fillStyle = N[bars[i]];
      ctx.fillRect(Math.round((i * W) / bars.length), 40, Math.ceil(W / bars.length), 80);
    }
    ctx.fillStyle = N[0x17];
    ctx.fillRect(0, 148, W, 32);
    const x = ((f * 2) % (W + 32)) - 16;
    L.sprite(ctx, 'clawdS_idle', x, 132);
    L.pxtext(ctx, 'CLAUDE QUEST V2 TEST CARD', 160, 10, { color: N[0x30], align: 'center' });
    L.pxtext(ctx, 'FRAME ' + String(f).padStart(5, '0'), 160, 128, { color: N[0x30], align: 'center' });
  }

  FILM.scene({
    id: 'game',
    draw(ctx, t, info) {
      const f = info.frame; // global frame index at 60 fps
      const nb = FILM.native();
      if (FILM.game && typeof FILM.game.draw === 'function') FILM.game.draw(nb.ctx, f);
      else testCard(nb.ctx, f);
      if (FILM.crt && typeof FILM.crt.present === 'function') FILM.crt.present(nb.canvas, ctx, { frame: f, T: info.T });
      else FILM.presentNearest(nb.canvas, ctx);
    },
  });
})();

<script>
// ---- src/music.js
// music.js : the sound of CLAUDE QUEST (1986), a sound driver and an emulated NES 2A03 APU.
// Owner: audio. Contract: docs/v2-architecture.md sections 4.2 and 4.4; design notes: docs/sound.md.
//
// FILM.audio.render(ctx, { start = 0, dest = ctx.destination }) plays the whole film, music, effects and
// the TV foley, from global time `start` into any BaseAudioContext.
// FILM.audio.live(audioCtx, { dest }) runs the same driver and chip in real time for the playable mode.
//
// The sound is made the way a 1986 cartridge made it:
//   1 the driver   runs once per 60 Hz frame. It reads the frame's game events (FILM.game.events(): a
//                  `song` event starts a song, every other event starts a sound effect), advances the
//                  song sequencer one tick, lets an effect take over its channel for its length (the
//                  song's voice there keeps time silently and resumes on the frame the effect ends), and
//                  writes the result as APU register writes ($4000-$4017), keeping a shadow of the pulse
//                  high bytes so $4003/$4007 are only rewritten on a new note (no phase-reset clicks).
//   2 the APU      emulates the chip from those writes: two pulses (duty sequencer, envelope, sweep unit
//                  with its muting quirk, length counter), the triangle (linear counter, 32 steps), the
//                  noise LFSR (long and short mode, NTSC periods), and the DMC (1-bit delta playback of
//                  sample bytes from $C000 at the 16 NTSC rates). The drum samples are synthesised and
//                  delta-encoded below, the way a composer's tool would have packed them into the ROM.
//                  The channels are integrated exactly at 4x the output rate, mixed by the console's
//                  non-linear DAC formulas, filtered like the console output (high-pass 90 Hz and 440 Hz,
//                  low-pass 14 kHz) and decimated by a zero-phase windowed sinc.
//   3 the TV       src/foley.js (FILM.foley) turns the TV's speaker on and off with the picture and adds
//                  the set's own sounds (switch, degauss, static, flyback whine). The only non-NES sound.
//
// No reverb, delay, compressor or panning: the buffer is the chip times one flat gain (measured to
// -14 LUFS, true peak under -1 dBTP), mono in both channels. Deterministic: the only randomness is
// FILM.lib.rng with fixed seeds. The buffer is always computed from frame 0, so any `start` hears the
// same samples at the same global times.
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const FILM = root.FILM;
  const lib = FILM.lib;
  const TAU = Math.PI * 2;

  // ---------------------------------------------------------------- hardware constants
  const CPU = 1789773; // NTSC 2A03 clock, Hz
  const FPS = 60; // driver frames per second (the film's frame rate)
  const SUB = 4; // integration sub-samples per output sample
  const HALF = 23; // decimation filter half length, in sub-samples
  const GAIN = 2.87; // flat master gain, set by measurement (tools/audio/loudness.cjs): -14 LUFS
  const DUTY = [
    [0, 1, 0, 0, 0, 0, 0, 0], // 12.5 %
    [0, 1, 1, 0, 0, 0, 0, 0], // 25 %
    [0, 1, 1, 1, 1, 0, 0, 0], // 50 %
    [1, 0, 0, 1, 1, 1, 1, 1], // 25 % negated
  ];
  const TRI = [];
  for (let i = 15; i >= 0; i--) TRI.push(i);
  for (let i = 0; i <= 15; i++) TRI.push(i);
  const NOISE = [4, 8, 16, 32, 64, 96, 128, 160, 202, 254, 380, 508, 762, 1016, 2034, 4068];
  const DMC_RATE = [428, 380, 340, 320, 286, 254, 226, 214, 190, 160, 142, 128, 106, 84, 72, 54];
  const LENGTH = [10, 254, 20, 2, 40, 4, 80, 6, 160, 8, 60, 10, 14, 12, 26, 14, 12, 16, 24, 18, 48, 20, 96, 22, 192, 24, 72, 26, 16, 28, 32, 30];
  const DMC_LEVEL0 = 40; // $4011 as the game's reset code left it, long before the TV came on

  // ---------------------------------------------------------------- pitch
  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function midi(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(n);
    if (!m) throw new Error('music.js: bad note ' + n);
    return 12 * (Number(m[3]) + 1) + SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  }
  const mhz = (m) => 440 * Math.pow(2, (midi(m) - 69) / 12);
  const clampT = (t) => Math.max(0, Math.min(2047, t));
  const ptimer = (hz) => clampT(Math.round(CPU / (16 * hz) - 1)); // pulse: f = CPU / (16 (t + 1))
  const ttimer = (hz) => clampT(Math.round(CPU / (32 * hz) - 1)); // triangle: f = CPU / (32 (t + 1))

  // ---------------------------------------------------------------- DMC samples (the ROM at $C000)
  // Each drum is synthesised at its playback rate and delta-encoded greedily (a 1 bit steps the 7-bit DAC
  // up by 2, a 0 steps it down by 2). Every sample holds as many 1s as 0s, so it returns the DAC to the
  // level it started from and the drums never drift the channel's DC level.
  const DMC_MEM = new Uint8Array(0x4000);
  const DMC = {}; // name -> { a: $4012 value, l: $4013 value, bytes }
  const dmcHz = (rate) => CPU / DMC_RATE[rate];
  function dmcEncode(wave) {
    const L0 = DMC_LEVEL0;
    const need = wave.length + 64; // the wave, then at least 64 bits to settle home
    const nBytes = Math.ceil((need / 8 - 1) / 16) * 16 + 1; // lengths are 16 n + 1 bytes
    const bits = nBytes * 8;
    const out = new Uint8Array(nBytes);
    let level = L0;
    for (let i = 0; i < bits; i++) {
      let bit;
      if (i < wave.length) {
        const target = L0 + wave[i];
        bit = level < target ? 1 : level > target ? 0 : i & 1;
      } else {
        const off = level - L0; // settle: walk home, then hover up-down so the last bit lands on L0
        bit = off < 0 ? 1 : off > 0 ? 0 : 1;
      }
      if (!bit && level < 2) bit = 1; // never ask for a step the DAC would clamp: the 1s and 0s stay paired
      else if (bit && level > 125) bit = 0;
      if (bit) {
        if (level <= 125) level += 2;
        out[i >> 3] |= 1 << (i & 7); // bits play LSB first
      } else if (level >= 2) level -= 2;
    }
    if (level !== L0) throw new Error('music.js: DMC sample does not return to its level');
    return out;
  }
  function dmcSynth(rate, seconds, fn) {
    const sr = dmcHz(rate);
    const n = Math.round(seconds * sr);
    const w = new Float64Array(n);
    let ph = 0;
    for (let i = 0; i < n; i++) {
      const t = i / sr;
      const r = fn(t, ph);
      w[i] = r.x;
      ph += (TAU * (r.hz || 0)) / sr;
    }
    return w;
  }
  (function buildDmc() {
    const noise = lib.rng('claude-quest-dmc');
    const kick = dmcSynth(15, 0.11, (t, ph) => {
      const env = t < 0.0008 ? t / 0.0008 : Math.exp(-(t - 0.0008) / 0.042);
      const click = t < 0.002 ? (noise() * 2 - 1) * 12 * (1 - t / 0.002) : 0;
      return { x: 28 * env * Math.sin(ph) + click, hz: 46 + 170 * Math.exp(-t / 0.016) };
    });
    const snare = dmcSynth(15, 0.13, (t, ph) => {
      const tone = 9 * Math.exp(-t / 0.028) * (Math.sin(ph) + 0.6 * Math.sin(ph * 1.78));
      const hiss = 17 * Math.exp(-t / 0.045) * (noise() * 2 - 1);
      return { x: tone + hiss, hz: 188 };
    });
    // Timpani: a membrane's inharmonic partials under a felt mallet. Tuned so rate 15 plays the root and
    // rate 14 (0.75x) the fifth below it: a tonic-dominant pair from one sample, as real carts did.
    const timp = (root) =>
      dmcSynth(15, 0.36, (t, ph) => {
        const env = t < 0.004 ? t / 0.004 : 1;
        const x = Math.sin(ph) * Math.exp(-t / 0.3) + 0.45 * Math.sin(ph * 1.5 + 0.3) * Math.exp(-t / 0.16) + 0.22 * Math.sin(ph * 1.98 + 1.1) * Math.exp(-t / 0.09);
        const mallet = t < 0.005 ? (noise() * 2 - 1) * 8 * (1 - t / 0.005) : 0;
        return { x: 24 * env * x + mallet, hz: root };
      });
    let addr = 0;
    for (const [name, wave] of [['kick', kick], ['snare', snare], ['timpD', timp(mhz('D3'))], ['timpC', timp(mhz('C3'))]]) {
      const bytes = dmcEncode(wave);
      DMC_MEM.set(bytes, addr);
      DMC[name] = { a: addr >> 6, l: (bytes.length - 1) >> 4, bytes: bytes.length };
      addr = Math.ceil((addr + bytes.length) / 64) * 64;
    }
    DMC.romBytes = addr;
  })();

  // ---------------------------------------------------------------- the APU
  // A register-level 2A03 sound unit. write(addr, value) as the CPU would; quarter(q) is the frame
  // counter's quarter-frame clock (4-step mode); fill(ring, s0, n) integrates n sub-samples.
  function makeApu(sr) {
    const RS = sr * SUB;
    const cps = CPU / RS; // CPU cycles per sub-sample
    const pulse = (i) => ({ i, duty: 0, halt: false, cv: true, vol: 0, envStart: false, envDiv: 0, decay: 0, swEn: false, swP: 0, swN: false, swS: 0, swDiv: 0, swReload: false, t: 0, per: 2, cnt: 2, pos: 0, len: 0, on: false, mute: true });
    const P = [pulse(0), pulse(1)];
    const T = { ctrl: false, linR: 0, lin: 0, linFlag: false, t: 0, cnt: 1, pos: 0, len: 0, on: false };
    const N = { halt: false, cv: true, vol: 0, envStart: false, envDiv: 0, decay: 0, mode: 0, per: 4, cnt: 4, lfsr: 1, len: 0, on: false };
    const D = { loop: false, rate: DMC_RATE[0], cnt: DMC_RATE[0], level: DMC_LEVEL0, addr: 0xc000, length: 1, cur: 0xc000, left: 0, buf: -1, shift: 0, bits: 8, silent: true, on: false };

    const target = (c) => {
      const ch = c.t >> c.swS;
      return c.swN ? c.t - ch - (c.i === 0 ? 1 : 0) : c.t + ch;
    };
    const remute = (c) => {
      c.mute = c.t < 8 || (!c.swN && target(c) > 0x7ff);
      c.per = 2 * (c.t + 1);
    };
    function dmcFetch() {
      if (D.buf < 0 && D.left > 0) {
        D.buf = DMC_MEM[D.cur - 0xc000];
        D.cur = D.cur === 0xffff ? 0x8000 : D.cur + 1;
        D.left--;
        if (D.left === 0 && D.loop) {
          D.cur = D.addr;
          D.left = D.length;
        }
      }
    }
    function write(a, v) {
      if (a < 0x4008) {
        const c = P[(a - 0x4000) >> 2];
        switch (a & 3) {
          case 0:
            c.duty = v >> 6;
            c.halt = !!(v & 0x20);
            c.cv = !!(v & 0x10);
            c.vol = v & 15;
            break;
          case 1:
            c.swEn = !!(v & 0x80);
            c.swP = (v >> 4) & 7;
            c.swN = !!(v & 8);
            c.swS = v & 7;
            c.swReload = true;
            remute(c);
            break;
          case 2:
            c.t = (c.t & 0x700) | v;
            remute(c);
            break;
          default:
            c.t = (c.t & 0xff) | ((v & 7) << 8);
            if (c.on) c.len = LENGTH[v >> 3];
            c.pos = 0; // $4003 restarts the duty sequencer: the phase reset drivers avoid mid-note
            c.envStart = true;
            remute(c);
        }
        return;
      }
      switch (a) {
        case 0x4008:
          T.ctrl = !!(v & 0x80);
          T.linR = v & 0x7f;
          break;
        case 0x400a:
          T.t = (T.t & 0x700) | v;
          break;
        case 0x400b:
          T.t = (T.t & 0xff) | ((v & 7) << 8);
          if (T.on) T.len = LENGTH[v >> 3];
          T.linFlag = true;
          break;
        case 0x400c:
          N.halt = !!(v & 0x20);
          N.cv = !!(v & 0x10);
          N.vol = v & 15;
          break;
        case 0x400e:
          N.mode = v >> 7;
          N.per = NOISE[v & 15];
          break;
        case 0x400f:
          if (N.on) N.len = LENGTH[v >> 3];
          N.envStart = true;
          break;
        case 0x4010:
          D.loop = !!(v & 0x40);
          D.rate = DMC_RATE[v & 15];
          break;
        case 0x4011:
          D.level = v & 0x7f;
          break;
        case 0x4012:
          D.addr = 0xc000 + v * 64;
          break;
        case 0x4013:
          D.length = v * 16 + 1;
          break;
        case 0x4015:
          P[0].on = !!(v & 1);
          P[1].on = !!(v & 2);
          T.on = !!(v & 4);
          N.on = !!(v & 8);
          if (!P[0].on) P[0].len = 0;
          if (!P[1].on) P[1].len = 0;
          if (!T.on) T.len = 0;
          if (!N.on) N.len = 0;
          if (v & 0x10) {
            if (D.left === 0) {
              D.cur = D.addr;
              D.left = D.length;
            }
            dmcFetch();
          } else D.left = 0;
          break;
        default:
      }
    }
    function env(c) {
      if (c.envStart) {
        c.envStart = false;
        c.decay = 15;
        c.envDiv = c.vol;
      } else if (c.envDiv === 0) {
        c.envDiv = c.vol;
        if (c.decay > 0) c.decay--;
        else if (c.halt) c.decay = 15;
      } else c.envDiv--;
    }
    function quarter(q) {
      env(P[0]);
      env(P[1]);
      env(N);
      if (T.linFlag) T.lin = T.linR;
      else if (T.lin > 0) T.lin--;
      if (!T.ctrl) T.linFlag = false;
      if (q & 1) {
        for (const c of P) {
          if (c.len > 0 && !c.halt) c.len--;
          if (c.swDiv === 0 && c.swEn && c.swS > 0 && !c.mute) {
            c.t = Math.max(0, target(c));
            remute(c);
          }
          if (c.swDiv === 0 || c.swReload) {
            c.swDiv = c.swP;
            c.swReload = false;
          } else c.swDiv--;
        }
        if (T.len > 0 && !T.ctrl) T.len--;
        if (N.len > 0 && !N.halt) N.len--;
      }
    }

    // Between two boundaries (a driver frame's register writes, a frame-counter clock) every channel's
    // parameters are constant, so each channel runs as its own tight loop over the stretch, then one loop
    // mixes and filters. Each channel's output is integrated exactly over every sub-sample.
    const QMAX = Math.ceil(RS / (FPS * 4)) + 2; // the longest stretch: one quarter frame
    const sp = new Float64Array(QMAX); // pulse 1 + pulse 2
    const stn = new Float64Array(QMAX); // triangle / 8227 + noise / 12241 + DMC / 22638
    function runPulse(c, n) {
      if (c.mute) return; // silenced by the sweep unit's muting: the timer's phase is not modelled
      const lvl = c.len > 0 ? (c.cv ? c.vol : c.decay) : 0;
      const seq = DUTY[c.duty];
      const per = c.per;
      const scale = lvl / cps;
      let cnt = c.cnt;
      let pos = c.pos;
      for (let i = 0; i < n; i++) {
        let rem = cps;
        let acc = 0;
        let o = seq[pos];
        while (cnt <= rem) {
          acc += o * cnt;
          rem -= cnt;
          pos = (pos + 1) & 7;
          o = seq[pos];
          cnt = per;
        }
        acc += o * rem;
        cnt -= rem;
        sp[i] += acc * scale;

      c.pos = pos;
    }

      if (T.lin === 0 || T.len === 0 || T.t < 2) {
        const v = TRI[T.pos] / 8227; // halted: the sequencer holds its step
        for (let i = 0; i < n; i++) stn[i] += v;

      }
      const per = T.t + 1;
      const scale = 1 / (cps * 8227);
      let cnt = T.cnt;
      let pos = T.pos;
      for (let i = 0; i < n; i++) {
        let rem = cps;
        let acc = 0;
        let o = TRI[pos];
        while (cnt <= rem) {
          acc += o * cnt;
          rem -= cnt;
          pos = (pos + 1) & 31;
          o = TRI[pos];
          cnt = per;
        }
        acc += o * rem;
        cnt -= rem;
        stn[i] += acc * scale;
      }
      T.cnt = cnt;
      T.pos = pos;
    }
    function runNoise(n) {
      const lvl = N.len > 0 ? (N.cv ? N.vol : N.decay) : 0;
      if (lvl === 0) return; // silent: the shift register is not clocked
      const per = N.per;
      const tap = N.mode ? 6 : 1;
      const scale = lvl / (cps * 12241);
      let cnt = N.cnt;
      let lfsr = N.lfsr;
      for (let i = 0; i < n; i++) {
        let rem = cps;
        let acc = 0;
        let o = lfsr & 1 ? 0 : 1;
        while (cnt <= rem) {
          acc += o * cnt;
          rem -= cnt;
          lfsr = (lfsr >> 1) | (((lfsr ^ (lfsr >> tap)) & 1) << 14);
          o = lfsr & 1 ? 0 : 1;
          cnt = per;
        }
        acc += o * rem;
        cnt -= rem;
        stn[i] += acc * scale;
      }
      N.cnt = cnt;
      N.lfsr = lfsr;
    }
    function runDmc(n) {
      const scale = 1 / (cps * 22638);
      for (let i = 0; i < n; i++) {
        let rem = cps;
        let acc = 0;
        while (D.cnt <= rem) {
          acc += D.level * D.cnt;
          rem -= D.cnt;
          if (!D.silent) {
            if (D.shift & 1) {
              if (D.level <= 125) D.level += 2;
            } else if (D.level >= 2) D.level -= 2;
          }
          D.shift >>= 1;
          if (--D.bits === 0) {
            D.bits = 8;
            if (D.buf < 0) D.silent = true;
            else {
              D.silent = false;
              D.shift = D.buf;
              D.buf = -1;
              dmcFetch();
            }
          }
          D.cnt = D.rate;
        }
        acc += D.level * rem;
        D.cnt -= rem;
        stn[i] += acc * scale;
      }
    }

    // console output filters, first order, at the integration rate
    const dt = 1 / RS;

  // One call per 60 Hz frame: frame(f, events) -> that frame's APU register writes, flat [addr, value, ...].
  function makeDriver(mute) {
    const mu = mute || {};

    let sf = 0;

    const fx = { p1: null, p2: null, t: null, n: null };

          w.push(b + 1, 0x80 | (st.sw.p << 4) | (st.sw.n ? 8 : 0) | st.sw.s);

        }

      if (st.t !== undefined) {
        const hi = st.t >> 8;
        w.push(b + 2, st.t & 0xff);
        if (st.trig || hi !== hiShadow[c]) {
          w.push(b + 3, 0xf8 | hi); // restarts the phase: only on a new note or a new high byte
          hiShadow[c] = hi;
        }

    }

      if (!st) {
        if (triOn) w.push(0x4008, 0x80); // reload 0: the linear counter stops the triangle next quarter frame
        triOn = false;
        return;
      }
      if (!triOn) w.push(0x4008, 0xff);
      const hi = st.t >> 8;
      w.push(0x400a, st.t & 0xff);
      if (st.trig || hi !== triHi || !triOn) {
        w.push(0x400b, 0xf8 | hi);
        triHi = hi;
      }
      triOn = true;
    }
    function noise(w, st) {
      if (!st || !(st.v > 0)) {
        w.push(0x400c, 0x30);
        return;
      }
      w.push(0x400c, 0x30 | st.v, 0x400e, (st.m ? 0x80 : 0) | st.i);
      if (st.trig) w.push(0x400f, 0xf8);
    }

      const w = [];
      if (!started) {
        w.push(0x4015, 0x0f, 0x4001, 0x08, 0x4005, 0x08, 0x4000, 0x30, 0x4004, 0x30, 0x4008, 0x80, 0x400c, 0x30, 0x4010, 0x0f);

          // a section starts the song at that row (overworld: 'intro', 'A' the hook, 'B'); unknown: the top

          fresh = true;

  const NONE = [];

    return g.events() || NONE;
