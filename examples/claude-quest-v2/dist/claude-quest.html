  //   o.samples  length (default the film's duration)
  //   o.foley    false to leave out the TV (FILM.foley)
  //   o.mute     { music: true } or { sfx: true }: drop song or effect events (tools)
  //   o.log      true: attach out.log = [[frame, [addr, value, ...]], ...], every register write
  function synth(sr, opts) {
    const o = opts || {};
    const events = o.events || gameEvents();
    const byF = new Map();
    for (const e of events) {
      const f = Math.max(0, Math.round(Number(e.f) || 0));
      if (!byF.has(f)) byF.set(f, []);
      byF.get(f).push(e);
    }
    const driver = makeDriver(o.mute);
    const log = o.log ? [] : null;
    const eng = makeEngine(sr, (f) => {
      const w = driver.frame(f, byF.get(f) || NONE);
      if (log && w.length) log.push([f, w]);
      return w;
    });
    const n = o.samples != null ? o.samples : Math.round((filmFrames() / FPS) * sr);
    const out = new Float32Array(n);
    for (let j = 0; j < n; j++) out[j] = eng.out(j) * GAIN;
    if (o.foley !== false && FILM.foley && typeof FILM.foley.apply === 'function') FILM.foley.apply(out, sr);
    if (log) out.log = log;
    return out;
  }

  const cache = {};
  FILM.audio = {
    render(ctx, opts) {
      const o = opts || {};
      const start = Math.max(0, Number(o.start) || 0);
      const dest = o.dest || ctx.destination;
      const base = ctx.currentTime;
      const sr = ctx.sampleRate;
      // o.events: tools only (a mock list while the game is built); the film always hears its game
      const data = o.events ? synth(sr, { events: o.events }) : cache[sr] || (cache[sr] = synth(sr));
      if (start >= data.length / sr) return;
      const buf = ctx.createBuffer(2, data.length, sr);
      buf.getChannelData(0).set(data);
      buf.getChannelData(1).set(data);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(dest);
      // A live context keeps running while the chip is emulated: start late by that much, on time.
      const late = Math.max(0, ctx.currentTime - base);
      src.start(base + late, start + late);
    },
    // The playable mode: the same driver and chip, generated as it plays. Feed it what the game engine's
    // step() returns each frame; they sound on the next driver frame.
    live(actx, opts) {
      const o = opts || {};
      const queue = [];
      const driver = makeDriver();
      const eng = makeEngine(actx.sampleRate, (f) => driver.frame(f, queue.splice(0, queue.length)));
      let vol = o.volume == null ? 1 : Number(o.volume);
      let j = 0;
      const node = actx.createScriptProcessor(o.bufferSize || 1024, 1, 1);
      node.onaudioprocess = (e) => {
        const out = e.outputBuffer.getChannelData(0);
        for (let i = 0; i < out.length; i++) out[i] = eng.out(j++) * GAIN * vol;
      };
      node.connect(o.dest || actx.destination);
      if (o.song) queue.push({ type: 'song', id: o.song });
      return {
        node,
        song(id) {
          queue.push({ type: 'song', id });
        },
        event(ev) {
          if (ev) queue.push(ev);
        },
        events(list) {
          for (const ev of list || NONE) queue.push(ev);
        },
        get frame() {
          return eng.frame();
        },
        get volume() {
          return vol;
        },
        set volume(v) {
          vol = Number(v);
        },
        stop() {
          node.onaudioprocess = null;
          node.disconnect();
        },
      };
    },
    synth,
    // tools: an effect's program for an event, { pri, frames per channel }
    effect: (ev) => {
      const make = SFX[ev.type];
      if (!make) return null;
      const pr = make(ev);
      const out = { pri: pr.pri };
      for (const ch of ['p1', 'p2', 't', 'n']) if (pr[ch]) out[ch] = pr[ch].length;
      return out;
    },
    songs: Object.keys(SONGS),
    sfx: Object.keys(SFX),
    info: () => ({
      gain: GAIN,
      dmcRomBytes: DMC.romBytes,
      dmc: Object.fromEntries(['kick', 'snare', 'timpD', 'timpC'].map((k) => [k, DMC[k].bytes])),
      songs: Object.fromEntries(Object.keys(SONGS).map((k) => [k, { speed: SONGS[k].speed, rows: SONGS[k].rows, frames: SONGS[k].L, loopFrame: SONGS[k].LF, sections: Object.assign({}, SONGS[k].sections) }])),
    }),
  };
})();

</script>
<script>
// ---- src/player.js
/*
 * player.js : the interactive page around the film.
 *
 *   first click / tap  powers the TV on and plays the film with sound (a browser needs a gesture for
 *                      audio, so the page opens on the dark glass with CLICK TO POWER ON in the chrome)
 *   click or space     play / pause (with audio)
 *   left / right       step one frame back / forward
 *   C                  the TV: CRT (default) <-> clean nearest-neighbour pixels (FILM.crt.mode)
 *   F                  fullscreen on / off
 *   M                  mute / unmute (the film and the playable mode)
 *   ?t=seconds         open paused on that global time
 *   ?shot=id           loop one shot
 *   ?clean=1           open with the TV in clean mode
 *   ?render=1          no UI, canvas at native size, nothing drawn until asked (used by tools)
 *
 * The page is a column: the TV (the canvas), then the chrome row under it (status left, help or the
 * power-on prompt centre, a slot right). The TV is fitted to what the chrome leaves, so nothing in the
 * page is ever drawn over the picture. The canvas is rendered at the display's own device pixels
 * (re-mounted on resize and fullscreen), so the CRT's scanlines and grille land on real pixels.
 *
 * The clock while playing is the AudioContext clock when there is music, otherwise the
 * requestAnimationFrame timestamp. Nothing here draws: it only calls FILM.renderFrame(T).
 *
 * Extension point (phase 3, a viewer takes the controller; src/play.js, docs/playable.md):
 *   FILM.player.onMount(api)        called once, after the chrome exists and before the first draw
 *   FILM.player.onKey(e, api)       called first for every keydown and keyup; return true to consume
 *                                   the key (the film's own keys are then skipped)
 *   FILM.player.onFrame(stamp, api) called every animation frame before the film draws; return true
 *                                   when it drew the frame itself (the film is then not drawn, and
 *                                   clicks on the TV do not start the film under it)
 *   FILM.player.api                 { play(), pause(), seek(T), redraw(), relayout(), setHelp(text|null),
 *                                     T, playing, frame, powered, muted, audioState, touch, canvas, ctx,
 *                                     chrome: { root, status, help, slot }, present(frame, opts) }
 *                                   present() puts FILM.native() on the TV; opts go to FILM.crt.present
 *                                   (the playable mode passes { overlays: false })
 */
(function () {
  'use strict';

  const FILM = window.FILM;
  if (!FILM || typeof FILM.renderFrame !== 'function') return;

  const params = new URLSearchParams(window.location.search);
  const renderMode = params.get('render') === '1';
  const player = (FILM.player = FILM.player || {});
  if (typeof player.onKey !== 'function') player.onKey = null;
  if (typeof player.onFrame !== 'function') player.onFrame = null;
  if (typeof player.onMount !== 'function') player.onMount = null;

  if (renderMode) {
    // tools mount their own canvas; keep the page inert
    document.documentElement.style.background = '#000';
    return;
  }

  // A phone or tablet: the primary pointer is a finger. ?touch=1 / ?touch=0 force it either way.
  const touchParam = params.get('touch');
  const touch =
    touchParam === '1' ||
    (touchParam !== '0' && !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches));

  function start() {
    if (FILM.prepare) FILM.prepare(); // applies the timeline's fps and frame size before anything reads them
    const FPS = FILM.FPS;
    const duration = FILM.DURATION;
    const shotId = params.get('shot');
    const loopShot = shotId ? FILM.shotById(shotId) : null;
    const rangeStart = loopShot ? loopShot.start : 0;
    const rangeEnd = loopShot ? loopShot.end : duration;
    const tParam = params.get('t');

    const style = document.createElement('style');
    style.textContent = [
      'html,body{margin:0;height:100%;background:#000;overflow:hidden}',
      'body{display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;',
      '-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;',
      'font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#7d7a74}',
      '#film{display:block;flex:none;background:#000}',
      '#chrome{flex:none;box-sizing:border-box;width:100%;height:40px;padding:0 14px;display:flex;align-items:center;gap:12px}',
      '#chrome>div{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
      '#chrome>#help{flex:0 1 auto;text-align:center;letter-spacing:.02em}',
      '#status{text-align:left}',
      '#slot{display:flex;justify-content:flex-end;align-items:center}',
      '#chrome>#slot{overflow:visible}',
      '#gate{color:#e8e0cf;letter-spacing:.16em;animation:cq-blink 1.2s steps(1,end) infinite}',
      '@keyframes cq-blink{0%{opacity:1}62%{opacity:0}}',
      '#bar{position:fixed;left:0;bottom:0;height:2px;background:#e8e0cf;width:0;pointer-events:none;opacity:.5}',
      'body.touch #status{display:none}',
    ].join('');
    document.head.appendChild(style);
    if (touch) document.body.classList.add('touch');

    const canvas = document.createElement('canvas');
    canvas.id = 'film';
    document.body.appendChild(canvas);
    if (params.get('clean') === '1' && FILM.crt) FILM.crt.mode = 'clean';

    const chrome = document.createElement('div');
    chrome.id = 'chrome';
    const status = document.createElement('div');
    status.id = 'status';
    const help = document.createElement('div');
    help.id = 'help';
    const slot = document.createElement('div');
    slot.id = 'slot';
    chrome.appendChild(status);
    chrome.appendChild(help);
    chrome.appendChild(slot);
    document.body.appendChild(chrome);
    const bar = document.createElement('div');
    bar.id = 'bar';
    document.body.appendChild(bar);

    const GATE_TEXT = touch ? 'TAP TO POWER ON' : 'CLICK TO POWER ON';
    const HELP_TEXT = touch ? 'START — play' : 'ENTER — play · C — CRT · I — inputs · F — fullscreen';
    let helpOverride = null;
    let powered = false;
    function showHelp() {
      if (!powered) {
        help.innerHTML = '';
        const g = document.createElement('span');
        g.id = 'gate';
        g.textContent = GATE_TEXT;
        help.appendChild(g);
      } else {
        help.textContent = helpOverride != null ? helpOverride : HELP_TEXT;
      }
    }
    showHelp();

    // Render at the display's device pixels. The TV gets the window minus whatever the chrome (and a
    // touch pad in the page flow, src/play.js) takes; fixed overlays take nothing.
    let mountedScale = 0;
    function fit() {
      const dpr = window.devicePixelRatio || 1;
      let used = 0;
      for (const el of document.body.children) {
        if (el === canvas || el.tagName === 'SCRIPT' || el.tagName === 'STYLE') continue;
        const cs = window.getComputedStyle(el);
        if (cs.display === 'none' || cs.position === 'fixed' || cs.position === 'absolute') continue;
        used += el.offsetHeight;
      }
      const cssH = Math.max(60, Math.min(window.innerHeight - used, (window.innerWidth * FILM.H) / FILM.W));
      canvas.style.height = `${cssH}px`;
      canvas.style.width = `${(cssH * FILM.W) / FILM.H}px`;
      const S = Math.max(0.25, Math.min(3, (cssH * dpr) / FILM.H));
      if (Math.abs(S - mountedScale) < 0.01) return false;
      mountedScale = S;
      FILM.mount(canvas, { scale: S });
      return true;
    }

    let T = tParam != null && isFinite(Number(tParam)) ? Number(tParam) : rangeStart;
    let playing = false;
    let muted = false;
    let owned = false; // the last animation frame was drawn by FILM.player.onFrame (the playable mode)
    let audio = null; // { ctx, master, anchor, startT }
    let rafStamp0 = null;
    let rafT0 = 0;
    let lastDrawn = -1;

    const quant = (t) => Math.floor(t * FPS + 1e-6) / FPS;

    // Clip frames (instrument mode) decode on demand: a frame draws once its clips are ready, and
    // while playing the next second is prefetched so playback does not wait on the decoder.
    const hasClips = FILM.prepareFrame && FILM.CLIPS && Object.keys(FILM.CLIPS).length > 0;
    let prefetchedTo = -1;
    function prefetch(q) {
      if (!hasClips) return;
      const to = Math.min(rangeEnd - 1 / FPS, q + 1);
      for (let f = Math.max(Math.round(q * FPS), prefetchedTo + 1); f <= Math.round(to * FPS); f++) FILM.prepareFrame(f / FPS);
      prefetchedTo = Math.round(to * FPS);
    }
    function paint(q) {
      FILM.errors = [];
      const shot = FILM.renderFrame(q);
      if (FILM.errors.length && window.console) console.warn('FILM errors at', q, FILM.errors);
      // the first screen is the dark glass and the power-on prompt, nothing else
      status.textContent = powered ? `${q.toFixed(2)}s  f${Math.round(q * FPS)}  ${shot ? shot.id : ''}${muted ? '  muted' : ''}` : '';
      bar.style.width = `${(100 * (q - rangeStart)) / Math.max(1e-6, rangeEnd - rangeStart)}%`;
    }
    function draw(force) {
      const q = quant(Math.min(Math.max(T, rangeStart), rangeEnd - 1 / FPS));
      if (!force && q === lastDrawn) return;
      lastDrawn = q;
      if (!hasClips) return paint(q);
      if (q * FPS < prefetchedTo - FPS * 2) prefetchedTo = -1; // looped or seeked back
      prefetch(q);
      FILM.prepareFrame(q).then(() => {
        if (lastDrawn === q) paint(q);
      });
    }

    function stopAudio() {
      if (audio) {
        const c = audio.ctx;
        audio = null;
        c.close();
      }
    }

    function startAudio(fromT) {
      stopAudio();
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC || !FILM.audio || typeof FILM.audio.render !== 'function') return;
      const ctx = new AC({ latencyHint: 'playback', sampleRate: 48000 });
      const master = ctx.createGain();
      master.gain.value = muted ? 0 : 1;
      master.connect(ctx.destination);
      const anchor = ctx.currentTime;
      try {
        FILM.audio.render(ctx, { start: fromT, dest: master });
      } catch (e) {
        if (window.console) console.error('FILM.audio.render failed', e);
      }
      audio = { ctx, master, anchor, startT: fromT };
    }
    // A context made outside a gesture (the loop restart, a return from the playable mode) can start
    // suspended in a strict browser; the next gesture of any kind lets it run.
    const wake = () => {
      if (audio && audio.ctx.state === 'suspended') audio.ctx.resume();
    };
    for (const type of ['pointerup', 'touchend', 'keydown', 'click']) window.addEventListener(type, wake, true);

    function play() {
      if (T >= rangeEnd - 1 / FPS) T = rangeStart;
      if (!powered) {
        powered = true;
        showHelp();
      }
      playing = true;
      document.body.classList.add('playing');
      startAudio(T);
      rafStamp0 = null;
      rafT0 = T;
    }

    function pause() {
      playing = false;
      document.body.classList.remove('playing');
      stopAudio();
      T = quant(T);
      draw(true);
    }

    function tick(stamp) {
      if (player.onFrame && player.onFrame(stamp, api) === true) {
        owned = true;
        window.requestAnimationFrame(tick);
        return;
      }
      owned = false;
      if (playing) {
        if (audio) {
          // currentTime moves once per audio buffer (tens of ms under the 'playback' latency hint), which
          // would judder a 60 fps picture; the output timestamp pins a context time to a performance
          // time, so the audio clock is read at this animation frame's own stamp (latency included)
          const ts = typeof audio.ctx.getOutputTimestamp === 'function' ? audio.ctx.getOutputTimestamp() : null;
          if (ts && ts.contextTime > 0 && ts.performanceTime > 0) {
            T = audio.startT + Math.max(0, ts.contextTime + (stamp - ts.performanceTime) / 1000 - audio.anchor);
          } else {
            const lat = (audio.ctx.baseLatency || 0) + (audio.ctx.outputLatency || 0);
            T = audio.startT + Math.max(0, audio.ctx.currentTime - audio.anchor - lat);
          }
        } else {
          if (rafStamp0 == null) rafStamp0 = stamp;
          T = rafT0 + (stamp - rafStamp0) / 1000;
        }
        if (T >= rangeEnd) {
          T = rangeStart;
          if (audio) startAudio(T);
          rafStamp0 = stamp;
          rafT0 = T;
        }
        draw(false);
      }
      window.requestAnimationFrame(tick);
    }

    function step(n) {
      if (playing) pause();
      const f = Math.round(quant(T) * FPS) + n;
      const f0 = Math.round(rangeStart * FPS);
      const f1 = Math.round(rangeEnd * FPS) - 1;
      T = Math.min(f1, Math.max(f0, f)) / FPS;
      draw(true);
    }

    function seek(t) {
      T = Math.min(Math.max(Number(t) || 0, rangeStart), rangeEnd - 1 / FPS);
      if (playing) {
        if (audio) startAudio(T);
        rafStamp0 = null;
        rafT0 = T;
      }
      draw(true);
    }
    function toggleTV() {
      if (!FILM.crt) return;
      FILM.crt.mode = FILM.crt.mode === 'clean' ? 'crt' : 'clean';
      if (!owned) draw(true); // the playable mode re-presents on its next frame
    }
    function toggleMute() {
      muted = !muted;
      if (audio) audio.master.gain.value = muted ? 0 : 1;
      if (!owned) draw(true);
    }
    function toggleFullscreen() {
      const d = document;
      const el = d.documentElement;
      if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else if (el.requestFullscreen || el.webkitRequestFullscreen) (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
    function relayout() {
      if (fit() && !owned) draw(true);
    }
    const api = {
      play,
      pause,
      seek,
      redraw: () => draw(true),
      relayout,
      setHelp(text) {
        helpOverride = text == null ? null : String(text);
        showHelp();
      },
      get T() {
        return T;
      },
      get playing() {
        return playing;
      },
      get frame() {
        return Math.round(quant(T) * FPS);
      },
      get powered() {
        return powered;
      },
      get muted() {
        return muted;
      },
      get audioState() {
        return audio ? audio.ctx.state : 'none';
      },
      touch,
      canvas,
      chrome: { root: chrome, status, help, slot },
      get ctx() {
        return FILM.ctx;
      },
      present(frame, opts) {
        const nb = FILM.native ? FILM.native() : null;
        if (!nb) return;
        if (FILM.crt && typeof FILM.crt.present === 'function') FILM.crt.present(nb.canvas, FILM.ctx, Object.assign({}, opts, { frame }));
        else FILM.presentNearest(nb.canvas, FILM.ctx);
      },
    };
    player.api = api;

    window.addEventListener('resize', relayout);
    // The first click anywhere powers the TV on (the pad of the playable mode excepted: its START takes
    // the controller instead). After that a click on the TV or the page plays and pauses the film,
    // except while the playable mode owns the TV.
    canvas.addEventListener('click', () => {
      if (!owned) playing ? pause() : play();
    });
    document.body.addEventListener('click', (e) => {
      if (e.target === document.body && !owned) playing ? pause() : play();
    });
    document.addEventListener('click', (e) => {
      if (powered || owned || playing) return;
      if (e.target && e.target.closest && e.target.closest('[data-pad]')) return;
      play();
    });
    window.addEventListener('keyup', (e) => {
      if (player.onKey && player.onKey(e, api) === true) e.preventDefault();
    });
    window.addEventListener('keydown', (e) => {
      if (player.onKey && player.onKey(e, api) === true) {
        e.preventDefault();
        return;
      }
      const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
      if (e.code === 'KeyC' && plain) {
        e.preventDefault();
        toggleTV();
      } else if (e.code === 'KeyF' && plain) {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.code === 'KeyM' && plain) {
        e.preventDefault();
        toggleMute();
      } else if (e.code === 'Space') {
        e.preventDefault();
        playing ? pause() : play();
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        step(1);
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        step(-1);
      }
    });

    if (player.onMount) {
      try {
        player.onMount(api);
      } catch (e) {
        if (window.console) console.error('FILM.player.onMount failed', e);
      }
    }
    fit();
    draw(true);
    window.requestAnimationFrame(tick);
  }

  // Photos decode asynchronously and the hand-lettering face resolves asynchronously; drawing before
  // either is ready shows a half-built frame (and hashes differently from the same frame drawn later).
  const boot = () =>
    Promise.all([
      FILM.loadPhotos ? FILM.loadPhotos() : Promise.resolve(),
      document.fonts ? document.fonts.ready : Promise.resolve(),
    ]).then(start);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
// ---- src/play.js
/*
 * play.js : the playable mode. A viewer takes the controller from the film (docs/playable.md).
 *
 *   ENTER (or the touch pad's START, or START on a gamepad)   take the controller: a fresh console
 *                                                              (FILM.game.create) at the title screen
 *   ESC (or the touch pad's FILM)                              give it back: the film resumes
 *   I                                                          the NES controller input display (the
 *                                                              film shows the recorded tape's buttons)
 *
 * Controls in the playable mode: arrows or WASD move, Z or K is A (jump), X or J is B (run),
 * ENTER is START, SHIFT is SELECT. A gamepad with the standard mapping: D-pad or left stick, the
 * right and top face buttons are A, the bottom and left ones B, START and SELECT (back). A phone or
 * tablet gets a translucent pad: D-pad left, B and A right, SELECT, START and FILM between them.
 *
 * The console steps at exactly 60 Hz from a fixed-timestep accumulator on the animation-frame clock,
 * whatever the display's refresh; a stall is caught up by at most MAX_CATCHUP steps and the rest is
 * dropped, so the game never runs fast to make up time. Each animation frame that stepped draws the
 * console into FILM.native() and puts it on the TV through FILM.player.api.present(), at
 * FILM.crt.settledFrame() with the film's baked overlays off. Sound is the
 * film's own driver and chip generated live (FILM.audio.live), fed every step's events.
 *
 * Only the player's hooks are used (src/player.js): onMount, onKey, onFrame. Nothing here runs with
 * ?render=1. FILM.player.live exposes read-only stats (steps, frame, rate, buttons) for tools.
 */
(function () {
  'use strict';

  const FILM = window.FILM;
  if (!FILM) return;
  const params = new URLSearchParams(window.location.search);
  if (params.get('render') === '1') return;
  const player = (FILM.player = FILM.player || {});

  const STEP_MS = 1000 / 60; // one console frame
  const TOL_MS = 2; // animation-frame jitter absorbed without a skipped or doubled step
  const MAX_CATCHUP = 5; // most steps one animation frame may run: full speed down to 12 drawn frames/s
  const MAX_GAP_MS = 250; // a longer gap (a hidden tab) is not caught up at all

  const KEYS = {
    ArrowUp: 'UP', KeyW: 'UP',
    ArrowDown: 'DOWN', KeyS: 'DOWN',
    ArrowLeft: 'LEFT', KeyA: 'LEFT',
    ArrowRight: 'RIGHT', KeyD: 'RIGHT',
    KeyZ: 'A', KeyK: 'A',
    KeyX: 'B', KeyJ: 'B',
    Enter: 'START', NumpadEnter: 'START',
    ShiftLeft: 'SELECT', ShiftRight: 'SELECT',
  };
  const LIVE_HELP = '← → — move · Z — jump · X — run · ENTER — start · ESC — film';

  const S = {
    active: false,
    game: null,
    snd: null,
    actx: null,
    gain: null,
    keys: 0, // held keyboard buttons
    touch: 0, // held touch-pad buttons
    pad: 0, // held gamepad buttons
    padPrev: 0,
    latch: 0, // pressed since the last step: a tap shorter than a frame still reaches the console
    suppress: 0, // buttons held when the controller was taken: ignored until released
    buttons: 0, // what the console saw on its last step
    acc: 0,
    last: null,
    steps: 0,
    rafs: 0,
    rate: 0,
    rateT0: null,
    rateN0: 0,
    presented: '',
    wasPlaying: false,
    wasPowered: false,
    overlay: false,
    bakedInput: undefined, // FILM.crt.overlays.input before the chrome display hid it
    ui: null,
    api: null,
  };

  const BTN = () => (FILM.game && FILM.game.BUTTONS) || { A: 1, B: 2, SELECT: 4, START: 8, UP: 16, DOWN: 32, LEFT: 64, RIGHT: 128 };

  // ---------------------------------------------------------------------------------------------
  // The page: the input display (in the chrome's right slot) and the touch pad
  // ---------------------------------------------------------------------------------------------
  const CSS = [
    // the NES controller input display
    '#nes{display:none;align-items:center;gap:8px;pointer-events:none}',
    '#nes.on{display:flex}',
    '#nes .cap{font-size:9px;letter-spacing:.16em;color:#6d6a64}',
    '#nes .shell{width:122px;height:34px;box-sizing:border-box;padding:3px;border-radius:3px;background:#c4c2bd;box-shadow:inset 0 -2px 0 #9d9b96}',
    '#nes .face{position:relative;width:100%;height:100%;border-radius:2px;background:#17171a}',
    '#nes i{position:absolute;display:block;background:#2e2e33}',
    '#nes .v{left:11px;top:3px;width:8px;height:22px;border-radius:1px}',
    '#nes .h{left:4px;top:10px;width:22px;height:8px;border-radius:1px}',
    '#nes .u{left:11px;top:3px;width:8px;height:7px;background:none}',
    '#nes .d{left:11px;top:18px;width:8px;height:7px;background:none}',
    '#nes .l{left:4px;top:10px;width:7px;height:8px;background:none}',
    '#nes .r{left:19px;top:10px;width:7px;height:8px;background:none}',
    '#nes .mid{left:34px;top:7px;width:38px;height:14px;border-radius:2px;background:#8f8d88}',
    '#nes .se{left:38px;top:12px;width:13px;height:5px;border-radius:3px;background:#2e2e33}',
    '#nes .st{left:55px;top:12px;width:13px;height:5px;border-radius:3px;background:#2e2e33}',
    '#nes .bb,#nes .ba{top:6px;width:16px;height:16px;border-radius:2px;background:#bdbbb6}',
    '#nes .bb{left:78px}#nes .ba{left:96px}',
    '#nes .b,#nes .a{top:8px;width:12px;height:12px;border-radius:50%;background:#9c2a20}',
    '#nes .b{left:80px}#nes .a{left:98px}',
    '#nes i.lit{background:#f4f1ea;box-shadow:0 0 6px rgba(255,248,230,.85)}',
    '#nes .b.lit,#nes .a.lit{background:#ff5a45;box-shadow:0 0 7px rgba(255,90,69,.95)}',
    // the touch pad (phones and tablets only)
    '#pad{flex:none;box-sizing:border-box;width:100%;max-width:520px;height:196px;padding:8px 18px 22px;display:flex;',
    'align-items:center;justify-content:space-between;touch-action:none;cursor:default;color:rgba(255,255,255,.62);',
    'font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em}',
    '#pad *{touch-action:none}',
    '#pad .dpad{position:relative;width:124px;height:124px;flex:none}',
    '#pad .dpad>div{position:absolute}',
    '#pad .x{inset:0;background:rgba(255,255,255,.13);clip-path:polygon(34% 0,66% 0,66% 34%,100% 34%,100% 66%,66% 66%,66% 100%,34% 100%,34% 66%,0 66%,0 34%,34% 34%)}',
    '#pad .u{left:34%;top:0;width:32%;height:34%}',
    '#pad .d{left:34%;bottom:0;width:32%;height:34%}',
    '#pad .l{left:0;top:34%;width:34%;height:32%}',
    '#pad .r{right:0;top:34%;width:34%;height:32%}',
    '#pad .dpad>div.lit{background:rgba(255,255,255,.34)}',
    '#pad .mid{display:flex;flex-direction:column;align-items:center;gap:12px}',
    '#pad .pill{width:62px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;',
    'background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.2);font-size:9px}',
    '#pad .pill.lit{background:rgba(255,255,255,.34)}',
    '#pad .exit{display:none}',
    'body.live #pad .exit{display:flex}',
    '#pad .ab{display:flex;align-items:flex-end;gap:14px;flex:none}',
    '#pad .btn{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;',
    'background:rgba(214,64,52,.24);border:1.5px solid rgba(255,120,100,.42);font-size:17px;letter-spacing:0}',
    '#pad .btn.a{margin-bottom:30px}',
    '#pad .btn.lit{background:rgba(236,72,56,.62)}',
    'body.touch #chrome>#help{flex:1 1 0}',
    'body.touch #chrome>#slot{flex:0 0 auto}',
    'body.live #bar{display:none}',
    // landscape: the pad moves off the page flow and sits over the TV's side edges
    '@media (orientation: landscape){',
    '#pad{position:fixed;left:0;top:0;right:0;bottom:0;width:auto;max-width:none;height:auto;padding:0;display:block;pointer-events:none}',
    '#pad .dpad,#pad .ab,#pad .mid{position:fixed;pointer-events:auto}',
    // sized to fit the side margins a 16:9 TV leaves on a phone held sideways (about 110 px)
    '#pad .dpad{left:4px;bottom:56px;width:104px;height:104px}',
    '#pad .ab{right:6px;bottom:56px;gap:4px}',
    '#pad .btn{width:50px;height:50px;font-size:15px}',
    '#pad .btn.a{margin-bottom:26px}',
    '#pad .mid{left:50%;bottom:8px;transform:translateX(-50%);flex-direction:row;gap:10px}',
    'body.touch #chrome>#help{flex:0 1 auto;text-align:left}',
    '}',
  ].join('');

  function el(tag, cls, parent, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }

  function buildUI(api) {
    if (S.ui) return S.ui;
    const style = document.createElement('style');
    style.textContent = CSS;
    document.head.appendChild(style);
    const ui = { nes: null, nesCap: null, nesLit: {}, nesMask: -1, pad: null, padLit: {}, padMask: -1 };

    // the input display: an NES controller in the chrome, lit by the buttons held on this frame
    const slot = api.chrome && api.chrome.slot;
    if (slot) {
      const nes = el('div', '', slot);
      nes.id = 'nes';
      ui.nesCap = el('span', 'cap', nes, 'TAPE');
      const face = el('div', 'face', el('div', 'shell', nes));
      for (const c of ['v', 'h', 'u', 'd', 'l', 'r', 'mid', 'se', 'st', 'bb', 'ba', 'b', 'a']) {
        const i = el('i', c, face);
        const name = { u: 'UP', d: 'DOWN', l: 'LEFT', r: 'RIGHT', se: 'SELECT', st: 'START', b: 'B', a: 'A' }[c];
        if (name) ui.nesLit[name] = i;
      }
      ui.nes = nes;
    }

    // the touch pad
    if (api.touch) {
      const pad = el('div', '');
      pad.id = 'pad';
      pad.setAttribute('data-pad', '');
      const dpad = el('div', 'dpad', pad);
      dpad.setAttribute('data-dpad', '');
      el('div', 'x', dpad);
      for (const [c, name] of [['u', 'UP'], ['d', 'DOWN'], ['l', 'LEFT'], ['r', 'RIGHT']]) ui.padLit[name] = el('div', c, dpad);
      const mid = el('div', 'mid', pad);
      for (const name of ['SELECT', 'START']) {
        const p = el('div', 'pill', mid, name);
        p.setAttribute('data-btn', name);
        ui.padLit[name] = p;
      }
      const exit = el('div', 'pill exit', mid, 'FILM');
      exit.setAttribute('data-act', 'exit');
      const ab = el('div', 'ab', pad);
      for (const name of ['B', 'A']) {
        const b = el('div', 'btn ' + name.toLowerCase(), ab, name);
        b.setAttribute('data-btn', name);
        ui.padLit[name] = b;
      }
      // after the chrome, so in portrait the pad sits under the TV and its status line
      const chrome = api.chrome && api.chrome.root;
      if (chrome && chrome.parentNode) chrome.parentNode.insertBefore(pad, chrome.nextSibling);
      else document.body.appendChild(pad);
      ui.pad = pad;
      bindTouch(pad, api);
    }
    S.ui = ui;
    return ui;
  }

  function light(map, mask, prev) {
    const B = BTN();
    for (const name in map) {
      const on = (mask & B[name]) !== 0;
      if (prev < 0 || on !== ((prev & B[name]) !== 0)) map[name].classList.toggle('lit', on);
    }
  }
  function showInputs(mask, live) {
    const ui = S.ui;
    if (!ui || !ui.nes || !S.overlay) return;
    const cap = live ? 'YOU' : 'TAPE';
    if (ui.nesCap.textContent !== cap) ui.nesCap.textContent = cap;
    if (mask !== ui.nesMask) {
      light(ui.nesLit, mask, ui.nesMask);
      ui.nesMask = mask;
    }
  }
  // While the chrome's input display shows, the film's baked pad (FILM.crt.overlays.input) is off so the
  // two never double up; hiding the chrome display restores what was there before.
  function toggleOverlay() {
    S.overlay = !S.overlay;
    if (S.ui && S.ui.nes) {
      S.ui.nes.classList.toggle('on', S.overlay);
      S.ui.nesMask = -1;
    }
    const ov = FILM.crt && FILM.crt.overlays;
    if (ov) {
      if (S.overlay) {
        S.bakedInput = ov.input;
        ov.input = false;
      } else if (S.bakedInput !== undefined) {
        ov.input = S.bakedInput;
        S.bakedInput = undefined;
      }
    }
    if (!S.active && S.api && !S.api.playing) S.api.redraw(); // a paused film shows the change at once
  }

  // ---------------------------------------------------------------------------------------------
  // Sound: the film's driver and chip, generated as the console plays
  // ---------------------------------------------------------------------------------------------
  function startSound(api) {
    if (!FILM.audio || typeof FILM.audio.live !== 'function') return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      if (!S.actx) {
        S.actx = new AC({ latencyHint: 'interactive' });
        S.gain = S.actx.createGain();
        S.gain.connect(S.actx.destination);
      }
      if (S.actx.state === 'suspended') S.actx.resume();
      S.gain.gain.value = api.muted ? 0 : 1;
      S.snd = FILM.audio.live(S.actx, { song: 'title', dest: S.gain });
    } catch (e) {
      S.snd = null;
      if (window.console) console.error('FILM.audio.live failed', e);
    }
  }
  function stopSound() {
    if (S.snd) S.snd.stop();
    S.snd = null;
    if (S.actx && S.actx.state === 'running') S.actx.suspend();
  }
  // A context made outside a gesture (a gamepad's START, a touch-down) starts suspended; the next
  // gesture of any kind lets it run.
  const wake = () => {
    if (S.active && S.actx && S.actx.state === 'suspended' && !document.hidden) S.actx.resume();
  };
  for (const type of ['pointerup', 'touchend', 'keydown', 'click']) window.addEventListener(type, wake, true);

  // ---------------------------------------------------------------------------------------------
  // Taking and giving back the controller
  // ---------------------------------------------------------------------------------------------
  function enter(api, held) {
    if (S.active || !FILM.game || typeof FILM.game.create !== 'function') return;
    S.wasPlaying = api.playing;
    const wasPowered = api.powered;
    api.pause();
    S.game = FILM.game.create({});
    S.active = true;
    S.suppress = held | 0;
    S.latch = 0;
    S.buttons = 0;
    S.acc = 0;
    S.last = null;
    S.presented = '';
    S.rateT0 = null;
    S.wasPowered = wasPowered;
    document.body.classList.add('live');
    startSound(api);
    api.setHelp(api.touch ? '' : LIVE_HELP);
  }
  function exit(api) {
    if (!S.active) return;
    S.active = false;
    stopSound();
    S.game = null;
    S.keys = 0;
    S.latch = 0;
    S.buttons = 0;
    document.body.classList.remove('live');
    api.setHelp(null);
    if (S.wasPlaying || !S.wasPowered) api.play();
    api.redraw();
  }

  // ---------------------------------------------------------------------------------------------
  // Inputs
  // ---------------------------------------------------------------------------------------------
  function onKey(e, api) {
    const down = e.type === 'keydown';
    const code = e.code;
    const name = KEYS[code];
    if (!down && name) S.keys &= ~BTN()[name]; // a release always lands, whatever else is held
    if (e.metaKey || e.ctrlKey || e.altKey) return false; // browser shortcuts stay the browser's
    if (!S.active) {
      if (down && (code === 'Enter' || code === 'NumpadEnter')) {
        if (!e.repeat) enter(api, 0);
        return true;
      }
      if (code === 'KeyI') {
        if (down && !e.repeat) toggleOverlay();
        return true;
      }
      return false;
    }
    if (code === 'Escape') {
      if (down) exit(api);
      return true;
    }
    if (code === 'KeyC' || code === 'KeyF' || code === 'KeyM') return false; // the player's own keys
    if (code === 'KeyI') {
      if (down && !e.repeat) toggleOverlay();
      return true;
    }
    if (name) {
      const b = BTN()[name];
      if (down && !e.repeat) {
        S.keys |= b;
        S.latch |= b;
      }
      return true;
    }
    return code === 'Space'; // never the film's play/pause while the viewer holds the controller
  }

  // The standard mapping (w3c gamepad): 0 bottom, 1 right, 2 left, 3 top face button, 8 back/select,
  // 9 start, 12-15 the D-pad. The NES has B left of A: the bottom and left buttons are B, the right
  // and top ones A, as Nintendo's own NES collections map a modern pad.
  function pollGamepads() {
    let list = null;
    try {
      list = navigator.getGamepads ? navigator.getGamepads() : null;
    } catch (e) {
      list = null;
    }
    const B = BTN();
    let m = 0;
    if (list) {
      for (const gp of list) {
        if (!gp || gp.connected === false) continue;
        const on = (i) => {
          const b = gp.buttons[i];
          return !!b && (b.pressed || b.value > 0.5);
        };
        if (on(12)) m |= B.UP;
        if (on(13)) m |= B.DOWN;
        if (on(14)) m |= B.LEFT;
        if (on(15)) m |= B.RIGHT;
        if (on(1) || on(3)) m |= B.A;
        if (on(0) || on(2)) m |= B.B;
        if (on(9)) m |= B.START;
        if (on(8)) m |= B.SELECT;
        const ax = gp.axes[0] || 0;
        const ay = gp.axes[1] || 0;
        if (ax < -0.5) m |= B.LEFT;
        if (ax > 0.5) m |= B.RIGHT;
        if (ay < -0.5) m |= B.UP;
        if (ay > 0.5) m |= B.DOWN;
      }
    }
    const pressed = m & ~S.padPrev;
    S.padPrev = m;
    S.pad = m;
    if (S.active) S.latch |= pressed;
    return pressed;
  }

  // Touch: every finger is tracked on its own. A finger that lands on the D-pad keeps steering it
  // (8 ways from the pad's centre) wherever it slides; a finger on a button can roll onto the next.
  function bindTouch(pad, api) {
    const fingers = new Map(); // pointerId -> { dpad: bool, mask }
    const B = BTN();
    const dpadEl = pad.querySelector('[data-dpad]');
    function dpadMask(x, y) {
      const r = dpadEl.getBoundingClientRect();
      const dx = x - (r.left + r.width / 2);
      const dy = y - (r.top + r.height / 2);
      const dead = r.width * 0.1;
      if (Math.hypot(dx, dy) < dead) return 0;
      let m = 0;
      const t = 0.4142; // tan 22.5 degrees: eight equal sectors
      if (Math.abs(dx) > Math.abs(dy) * t) m |= dx < 0 ? B.LEFT : B.RIGHT;
      if (Math.abs(dy) > Math.abs(dx) * t) m |= dy < 0 ? B.UP : B.DOWN;
      return m;
    }
    function buttonAt(x, y) {
      const hit = document.elementFromPoint(x, y);
      const b = hit && hit.closest ? hit.closest('[data-btn]') : null;
      return b ? B[b.getAttribute('data-btn')] || 0 : 0;
    }
    function update() {
      let m = 0;
      for (const f of fingers.values()) m |= f.mask;
      const pressed = m & ~S.touch;
      S.touch = m;
      if (S.active) S.latch |= pressed;
      if (S.ui) {
        light(S.ui.padLit, m, S.ui.padMask);
        S.ui.padMask = m;
      }
      if (!S.active && pressed & B.START) enter(api, m);
    }
    pad.addEventListener('pointerdown', (e) => {
      const onDpad = !!(e.target.closest && e.target.closest('[data-dpad]'));
      const onBtn = !!(e.target.closest && e.target.closest('[data-btn]'));
      if (!onDpad && !onBtn) return;
      e.preventDefault();
      fingers.set(e.pointerId, { dpad: onDpad, mask: onDpad ? dpadMask(e.clientX, e.clientY) : buttonAt(e.clientX, e.clientY) });
      update();
    });
    pad.addEventListener('pointermove', (e) => {
      const f = fingers.get(e.pointerId);
      if (!f) return;
      e.preventDefault();
      const m = f.dpad ? dpadMask(e.clientX, e.clientY) : buttonAt(e.clientX, e.clientY);
      if (m !== f.mask) {
        f.mask = m;
        update();
      }
    });
    const lift = (e) => {
      if (fingers.delete(e.pointerId)) update();
    };
    pad.addEventListener('pointerup', lift);
    pad.addEventListener('pointercancel', lift);
    pad.addEventListener('lostpointercapture', lift);
    pad.addEventListener('contextmenu', (e) => e.preventDefault());
    pad.addEventListener('click', (e) => {
      const act = e.target.closest ? e.target.closest('[data-act]') : null;
      if (act && act.getAttribute('data-act') === 'exit') exit(api);
    });
  }

  window.addEventListener('blur', () => {
    S.keys = 0;
  });
  document.addEventListener('visibilitychange', () => {
    if (!S.active || !S.actx) return;
    if (document.hidden) {
      if (S.actx.state === 'running') S.actx.suspend();
    } else {
      S.last = null; // no catch-up for the time away
      if (S.actx.state === 'suspended') S.actx.resume();
    }
  });

  // ---------------------------------------------------------------------------------------------
  // The live console: fixed 60 Hz steps, drawn once per animation frame
  // ---------------------------------------------------------------------------------------------
  function stepOnce() {
    const B = BTN();
    const raw = S.keys | S.touch | S.pad | S.latch;
    S.latch = 0;
    S.suppress &= raw;
    let m = raw & ~S.suppress;
    // a real D-pad cannot press opposite directions together
    if ((m & (B.LEFT | B.RIGHT)) === (B.LEFT | B.RIGHT)) m &= ~(B.LEFT | B.RIGHT);
    if ((m & (B.UP | B.DOWN)) === (B.UP | B.DOWN)) m &= ~(B.UP | B.DOWN);
    S.buttons = m;
    const ev = S.game.step(m);
    S.steps++;
    if (S.snd && ev && ev.length) S.snd.events(ev);
  }

  // The TV shows the live console lit and filling the frame, whatever film frame was paused on: any
  // other film frame carries the film's camera (the wide shot of the set) and power state. The film's
  // baked proof layers stay off, since the live controller is not the film's tape.
  function tvFrame() {
    if (FILM.crt && typeof FILM.crt.settledFrame === 'function') return FILM.crt.settledFrame();
    const c = FILM.TIMELINE && FILM.TIMELINE.crt;
    return c && c.powerOn ? c.powerOn[1] : 0;
  }

  function onFrame(stamp, api) {
    if (!S.ui) buildUI(api);
    const padPressed = pollGamepads();
    if (!S.active) {
      if (padPressed & BTN().START) enter(api, S.pad);
      else {
        if (S.overlay && FILM.game && typeof FILM.game.sim === 'function') {
          const sim = FILM.game.sim();
          const st = sim.states[Math.max(0, Math.min(sim.length - 1, api.frame))];
          showInputs(st ? st.btn | 0 : 0, false);
        }
        return false;
      }
    }
    S.rafs++;
    if (S.last == null) {
      S.last = stamp;
      S.acc = STEP_MS; // the first animation frame shows the first console frame
    } else {
      const dt = stamp - S.last;
      S.last = stamp;
      S.acc += dt > MAX_GAP_MS ? STEP_MS : dt;
    }
    let n = 0;
    while (S.acc >= STEP_MS - TOL_MS && n < MAX_CATCHUP) {
      stepOnce();
      S.acc -= STEP_MS;
      n++;
    }
    if (S.acc >= STEP_MS) S.acc = 0; // too far behind: drop the backlog rather than run fast later
    const nb = FILM.native();
    if (n) S.game.draw(nb.ctx);
    const out = FILM.ctx && FILM.ctx.canvas;
    const key = out ? `${out.width}x${out.height}:${FILM.crt ? FILM.crt.mode : ''}` : '';
    if (n || key !== S.presented) {
      api.present(tvFrame(), { overlays: false });
      S.presented = key;
    }
    if (S.gain) S.gain.gain.value = api.muted ? 0 : 1;
    if (S.rateT0 == null) {
      S.rateT0 = stamp;
      S.rateN0 = S.steps;
    } else if (stamp - S.rateT0 >= 1000) {
      S.rate = ((S.steps - S.rateN0) * 1000) / (stamp - S.rateT0);
      S.rateT0 = stamp;
      S.rateN0 = S.steps;
    }
    if (api.chrome && api.chrome.status) {
      api.chrome.status.textContent = `LIVE  f${S.game.frame}  ${S.rate ? S.rate.toFixed(1) : '--'} steps/s${api.muted ? '  muted' : ''}`;
    }
    showInputs(S.buttons, true);
    return true;
  }

  player.onMount = (api) => {
    S.api = api;
    buildUI(api);
  };
  player.onKey = onKey;
  player.onFrame = onFrame;
  player.live = Object.freeze({
    get active() {
      return S.active;
    },
    get game() {
      return S.game;
    },
    get steps() {
      return S.steps;
    },
    get frame() {
      return S.game ? S.game.frame : 0;
    },
    get rafs() {
      return S.rafs;
    },
    get rate() {
      return S.rate;
    },
    get buttons() {
      return S.buttons;
    },
    get overlay() {
      return S.overlay;
    },
    get audioState() {
      return S.actx ? S.actx.state : 'none';
    },
    get sound() {
      return S.snd ? S.snd.frame : 0;
